# scripts/sites.yaml — 사이트(온프렘 / EKS) 결합 값의 **단일 선언점**
#
# 왜 있는가 (0-10)
# ---------------
# `validate.py` 안에 온프렘 LAN 값이 리터럴로 박혀 있었다 — CNPG failsafe 검사의
# kubelet 예외 `192.168.0.0/24` 가 그것이다. 검증 스크립트가 한 사이트의 물리 주소를
# 알고 있으면, 두 사이트를 검증하는 순간 **스크립트를 고쳐야 사이트가 늘어난다.**
# 그래서 사이트 결합 값은 코드가 아니라 이 파일에 선언하고 스크립트는 읽기만 한다.
#
# 무엇이 여기 오나
# ---------------
# **"사이트가 달라지면 값이 달라지는데, 매니페스트가 아니라 검증 규칙이 알아야 하는 것"** 만.
# 매니페스트가 쓰는 값(storageClass·nodeSelector 등)은 각 `overlays/<site>` 가 정본이다.
# 여기에 중복으로 적지 말 것 — 두 정본은 반드시 갈린다.
#
# 🔴 registry 를 바꾸는 절차 (계정 ID 가 정해졌을 때)
# ---------------------------------------------------
#  1. 아래 `eks.registry` 를 실제 값으로 고친다.
#  2. `python3 scripts/validate.py` — check_eks_registry 가 **아직 안 맞는 오버레이를 전부 열거**한다.
#  3. 그 목록대로 각 `overlays/eks/kustomization.yaml` 의 `newName` 을 맞춘다.
# 즉 값 자체는 오버레이에 있지만(= kustomize `images` 트랜스포머·CD 가 쓰는 자리),
# **불일치는 이 파일 기준으로 기계가 잡는다.** 손으로 15곳을 세지 않는다.

onprem:
  # 이미지 레지스트리 접두사 — Harbor(호스트 C). C-3 으로 이관 후에도 **ECR 미러로 존치**한다.
  registry: 192.168.0.10/mealplanning
  # 노드가 사는 대역. CNPG failsafe(8000/tcp)에서 kubelet probe 예외로 허용되는 유일한 ipBlock.
  node_cidrs:
    - 192.168.0.0/24

eks:
  # 🟢 계정 ID 확정(2026-08-14) = `689192361171` (C-57 로 계정 1개). 🔴 config 레포는 **비공개**라 적어도 되지만,
  #    app 레포는 **공개**다 — 거기 `.gitlab-ci.yml` 은 계속 롤 ARN 에서 유도한다. 옮겨 적지 말 것.
  # 🔴 2026-08-13 정정 — 종전 주석 *"ECR 리포지터리는 평평하다 — `mealplanning/` 같은 프로젝트
  #    경로가 없다"* 는 **사실이 아니다.** ECR 리포 이름은 `/` 로 네임스페이스를 가질 수 있다
  #    (이름 패턴이 `(namespace/)*repo` 를 허용한다). 그래서 **Harbor 와 1:1 로 맞춘다.**
  #    ⇒ onprem `192.168.0.10/mealplanning` ↔ eks `<acct>.dkr.ecr…/mealplanning`
  #      사이트 차이가 **레지스트리 호스트 하나로** 줄어들어 기계적 변환이 되고 판단이 안 낀다.
  #    🔴 ECR 리포는 자동 생성이 안 된다 — Terraform 이 **정확히 이 이름**으로 만들어야 하고,
  #      이름이 두 갈래면 컷오버 때 ImagePullBackOff 로 가장 늦게·가장 아프게 드러난다.
  #      `.gitlab-ci.yml` 의 `IMAGE_PREFIX=${ECR_REGISTRY}/mealplanning` 이 이미 이 형태다.
  registry: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning
  # 🔴 비어 있음 = VPC CIDR 미정(사람 결정). 정해지면 여기에 노드 서브넷을 적는다.
  #    ⚠️ 온프렘 값을 그대로 복사하지 말 것 — 0-18 이 "LAN 전 포트 개방을 VPC CIDR 로
  #    기계적 치환 금지" 라고 못박은 그 부채가 여기로 새는 경로다.
  node_cidrs: []
