apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 1-31 로 Harbor pull secret 만 걷었다(2026-08-10) — 나머지는 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-2 `secretStoreRef.name` fb-kubernetes → `mp-aws-secrets` (2026-08-10, 아래 patches)
#    - 0-9 Harbor pull secret 자체가 불요해질 수 있다 — ECR 은 노드 롤/Pod Identity 로 당긴다
#    - ✅ app-common ConfigMap 의 Redis 좌표 — C-14 ElastiCache (2026-08-14, 아래 patches ①~④)
resources:
  - ../../base

# 🟢 PG·ES 좌표는 **가를 것이 없다** — `pg-pooler.data.svc` · `es-es-http.data.svc` 가 EKS 에도
#    같은 이름으로 실재한다(A1 완료, 실측 2026-08-14). 갈린 건 Redis 하나뿐이다.
#
# 🔴 **남은 온프렘 좌표 1건 = `KAFKA_BOOTSTRAP`.** EKS 에 Kafka 는 만들지 않는다(C-44).
#    유일한 소비자가 `mp-mealplan` 이고(실측), C-88 이 그 해법으로 `EVENT_SINK=pg` 선택자를 뒀다.
#    ⚠️ 아직 못 켠다 — `svc_mealplan` 에 `activity.user_event` INSERT 권한이 없다
#    (`schema-roles.sql:137-138` 은 `activity.recipe_impression` 만 준다). 앱 레포 선행이 필요하다.
#    그때까지 mealplan 의 클릭스트림 발행은 실패하지만 **best-effort 라 담기를 막지 않는다.**


# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

# ── 1-31 Harbor pull secret 제거 ────────────────────────────────────────────
# ECR 은 **kubelet 이 노드 인스턴스 롤로** 당긴다(IRSA/Pod Identity 는 파드 전용이라 이미지 풀에
# 관여하지 않는다 — 노드 롤에 AmazonEC2ContainerRegistryReadOnly). dockerconfigjson 이 불요하다.
# 🔴 남기면 해로운 이유: 이 ExternalSecret 은 온프렘 `fb-secrets` 의 `harbor-pull`(robot 계정)을
#    당긴다. EKS 스토어(Secrets Manager, C-36)엔 그 키가 없으므로 **영구 SecretSyncedError** 가 되고,
#    ns 의 ESO 상태가 상시 빨강이라 진짜 실패가 묻힌다.
# ⚠️ 나머지 반쪽(default SA 의 imagePullSecrets: harbor)은 **앱 레포 Ansible 소관**이다 — 1-31.
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-harbor-pull
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-harbor-pull

# ── 0-13 부수 — `PGUSER: fbapp` 을 EKS 에서 걷는다 (2026-08-13) ────────────────
# 0-13 으로 app ns 11종이 전부 `env: PGUSER=svc_<서비스>` 를 직접 갖게 됐다(env 가 envFrom 을 이긴다).
# 그러면 여기 남은 `fbapp` 은 **아무도 안 쓰는 값**이 되는데, 남겨 두면 해롭다:
#
#   새 서비스를 추가하면서 PGUSER 를 안 적는다
#     → 조용히 `fbapp` 으로 붙는다
#     → `fbapp` 은 앱 스키마 8개 전부의 **소유자**다 (schema-roles.md §1.1)
#     → 롤을 가른 의미가 그 서비스에서만 통째로 사라지고, **에러가 없어서 아무도 모른다**
#
# 지우면 반대로 기동 시점에 드러난다(접속 유저 미지정 → 라이브러리가 OS 유저로 폴백 → 인증 실패).
# **조용한 권한 상승보다 시끄러운 실패가 낫다.**
#
# 🔴 온프렘에는 손대지 않는다 — 거기는 11종이 실제로 `fbapp` 으로 붙어 있다(C-83 형상 동결).
#    이 패치가 `overlays/eks` 에만 있는 이유가 그것이다.
#
# 실측으로 확인한 "지워도 되는 근거" (2026-08-13, eks 렌더 기준):
#   · app ns 워크로드 14개 중 app-common 을 읽는 것 13개
#   · 그중 PGUSER 가 필요한 11개 = 전부 자기 env 보유  ✅
#   · `mp-operations`  = 자기 `PGUSER`(외부 교육용 DB) 보유 — 여기 값을 애초에 안 씀  ✅
#   · `mp-frontend`    = envFrom 자체가 없다(nginx)  ✅
#   · `mp-ocr-config-canary` = app-common 을 읽지만 **PG 를 안 쓴다**
#        (`services/ocr/app/config_canary.py` 에 psycopg·PGHOST·PGUSER 참조 **0건** — Vertex 호출만)  ✅
#
# ⚠️ `op: test` 로 base 값이 바뀌면 렌더가 죽게 했다. base 가 `fbapp` 이 아니게 되는 날은
#    이 판단의 전제가 바뀌는 날이므로 조용히 통과하면 안 된다.
  - target: {version: v1, kind: ConfigMap, name: app-common}
    patch: |-
      - op: test
        path: /data/PGUSER
        value: fbapp
      - op: remove
        path: /data/PGUSER

# ══ C-14 — Redis = ElastiCache for Valkey (A2, 2026-08-14) ═════════════════════
# 🔴 **이 오버레이의 본론이었다.** base 는 온프렘 Sentinel 3파드를 가리키는데 EKS 엔 그 파드가
#    없다 — 고치지 않으면 앱 12종이 뜬 채로 Redis 만 조용히 죽는다.
#
# 라이브 실측(2026-08-14): `mp-cache` available · engine=valkey · Multi-AZ(t4g.micro ×2)
#   · TransitEncryption=false · AuthToken=false  ⇒ 평문 6379 그대로, TLS/비번 env 불요.
#
# 🔴 **온프렘은 한 글자도 안 바뀐다**(C-83 형상 동결) — 그래서 base 가 아니라 여기다.
# ⚠️ `envFrom.configMapRef` 는 **파드 기동 시점 주입**이다. 이 값을 바꾸고 sync 해도 도는 파드는
#    옛 값을 쓴다. 체크섬 어노테이션이 없어 ArgoCD 가 안 굴려준다 → `rollout restart` 가 별도로 필요.
  - target: {version: v1, kind: ConfigMap, name: app-common}
    patch: |-
      # ── ① Sentinel 끄기 ────────────────────────────────────────────────────
      # ElastiCache 는 페일오버를 **엔드포인트 DNS 뒤에서** 처리한다 — Sentinel 이 할 일이 없고,
      # 애초에 EKS 에 sentinel 파드가 없어 이 주소는 전부 NXDOMAIN 이다.
      # 🔴 빈 문자열이 정확한 값이다(키 삭제 아님) — `redis_sentinels: str = ""` 가 소스의
      #    폴백 분기 조건이고, 값이 있으면 db.py 가 Service 대신 Sentinel 로 master 를 찾는다.
      #    (chat·price 두 서비스만 이 분기를 읽는다 — 실측 2026-08-14)
      #    🔵 `REDIS_MASTER_GROUP` 은 남긴다 — Sentinel 이 꺼지면 아무도 안 읽고, 지우는 쪽이
      #       오히려 소스 기본값(`"mymaster"`)과 어긋날 여지를 만든다.
      - op: test
        path: /data/REDIS_SENTINELS
        value: "mp-redis-s-0.mp-redis-s-hl.data.svc:26379,mp-redis-s-1.mp-redis-s-hl.data.svc:26379,mp-redis-s-2.mp-redis-s-hl.data.svc:26379"
      - op: replace
        path: /data/REDIS_SENTINELS
        value: ""

      # ── ② 엔드포인트 = ElastiCache primary ─────────────────────────────────
      # base 주석이 REDISHOST 를 "폴백 전용(Sentinel 모드에선 미사용)"이라 적는데, ①로 Sentinel 을
      # 껐으므로 **EKS 에서는 이게 유일한 접속 경로**다. 폴백이 아니라 정본이 된다.
      # 🔵 reader 엔드포인트(`mp-cache-ro…`)는 쓰지 않는다 — 앱이 쓰는 건 캐시·잡 큐라 쓰기가 섞인다.
      - op: test
        path: /data/REDISHOST
        value: mp-redis-master.data.svc
      - op: replace
        path: /data/REDISHOST
        value: mp-cache.gnqpbg.ng.0001.apn2.cache.amazonaws.com

      # ── ③ 1-15 소켓 타임아웃 ───────────────────────────────────────────────
      # 🔴 chat 은 기본값이 `None` = **무한 대기**다(`redis_socket_timeout_s: float | None = None`).
      #    사이트 간 지연이 생기는 구성에서 상한이 없으면 그때 드러난다 — 소스 주석이 그렇게 적고
      #    "`overlays/eks` 에서 3.0 을 준다"고 지정한다. price 는 5.0 → 3.0.
      #    나머지 10종은 이 필드를 선언하지 않는다 ⇒ `extra="ignore"` 라 **무해하게 무시**된다
      #    (전 서비스 `SettingsConfigDict(extra="ignore")` 확인 — 실측 2026-08-14).
      - op: add
        path: /data/REDIS_SOCKET_TIMEOUT_S
        value: "3.0"

      # ── ④ 1-14 페일오버 재연결 (video) ─────────────────────────────────────
      # 🔴 **둘은 한 쌍이다.** Multi-AZ 전환은 DNS 이름이 유지된 채 뒤의 노드가 바뀌므로 기존
      #    커넥션이 끊기고 재연결이 필요하다 — `health_check` 가 죽은 커넥션을 걷어내고
      #    `job_retries` 가 그 창을 재시도로 덮는다. 하나만 켜면 방어의 절반이다.
      # ⚠️ `REDIS_JOB_RETRIES` 는 **1 이 "재시도 없음"**이다(0 아님 — `ge=1`, 0 을 주면 명령을
      #    아예 실행하지 않고 TypeError 를 낸다). 값 3 = 소스 주석이 지정한 EKS 값.
      - op: add
        path: /data/REDIS_HEALTH_CHECK_S
        value: "30"
      - op: add
        path: /data/REDIS_JOB_RETRIES
        value: "3"
