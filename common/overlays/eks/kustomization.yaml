apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 1-31 로 Harbor pull secret 만 걷었다(2026-08-10) — 나머지는 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-2 `secretStoreRef.name` fb-kubernetes → `mp-aws-ssm` (2026-08-10, 아래 patches)
#    - 0-9 Harbor pull secret 자체가 불요해질 수 있다 — ECR 은 노드 롤/Pod Identity 로 당긴다
#    - app-common ConfigMap 의 백엔드 주소(PG/ES/Redis) — 🔴 Redis 는 C-14 로 ElastiCache 엔드포인트
resources:
  - ../../base

#    - 🔴 app-common ConfigMap 의 백엔드 주소(PG/ES/Redis) — Redis 는 C-14 로 ElastiCache 엔드포인트.
#      **여기가 이 트랙의 본론이고 아직 안 했다.**
#      ⚠️ `envFrom.configMapRef` 는 파드 기동 시점 주입이라 바꿔도 도는 파드는 옛 값을 쓴다 —
#      체크섬 어노테이션이 없어 rollout restart 가 별도로 필요하다.


# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm

# ── 1-31 Harbor pull secret 제거 ────────────────────────────────────────────
# ECR 은 **kubelet 이 노드 인스턴스 롤로** 당긴다(IRSA/Pod Identity 는 파드 전용이라 이미지 풀에
# 관여하지 않는다 — 노드 롤에 AmazonEC2ContainerRegistryReadOnly). dockerconfigjson 이 불요하다.
# 🔴 남기면 해로운 이유: 이 ExternalSecret 은 온프렘 `fb-secrets` 의 `harbor-pull`(robot 계정)을
#    당긴다. EKS 스토어(SSM, C-23)엔 그 키가 없으므로 **영구 SecretSyncedError** 가 되고,
#    ns 의 ESO 상태가 상시 빨강이라 진짜 실패가 묻힌다.
# ⚠️ 나머지 반쪽(default SA 의 imagePullSecrets: harbor)은 **앱 레포 Ansible 소관**이다 — 1-31.
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-harbor-pull
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-harbor-pull
