# app ns Harbor pull secret IaC 화 (런북 §9-21 부채 해소, 2026-07-30) — P1 수동 배선 대체.
# 선행조건·형식은 pipelines/externalsecret.yaml 의 동일 사본 주석 참조 (백엔드 = fb-secrets `harbor-pull`).
# target 이름은 기존 실물 `harbor` 유지(default SA imagePullSecrets 가 문다 — SA IaC = k8s_cluster_base).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: harbor
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef: {key: harbor-pull, property: REGISTRY}
    - secretKey: username
      remoteRef: {key: harbor-pull, property: USERNAME}
    - secretKey: password
      remoteRef: {key: harbor-pull, property: PASSWORD}
