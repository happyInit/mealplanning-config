apiVersion: v1
kind: ConfigMap
metadata:
  name: app-common
data:
  # ✅ P2 데이터 컷오버 (2026-07-29 전환창 스텝 7) — VM(.8) → in-cluster Service DNS.
  #    롤백(런북 §6)은 이 블록을 VM 좌표로 원복 + VM read_only 해제.
  # ✅ P3 Pooler 전환 (2026-07-30) — 앱 기본 좌표가 CNPG Pooler(PgBouncer, transaction 모드)다.
  #    HPA 로 파드가 늘어도 PG 커넥션이 곱해지지 않게 하는 것이 목적(object_spec §4.5).
  # 🔴 **이 값을 따르지 않는 예외 3종** — 각 overlay 의 pg-direct.yaml 이 pg-rw 로 되돌린다:
  #    · ocr             세션 SET(statement_timeout)·read_only 가드가 transaction 풀링에서 무효화됨
  #    · ranking-serving psycopg.connect 직접 사용 → prepare_threshold 기본값(5) 그대로
  #    · (참고) 파이프라인·PGSync 는 애초에 이 ConfigMap 을 안 읽는다 — 각자 좌표 보유
  # 롤백: 이 한 줄을 pg-rw.data.svc 로 되돌리고 sync (파드 재기동, 수 초).
  PGHOST: pg-pooler.data.svc
  PGPORT: "5432"
  PGDATABASE: foodbudget
  PGUSER: fbapp              # 비밀 아님(비번만 Secret) — account config.py 필드명과 일치
  ESHOST: es-es-http.data.svc # ECK — 인증 강제. ES_USER 는 여기, ES_PASSWORD 는 서비스 Secret(ESO)
  ESPORT: "9200"
  # 🔴 이 ConfigMap 은 app ns 의 모든 서비스가 envFrom 으로 읽는다 — ES 를 안 쓰는 서비스에는
  #    값만 들어있을 뿐 사용하지 않아 무해하다.
  # ES_USER: mp_recipe_reader (이슈 #521 3단계) — ECK file realm 롤 `mp_recipe_reader`(`recipes*` read 전용).
  #    종전 `elastic` 슈퍼유저 자격증명이 평문(envFrom)으로 오가던 것을 읽기 전용 계정으로 낮췄다.
  #    비밀번호는 data-secrets/ES_RECIPE_READER_PASSWORD (chat·recipe ExternalSecret 이 한 세트로 참조).
  #    코드 하위호환(f665eb5): env 없으면 무인증(VM 폴백 경로 그대로 성립) — mp_recipe_reader 는 이 좌표와 붙는다.
  # ⚠️ rollout restart 필요 — envFrom.configMapRef 는 파드 기동 시점에만 주입된다. 이 값을 바꾸고
  #    ArgoCD sync 를 해도 도는 파드는 옛 값을 계속 쓴다(체크섬 어노테이션 없음). app 워크로드에 rollout restart 필수.
  ES_USER: mp_recipe_reader
  # Redis = Sentinel-aware(분기 C — 앱 이미지 ≥1.2.0 전제). REDISHOST 는 폴백 전용.
  REDIS_SENTINELS: "mp-redis-s-0.mp-redis-s-hl.data.svc:26379,mp-redis-s-1.mp-redis-s-hl.data.svc:26379,mp-redis-s-2.mp-redis-s-hl.data.svc:26379"
  REDIS_MASTER_GROUP: mymaster # 🔴 소문자 — 인라인 sentinel 기본 그룹명
  REDISHOST: mp-redis-master.data.svc # 폴백 전용(Sentinel 모드에선 미사용)
  REDISPORT: "6379"
  KAFKA_BOOTSTRAP: kafka-kafka-bootstrap.data.svc:9092 # Strimzi <cluster>-kafka-bootstrap
  # 🔴 크로스서비스 URL 계약 — Service 가 bare(§2.3)라 bare 이름으로 도달. 코드 기본값과 같지만 명시로 박아 계약을 고정.
  #    mealplan→account/pantry/ranking, chat→account/pantry 가 이 값을 읽는다.
  ACCOUNT_BASE_URL: "http://account:8004"
  PANTRY_BASE_URL: "http://pantry:8005"
  RANKING_SERVING_URL: "http://ranking-serving:8009"
  ENVIRONMENT: production
  LOG_LEVEL: INFO

  # ── OpenTelemetry (2026-08-02 배선) ──────────────────────────────────────────
  #
  # 🔴 종전 주석("지금은 미주입 — 앱은 없으면 OTEL 비활성")은 **사실과 달랐다.**
  #    앱 7종은 Dockerfile CMD 가 `opentelemetry-instrument uvicorn …` 래퍼다. 엔드포인트가
  #    없으면 비활성이 되는 게 아니라 **SDK 기본값 localhost:4317 로 붙으려다 실패하고
  #    무한 재시도**한다. 실측(2026-08-02, 24시간):
  #      app ns 총 로그          330,827 줄
  #      OTLP Connection refused 132,633 줄  = 전체의 40.1%
  #    Loki 7일 보존 예산의 40%를 이 에러 하나가 먹고 있었고, 모든 파드가 재시도 백오프에
  #    CPU 를 태우고 있었다. 구조화 로그에 trace_id 는 찍히는데 그 trace 는 어디에도 없었다.
  #
  # 대상: 래퍼를 쓰는 7종(account·mealplan·notify·pantry·price·recipe·recipebook)이 이 값을 읽는다.
  #    나머지 5종(chat·ocr·operations·video·ranking-serving)은 CMD 에 래퍼가 없어 이 값만으론
  #    스팬을 내보내지 않는다 — Dockerfile 변경이 필요한 앱 레포 건이라 별건으로 남긴다.
  #    (chat 만 자체 tracing.py 를 갖고 있는데 `OTEL_TRACES_ENABLED` 기본 False 라 지금도 조용하다.
  #     그 기본 엔드포인트가 죽은 `.11` VM 좌표라, 켤 때 반드시 이 값으로 덮여야 한다.)
  #
  # 🔴 `.svc` 단축형 고정 — 4-dot FQDN 금지(파드 search 의 `local` 하이재킹, 실측 21.7%).
  #    근거는 config 레포 platform/argocd/alloy.yaml 주석.
  # 🔴 스킴이 `http://` 인 것이 곧 insecure 지시다 — Tempo OTLP 수신기에 TLS 가 없다.
  #    gRPC 익스포터는 스킴으로 채널 보안을 정한다(https:// 로 쓰면 핸드셰이크에서 죽는다).
  # ⚠️ 이 값만으론 안 된다 — `app` ns 는 egress default-deny 라
  #    platform/policies/netpol-backend.yaml 에 tempo:4317 허용이 함께 있어야 한다.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability.svc:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc # 설치된 패키지 = opentelemetry-exporter-otlp-proto-grpc
  # 지표·로그는 OTLP 로 내보내지 않는다. Tempo 는 트레이스만 받고,
  #   지표 = prometheus_fastapi_instrumentator 가 /metrics 로 노출 → Prometheus 가 스크레이프
  #   로그 = Alloy 가 /var/log/pods 를 테일 → Loki
  # 🔴 이 둘을 none 으로 안 박으면 트레이스만 고치고 **지표·로그 익스포터가 같은 스팸을 계속 낸다.**
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_TRACES_EXPORTER: otlp
  # 🔴 헬스 프로브·메트릭 스크레이프를 트레이스에서 제외한다.
  #
  # 배선 직후 실측(2026-08-02, 유저 트래픽 0인 상태):
  #   Tempo 유입 378 스팬/분 = 하루 약 545K — **거의 전부 kubelet 프로브였다.**
  #   7종이 전부 /health 하나에 startup·readiness·liveness 3중으로 붙어 있고,
  #   FastAPI 계측이 요청마다 부모 1 + `http send` 자식 3 = 4스팬을 만든다.
  #   실제로 잡힌 트레이스: recipe / GET /health 0.90ms + http send ×3.
  #
  # 이걸 방치하면 트레이스 백엔드가 프로브 기록으로 가득 찬다. Tempo 가 07-28~08-02 닷새간
  # 죽은 원인이 **106MB WAL 블록을 2Gi 로 완성하지 못한 것**이었는데, 그 블록의 내용도
  # 유저 트래픽이 아니라 이런 종류였을 가능성이 높다(같은 기간 유저 트래픽은 사실상 0이었다).
  #
  # 값은 정규식이고 매칭은 `re.search(패턴, url)` 다(설치된 opentelemetry.util.http.ExcludeList
  # 소스로 확인). 그래서 `$` 로 끝을 앵커한다 — 그냥 `health` 로 두면 나중에 생길
  # `/api/health-tips` 같은 실제 엔드포인트까지 조용히 트레이스에서 사라진다.
  # 전역 키를 쓰면 FastAPI 외 계측도 함께 커버된다(계측별 키는 OTEL_PYTHON_FASTAPI_EXCLUDED_URLS).
  OTEL_PYTHON_EXCLUDED_URLS: "/health$,/metrics$"
