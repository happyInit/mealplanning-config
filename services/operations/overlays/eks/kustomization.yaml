apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - ../../base
  - serviceaccount.yaml
# EKS 이관 시 Harbor 주소만 ECR로 교체한다.
images:
  - name: 192.168.0.10/mealplanning/mp-operations-service
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mp-operations-service
    newTag: "e850ca6de1f46cb64a943b271f8d0e9ee9792acd"

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).
  - target: {group: apps, kind: Deployment, name: mp-operations}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-operations}
      spec:
        template:
          spec:
            serviceAccountName: mp-operations
