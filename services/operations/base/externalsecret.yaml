# Operations는 임시로 더존비즈온 교육용 외부 PostgreSQL(team2)을 사용한다.
# 내부 CNPG 여유 확보 전까지의 임시 조치 — app-secrets.PGPASSWORD(내부 DB 비번)와는 별개 키.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-operations-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-operations-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: OPERATIONS_EXTERNAL_PGPASSWORD }
