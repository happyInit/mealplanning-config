# Operations는 기존 앱 PostgreSQL 계정의 비밀번호만 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-operations-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-operations-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
