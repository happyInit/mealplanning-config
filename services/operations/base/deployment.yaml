apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-operations
  labels:
    app: operations
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations
  template:
    metadata:
      labels:
        app: operations
        tier: backend
    spec:
      # 🔴 셀렉터가 `app: <자기이름>` 이 아니라 **공통 `tier: backend`** 인 게 핵심이다 (2026-07-31).
      #    11종 중 10종이 replica 1 이라, 자기 파드만 세는 제약은 셀 게 하나뿐이라 **아무 일도 안 한다**.
      #    tier 로 묶어야 "백엔드 파드 전체를 노드/호스트에 고르게" 가 성립한다.
      # 배경: 제약이 전무해 분포가 a1 7 · b2 7 · b1 1 이었다 — b2 하나가 죽으면 7개 서비스가
      #    동시에 유일 replica 를 잃는다. hostname = 노드 상실, zone = 물리 호스트 상실 대비.
      # ⚠️ **ScheduleAnyway(soft) 인 이유** = b1·b2 요청률이 77~80% 라, DoNotSchedule 이면
      #    가장 적게 담은 노드에 자리가 없을 때 파드가 **Pending 으로 멈춘다**(가용성 사고).
      #    균형은 점수로 유도하고 스케줄 자체는 막지 않는다.
      # ⚠️ 이건 **blast radius 축소이지 HA 가 아니다** — replica 1 서비스는 노드가 죽으면
      #    그대로 내려가고, 기본 tolerationSeconds 300s 탓에 재스케줄까지 최대 5분 걸린다.
      #    진짜 HA 는 replicas>=2 + PDB 이며 별건이다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tier: backend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tier: backend
      automountServiceAccountToken: false
      # 축출 서열 — kubelet 은 (QoS, priority, 초과분) 순으로 고른다. 앱 티어가 비면(priority 0)
      #   크롤러·배치(pipeline-low, 1000)보다 먼저 죽는 역전이 난다. object_spec §1.4 ①.
      priorityClassName: app-normal
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: operations
          # CI가 food-budget-app 커밋 SHA 태그를 Harbor에 push한 뒤에만 ArgoCD sync 한다.
          image: 192.168.0.10/mealplanning/mp-operations-service:e850ca6de1f46cb64a943b271f8d0e9ee9792acd
          ports:
            - name: http
              containerPort: 8011
              # 🔴 여기에 appProtocol 을 두지 말 것 — ContainerPort 에는 그런 필드가 없다
              #    (name·hostPort·containerPort·protocol·hostIP 뿐). Istio 프로토콜 선택에 쓰는
              #    appProtocol 은 **Service 포트 전용**이고 service.yaml 에 이미 올바로 들어 있다.
              #    ArgoCD 의 apply 는 strict 가 아니라 API 서버가 조용히 프루닝했다 —
              #    라이브 Deployment 의 ports 에는 이 필드가 없었고 아무 에러도 없었다.
              #    (kubectl apply --validate=strict 는 거부한다: unknown field ...ports[0].appProtocol)
              #    2026-08-02 scripts/validate.py 의 kubeconform 단계가 첫 실행에서 잡았다.
          envFrom:
            - configMapRef:
                name: app-common
            - secretRef:
                name: mp-operations-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: operations
            - name: OPERATIONS_DATABASE_ENABLED
              value: "true"
            - name: OPERATIONS_COLLECTOR_ENABLED
              value: "true"
            - name: OPERATIONS_KUBERNETES_EVIDENCE_ENABLED
              value: "false"
            # Incident Evidence 생성 시 Tempo에서 해당 서비스·시간 범위의 오류·1초 이상 Trace를 수집한다.
            # 느린 Trace 기준은 현재 AppHighP95Latency 경보와 동일한 1초로 유지한다.
            - name: OPERATIONS_TEMPO_EVIDENCE_ENABLED
              value: "true"
            # 4-dot FQDN은 파드 search domain에서 외부 DNS로 새므로 .svc까지만 쓴다.
            - name: OPERATIONS_TEMPO_URL
              value: http://tempo.observability.svc:3200
            - name: OPERATIONS_PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.observability.svc:9090
            # 임시: 내부 CNPG 여유 확보 전까지 더존비즈온 교육용 외부 PG(team2) 사용.
            # app-common의 PGHOST/PGPORT/PGUSER/PGDATABASE(내부 CNPG용)를 이 컨테이너만 덮어씀.
            - name: PGHOST
              value: "211.46.52.152"
            - name: PGPORT
              value: "15432"
            - name: PGUSER
              value: team2
            - name: PGDATABASE
              value: postgres
            # 🔴 `PGSSLMODE: require` 를 넣지 말 것 — 넣으면 operations 가 즉시 죽는다.
            #    2026-08-03 실측(파드 안에서 psycopg 로 직접 확인):
            #      sslmode=prefer  → 연결 OK · pg_stat_ssl = (ssl=False) = **평문**
            #      sslmode=require → 실패 "server does not support SSL"
            #    즉 이 서버는 TLS 를 아예 지원하지 않는다. psycopg 기본값 prefer 라
            #    지금 이 연결은 **공인 IP 를 지나는 평문**이다(위 PGHOST 는 사설망이 아니다).
            #    ⚠️ 설정으로 못 고친다. 실질 해결은 둘 중 하나다:
            #      ① operations 를 내부 CNPG 로 되돌린다(위 "임시" 주석의 원래 계획) ← 정공법
            #      ② 그때까지는 이 경로로 민감 데이터를 보내지 않는다(운영 지표 한정 유지)
            #    CIS/보안 점검에서 이 항목이 나오면 "인지된 갭 + 이전 계획 있음"으로 답한다.
          startupProbe:
            httpGet: { path: /health, port: 8011 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8011 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8011 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
