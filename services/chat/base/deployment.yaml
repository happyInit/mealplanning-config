apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-chat            # §2.3: 워크로드 오브젝트는 mp- 접두사
  labels:
    app: chat              # §2.3: 라벨은 bare(논리 신원·Service selector·OTEL)
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      annotations:
        # Istio 병합 대상 — 사이드카가 이 앱 /metrics 를 15020/stats/prometheus 로 합친다(STRICT-safe). scrape=ServiceMonitor mp-app-services.
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8003"
      labels:
        app: chat
        tier: backend
    spec:
      automountServiceAccountToken: false    # 앱은 K8s API 안 씀 → 토큰=공격표면
      securityContext:                       # 🔴 PSS restricted (app ns enforce)
        runAsNonRoot: true
        runAsUser: 10001                     # 이미지 svc 유저(Dockerfile USER 10001)
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat
          image: 192.168.0.10/mealplanning/mp-chat-service:d20d3fdb3a4fe05d852bde354cca7991e11c6d59   # overlay가 :sha로 재확인(CI 커밋 지점)
          ports:
            - name: http                     # 🔴 Istio L7 판별 = 포트 이름
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: app-common             # PG·ES·Redis·Kafka·크로스서비스 URL(§2.3)
            - configMapRef:
                name: chat-config            # 서비스별 기능 플래그(§7.3)
            - secretRef:
                name: mp-chat-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: chat
          startupProbe:
            httpGet: { path: /health, port: 8003 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi                  # OOM 보호(compose mem_limit 정합)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # compose read_only:true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
