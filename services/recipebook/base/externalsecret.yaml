# recipebook 비밀 — fb-secrets/app-secrets + data-secrets ──ESO──▶ app ns Secret `mp-recipebook-secrets`.
#   (ES_PASSWORD 만 data-secrets — 나머지는 전부 app-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-recipebook-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-recipebook-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: app-secrets, property: JWT_SECRET }
    # ECK basic_auth — mp_recipe_reader 와 한 세트 (app-common 의 ES_USER 와 결합).
    # 🔴 #515 B단계에서 recipebook 이 ES(alias user_recipes_live)를 읽기 시작했다. 이 줄이 없으면
    #    코드가 `(es_user, "")` 로 인증을 시도해 401 → 발행 레시피 목록이 통째로 죽는다
    #    (es_user 는 app-common 에서 오므로 "비번만 없는" 상태가 만들어진다).
    - secretKey: ES_PASSWORD
      remoteRef: { key: data-secrets, property: ES_RECIPE_READER_PASSWORD }
