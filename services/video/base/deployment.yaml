# 영상→레시피 추출 서비스 (#11). AI 파트 신규 · 2026-07-31. Vertex AI 전용(SA키 파일 마운트).
# 이미지 태그는 overlays/onprem 에서 Jenkins CD 가 :sha 로 핀한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-video
  labels:
    app: video
    tier: backend
spec:
  replicas: 1                              # #299 replica-safe(잡 상태 Redis) — HPA 가능
  selector:
    matchLabels:
      app: video
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8011"
      labels:
        app: video
        tier: backend
    spec:
      automountServiceAccountToken: false
      # 축출 서열 — kubelet 은 (QoS, priority, 초과분) 순으로 고른다. 앱 티어가 비면(priority 0)
      #   크롤러·배치(pipeline-low, 1000)보다 먼저 죽는 역전이 난다. object_spec §1.4 ①.
      priorityClassName: app-normal
      terminationGracePeriodSeconds: 30
      securityContext:                     # app ns = PodSecurity enforce=restricted
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # 🔴 ndots:1 — 유튜브·Vertex FQDN 이 서치도메인 변조로 조용히 막히는 것을 차단한다.
      #    이 서비스는 **실제로 걸려 있었다** — 2026-08-04 조사 중 Cilium FQDN 캐시에
      #    `www.youtube.com.local.` 이 상주 중인 것을 실측했다(= ISP 가 그 이름에 가짜 IP 를
      #    물려줬고 리졸버가 거기서 확정했다는 뜻). 그 IP 는 toFQDNs 에 안 걸려 RST 없이
      #    드롭되므로, oembed 검증이 fail-open 이라 치명적이진 않아도 매 추출이 지연된다.
      #    근거·실측 = config#139 (같은 뿌리의 컬리 크롤 실장애).
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: video
          image: 192.168.0.10/mealplanning/mp-video-service:latest   # ← overlay 가 :sha 로 덮음
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8011, protocol: TCP}
          envFrom:
            - configMapRef: {name: app-common}
            - secretRef: {name: mp-video-secrets}   # PGPASSWORD (gazetteer item_id 정규화용 PG 접속)
          env:
            - {name: OTEL_SERVICE_NAME, value: "video"}
            - {name: VIDEO_EXTRACT_MODEL, value: "gemini-3.5-flash-lite"}   # 🔴 -latest 별칭 금지(PR #272)
            - {name: VIDEO_RETRY_MODEL,   value: "gemini-3.5-flash"}
            - {name: VIDEO_REFINE_ENABLED, value: "false"}                  # 기본 OFF(비용)
            # ── Vertex 전환 (결정 gcp-migration-plan §4.2 · PoC 완료 2026-07-29) ──
            # extract.py 는 genai.Client(vertexai=True)=ADC → SA키 **파일 마운트** 필요(OCR 의 env JSON 과 다름).
            # 영상 = Vertex 전용 확정(2026-07-31) — api_key 롤백/ mp-video-secrets 폐기. 인증은 SA키 파일 하나뿐.
            - {name: VIDEO_GENAI_BACKEND, value: "vertex"}
            - {name: GCP_PROJECT_ID, value: "mealplanning-503911"}
            - {name: GCP_LOCATION,   value: "global"}                       # 서울 미배치 → global(팀 승인)
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: "/etc/gcp/gcp-sa.json"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: gcp-sa, mountPath: /etc/gcp, readOnly: true}
          livenessProbe:
            httpGet: {path: /health, port: 8011}
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: 8011}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: gcp-sa
          secret: {secretName: mp-gcp-sa, defaultMode: 0444}   # 0400 아님 — 비root(10001)가 읽어야 함
