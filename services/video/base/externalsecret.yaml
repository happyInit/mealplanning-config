# 영상 전용 Gemini 키(api_key 롤백용 · 서비스별 비용 구분). 값은 fb-secrets/app-secrets 에 선주입 필요.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-video-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-video-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIDEO_GEMINI_API_KEY
      remoteRef: {key: app-secrets, property: VIDEO_GEMINI_API_KEY}
---
# Vertex 인증용 SA키 — **파일 마운트**(extract.py 가 ADC 사용). /etc/gcp/gcp-sa.json 으로 마운트됨.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-gcp-sa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-gcp-sa
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gcp-sa.json                # ← 마운트될 파일명
      remoteRef: {key: app-secrets, property: GCP_SA_KEY_JSON}
