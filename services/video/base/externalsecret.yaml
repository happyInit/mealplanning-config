# 영상 전용 Gemini 키(OCR·챗과 분리 = 서비스별 비용 구분). 값은 fb-secrets/app-secrets 에 선주입 필요.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-video-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-video-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIDEO_GEMINI_API_KEY
      remoteRef: {key: app-secrets, property: VIDEO_GEMINI_API_KEY}
