# 영상 = Vertex AI 전용(gcp-migration-plan §4.2, 2026-07-31 확정). api_key 롤백 레버는 폐기 →
# mp-video-secrets(VIDEO_GEMINI_API_KEY) 제거. 인증은 아래 SA키 파일 마운트 하나뿐.
# Vertex 인증용 SA키 — **파일 마운트**(extract.py 가 ADC 사용). /etc/gcp/gcp-sa.json 으로 마운트됨.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-gcp-sa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-gcp-sa
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gcp-sa.json                # ← 마운트될 파일명
      remoteRef: {key: app-secrets, property: GCP_SA_KEY_JSON}
