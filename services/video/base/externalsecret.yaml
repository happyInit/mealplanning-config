# 영상 = Vertex AI 전용(gcp-migration-plan §4.2, 2026-07-31). LLM api_key 롤백 레버는 폐기.
# 단 재료명→item_id 정규화(normalize.py→gazetteer→_db.connect)에 PG 접속이 필요 →
# mp-video-secrets 는 PGPASSWORD 만 보유(인증 없는 서비스라 JWT·ES 불필요). 다른 서비스 동형.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-video-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-video-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PGPASSWORD
      remoteRef: {key: app-secrets, property: PGPASSWORD}
---
# Vertex 인증용 SA키 — **파일 마운트**(extract.py 가 ADC 사용). /etc/gcp/gcp-sa.json 으로 마운트됨.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-gcp-sa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-gcp-sa
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gcp-sa.json                # ← 마운트될 파일명
      remoteRef: {key: app-secrets, property: GCP_SA_KEY_JSON}
