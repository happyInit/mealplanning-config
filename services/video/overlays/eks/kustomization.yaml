apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - ../../base
  - serviceaccount.yaml

# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
# 🔴 0-9(2026-08-10): 여기만 images 블록이 비어 있어 base 의 `:latest` 가 그대로 샜다.
#    다른 서비스 13종과 같은 모양으로 맞춘다. 레지스트리 호스트의 정본 = scripts/sites.yaml.
images:
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
# 🔴 0-9(2026-08-10): 여기만 images 블록이 비어 있어 base 의 `:latest` 가 그대로 샜다.
#    다른 서비스 13종과 같은 모양으로 맞춘다. 레지스트리 호스트의 정본 = scripts/sites.yaml.
  - name: 192.168.0.10/mealplanning/mp-video-service
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-video-service
    newTag: "d22e2b704985181099b306bea3b0422b4accab96"

# EKS 이식 오버레이(플랜 §8) — ECR 이미지·gp3 등 환경차만. 착수 시 다른 서비스 eks 오버레이 본떠 채운다.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:
# EKS 이식 오버레이(플랜 §8) — ECR 이미지·gp3 등 환경차만. 착수 시 다른 서비스 eks 오버레이 본떠 채운다.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).
  - target: {group: apps, kind: Deployment, name: mp-video}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-video}
      spec:
        template:
          spec:
            serviceAccountName: mp-video

# ── 0-13 PG 서비스 롤 = svc_video (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
  - target: {group: apps, kind: Deployment, name: mp-video}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-video}
      spec:
        template:
          spec:
            containers:
              - name: video
                env:
                  - name: PGUSER
                    value: svc_video
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-video-secrets}
    patch: |-
      - op: test
        path: /spec/data/0/secretKey
        value: PGPASSWORD
      - op: replace
        path: /spec/data/0/remoteRef
        value: {key: pg-roles, property: svc_video}
# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
  - target: {group: apps, version: v1, kind: Deployment, name: mp-video}
    patch: |-
      # tmp → 512Mi — 🔴 YouTube 추출 산출물 경로. 관측 4KiB 는 저부하 시점
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: tmp
      - op: add
        path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
        value: 512Mi

  # ── C-14(ElastiCache) 대비 Redis 튜너블 — EKS 전용 (이슈 #642 · 체크리스트 1-14·1-15) ──
  # 🔴 **앱 기본값은 현행 온프렘 동작**이고(무한 대기 / 재시도 없음), 여기서만 켠다.
  #    ElastiCache Multi-AZ 페일오버는 DNS 이름이 유지된 채 뒤의 노드가 바뀌어 기존 커넥션이
  #    끊긴다 — 온프렘엔 ElastiCache 가 없어 이 방어가 필요 없고, 켜면 지연만 는다.
  # ⚠️ Redis **주소**(REDISHOST·REDIS_SENTINELS)는 여기서 안 건드린다 —
  #    그건 `common/overlays/eks` 의 미완 항목(C-14 엔드포인트)이고 인프라 담당 소관이다.
  #    여기 있는 건 **앱 동작 튜너블**뿐이다.
  # 🔴 `env` 는 `envFrom` 을 이긴다 — app-common 에 같은 키가 생겨도 이 값이 유효하다.
  - target: {group: apps, version: v1, kind: Deployment, name: mp-video}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: REDIS_JOB_RETRIES, value: "3"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: REDIS_HEALTH_CHECK_S, value: "30"}
