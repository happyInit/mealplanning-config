# ocr 비밀 — fb-secrets/app-secrets ──ESO──▶ app ns Secret `mp-ocr-secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-ocr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-ocr-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: app-secrets, property: JWT_SECRET }
    - secretKey: GEMINI_API_KEY
      remoteRef: { key: app-secrets, property: GEMINI_API_KEY }   # api_key 롤백용 유지
    # ── Vertex 전환 (AI 파트 추가 · draft 2026-07-31) ──
    # genai_client 는 SA 키를 env(JSON 원문)로 받는다(#387). envFrom secretRef 로 컨테이너에 주입됨.
    # 값은 fb-secrets/app-secrets 에 GCP_SA_KEY_JSON 이 먼저 있어야 한다(사용자/인프라 주입).
    - secretKey: GCP_SA_KEY_JSON
      remoteRef: { key: app-secrets, property: GCP_SA_KEY_JSON }
