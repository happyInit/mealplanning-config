# price 비밀 — fb-secrets/app-secrets ──ESO──▶ app ns Secret `mp-price-secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-price-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-price-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: app-secrets, property: JWT_SECRET }
