# 🟡 **임시** — P3 Pooler 전환 카나리 (2026-07-30). price 한 서비스만 Pooler 경유로 돌려
#    실사용 트래픽에서 검증한다. 나머지 8개는 그대로 pg-rw 직결.
#
# 동작 원리: 컨테이너의 `env` 는 `envFrom`(app-common ConfigMap)을 **이긴다**. 그래서 이 한 줄이
#   app-common 의 PGHOST=pg-rw.data.svc 를 price 에서만 덮는다.
#
# 🔴 제거 조건: 검증 통과 후 app-common 의 PGHOST 자체를 pg-pooler 로 바꾸는 PR 에서 **이 파일을 함께 삭제**한다.
#   남겨두면 정본이 두 곳(여기 + app-common)이 되어, 나중에 app-common 을 되돌려도 price 만 안 돌아온다.
#
# 롤백: 이 파일을 kustomization 에서 빼고 sync — 파드 재기동으로 pg-rw 직결 복귀(수 초).
#
# 전제(이미 실증): 이미지에 prepare_threshold=None 반영(app#407) · pg-pooler 스모크 통과(인증·트랜잭션·
#   동시 커넥션 다중화) · backend NetworkPolicy 의 data ns egress 는 포트 무제한이라 Pooler 도 허용.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-price
spec:
  template:
    spec:
      containers:
        - name: price
          env:
            - name: PGHOST
              value: pg-pooler.data.svc
