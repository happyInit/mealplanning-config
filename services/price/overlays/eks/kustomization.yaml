apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - ../../base
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
images:
  - name: 192.168.0.10/mealplanning/mp-price-service
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mp-price-service
    newTag: "d20d3fdb3a4fe05d852bde354cca7991e11c6d59"

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 300m → 150m. 🔴 base 의 300m 은 **HPA 를 켜기 위한 값이 아니다** — price 에는 HPA 가 없다
# (§9.3: HPA 는 실측 근거가 있는 account·recipe 만). 2026-08-01 부하실측 정합으로 올린 값이지만
# 그 부하는 **replica 1 짜리 서비스의 피크**였고, 요청은 피크가 아니라 **스케줄러가 예약해 두는 몫**이다.
# CPU limits 가 없으므로(§13.7) 피크는 요청 위로 그대로 뚫는다 — 150m 로 내려도 처리량 천장은 그대로다.
# 온프렘 base 는 300m 유지(사이트 분리 근거 = platform/es/overlays/eks 하단 주석).
#
# 🔴 0-6 대상 아님 — price 의 TSC 는 hostname·zone 두 축 다 이미 ScheduleAnyway(soft)다(base 확인).
#    hard TSC 보유는 실측 5종뿐 = account · recipe · frontend · gw-public · kafka-combined.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mp-price
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 150m

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm
