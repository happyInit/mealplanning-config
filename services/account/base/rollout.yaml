# account — Argo Rollouts 카나리 (ADR-0001). 기존 Deployment 를 변환(2026-08-03).
#   recipe 파일럿 검증 완료(0→20→50→100 자동분석 통과·자동 promote) 후 같은 패턴을 관문 서비스에 적용.
#
# 🔴 마이그레이션(무중단): 구 Deployment `mp-account` 는 prune:false 라 자동 삭제 안 됨.
#    이 Rollout 이 Healthy 로 뜬 뒤 **수동** `kubectl -n app delete deploy mp-account`.
#    🔴 account = auth 관문이라 blast radius 최대 — 삭제 전 recipe 때처럼 stable Service selector 에
#       rollouts-pod-template-hash 주입됐는지(=트래픽이 Rollout 으로 갔는지) 반드시 확인하고 지운다.
#
# 🔴 TSC matchLabelKeys = **rollouts-pod-template-hash** (Deployment 의 pod-template-hash 아님).
# 🔴 카나리 트래픽 분할 = Gateway API 플러그인. HTTPRoute(mp-account-route)는 backendRefs 2개
#    (account 100 / account-canary 0)로 선언돼 있어야 한다. account 도 HPA 라 트래픽라우터 필수(§6.1).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mp-account
  labels:
    app: account
    tier: backend
spec:
  # 🔴 replicas 없음 — HPA(hpa.yaml, scaleTargetRef→Rollout)가 소유. 베이스라인=HPA minReplicas(2).
  selector:
    matchLabels:
      app: account
  strategy:
    canary:
      stableService: account
      canaryService: account-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: mp-account-route
            namespace: app
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: account-canary-analysis
        - setWeight: 50
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: account-canary-analysis
        - setWeight: 100
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8004"
      labels:
        app: account
        tier: backend
    spec:
      # blast radius 축소 — zone·hostname 스프레드(hard). 근거·함정은 구 deployment.yaml 주석 참조.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - rollouts-pod-template-hash   # 🔴 Rollouts 라벨 (pod-template-hash 아님)
          labelSelector:
            matchLabels:
              app: account
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - rollouts-pod-template-hash
          labelSelector:
            matchLabels:
              app: account
      automountServiceAccountToken: false
      priorityClassName: app-normal          # 🔴 축출 서열 — 없으면 pipeline-low 보다 먼저 죽음(§1.4)
      securityContext:                       # PSS restricted (app ns enforce)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # 🔴 ndots:1 — 소셜 로그인 FQDN 이 서치도메인 변조로 조용히 막히는 것을 차단한다.
      #    기본 ndots:5 아래에서 `kauth.kakao.com`(점 2개)은 `kauth.kakao.com.local` 이
      #    **먼저** 질의되고, ISP 가 NXDOMAIN 대신 가짜 IP 를 물려주면(간헐) 리졸버가 거기서
      #    확정한다. 그 IP 는 netpol-backend-fqdn.yaml 의 toFQDNs 에 안 걸려 Cilium 이
      #    **RST 없이 드롭** → 빠른 에러가 아니라 무한 대기 → 로그인이 타임아웃으로 보인다.
      #    2026-08-03 컬리 크롤 실장애와 같은 뿌리다(측정·근거 = config#139).
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: account                      # 🔴 HPA containerResource 가 이 이름을 참조
          image: 192.168.0.10/mealplanning/mp-account-service:1.1.9   # overlay images 트랜스포머가 :sha 재확인
          ports:
            - name: http                     # Istio L7 판별 = 포트 이름
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: app-common
            - secretRef:
                name: mp-account-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: account
          startupProbe:
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests:
              cpu: 500m                       # bcrypt 부하 실측 정합(§stage1). limit CPU 없음(버스트 CFS 스로틀 회피).
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
