apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-account            # §2.3: 워크로드 오브젝트는 mp- 접두사
  labels:
    app: account              # §2.3: 라벨은 bare(논리 신원·Service selector·OTEL)
    tier: backend            # NetworkPolicy 가 ns 아닌 이 라벨로 선택(object_spec §1.3)
spec:
  # 🔴 replicas 를 **의도적으로 안 적는다** — HPA(hpa.yaml)가 이 필드의 주인이다(2026-07-30 P3).
  #    git 에 남겨두면 ArgoCD 가 sync 할 때마다 HPA 가 정한 replica 수를 1 로 되돌려,
  #    피크 중에 파드가 줄었다 늘었다 한다. 필드가 없으면 apply 가 live 값을 안 건드린다.
  #    베이스라인이 필요하면 HPA 의 minReplicas 를 본다(현재 2).
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      annotations:
        # Istio 병합 대상 — 사이드카가 이 앱 /metrics 를 15020/stats/prometheus 로 합친다(STRICT-safe). scrape=ServiceMonitor mp-app-services.
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8004"
      labels:
        app: account
        tier: backend
    spec:
      # 🔴 셀렉터가 `app: <자기이름>` 이 아니라 **공통 `tier: backend`** 인 게 핵심이다 (2026-07-31).
      #    11종 중 10종이 replica 1 이라, 자기 파드만 세는 제약은 셀 게 하나뿐이라 **아무 일도 안 한다**.
      #    tier 로 묶어야 "백엔드 파드 전체를 노드/호스트에 고르게" 가 성립한다.
      # 배경: 제약이 전무해 분포가 a1 7 · b2 7 · b1 1 이었다 — b2 하나가 죽으면 7개 서비스가
      #    동시에 유일 replica 를 잃는다. hostname = 노드 상실, zone = 물리 호스트 상실 대비.
      # ⚠️ **ScheduleAnyway(soft) 인 이유** = b1·b2 요청률이 77~80% 라, DoNotSchedule 이면
      #    가장 적게 담은 노드에 자리가 없을 때 파드가 **Pending 으로 멈춘다**(가용성 사고).
      #    균형은 점수로 유도하고 스케줄 자체는 막지 않는다.
      # ⚠️ 이건 **blast radius 축소이지 HA 가 아니다** — replica 1 서비스는 노드가 죽으면
      #    그대로 내려가고, 기본 tolerationSeconds 300s 탓에 재스케줄까지 최대 5분 걸린다.
      #    진짜 HA 는 replicas>=2 + PDB 이며 별건이다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tier: backend
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              tier: backend
        # 🔴 위 둘(tier: backend)은 **백엔드 파드 전체**의 균형이라, account 자신의 replica 가
        #    서로 다른 노드에 간다는 보장을 주지 않는다 — 13개가 고르게 퍼진 채로도
        #    account 2개가 같은 노드에 앉을 수 있다. 그러면 PDB(minAvailable:1)가 그 노드를
        #    **drain 불가**로 만든다(두 번째 축출에서 0 이 되어 거부). 그래서 app 단위 제약을 더한다.
        #    account 는 HPA 로 최대 4까지 늘어나므로 이 제약이 실제로 셀 것이 있다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: account
      automountServiceAccountToken: false   # 앱은 K8s API 안 씀 → 토큰은 공격표면(§10.6)
      # imagePullSecret 은 app ns default SA 에 붙인다(§7.8) — 여기 명시 안 함. app 이전 단계 생성.
      securityContext:                       # 🔴 PSS restricted (app ns enforce) — 없으면 파드 거부
        runAsNonRoot: true
        runAsUser: 10001                     # 이미지의 svc 유저(Dockerfile USER 10001)
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: account
          image: 192.168.0.10/mealplanning/mp-account-service:1.1.9  # 태그는 overlay가 :sha로 덮음
          ports:
            - name: http                     # 🔴 Istio L7 판별 = 포트 이름(§4.4). 없으면 TCP 취급
              containerPort: 8004
          envFrom:
            - configMapRef:                  # PGHOST(.8)·ESHOST·OTEL 등 — app 이전 단계 생성
                name: app-common
            - secretRef:                     # JWT_SECRET·PGPASSWORD (ExternalSecret←fb-secrets)
                name: mp-account-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: account
          startupProbe:                      # 부팅(pool.open) 유예 — 없으면 liveness 가 부팅을 죽임
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 5
            failureThreshold: 6              # ≈30초 (compose start_period 20s 여유)
          readinessProbe:                    # 실패 = EndpointSlice 에서만 제거(재시작 안 함, §3.1)
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 무중단 배포 — EndpointSlice 전파 대기(§13.8)
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi                  # OOM 보호(compose mem_limit 512m)
              # 🔴 cpu limit 없음 — bcrypt 는 버스트가 본질(§13.7). CFS 스로틀 = 로그인 병목 재발
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # compose read_only:true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                       # readOnlyRootFilesystem 이라 쓰기 경로 하나 필요
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
