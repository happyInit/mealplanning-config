apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-account            # §2.3: 워크로드 오브젝트는 mp- 접두사
  labels:
    app: account              # §2.3: 라벨은 bare(논리 신원·Service selector·OTEL)
    tier: backend            # NetworkPolicy 가 ns 아닌 이 라벨로 선택(object_spec §1.3)
spec:
  # 🔴 replicas 를 **의도적으로 안 적는다** — HPA(hpa.yaml)가 이 필드의 주인이다(2026-07-30 P3).
  #    git 에 남겨두면 ArgoCD 가 sync 할 때마다 HPA 가 정한 replica 수를 1 로 되돌려,
  #    피크 중에 파드가 줄었다 늘었다 한다. 필드가 없으면 apply 가 live 값을 안 건드린다.
  #    베이스라인이 필요하면 HPA 의 minReplicas 를 본다(현재 2).
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      annotations:
        # Istio 병합 대상 — 사이드카가 이 앱 /metrics 를 15020/stats/prometheus 로 합친다(STRICT-safe). scrape=ServiceMonitor mp-app-services.
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8004"
      labels:
        app: account
        tier: backend
    spec:
      # 🔴 셀렉터가 `app: <자기이름>` 이 아니라 **공통 `tier: backend`** 인 게 핵심이다 (2026-07-31).
      #    11종 중 10종이 replica 1 이라, 자기 파드만 세는 제약은 셀 게 하나뿐이라 **아무 일도 안 한다**.
      #    tier 로 묶어야 "백엔드 파드 전체를 노드/호스트에 고르게" 가 성립한다.
      # 배경: 제약이 전무해 분포가 a1 7 · b2 7 · b1 1 이었다 — b2 하나가 죽으면 7개 서비스가
      #    동시에 유일 replica 를 잃는다. hostname = 노드 상실, zone = 물리 호스트 상실 대비.
      # ⚠️ **ScheduleAnyway(soft) 인 이유** = b1·b2 요청률이 77~80% 라, DoNotSchedule 이면
      #    가장 적게 담은 노드에 자리가 없을 때 파드가 **Pending 으로 멈춘다**(가용성 사고).
      #    균형은 점수로 유도하고 스케줄 자체는 막지 않는다.
      # ⚠️ 이건 **blast radius 축소이지 HA 가 아니다** — replica 1 서비스는 노드가 죽으면
      #    그대로 내려가고, 기본 tolerationSeconds 300s 탓에 재스케줄까지 최대 5분 걸린다.
      #    진짜 HA 는 replicas>=2 + PDB 이며 별건이다.
      #
      # 🔴 2026-08-01 — account 는 그 "별건" 에 해당하게 됐다(HPA min2/max4 + PDB).
      #    그래서 `tier: backend`(soft) 2종을 **app 단위 hard 2종으로 교체**한다.
      #    근거: 같은 구성(tier soft)이던 recipe 가 실제로 **2 replica 둘 다 host-a**,
      #    frontend(app soft)가 **둘 다 host-b** 에 앉아 있었다. soft 는 롤링 업데이트 중
      #    아직 안 죽은 구 파드까지 세어 분포가 왜곡되고 다른 스케줄 점수에 밀려
      #    **조용히 안 지켜진다.** account 가 지금 갈라져 있는 건 보장이 아니라 운이었다.
      #    hostname 만으론 부족하다 — 노드는 갈라도 a1·a2 는 같은 물리 호스트라, 급사 3회
      #    이력이 있는 호스트 A 가 죽으면 전멸한다. 그래서 zone 축이 따로 필요하다.
      #    (replica 1 인 나머지 10종은 tier 제약 유지 — 그쪽 전제는 여전히 유효하고,
      #     그 제약들의 selector 가 tier:backend 라 account 파드도 계속 카운트에 잡힌다.)
      #
      # 🔴 왜 tier 제약을 남겨서 겹치지 않았나: `topologySpreadConstraints` 의
      #    strategic-merge patchMergeKey 가 **topologyKey** 라, 같은 topologyKey 항목이 둘이면
      #    병합이 깨진다 — `kubectl apply --dry-run=server` 에서 병합 결과의 **maxSkew 가
      #    소실**됐다. API 검증은 (topologyKey, whenUnsatisfiable) 쌍만 봐서 통과하지만
      #    apply 경로에서 조용히 망가진다. → **워크로드당 topologyKey 는 유일하게 유지한다.**
      #
      # 🔴 tier 제약이 soft 였던 건 옳다(14 파드를 4 노드에 맞추는 촘촘한 제약 → hard 면
      #    노드가 찼을 때 Pending). app 단위는 파드 2~4개를 2 zone/4 노드에 놓는 성긴
      #    제약이라 자리 부족 국면이 사실상 안 온다 — 그래서 여기선 hard 가 맞다.
      # 🔴 nodeTaintsPolicy: Honor 없이 hard 만 걸면 **막으려던 장애에서 복구가 막힌다** —
      #    host-a 가 죽어도 "파드 0개 도메인" 으로 남아 host-b 이전이 skew 2 로 거부된다.
      #    Honor 는 급사·cordon 노드의 `NoSchedule` 테인트(파드가 톨러레이션 미보유)를 보고
      #    그 노드를 도메인 계산에서 제외한다. ⚠️ 파드 기본 not-ready/unreachable 톨러레이션은
      #    `effect: NoExecute` 전용이라 `NoSchedule` 변종에 안 걸린다 → 제외가 성립한다.
      # 🔴🔴 matchLabelKeys: [pod-template-hash] 없이는 hard 도 안 지켜진다 — TSC 는 스케줄
      #    시점에 selector 에 걸리는 모든 파드를 세므로 **아직 안 죽은 구 RS 파드**가 계산에
      #    낀다. 실제로 hard 로 올린 첫 롤아웃에서 mp-frontend·게이트웨이가 다시 한 호스트로
      #    몰렸다(구 파드가 반대 zone 을 채워 주는 바람에 신규 2개가 같은 zone 을 통과).
      #    matchLabelKeys 는 pod-template-hash 를 selector 에 AND 해 같은 RS 파드만 세게 한다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: account
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: account
      automountServiceAccountToken: false   # 앱은 K8s API 안 씀 → 토큰은 공격표면(§10.6)
      # imagePullSecret 은 app ns default SA 에 붙인다(§7.8) — 여기 명시 안 함. app 이전 단계 생성.
      securityContext:                       # 🔴 PSS restricted (app ns enforce) — 없으면 파드 거부
        runAsNonRoot: true
        runAsUser: 10001                     # 이미지의 svc 유저(Dockerfile USER 10001)
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: account
          image: 192.168.0.10/mealplanning/mp-account-service:1.1.9  # 태그는 overlay가 :sha로 덮음
          ports:
            - name: http                     # 🔴 Istio L7 판별 = 포트 이름(§4.4). 없으면 TCP 취급
              containerPort: 8004
          envFrom:
            - configMapRef:                  # PGHOST(.8)·ESHOST·OTEL 등 — app 이전 단계 생성
                name: app-common
            - secretRef:                     # JWT_SECRET·PGPASSWORD (ExternalSecret←fb-secrets)
                name: mp-account-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: account
          startupProbe:                      # 부팅(pool.open) 유예 — 없으면 liveness 가 부팅을 죽임
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 5
            failureThreshold: 6              # ≈30초 (compose start_period 20s 여유)
          readinessProbe:                    # 실패 = EndpointSlice 에서만 제거(재시작 안 함, §3.1)
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 무중단 배포 — EndpointSlice 전파 대기(§13.8)
          resources:
            requests:
              cpu: 500m                       # 250m→500m (2026-08-01): 부하실측 정합.
              #   로그인 부하시 pod당 ~400~900m(bcrypt) 관측 — 250m 기준 HPA util% 가 1532% 로
              #   무의미했다. 500m 로 올려 관측범위가 0~100%+ 로 읽히고 스케줄 예약도 실측 근사.
              #   HPA 거동은 불변(실부하선 여전히 max 4). 근거 = loadtest/stage1_results.md.
              memory: 256Mi
            limits:
              memory: 512Mi                  # OOM 보호(compose mem_limit 512m)
              # 🔴 cpu limit 없음 — bcrypt 는 버스트가 본질(§13.7). CFS 스로틀 = 로그인 병목 재발
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # compose read_only:true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                       # readOnlyRootFilesystem 이라 쓰기 경로 하나 필요
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
