# account 비밀 — fb-secrets(정본) ──ESO──▶ app ns Secret `mp-account-secrets`.
# 🔴 제안 컨벤션(인프라 확인 필요): fb-secrets 에 Secret **`app-secrets`** 하나를 두고
#    앱 공용 비밀을 키로 담는다(PGPASSWORD·JWT_SECRET·ES_USER·ES_PASS·*_GEMINI_API_KEY).
#    JWT_SECRET 은 7개 서비스 공용(object_spec §7.5), PG 도 단일이라 공용 Secret 이 맞다.
#    → 인프라가 secrets.yml 에 이 키들을 넣고 fb-secrets/app-secrets 로 적재하면 연결 완성.
#    EKS 이전 시 SecretStore 백엔드만 교체, 이 매니페스트는 무수정(§7.7).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-account-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes          # status §4.2 정본 스토어 (repo cred 와 동일 경로 = 검증됨)
  target:
    name: mp-account-secrets        # Deployment 의 envFrom.secretRef 가 이걸 참조
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: app-secrets, property: JWT_SECRET }
    # 소셜 로그인(OAuth) — client_secret 은 비밀, client_id 는 공개지만 account 전용이라 함께 관리.
    #   REDIRECT_URI 는 config.py 기본값(= 운영 app.mealbong.cloud/auth/{provider}/callback)이라 미주입.
    #   → fb-secrets/app-secrets 에 아래 4개 property 를 먼저 넣어야 ESO 가 동기화한다.
    - secretKey: KAKAO_CLIENT_ID
      remoteRef: { key: app-secrets, property: KAKAO_CLIENT_ID }
    - secretKey: KAKAO_CLIENT_SECRET
      remoteRef: { key: app-secrets, property: KAKAO_CLIENT_SECRET }
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: app-secrets, property: GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: app-secrets, property: GOOGLE_CLIENT_SECRET }
