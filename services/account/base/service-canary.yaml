# account 카나리 Service (ADR-0001) — Rollouts 가 stable(account)/canary(account-canary) 사이 트래픽 분할.
#   selector 는 base 에서 `app: account` 뿐이지만 Rollouts 가 rollouts-pod-template-hash 를 주입해
#   카나리 RS 파드로 좁힌다(라이브 selector 드리프트 → account 앱 ignoreDifferences 로 무시).
apiVersion: v1
kind: Service
metadata:
  name: account-canary
  labels:
    app: account
spec:
  type: ClusterIP
  selector:
    app: account
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      appProtocol: http
