# account: Karpenter 버스트 노드 toleration (1-43 · EKS 전용). 근거는 kustomization.yaml 머리말.
# 🔴 base 에 tolerations 가 없으므로 `add` 가 필드를 새로 만든다. base 가 나중에 tolerations 를
#    갖게 되면 이 패치는 그것을 **통째로 덮는다** — 그때는 `/-` append 로 바꿔야 한다.
- op: add
  path: /spec/template/spec/tolerations
  value:
    - key: mp.io/burst
      operator: Equal
      value: "true"
      effect: NoSchedule
