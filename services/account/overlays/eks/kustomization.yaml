apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
- ../../base
- serviceaccount.yaml
- service-preview.yaml            # C-76 Blue-Green preview 창구
- analysistemplate-bluegreen.yaml # C-76 승격 게이트
# EKS 이식 오버레이 — 온프렘과 "다른 것만" 둔다(플랜 §8). base·PVC 는 무수정 이식.
# 바뀌는 것: 이미지 레지스트리 Harbor→ECR, SC openebs-lvm→gp3 등.
images:
- name: 192.168.0.10/mealplanning/mp-account-service
  newName: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-account-service
  newTag: "06a1264465184088555e98cb27629ff0b8e1d0f4"

# ── 0-6 hard TSC 완화 + 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────
#
# ▸ 0-6 — `kubernetes.io/hostname` 축만 ScheduleAnyway. **zone 축은 DoNotSchedule 유지.**
#   C-29 = `m7g.xlarge` × 3 · **AZ 당 1대** ⇒ EKS 에선 zone 도메인 = hostname 도메인(1:1)이라
#   hostname 축이 추가로 막아 주는 것이 없다. 반대로 남겨 두면 위험이 둘 생긴다:
#     ① C-27 Blue-Green — green 세트가 blue 와 동시에 뜬다. 노드 3대에서 hard 두 축이면
#        "자리는 있는데 그 노드가 아니라서" Pending 이 나고, 그건 체크리스트가 미리 못박은
#        **BG 포기 기준 4개 중 하나**("green 세트가 hard TSC 로 Pending")에 그대로 걸린다.
#     ② Karpenter 가 한 AZ 에 노드를 더 띄우면 1:1 이 깨지면서 hard hostname 이 실제 제약이 된다.
#   zone 축을 hard 로 남기는 이유 = D-rep. **replica 2 가 같은 AZ 에 뜨면 AZ 상실 대비가 0** 이고,
#   soft(ScheduleAnyway)는 "보장"이 아니라 "선호"다 — 온프렘 실측에서 soft 2계층이 걸린 mp-recipe 가
#   둘 다 host-a 에 뜬 전례가 있다(ingress/base/gateway-params.yaml 3차 주석).
#   ⚠️ 온프렘 base 는 hard 그대로 둔다 — zone 2 · 워커 4대라 1:1 이 아니라서 hostname 축이 실제로 일한다.
#
# ▸ 0-27 — CPU 요청 500m → 350m. 🔴 **HPA 임계값을 같이 옮긴다.**
#   지금 정책의 실체는 "파드 평균 CPU 350m 에서 확장"(500m × 70%)이다. 요청만 내리면 같은 부하에서
#   utilization 이 올라가 **더 일찍 스케일**한다 — 노드를 아끼려다 파드를 늘리는 자충수가 된다.
#   그래서 **확장 지점(350m/파드)을 절대값으로 고정**하고 요청을 거기에 맞췄다: 350m × 100% = 350m.
#   부수 효과로 "요청 = 확장 지점"이 되어 정책이 한 줄로 읽힌다("자기 몫을 다 쓰면 옆으로 늘린다").
#   CPU limits 는 없다(§13.7) — bcrypt 버스트는 요청 위로 그대로 뚫는다. 메모리는 손대지 않는다.
#   절감 = 350m × 2(min) ~ 4(max) 기준 300m ~ 600m.
#   ⚠️ 후속 후보 = metric 을 Utilization 대신 **AverageValue(350m)** 로 바꾸면 요청과 임계값이
#      영구히 분리된다. 지금은 사이트 간 구조를 같게 두려고 퍼센트만 고쳤다(리뷰 가능한 최소 diff).

# ── maxReplicas 4 → 8 (EKS 전용 · 2026-08-17) ─────────────────────────────────
# base 의 max 4 는 **고정 노드 수에서 나온 값**이다(base/hpa.yaml: "노드 4대 · 커넥션 4×5=20").
# AWS 는 그 전제가 다르다 — 부족하면 **노드가 온다**(C-45 Karpenter · NodePool `mp-burst`).
# 진짜 천장은 replica 수가 아니라 NodePool 상한(cpu 16 = m7g.xlarge 4대)이고, 커넥션도
# Pooler(PgBouncer transaction) 뒤라 8×5=40 이 max_client_conn 100 안쪽이다.
#
# 🔴 **kubectl patch 로는 못 버틴다 — 그래서 git 에 넣는다.** 2026-08-17 Stage1 시험에서
#    스크립트가 4→8 로 올린 값을 **80초 뒤 ArgoCD 자동 싱크가 4 로 되돌렸다**(sync history #11,
#    05:19:04Z). selfHeal 이 아니라 새 리비전 싱크였다 — 즉 시험·촬영 중에 config 레포 머지가
#    하나만 들어와도 상한이 날아간다. 라이브 값과 git 값을 같게 두는 것이 유일한 방어다.
#
# ⚠️ 온프렘은 4 그대로다 — Karpenter 가 없어 늘려도 고정 5노드의 남은 CPU 를 먹을 뿐이다.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).

# ── 0-13 PG 서비스 롤 = svc_account (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
#    Rollout 은 JSON6902 로 간다(위 함정 — env 를 담으려면 컨테이너 리스트를 건드려야 한다).
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).
# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
# 🔴 아래 sizeLimit 주석을 `patch: |-` 블록 **안**에 두지 말 것 — kustomize 가 리터럴 안
#    주석을 밖으로 한 벌 더 복제하면서 원본은 남겨서, CD 빌드마다 1줄씩 무한히 늘어난다
#    (v5.4.3 실측 1→2→3→4). `patches:` 위 최상위 주석만 반복 edit 에 불변이다.
#   tmp → 64Mi — readOnlyRootFilesystem 스크래치 · 관측 4KiB

# ══ C-76 카나리 → Blue-Green (EKS 전용 · 2026-08-16) ═══════════════════════════
# 🔴 base 는 손대지 않는다 — 온프렘은 카나리 그대로다(C-83 형상 동결). 여기서만 갈아끼운다.
#    C-76 이 *"eks 오버레이는 처음부터 blueGreen 으로 쓴다(두 번 쓰지 않는다)"* 로 못박은 지점이다.
# 🔴 아래 주석을 `patch:` 리터럴 **안**에 두지 말 것 — kustomize 가 CD 빌드마다 복제해 무한히 늘린다.
#    (PR #166 · `patches:` 위 최상위 주석만 반복 edit 에 불변이다) ⇒ 패치 본문은 별도 파일로 뺐다.
#   patch-bluegreen.yaml            strategy 교체 + MP_RELEASE 주입 (근거는 그 파일 머리말)
#   service-preview.yaml            green 만 보는 창구
#   analysistemplate-bluegreen.yaml 승격 게이트 (preview 대상)

# ══ 1-43 집행 — Karpenter 버스트 노드 toleration ═══════════════════════════════
# 🔴 **이게 없으면 Karpenter 는 장식이다.** `mp-burst` NodePool 은 자기 노드에
#    `mp.io/burst=true:NoSchedule` 를 박는다(ansible `eks_karpenter/templates/nodepool.yaml.j2`).
#    그 롤 주석이 *"앱(무상태)은 config 오버레이에서 toleration 을 받고, PG·ES 는 받지 않는다"* 로
#    설계를 적어 뒀는데 **그 절반이 구현돼 있지 않았다.**
# 🔴 2026-08-16 실측 — BG 승격 창에서 이 결손이 3단 연쇄로 터졌다:
#      ① green 파드 `0/2 nodes are available: 2 Insufficient cpu`
#      ② Karpenter 가 버스트 노드를 띄웠지만 **green 이 taint 를 못 견뎌 못 올라감**
#      ③ 스케줄러가 대신 **Prometheus 를 선점**(app-normal 100000 vs Prometheus priority 0)
#         → Prometheus 도 갈 곳이 없어(빈 자리가 그 tainted 노드뿐) 약 5분 다운
#         → 승격 게이트가 Prometheus 를 못 읽어 **RolloutAborted**
#    즉 "노드가 모자란다"가 아니라 **"여분 노드를 아무도 쓸 수 없다"** 가 진짜 고장이었다.
# 🔵 무상태 앱이라 버스트 노드(`expireAfter: 720h` · `WhenEmpty` 회수)에 올라가도 잃을 상태가 없다.
#    PG·ES 가 toleration 을 안 받는 이유가 정확히 그 반대다(노드가 사라지면 데이터가 이사해야 한다).
# ⚠️ 남은 결손 = 나머지 앱 11종에도 같은 toleration 이 필요하다(1-43 잔여). 여기선 BG 를 켠 둘만 닫는다.
patches:
- path: patch-burst-toleration.yaml
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
    version: v1alpha1
- path: patch-bluegreen.yaml
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
    version: v1alpha1
- patch: |-
    - op: replace
      path: /spec/template/spec/topologySpreadConstraints/1/whenUnsatisfiable
      value: ScheduleAnyway
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 350m
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
    version: v1alpha1
# ── 배포 실증용 릴리스 표식 (BG 시연) ────────────────────────────────────────
# 🔴 **이 값을 바꾸는 것이 곧 배포다.** 파드 템플릿이 달라지면 `rollouts-pod-template-hash` 가
#    새로 계산되고 Argo Rollouts 가 green ReplicaSet 을 띄운다 — 이미지를 안 바꿔도
#    BG 전 과정(green 기동 → 승격 게이트 → 수동 승격)이 그대로 돈다.
# 🔵 그 해시가 `MP_RELEASE` 로 주입돼 `/api/auth/health` 의 `release` 로 나온다
#    ⇒ **승격 순간이 응답에서 눈에 보인다**(patch-bluegreen.yaml 의 MP_RELEASE 절).
# ⚠️ 시연용이라 값 자체엔 의미가 없다. 실제 릴리스는 이미지 태그 교체로 한다.
- patch: |-
    - op: add
      path: /spec/template/metadata/annotations/mp.io~1release-note
      value: "v1.4.0"
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
    version: v1alpha1
- patch: |-
    - op: replace
      path: /spec/metrics/0/containerResource/target/averageUtilization
      value: 100
    - op: test
      path: /spec/maxReplicas
      value: 4
    - op: replace
      path: /spec/maxReplicas
      value: 8
  target:
    group: autoscaling
    kind: HorizontalPodAutoscaler
    name: mp-account
    version: v2
- patch: |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: mp-aws-secrets
  target:
    group: external-secrets.io
    kind: ExternalSecret
- patch: |-
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    metadata: {name: mp-account}
    spec:
      template:
        spec:
          serviceAccountName: mp-account
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: PGUSER, value: svc_account}
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
- patch: |-
    - op: test
      path: /spec/data/0/secretKey
      value: PGPASSWORD
    - op: replace
      path: /spec/data/0/remoteRef
      value: {key: pg-roles, property: svc_account}
  target:
    group: external-secrets.io
    kind: ExternalSecret
    name: mp-account-secrets
- patch: |-
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: tmp
    - op: add
      path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
      value: 64Mi
  target:
    group: argoproj.io
    kind: Rollout
    name: mp-account
