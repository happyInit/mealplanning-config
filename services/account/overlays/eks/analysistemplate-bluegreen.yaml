# account Blue-Green 승격 게이트 (C-76 · EKS 전용) — `prePromotionAnalysis` 가 참조한다.
#
# ── 왜 카나리 템플릿을 재사용하지 않나 ────────────────────────────────────────
# base 의 `account-canary-analysis` 는 `destination_service_name="account-canary"` 를 본다.
# BG 에서 그 Service 는 아무도 안 쓰므로 쿼리는 영원히 무데이터 → `or vector(0)` → **항상 통과**한다.
# 🔴 **항상 통과하는 게이트는 없는 게이트보다 나쁘다** — 있다고 믿게 만들기 때문이다.
#
# ── 🔴🔴 왜 여기에 Prometheus 지표가 **없는가** (2026-08-16 실사고로 결정) ──────
# 초안은 preview 의 5xx·p95 를 Prometheus 로 쟀다. 라이브에서 그게 **롤아웃을 죽였다**:
#     Metric "preview-5xx-rate" assessed Error due to consecutiveErrors (5) > limit (4):
#     dial tcp 172.20.129.128:9090: connect: no route to host   → RolloutAborted
# 원인은 Prometheus 버그가 아니라 **의존의 방향**이었다. BG 는 승격 창에 파드가 2배가 되고,
# 그 압력이 Prometheus 파드를 **선점(preempt)** 해 내렸다. 즉 *배포가 자기 판정 근거를 부순다.*
# 🔴 이건 C-65 가 *"보안 알림을 Alertmanager 로 보내지 않는다(순환 의존)"* 로 거부한 것과 같은 부류다.
#    승격 게이트는 **승격 때문에 흔들리는 것에 의존하면 안 된다.**
#
# 🔵 게다가 그 지표들은 **애초에 판정력이 0 이었다.** BG 순서가
#    `green Ready → prePromotionAnalysis → 승격 대기` 라 분석 시점엔 preview 트래픽이 아직 없다.
#    무데이터 → `or vector(0)` → 통과. **얻는 것 없이 고장 지점만 하나 늘린 것**이었다.
#    ⇒ 남긴 것은 자기완결적인 `web` 프로브 하나. 트래픽이 없어도 답이 나오고, 외부 의존이 없다.
#    ⚠️ 이건 "충분한 검증"이 아니다 — 부하·회귀 판정은 승격 전에 사람이 preview 를 때려서 한다.
#       자동 게이트가 막는 범위는 **명백히 죽은 green 을 승격하는 것**까지다.
#    ⏭ 트래픽 기반 판정을 자동화하려면 자리는 `postPromotionAnalysis`(승격 후 = 실트래픽)다.
#       단 같은 순환 의존을 지고 들어오므로 별건으로 판단한다.
#
# 🔵 `/health` 를 쓴다(`/api/auth/health` 아님) — 컨트롤러는 Service 로 직접 부르므로 게이트웨이
#    경로가 필요 없고, `/health` 는 전 서비스 공통 계약이라 recipe 와 형태가 같아진다.
# 🔴 경로 = argo-rollouts ns → app ns:8004. 2026-08-16 실측 기준 EKS 의 app ns 엔 NetworkPolicy·
#    PeerAuthentication 이 **없어서** 평문 호출이 통한다. 온프렘처럼 default-deny+STRICT 를 EKS 에
#    넣는 날(0-17 계열), **이 경로를 함께 열지 않으면 승격이 조용히 실패**한다.
# 🔴 **4-dot FQDN 을 쓰지 않는다**(`...svc.cluster.local`). search 의 `local` 때문에 ISP 로 새는
#    실측이 있다(21.7% · tempo 닷새간 420회 재시작). `<svc>.<ns>.svc` 가 정본이고 validate.py 가 검사한다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: account-bluegreen-analysis
spec:
  metrics:
    # ── ① 신버전이 실제로 응답하는가 (무트래픽에서도 판정 가능) ──────────────
    - name: preview-health
      interval: 10s
      count: 3                    # 3회 연속 — 기동 직후 한 번 우연히 성공한 것과 구분한다
      failureLimit: 0             # 🔴 여기선 관용을 두지 않는다. 헬스가 흔들리는 걸 승격시킬 이유가 없다
      provider:
        web:
          url: http://account-preview.app.svc:8004/health
          timeoutSeconds: 5
          jsonPath: "{$.status}"
      successCondition: result == "ok"
