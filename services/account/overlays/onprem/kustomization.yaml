apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
- ../../base
# 🔴 Jenkins 가 아래 newTag 를 :sha 로 커밋한다(6단계). 지금은 베이스라인 placeholder.
#    :latest 금지 — ArgoCD 가 감지할 변경이 없다(플랜 §7.4).
    # 🔴 실제 Harbor 태그는 :sha + :latest 뿐 (:1.1.9 릴리스 런 미실시). 현재 :latest 가 가리키는 sha 로 핀.
images:
- name: 192.168.0.10/mealplanning/mp-account-service
  newName: 192.168.0.10/mealplanning/mp-account-service
  newTag: 4edb8bd4468d488c4aaef0ea47a063470d9d4b84
