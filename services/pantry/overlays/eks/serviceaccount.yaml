# 0-14c — 워크로드별 ServiceAccount (**EKS 전용**)
#
# 🔴 왜 base 가 아니라 여기인가 = **C-83**(2026-08-13). 온프렘은 *형상 동결*이고 SA 교체는
#    구조·권한 변경이다. 종전 정본의 *"config base 에 넣으면 양 사이트에 다 적용된다"* 는 철회됐다.
#
# 🔴 `imagePullSecrets` 를 **일부러 안 넣었다.** 앱 레포 명세(§A)는 `harbor` 복사를 지시하지만
#    그건 온프렘 전제다 — EKS 는 ECR 이고 **kubelet 이 노드 인스턴스 롤로 당긴다**(1-31).
#    이 오버레이는 `ExternalSecret/mp-harbor-pull` 자체를 지운다. 없는 시크릿을 적으면
#    kubelet 이 매 pull 마다 경고를 찍는다.
#
# 🔴 `automountServiceAccountToken: false` — IRSA 와 충돌하지 않는다. IRSA 토큰은
#    EKS 웹훅이 **별도 projected 볼륨(`aws-iam-token`)** 으로 넣으므로 이 플래그 밖이다.
#
# 설계·검증 = docs/eks-pg-roles-and-workload-sa.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mp-pantry
  namespace: app
automountServiceAccountToken: false
