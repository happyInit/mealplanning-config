apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-frontend            # §2.3: 워크로드 오브젝트는 mp- 접두사
  labels:
    app: frontend              # §2.3: 라벨은 bare
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      automountServiceAccountToken: false    # nginx 는 K8s API 안 씀
      securityContext:                       # 🔴 PSS restricted
        runAsNonRoot: true
        runAsUser: 101                       # 이미지 nginx 유저(uid/gid 101)
        runAsGroup: 101
        fsGroup: 101                         # emptyDir 를 nginx(gid 101)가 쓰도록 그룹 소유
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          # 8080 리슨 이미지(PR #338 머지 커밋). 포트 80 은 PSS restricted 가 금지(NET_BIND_SERVICE).
          image: 192.168.0.10/mealplanning/mp-frontend:1da39a957d91519e09ffd64a807d6a5996ba6d59
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 무중단 배포 — EndpointSlice 전파 대기
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 96Mi                   # compose mem_limit 96m 정합
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # compose read_only:true
            capabilities:
              drop: ["ALL"]                  # 8080(비특권)이라 NET_BIND_SERVICE 불필요
          volumeMounts:                      # readOnlyRootFilesystem → nginx 쓰기 경로만 emptyDir
            - name: cache
              mountPath: /var/cache/nginx    # proxy/client temp
            - name: run
              mountPath: /run                # nginx.pid
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
