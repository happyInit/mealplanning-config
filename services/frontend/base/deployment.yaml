apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-frontend            # §2.3: 워크로드 오브젝트는 mp- 접두사
  labels:
    app: frontend              # §2.3: 라벨은 bare
    tier: frontend
spec:
  # 🔴 2 인 이유 = 용량이 아니라 **가용성**이다. frontend 는 UI 유입의 단일 경로라 죽으면
  #    전면 불가이고, replica 1 이면 노드 정비(drain)·노드 상실에 그대로 내려간다
  #    (기본 tolerationSeconds 300s 탓에 재스케줄까지 최대 5분).
  #    PDB 의 전제이기도 하다 — minAvailable:1 을 replica 1 에 걸면 drain 이 영원히 막힌다(object_spec §9.5).
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      # 🔴 셀렉터가 `app: frontend` 다 — 백엔드의 `tier: backend` 와 다르다.
      #    백엔드는 10종이 replica 1 이라 자기 파드만 세면 셀 게 하나뿐이라 tier 로 묶었지만,
      #    여기서 필요한 건 **이 서비스의 2 replica 를 서로 다른 노드에** 두는 것이다.
      #    둘 다 같은 노드에 앉으면 PDB(minAvailable:1)가 그 노드를 **drain 불가**로 만든다
      #    — 첫 파드는 축출되지만 두 번째에서 0 이 되므로 거부되고 drain 이 끝나지 않는다.
      # 🔴 2026-08-01 — soft → **hard(DoNotSchedule) + nodeTaintsPolicy: Honor** 로 승격.
      #    종전 주석("soft 인 이유 = 자리 없으면 Pending")의 우려는 타당하지만, 실측이
      #    반대쪽 비용을 더 크게 만들었다: soft 로 둔 결과 **frontend 2 replica 가 둘 다
      #    host-b(b1·b2)** 에 앉아 있었다(recipe 는 둘 다 host-a). soft 는 롤링 업데이트 중
      #    아직 안 죽은 구 파드까지 세어 분포 계산이 왜곡되고 ImageLocality·리소스 밸런싱
      #    점수에 밀려 **조용히 안 지켜진다** — 즉 종전 구성은 위 주석이 막으려던 상황
      #    (둘이 같은 실패 도메인 → PDB 가 drain 을 막음)을 실제로 허용하고 있었다.
      #    Pending 위험은 여기서 낮다: 파드 2~3개(surge 포함)를 **2 zone / 4 노드** 에 놓는
      #    성긴 제약이고, 노드 CPU 요청률 42~50% 다. 촘촘한 tier 단위 제약과는 상황이 다르다.
      # 🔴 nodeTaintsPolicy: Honor 가 hard 의 유일한 함정을 막는다 — 기본값 Ignore 면
      #    host-b 가 통째로 죽어도 "파드 0개 도메인" 으로 계산에 남아 host-a 이전이 skew 2 로
      #    거부돼 **막으려던 장애에서 복구가 막힌다**. Honor 는 급사·cordon 노드에 붙는
      #    `NoSchedule` 테인트(파드가 톨러레이션 미보유)를 보고 그 도메인을 제외한다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: frontend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: frontend
      automountServiceAccountToken: false    # nginx 는 K8s API 안 씀
      securityContext:                       # 🔴 PSS restricted
        runAsNonRoot: true
        runAsUser: 101                       # 이미지 nginx 유저(uid/gid 101)
        runAsGroup: 101
        fsGroup: 101                         # emptyDir 를 nginx(gid 101)가 쓰도록 그룹 소유
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          # 8080 리슨 이미지(PR #338 머지 커밋). 포트 80 은 PSS restricted 가 금지(NET_BIND_SERVICE).
          image: 192.168.0.10/mealplanning/mp-frontend:1da39a957d91519e09ffd64a807d6a5996ba6d59
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # 무중단 배포 — EndpointSlice 전파 대기
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 96Mi                   # compose mem_limit 96m 정합
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # compose read_only:true
            capabilities:
              drop: ["ALL"]                  # 8080(비특권)이라 NET_BIND_SERVICE 불필요
          volumeMounts:                      # readOnlyRootFilesystem → nginx 쓰기 경로만 emptyDir
            - name: cache
              mountPath: /var/cache/nginx    # proxy/client temp
            - name: run
              mountPath: /run                # nginx.pid
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
