apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - ../../base
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
images:
  - name: 192.168.0.10/mealplanning/mp-frontend
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mp-frontend
    newTag: "1da39a957d91519e09ffd64a807d6a5996ba6d59"

# ── 0-6 hard TSC 완화 (2026-08-10) ────────────────────────────────────────────
# hostname 축만 ScheduleAnyway · zone 축 DoNotSchedule 유지. 근거 전문 =
# services/account/overlays/eks/kustomization.yaml (C-29 AZ 당 1대 ⇒ zone·hostname 1:1 이라
# hostname 축은 EKS 에서 잉여, 반면 C-27 BG 에서는 Pending 유발원).
#
# 🔴 0-27 대상 아님 — frontend 요청은 이미 50m 다(nginx 정적). 더 내릴 것이 없다.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mp-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/1/whenUnsatisfiable
        value: ScheduleAnyway
