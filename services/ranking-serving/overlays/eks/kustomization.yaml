apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
- ../../base
- serviceaccount.yaml
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
#
# ── 0-8 / C-20 스토리지: 여기는 손댈 게 없다(확인 완료 2026-08-10) ─────────────
# `mp-ranking-model` PVC(1Gi · openebs-lvm)와 /models 볼륨 치환 패치는 **이미
# `overlays/onprem` 에만** 있다(model-pvc.yaml · model-volume.yaml). 즉 base 는 emptyDir 이고
# 이 오버레이는 그 emptyDir 을 그대로 쓴다 — EKS PVC 0개라는 C-20 결정과 이미 일치한다.
# 🔴 다만 C-20 의 나머지 절반("ranker.pkl 을 이미지에 굽는다")은 **앱 레포 Dockerfile 소관**이다.
#    그게 안 되면 EKS 에서는 파드 재시작마다 모델을 다시 받아야 한다(emptyDir 은 비휘발이 아니다).
#    ⚠️ 그 emptyDir 은 지금 sizeLimit 이 없다 — 0-8d 대상. 모델 1개(0.95 MiB)라 위험도는 낮다.
images:
- name: 192.168.0.10/mealplanning/mp-ranking-serving
  newName: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-ranking-serving
  newTag: "4a7fc5bc62ffc826c6adde462bee561292ee8da8"

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).

# ── 0-13 PG 서비스 롤 = svc_ranking (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
#
# ── C-20 나머지 절반 — `RANKING_MODEL_PATH` 를 구운 모델로 돌린다 (2026-08-15) ──
# 🔴 base 는 `/models/ranker.pkl` 인데 **EKS 에서 그 경로는 영영 빈다.** `/models` 는
#    emptyDir 이고(온프렘만 PVC 로 치환한다) emptyDir 은 파드가 재시작할 때마다 비워진다.
#    위 0-8d 주석이 남긴 미결 *"EKS 에서 모델이 재시작마다 사라져도 되나"* 의 답이 이것이다.
# 🔴 **에러가 안 나는 게 이 버그의 성질이다** — `serve.py:203` 이 모델을 못 찾으면 경고 한 줄만
#    남기고 **규칙순 폴백**으로 정상 기동한다. /health 는 초록이고 응답도 오는데 개인화만 죽는다.
# 🟢 실물 = 이미지 안 `/app/ranker.pkl`. CI 가 S3(`mp-ai-model-ap2`)에서 받아 빌드 컨텍스트에
#    떨구고 Dockerfile 의 `COPY . .` 가 담는다(앱 레포 `.gitlab-ci.yml` 의 `MODEL_S3_URI`
#    · `ml/recipe-ranking/.dockerignore` 의 `!ranker.pkl` 예외).
# ⚠️ 온프렘은 **건드리지 않는다** — 거기는 PVC(`mp-ranking-model`)라 base 값이 맞다.
# ⚠️ 선행 = `mp-ci-job` 롤의 `s3:GetObject`. 그 전에 이 값만 바꾸면 파일이 없어 폴백 그대로다
#    (지금과 같은 상태 · 나빠지지는 않는다).
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).

# ── Pooler 우회 (0-1 사이트 분기 누락분 · 2026-08-13) ─────────────────────────
#    온프렘 overlays/onprem/pg-direct.yaml 과 같은 내용. 근거·해제조건은 그 파일에.
# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
      # tmp 만 상한을 건다 — models 볼륨은 아래에서 **통째로 뺀다**.
#
# ── models 볼륨 제거 — 잔재가 오해를 만든다 (2026-08-16) ──────────────────────
# 🔴 **EKS 에서 `/models` 는 아무도 안 쓴다.** C-20 이 PVC 를 소거하면서 모델의 자리가
#    **이미지 안 `/app/ranker.pkl`** 로 옮겨졌다(위 RANKING_MODEL_PATH 블록). 그런데 base 의
#    emptyDir 마운트는 남아 있어서, 보는 사람마다 *"여기 채우면 되겠네"* 로 읽힌다.
#    실제로 그 오해가 리뷰에서 나왔다(2026-08-16 — *"마운트 지점과 불일치"* 지적).
# 🔴 **채울 수도 없다** — `readOnlyRootFilesystem: true` 이고 EKS 에는 그 emptyDir 을 채울
#    주체(initContainer·PVC·재학습 잡)가 없다. 빈 채로 서 있기만 하는 마운트다.
# 🟢 빼면 오해의 여지가 사라지고 "모델은 이미지에 있다" 가 형상으로 드러난다.
# ⚠️ 온프렘은 **그대로** 둔다 — 거기는 같은 자리가 PVC(`mp-ranking-model`)이고 재학습이
#    쓰는 실물 경로다(C-83 형상 동결).
# 🔴 `op: test` 를 지우지 말 것 — base 의 volumes/volumeMounts 순서가 바뀌면 인덱스 기반
#    remove 가 **엉뚱한 볼륨을 지운다.** test 가 깨지면 렌더가 죽어 validate.py 가 잡는다.
patches:
- patch: |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: mp-aws-secrets
  target:
    group: external-secrets.io
    kind: ExternalSecret
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-ranking-serving}
    spec:
      template:
        spec:
          serviceAccountName: mp-ranking-serving
  target:
    group: apps
    kind: Deployment
    name: mp-ranking-serving
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-ranking-serving}
    spec:
      template:
        spec:
          containers:
            - name: ranking-serving
              env:
                - name: PGUSER
                  value: svc_ranking
                - name: RANKING_MODEL_PATH
                  value: /app/ranker.pkl
  target:
    group: apps
    kind: Deployment
    name: mp-ranking-serving
- patch: |-
    - op: test
      path: /spec/data/0/secretKey
      value: PGPASSWORD
    - op: replace
      path: /spec/data/0/remoteRef
      value: {key: pg-roles, property: svc_ranking}
  target:
    group: external-secrets.io
    kind: ExternalSecret
    name: mp-ranking-serving-secrets
- path: pg-direct.yaml
- patch: "- op: test\n  path: /spec/template/spec/volumes/0/name\n  value: tmp\n- op: add\n
    \ path: /spec/template/spec/volumes/0/emptyDir/sizeLimit\n  value: 64Mi\n- op: test\n
    \ path: /spec/template/spec/volumes/1/name\n  value: models\n- op: remove\n  path:
    /spec/template/spec/volumes/1\n- op: test\n  path: /spec/template/spec/containers/0/volumeMounts/1/name\n
    \ value: models\n- op: remove\n  path: /spec/template/spec/containers/0/volumeMounts/1"
  target:
    group: apps
    kind: Deployment
    name: mp-ranking-serving
    version: v1
