apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - ../../base
  - serviceaccount.yaml
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
#
# ── 0-8 / C-20 스토리지: 여기는 손댈 게 없다(확인 완료 2026-08-10) ─────────────
# `mp-ranking-model` PVC(1Gi · openebs-lvm)와 /models 볼륨 치환 패치는 **이미
# `overlays/onprem` 에만** 있다(model-pvc.yaml · model-volume.yaml). 즉 base 는 emptyDir 이고
# 이 오버레이는 그 emptyDir 을 그대로 쓴다 — EKS PVC 0개라는 C-20 결정과 이미 일치한다.
# 🔴 다만 C-20 의 나머지 절반("ranker.pkl 을 이미지에 굽는다")은 **앱 레포 Dockerfile 소관**이다.
#    그게 안 되면 EKS 에서는 파드 재시작마다 모델을 다시 받아야 한다(emptyDir 은 비휘발이 아니다).
#    ⚠️ 그 emptyDir 은 지금 sizeLimit 이 없다 — 0-8d 대상. 모델 1개(0.95 MiB)라 위험도는 낮다.
images:
  - name: 192.168.0.10/mealplanning/mp-ranking-serving
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mp-ranking-serving
    newTag: "a2268432159f3093e6ef85478393102260939c7b"

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).
  - target: {group: apps, kind: Deployment, name: mp-ranking-serving}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-ranking-serving}
      spec:
        template:
          spec:
            serviceAccountName: mp-ranking-serving

# ── 0-13 PG 서비스 롤 = svc_ranking (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
  - target: {group: apps, kind: Deployment, name: mp-ranking-serving}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-ranking-serving}
      spec:
        template:
          spec:
            containers:
              - name: ranking-serving
                env:
                  - name: PGUSER
                    value: svc_ranking
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-ranking-serving-secrets}
    patch: |-
      - op: test
        path: /spec/data/0/secretKey
        value: PGPASSWORD
      - op: replace
        path: /spec/data/0/remoteRef
        value: {key: pg-roles, property: svc_ranking}

# ── Pooler 우회 (0-1 사이트 분기 누락분 · 2026-08-13) ─────────────────────────
#    온프렘 overlays/onprem/pg-direct.yaml 과 같은 내용. 근거·해제조건은 그 파일에.
  - path: pg-direct.yaml
