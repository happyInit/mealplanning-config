apiVersion: v1
kind: Service
metadata:
  name: ranking-serving            # §2.3: Service 는 bare — DNS 계약(호출자·nginx가 이 이름을 씀)
  labels:
    app: ranking-serving
spec:
  type: ClusterIP
  selector:
    app: ranking-serving
  ports:
    - name: http
      port: 8009
      targetPort: 8009
      appProtocol: http
