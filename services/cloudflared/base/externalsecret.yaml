# 터널 크리덴셜 — fb-secrets/app-secrets.CLOUDFLARE_TUNNEL_CREDS ──ESO──▶ app ns Secret `mp-app-tunnel-creds`.
#
# 값 = `cloudflared tunnel create mp-app` 이 만든 <UUID>.json(AccountTag·TunnelID·TunnelSecret).
# secretKey=credentials.json → Deployment 가 이 키를 파일로 마운트(/etc/cloudflared/creds/credentials.json).
# 레포 규칙: 값은 여기 없고 ESO 참조만. 실제 주입 = fb-secrets 백엔드(2026-07-29 완료).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-app-tunnel-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-app-tunnel-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef: { key: app-secrets, property: CLOUDFLARE_TUNNEL_CREDS }
