# cloudflared 터널 설정 — 인클러스터 전용 터널 mp-app 이 app.mealbong.cloud 를 GW 로 나른다.
#
# 🔴 UUID·라우팅은 비밀이 아니라 여기(git)에 둔다. TunnelSecret 은 credentials.json(ESO Secret) 안.
# service = GW 백킹 Service(mp-gw-public-istio) 의 443. originServerName 으로 SNI=app.mealbong.cloud 를
#   보내 GW 의 https 리스너(hostname 매칭)에 붙고, GW 의 LE 인증서를 검증한다(origin 구간 암호화).
# ingress 마지막 http_status:404 = 매칭 안 되는 호스트는 404(터널 필수 규칙).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mp-app-tunnel-config
data:
  config.yaml: |
    tunnel: 4c7d83d9-6704-436c-816c-42c5148aa176
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: app.mealbong.cloud
        service: https://mp-gw-public-istio.app.svc.cluster.local:443
        originRequest:
          originServerName: app.mealbong.cloud
      - service: http_status:404
