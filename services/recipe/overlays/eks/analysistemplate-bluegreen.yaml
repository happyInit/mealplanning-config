# recipe Blue-Green 승격 게이트 (C-76 · EKS 전용).
# 🔴 설계 근거 전문 — 특히 **왜 Prometheus 지표가 여기 없는지**(2026-08-16 실사고: BG 버스트가
#    Prometheus 를 선점해 내리자 게이트가 롤아웃을 죽였다 = 배포가 자기 판정 근거를 부순 순환 의존) 는
#    services/account/overlays/eks/analysistemplate-bluegreen.yaml 머리말에 있다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: recipe-bluegreen-analysis
spec:
  metrics:
    - name: preview-health
      interval: 10s
      count: 3
      failureLimit: 0
      provider:
        web:
          url: http://recipe-preview.app.svc:8001/health
          timeoutSeconds: 5
          jsonPath: "{$.status}"
      successCondition: result == "ok"
