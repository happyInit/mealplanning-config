# recipe 비밀 — fb-secrets/app-secrets + data-secrets ──ESO──▶ app ns Secret `mp-recipe-secrets`.
#   (ES_PASSWORD 만 data-secrets — 나머지는 전부 app-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-recipe-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-recipe-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: { key: app-secrets, property: PGPASSWORD }
    - secretKey: JWT_SECRET
      remoteRef: { key: app-secrets, property: JWT_SECRET }
    - secretKey: ES_PASSWORD # ECK basic_auth — mp_recipe_reader 와 한 세트 (app-common 의 ES_USER 와 결합).
      #                       이슈 #521 3단계: elastic 슈퍼유저 비번 → mp_recipe_reader(read 전용) 비번.
      #                       유저명/비번은 하나의 세트다 — 한쪽만 바꾸면 401 로 검색이 전부 실패한다.
      remoteRef: { key: data-secrets, property: ES_RECIPE_READER_PASSWORD }
