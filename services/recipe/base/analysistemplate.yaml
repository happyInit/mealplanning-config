# recipe 카나리 자동분석 (ADR-0001 §6.5) — Rollout 의 analysis 스텝이 참조.
#   Istio 사이드카 텔레메트리(destination_service_name="recipe-canary")로 **카나리 파드만** 격리 측정.
#   임계값 = 부하시험 abortOnFail 정렬(5xx<0.05 · p95<2000ms). 실패 시 Rollout 자동 abort→롤백.
#
# 🔴 저트래픽 주의: 카나리에 트래픽이 없으면 분자/분모 0 → 결과 없음(NaN/empty). 그땐 inconclusive 대신
#    통과로 처리(`len(result)==0`)한다 — 파일럿 검증은 k6 로 트래픽을 흘려 실제 데이터로 판정한다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: recipe-canary-analysis
spec:
  metrics:
    - name: canary-5xx-rate
      interval: 30s
      count: 3
      successCondition: "len(result) == 0 || result[0] < 0.05"
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability:9090
          query: |
            sum(rate(istio_requests_total{destination_service_name="recipe-canary",reporter="destination",response_code=~"5.."}[1m]))
            /
            sum(rate(istio_requests_total{destination_service_name="recipe-canary",reporter="destination"}[1m]))
    - name: canary-p95-latency-ms
      interval: 30s
      count: 3
      successCondition: "len(result) == 0 || result[0] < 2000"
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(istio_request_duration_milliseconds_bucket{destination_service_name="recipe-canary",reporter="destination"}[1m])) by (le))
