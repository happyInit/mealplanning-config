apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
- ../../base
- serviceaccount.yaml
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
images:
- name: 192.168.0.10/mealplanning/mp-mealplan-service
  newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-mealplan-service
  newTag: 5f9977ad99c7705c9bb6f60808c3664165b2c89a

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 150m → 100m (= 다른 백엔드 8종과 같은 값). mealplan 은 HPA 대상이 아니고
# (§9.3 · 체크리스트: mealplan 은 다운스트림 대기형이라 HPA 무용), 2026-08-01 에 100m→150m 로 올린 것은
# 부하시험 피크 정합이었다. 요청은 피크가 아니라 예약 몫이고 CPU limits 가 없으므로(§13.7)
# 피크 처리량은 안 바뀐다. 온프렘 base 는 150m 유지.
#
# 🔴 0-6 대상 아님 — TSC 두 축 다 이미 soft.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).

# ── 0-13 PG 서비스 롤 = svc_mealplan (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).
# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
  # ── 클릭스트림 학습 라벨 축적 — EKS 전용 (C-88 · 이슈 #640) ────────────────
  # 추천 노출을 activity.recipe_impression 에 적어야 담기(ADD_CART)와 조인이 서고
  # 랭킹 학습 라벨이 생긴다. 🔴 **base 가 아니라 여기** 인 이유 —
  #   base 는 두 사이트가 공유해서 온프렘 프로덕션까지 함께 켜진다(C-72·C-83 위반).
  #   구체적 대가 = 추천 1회당 top-20 행을 JSONB 포함해 INSERT ⇒ WAL 증가.
  #   PGSync 논리슬롯은 activity.* 를 복제하지 않아도 **그 WAL 을 전부 통과**해야 하고,
  #   #555(슬롯 무효화)의 원인이 WAL 버스트였다. 현행 실측 213 MiB/h 위에 얹는 셈이다.
  # ⚠️ 온프렘에도 켤 필요가 생기면 WAL 증가분 추정치와 함께 **별건 PR** 로 올린다.
# 🔴 아래 sizeLimit 주석을 `patch: |-` 블록 **안**에 두지 말 것 — kustomize 가 리터럴 안
#    주석을 밖으로 한 벌 더 복제하면서 원본은 남겨서, CD 빌드마다 1줄씩 무한히 늘어난다
#    (v5.4.3 실측 1→2→3→4). `patches:` 위 최상위 주석만 반복 edit 에 불변이다.
#   tmp → 64Mi — readOnlyRootFilesystem 스크래치 · 관측 4KiB
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
    version: v1
- patch: |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: mp-aws-secrets
  target:
    group: external-secrets.io
    kind: ExternalSecret
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-mealplan}
    spec:
      template:
        spec:
          serviceAccountName: mp-mealplan
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-mealplan}
    spec:
      template:
        spec:
          containers:
            - name: mealplan
              env:
                - name: PGUSER
                  value: svc_mealplan
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
- patch: |-
    - op: test
      path: /spec/data/0/secretKey
      value: PGPASSWORD
    - op: replace
      path: /spec/data/0/remoteRef
      value: {key: pg-roles, property: svc_mealplan}
  target:
    group: external-secrets.io
    kind: ExternalSecret
    name: mp-mealplan-secrets
- patch: |-
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: tmp
    - op: add
      path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
      value: 64Mi
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
    version: v1
- patch: |-
    - op: replace
      path: /data/IMPRESSION_LOG_ENABLED
      value: "true"
  target:
    kind: ConfigMap
    name: mealplan-config
    version: v1
