apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
- ../../base
- serviceaccount.yaml
# EKS 이식 오버레이 — 이미지 레지스트리만 교체(Harbor→ECR). base 무수정.
images:
- name: 192.168.0.10/mealplanning/mp-mealplan-service
  newName: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-mealplan-service
  newTag: "4a7fc5bc62ffc826c6adde462bee561292ee8da8"

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 150m → 100m (= 다른 백엔드 8종과 같은 값). mealplan 은 HPA 대상이 아니고
# (§9.3 · 체크리스트: mealplan 은 다운스트림 대기형이라 HPA 무용), 2026-08-01 에 100m→150m 로 올린 것은
# 부하시험 피크 정합이었다. 요청은 피크가 아니라 예약 몫이고 CPU limits 가 없으므로(§13.7)
# 피크 처리량은 안 바뀐다. 온프렘 base 는 150m 유지.
#
# 🔴 0-6 대상 아님 — TSC 두 축 다 이미 soft.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`

# ── 0-14c 워크로드별 SA (EKS 전용 · C-83 덧셈) ─────────────────────────────────
# 🔴 merge 패치로 `serviceAccountName` **한 필드만** 얹는다. Rollout 은 CRD 라 kustomize 가
#    스키마를 몰라 JSON merge 로 처리하는데, 패치에 리스트(`containers`)를 적으면 통째로
#    **교체**된다. 이 패치는 리스트를 안 담으므로 안전하다(0-9 §rollouts initContainer 함정과 같은 축).

# ── 0-13 PG 서비스 롤 = svc_mealplan (EKS 전용) ─────────────────────
# 온프렘은 `fbapp` 단독 그대로다 — **권한을 회수하지 않는다**(라이브 앱 즉사).
# AWS PG 는 처음부터 롤이 갈린 상태로 짓는다. 롤 실체 = platform/pg/overlays/eks,
# GRANT = 앱 레포 `docs/prd/schema-roles.sql`(사람이 psql 로 1회).
# 🔴 `env` 가 `envFrom` 을 이긴다 — app-common 의 `PGUSER: fbapp` 을 이 한 줄이 덮는다.
# 🔴 비밀번호 출처도 같이 간다 — 유저명과 비번은 한 세트다. 한쪽만 바꾸면 인증이 전부 실패한다.
#    `op: test` 로 base 의 순서 변경을 렌더 실패로 드러낸다(0-16 패치와 같은 규약).
# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
  # ── ML 재랭킹 호출 활성화 — EKS 전용 (2026-08-16) ────────────────────────────
  # 🔵 **스위치의 정본은 `base/configmap.yaml` 의 `RANKING_ML_ENABLED: "false"` 다.**
  #    여기서는 위 PGUSER 와 **똑같은 방식**으로 그 값을 덮는다(`env` 가 `envFrom` 을 이긴다).
  #    base 를 "true" 로 바꾸면 온프렘까지 켜져서 C-83 형상 동결을 깬다 — 그래서 사이트 분기다.
  #    ⚠️ 렌더에는 ConfigMap 의 "false" 와 이 env 의 "true" 가 **둘 다** 보인다. 이기는 쪽은 env 다.
  # 🔴 **켜지 않으면 모델을 실어도 개인화가 안 산다.** `ranking_ml_enabled` 기본값이 False 라
  #    `personalize()` 가 첫 줄에서 None 을 돌려주고(`ranking_client.py:17`) mealplan 은
  #    `/rank/personalize` 를 **아예 호출하지 않는다.** 서빙에 모델을 넣어도 경로가 안 열린다.
  #    ⇒ 모델 적재(`mp-ci-job` 의 S3 읽기 권한)와 **이 스위치는 별개의 두 조건**이다.
  # 🟢 모델이 없는 동안 켜 두는 것이 안전한 근거(실측 2026-08-16):
  #      POST /rank/personalize → HTTP 200 · **21ms** · `personalized: false`
  #    → `personalize()` 가 None 을 돌려주고 **규칙순이 그대로 유지**된다(동작 변화 0).
  #    실패 경로도 넓다 — 미가용·타임아웃·오류 **무엇이든** except 에서 None 이다.
  #    상한은 `ranking_serving_timeout_s` 0.3s 라 서빙이 죽어도 추천이 0.3초 이상 안 밀린다.
  # ⚠️ 온프렘에는 걸지 않는다 — C-83 형상 동결. 거기는 모델 PVC 경로라 조건 자체가 다르다.
  # 🔵 규칙 랭킹(재고·임박·예산)은 이것과 무관하게 이미 유저별로 동작한다. 이 스위치가 켜는 것은
  #    그 **위에 얹는 학습 재정렬**이다 — 켜도 모델이 없으면 규칙순 그대로다.
  # ── 클릭스트림 학습 라벨 축적 — EKS 전용 (C-88 · 이슈 #640) ────────────────
  # 추천 노출을 activity.recipe_impression 에 적어야 담기(ADD_CART)와 조인이 서고
  # 랭킹 학습 라벨이 생긴다. 🔴 **base 가 아니라 여기** 인 이유 —
  #   base 는 두 사이트가 공유해서 온프렘 프로덕션까지 함께 켜진다(C-72·C-83 위반).
  #   구체적 대가 = 추천 1회당 top-20 행을 JSONB 포함해 INSERT ⇒ WAL 증가.
  #   PGSync 논리슬롯은 activity.* 를 복제하지 않아도 **그 WAL 을 전부 통과**해야 하고,
  #   #555(슬롯 무효화)의 원인이 WAL 버스트였다. 현행 실측 213 MiB/h 위에 얹는 셈이다.
  # ⚠️ 온프렘에도 켤 필요가 생기면 WAL 증가분 추정치와 함께 **별건 PR** 로 올린다.
# 🔴 아래 sizeLimit 주석을 `patch: |-` 블록 **안**에 두지 말 것 — kustomize 가 리터럴 안
#    주석을 밖으로 한 벌 더 복제하면서 원본은 남겨서, CD 빌드마다 1줄씩 무한히 늘어난다
#    (v5.4.3 실측 1→2→3→4). `patches:` 위 최상위 주석만 반복 edit 에 불변이다.
#   tmp → 64Mi — readOnlyRootFilesystem 스크래치 · 관측 4KiB

# ── 클릭스트림 목적지 = pg — EKS 전용 (C-88 · C-44) ──────────────────────────
# 🔴 **지금 EKS 는 담기(ADD_CART) 이벤트를 조용히 버리고 있다.**
#    `EVENT_SINK` 미설정 = 코드 기본값 `kafka`(services/mealplan/app/events.py:113)인데
#    **EKS 에는 Kafka 가 없다**(C-44 · 실측 2026-08-14: data ns 에 Kafka CR·파드 0). 그래서
#    `emit_add_cart` 의 produce 가 예외로 떨어지고 `_count("failure")` 뒤 그냥 리턴한다 —
#    담기 자체는 무손상이라 **증상이 앱 어디에도 안 나타난다.**
# 🔴 그리고 이건 위 IMPRESSION_LOG_ENABLED 와 **한 짝**이다. 노출(recipe_impression)만
#    쌓이고 담기(user_event)가 없으면 조인할 상대가 없어 랭킹 학습 라벨이 서지 않는다.
#    반쪽만 켠 상태가 제일 나쁘다 — 데이터는 쌓이는데 쓸 수가 없다.
#
# `pg` 로 두면 앱이 `activity.user_event` 에 직접 INSERT 한다(savepoint + event_id UNIQUE
# ON CONFLICT DO NOTHING 이라 재시도·중복이 무해하고, 실패해도 장바구니 트랜잭션은 보존된다).
#
# 선행 조건은 **이미 충족됐다** — svc_mealplan 의 `activity.user_event` INSERT 와
# `user_event_id_seq` USAGE. 앱 레포 #685 로 고쳐 2026-08-14 라이브 적용까지 끝냈다
# (bigserial 은 테이블 GRANT 를 안 따라가서, 없으면 INSERT 가 조용히 0건이 된다).
#
# 🔴 **base 가 아니라 여기** 인 이유 = 온프렘은 Kafka 경로가 정상 가동 중이다(토픽
#    events.user.activity + 컨슈머 mp-user-event-sink 가 KEDA scale-to-zero 로 대기).
#    base 를 건드리면 온프렘 목적지가 바뀐다 — C-72·C-83 위반이고, 선택자가 하나뿐이라
#    (events.py 주석: dual-write 가 구조적으로 불가능) **Kafka 경로가 즉시 끊긴다.**
# 🔴 `op: add` 다(`replace` 아님) — base 에 `EVENT_SINK` 키가 **없다.** replace 는 없는
#    경로에서 렌더가 죽는다. 반대로 base 가 나중에 이 키를 갖게 되면 add 가 조용히 덮는데,
#    그때는 위 IMPRESSION_LOG_ENABLED 의 `replace` 가 같은 패치에서 먼저 깨져 드러난다.
# ⚠️ envFrom/ConfigMap 은 **파드 기동 시점 주입**이라 sync 만으로는 안 먹는다 —
#    `kubectl rollout restart deploy/mp-mealplan -n app` 가 반드시 따라와야 한다.
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
    version: v1
- patch: |-
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: mp-aws-secrets
  target:
    group: external-secrets.io
    kind: ExternalSecret
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-mealplan}
    spec:
      template:
        spec:
          serviceAccountName: mp-mealplan
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: mp-mealplan}
    spec:
      template:
        spec:
          containers:
            - name: mealplan
              env:
                - name: PGUSER
                  value: svc_mealplan
                - name: RANKING_ML_ENABLED
                  value: "true"
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
- patch: |-
    - op: test
      path: /spec/data/0/secretKey
      value: PGPASSWORD
    - op: replace
      path: /spec/data/0/remoteRef
      value: {key: pg-roles, property: svc_mealplan}
  target:
    group: external-secrets.io
    kind: ExternalSecret
    name: mp-mealplan-secrets
- patch: |-
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: tmp
    - op: add
      path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
      value: 64Mi
  target:
    group: apps
    kind: Deployment
    name: mp-mealplan
    version: v1
- patch: |-
    - op: replace
      path: /data/IMPRESSION_LOG_ENABLED
      value: "true"
    - op: add
      path: /data/EVENT_SINK
      value: "pg"
  target:
    kind: ConfigMap
    name: mealplan-config
    version: v1
