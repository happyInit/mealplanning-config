# MANUAL-ONLY. DB credential 없이 recipes_live alias metadata만 보정한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: mp-pgsync-es-maintenance
  namespace: data
  labels:
    app: pgsync
    app.kubernetes.io/component: manual-es-maintenance
spec:
  suspend: true
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: pgsync
        app.kubernetes.io/component: manual-es-maintenance
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: app-normal
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: es-maintenance
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994
          command: ["python3", "/ops/maintenance.py", "alias-write"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: ELASTICSEARCH_HOST, value: es-es-http}
            - {name: ELASTICSEARCH_PORT, value: "9200"}
            - {name: ELASTICSEARCH_SCHEME, value: http}
            - {name: ELASTICSEARCH_USER, value: elastic}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: es-es-elastic-user, key: elastic}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: maintenance-script, mountPath: /ops, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: maintenance-script
          configMap: {name: mp-pgsync-maintenance-script, defaultMode: 0444}
        - {name: tmp, emptyDir: {}}
