# MANUAL-ONLY. ops.sh가 __ACTION__을 allowlist 값으로 치환한 뒤 create하고 unsuspend한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: mp-pgsync-maintenance
  namespace: data
  labels:
    app: pgsync
    app.kubernetes.io/component: manual-maintenance
spec:
  suspend: true
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: pgsync
        app.kubernetes.io/component: manual-maintenance
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: app-normal
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: maintenance
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994
          command: ["python3", "/ops/maintenance.py", "__ACTION__"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: PG_HOST, value: pg-rw}
            - {name: PG_PORT, value: "5432"}
            - {name: PG_DATABASE, value: foodbudget}
            - {name: PG_USER, value: mp-pgsync-bootstrap}
            - name: PG_PASSWORD
              valueFrom: {secretKeyRef: {name: mp-pgsync-bootstrap-db, key: password}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: maintenance-script, mountPath: /ops, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: maintenance-script
          configMap: {name: mp-pgsync-maintenance-script, defaultMode: 0444}
        - {name: tmp, emptyDir: {}}
