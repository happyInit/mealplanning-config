# MANUAL-ONLY: platform/argocd 아래에서 참조하지 않는다.
# suspend:true + backoffLimit:0 이므로 이 파일을 실수로 create/apply 해도 bootstrap은 실행되지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: mp-pgsync-bootstrap
  namespace: data
  labels:
    app: pgsync
    app.kubernetes.io/component: manual-bootstrap
spec:
  suspend: true
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: pgsync
        app.kubernetes.io/component: manual-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: app-normal
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: copy-plugins
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994
          command: ["sh", "-c", "cp /plugins-src/*.py /app/plugins/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: plugins-src, mountPath: /plugins-src}
            - {name: plugins-dir, mountPath: /app/plugins}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: pgsync
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994
          command: ["bootstrap", "-c", "/app/schema.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: PG_HOST, value: pg-rw}
            - {name: PG_PORT, value: "5432"}
            - {name: PG_USER, value: mp-pgsync-bootstrap}
            - name: PG_PASSWORD
              valueFrom: {secretKeyRef: {name: mp-pgsync-bootstrap-db, key: password}}
            - {name: ELASTICSEARCH_HOST, value: es-es-http}
            - {name: ELASTICSEARCH_PORT, value: "9200"}
            - {name: ELASTICSEARCH_SCHEME, value: http}
            - {name: ELASTICSEARCH_USER, value: elastic}
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: es-es-elastic-user, key: elastic}}
            - {name: REDIS_HOST, value: redis-pgsync}
            - {name: REDIS_PORT, value: "6379"}
            - {name: REDIS_CHECKPOINT, value: "False"}
            - {name: SCHEMA, value: /app/schema.json}
            - {name: CHECKPOINT_PATH, value: /app/checkpoint}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: schema, mountPath: /app/schema.json, subPath: schema.json}
            - {name: plugins-dir, mountPath: /app/plugins}
            - {name: checkpoint, mountPath: /app/checkpoint}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: schema
          configMap: {name: mp-pgsync-schema}
        - name: plugins-src
          configMap: {name: mp-pgsync-plugins}
        - {name: plugins-dir, emptyDir: {}}
        - {name: checkpoint, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
