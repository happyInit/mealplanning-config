# ES 서비스 계정 비밀번호 배선 (이슈 #521 — 작업 3).
# 🔴 비밀 값은 여기 없다 — `ExternalSecret` 은 참조 선언일 뿐이다. 실제 값은 운영자가
#    `fb-secrets` ns 의 `data-secrets` 시크릿에 적재한다(정본). 이 레포 절대규칙 2.
#    적재 전에 sync 하면 ExternalSecret 이 NotReady 로 남고 es-users Job 이 비번을 못 찾는다.
# 🔴 계정 3개만 선언한다. exporter 비번(mp-elasticsearch-exporter)은 monitoring.yaml 의
#    Password generator 가 단일 출처로 소유 — 여기 또 넣으면 두 출처로 갈려 exporter 가 죽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-es-service-accounts
  namespace: data
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-es-service-accounts # es-users-job.yaml 의 각 계정 secretKeyRef 가 참조
    creationPolicy: Owner
  data:
    - secretKey: RECIPE_READER_PASSWORD
      remoteRef: {key: data-secrets, property: ES_RECIPE_READER_PASSWORD}
    - secretKey: PIPELINE_WRITER_PASSWORD
      remoteRef: {key: data-secrets, property: ES_PIPELINE_WRITER_PASSWORD}
    - secretKey: PGSYNC_WRITER_PASSWORD
      remoteRef: {key: data-secrets, property: ES_PGSYNC_WRITER_PASSWORD}
