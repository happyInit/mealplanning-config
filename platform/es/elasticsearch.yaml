# Elasticsearch (ECK) — 8.19.19 고정 (런북 §1.1 · Q5).
#
# ✅ nori 이미지 빌드·push 완료(2026-07-29 05:34 UTC, Jenkins 릴리스 런 — 준비 ③ 종결):
#    :f078bbe9…(git sha) + :8.19.19 + :latest 3태그, Trivy CRITICAL 0. 아래 핀 = 그 sha.
# 🔴 spec.version 을 느슨하게 두지 말 것 — ECK 3.4 는 Stack 9 도 지원해서 9.x 로 올라가면
#    클라이언트 핀 `elasticsearch[async]>=8.15,<9`(chat·recipe·ingest) 가 즉사한다.
#
# 보안 (플랜 §5.2 — 2026-07-29 재확인·종결, 재논의 금지):
#   · 인증 = 켬 (ECK 예약설정이라 끌 수 없음) — 앱은 basic_auth(코드 반영 완료·env 하위호환)
#   · HTTP TLS = 끔 — 경로별 TLS 는 API 에 없다(서버 전역 스위치). 암호화는 WireGuard.
#   · transport TLS(ES 노드 간)는 ECK 가 항상 켠다 — 우리가 못 끄고, 끌 필요도 없다.
#   · ECK 가 만드는 슈퍼유저 Secret `es-es-elastic-user` (user=elastic) 는 계정 부트스트랩
#     (아래 es-users-job.yaml) 전용으로만 남긴다 — 앱 소비자는 elastic 을 쓰지 않는다(이슈 #521).
#
# vm.max_map_count=262144 는 노드 sysctl 로 선반영돼 있다(k8s_node 롤, 4노드 실측 §2-A-4-1)
# → 특권 initContainer 불필요·불가(data ns PSS baseline 이 거부, §9-9). 여기엔 아무것도 안 넣는 게 맞다.
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es # Service = es-es-http.data.svc:9200 (ECK 규칙 <name>-es-http)
  namespace: data
spec:
  version: 8.19.19
  image: 192.168.0.10/mealplanning/mp-elasticsearch-nori:f078bbe9ecad4b09e11683aa5cbf1094a40d0ccd # ES 8.19.19 (Q5 — :sha 핀. 버전 자리는 spec.version 이 담당)
  # 최소권한 롤 (이슈 #521 — 소비자 4곳이 elastic 슈퍼유저를 쓰던 탈출구).
  # ECK `spec.auth.roles` 는 RoleSource 배열이고 필드가 secretName 하나뿐 — Secret 은 ES CR 과
  # 같은 `data` ns 에 두고 그 `roles.yml` 키 값을 롤 맵으로 읽는다. 비밀 값이 없어 선언형 적합.
  # 롤만 선언한다 — 계정 생성은 es-users-job.yaml 이 elastic 로 부트스트랩한다(아래 작업 2).
  # 🔴 mp-pgsync 는 이 롤의 mp_pgsync_writer 로 전환돼 쓴다(이슈 #521). 파이프라인 잡 전환은 별도 작업.
  auth:
    roles:
      - secretName: mp-es-roles
  http:
    tls:
      selfSignedCertificate:
        disabled: true # 플랜 §5.2 — 위 주석. 클라이언트는 http:// + basic auth 그대로
  nodeSets:
    # 배치 원칙(플랜 §5.2): B에 2 · A에 1 — zone awareness 로 primary/replica 샤드가 같은 물리호스트에 안 몰리게
    - name: b
      count: 2
      config:
        node.attr.zone: host-b
        cluster.routing.allocation.awareness.attributes: zone
      podTemplate:
        spec:
          priorityClassName: data-critical
          nodeSelector:
            topology.kubernetes.io/zone: host-b
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 1536Mi
                limits:
                  memory: 1536Mi # 플랜 §2.2 예산 3×1.5. CPU limits 는 넣지 않는다(§13.7 — 부하테스트 병목 재발 방지)
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: openebs-lvm
            resources:
              requests:
                storage: 10Gi
    - name: a
      count: 1
      config:
        node.attr.zone: host-a
        cluster.routing.allocation.awareness.attributes: zone
      podTemplate:
        spec:
          priorityClassName: data-critical
          nodeSelector:
            topology.kubernetes.io/zone: host-a
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 1536Mi
                limits:
                  memory: 1536Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: openebs-lvm
            resources:
              requests:
                storage: 10Gi
---
# least-privilege 롤 맵 — ECK 가 위 `auth.roles[0].secretName` 으로 읽는다 (이슈 #521).
# 🔴 비밀 값은 없다 — 롤 정의만 담은 선언형 IaC. 계정 비밀번호는 ESO(externalsecrets.yaml)가 소유.
apiVersion: v1
kind: Secret
metadata:
  name: mp-es-roles
  namespace: data
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
stringData:
  roles.yml: |
    # chat·recipe·recipebook 은 .search() 만 쓴다 → 읽기만. (절대규칙: 최소권한)
    # 🔴 user_recipes* 를 반드시 함께 넣는다 — 유저 발행 레시피 인덱스(#515 A단계로 신설된
    #    alias `user_recipes_live`)는 접두사가 달라 `recipes*` 에 매칭되지 않는다.
    #    recipebook 이 #515 B단계에서 이 인덱스를 읽으므로 빠지면 403 으로 발행목록이 죽는다.
    mp_recipe_reader:
      cluster: []
      indices:
        - names: ["recipes*", "user_recipes*"]
          privileges: ["read", "view_index_metadata"]
    # 파이프라인 잡은 인덱스를 만들고 쓴다 → 쓰기 + 인덱스 관리.
    mp_pipeline_writer:
      cluster: []
      indices:
        - names: ["recipes*"]
          privileges: ["read", "write", "create_index", "manage"]
    # mp-pgsync 는 두 stable alias `recipes_live`·`user_recipes_live` 에 쓴다(스키마 정본 =
    # schema-configmap.yaml. user_recipes_live 는 #515 A단계로 신설).
    # 🔴 이슈 #521 표의 "recipes_pgsync*" 는 틀렸다 — recipes_pgsync 는 alias 전환 전의 구 물리
    #    인덱스(롤백용 사본)라 PGSync 가 안 쓴다. 위 aliases 와 그 물리 인덱스
    #    (recipes_v2·user_recipes_v1)를 모두 덮도록 `recipes*`·`user_recipes*` 로 확장한다.
    # 🔴 cluster:["monitor"] 는 PGSync 라이브러리가 요구한다 — 기동 시 `client.info()` 로 ES 메이저
    #    버전을 확인한다(pgsync/search_client.py). 그 호출은 cluster:monitor/main 액션이라
    #    인덱스 권한만으로는 403 이 나고 **파드가 CrashLoopBackOff 로 아예 못 뜬다**(2026-08-04 실측).
    #    앱·파이프라인 코드에는 .info() 호출이 없어 다른 롤에는 필요 없다(최소권한 유지).
    mp_pgsync_writer:
      cluster: ["monitor"]
      indices:
        - names: ["recipes*", "user_recipes*"]
          privileges: ["read", "write", "create_index", "manage"]
