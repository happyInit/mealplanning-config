apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-5 nodeSelector — **base 에서 제거 완료**(2026-08-10). 온프렘 값은 overlays/onprem 이 얹는다.
#         여기서 뺄 것이 남아 있지 않다(패치 0). host-b/host-a 는 EKS 에 없는 라벨값이라
#         그대로 뒀으면 3 파드 전부 영구 Pending 이었다.
#    - ✅ 0-27 CPU 요청 500m → 250m (nodeSet b·a 2곳 = 파드 3개) — 아래
#    - 🔴 **C-21 미완 — 이 오버레이만으로는 배치가 성립하지 않는다.** nodeSelector 를 걷어낸 결과
#         `node.attr.zone: host-b|host-a`(ES 샤드 awareness)를 **뒷받침하는 것이 아무것도 없다** —
#         nodeSet `b` 의 파드 2개가 같은 AZ 에 떠도 ES 는 "다른 zone" 이라고 믿는다.
#         C-21(= master-eligible AZ 당 1개)이 nodeSets 를 3×1 로 재편하면서 함께 풀어야 한다.
#         **그 전에는 EKS 에 붙이지 말 것.** (이 레인 0-5 의 범위 밖 — 사람 판단 필요)
#    - ✅ 0-8 SC → gp3 (아래 patch). 🔴 vct 는 immutable 이라 **이관 시점이 유일한 무비용 창**이다
#    - C-16 용량 **10Gi → 8Gi × 3** — 미착수
#    - 0-8b ECK `volumeClaimDeletePolicy` = 미설정(기본 DeleteOnScaledownAndClusterDeletion) 노출.
#      🔴 **아래 "0-8b 미결" 참조 — EKS 에서 이 비대칭을 재현할지 사람이 정할 것**
#    - 0-15 ES PoLP(슈퍼유저 4곳) · HTTP TLS 는 현행대로 끔
#
# 🔴 **아래 patch 는 인덱스 지정(JSON6902)이다.** 지금 nodeSets 순서 = [0]=b · [1]=a.
#    C-21 이 nodeSets 를 재편하면 **인덱스 4개를 다 같이** 고쳐야 한다 — 어긋나도 kustomize 는
#    조용히 성공하고 엉뚱한 nodeSet 에 붙는다.
resources:
  - ../../base

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 실측(C-29): 클러스터 CPU 요청 10.780 코어 ↔ 실사용 1.145(9.4배). 스케줄러는 **요청**으로 배치하므로
# 쓰지도 않을 CPU 때문에 `m7g.xlarge` 3대가 CPU 89% 로 시작하고 노드가 4대가 된다(= 월 $146.44).
# ES 3 파드 = 1.5 코어 요청은 이 클러스터에서 가장 큰 단일 덩어리다 → 0.75 코어로 내린다.
#
# 🔴 왜 안전한가: **CPU limits 가 없다**(§13.7 — 부하테스트에서 CFS 스로틀이 병목이었다).
#    요청은 천장이 아니라 "노드가 포화했을 때 보장되는 몫"이다. 색인 버스트는 그대로 위로 뚫는다.
#    250m 도 여전히 실사용의 몇 배다. 대가 = 노드 CPU 가 실제로 100% 인 순간의 배분 몫이 절반이 된다.
# 🔴 메모리(1536Mi req==limit)는 **건드리지 않는다** — 실사용과 거의 같고 축출 보호가 걸려 있다.
# 🔴 온프렘 base 는 500m 그대로다(사이트 분리 근거 = 이 파일 하단 "왜 eks 에만" 참조).
#
# ── 0-8 StorageClass = gp3 ─────────────────────────────────────────────────────
# 🔴 SC 이름 `gp3` 는 EBS CSI 애드온이 자동 생성하지 않는다(기본 SC 는 `gp2` 하나뿐).
#    Terraform 이 만들어야 바인딩된다 — 앱 레포 IaC 선행 항목.
#
# ── 🔴 0-8b 미결 (여기서 정하지 않았다) ────────────────────────────────────────
# 온프렘 IaC 의도 = "PG·ES·Kafka 는 Retain — CR 을 실수로 지워도 데이터가 즉사하지 않는 마지막 방어선".
# 그런데 온프렘 라이브는 **PV 21/21 이 Delete** 이고 `openebs-lvm-retain` SC 는 소비자가 0 이다.
# ES 는 그 위에 **한 겹 더 노출**돼 있다 — `spec.volumeClaimDeletePolicy` 미설정 = ECK 기본
# `DeleteOnScaledownAndClusterDeletion`(Kafka 는 `deleteClaim:false` 로 오퍼레이터가 막아준다).
# EKS 에서 이 비대칭을 **재현할지 고칠지**는 사람이 정할 일이라 손대지 않았다. 고치려면 둘 다 필요:
#   ① SC = `gp3-retain`(reclaimPolicy=Retain) 을 Terraform 에 추가하고 아래 값을 그 이름으로
#   ② `spec.volumeClaimDeletePolicy: DeleteOnScaledownOnly` 를 patch 로 추가
# ⚠️ ①만 하면 반쪽이다 — ECK 가 PVC 를 지우면 Retain PV 는 `Released` 로 남아 **자동 재사용이 안 된다**
#    (수동 `claimRef` 해제 필요). "안 지워진다"와 "자동으로 돌아온다"는 다르다.
patches:
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: es
    patch: |-
      - op: replace
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/nodeSets/1/podTemplate/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: add
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
      - op: add
        path: /spec/nodeSets/1/volumeClaimTemplates/0/spec/storageClassName
        value: gp3

# ── 왜 eks 에만 — 온프렘 base 는 그대로 둔다 ──────────────────────────────────
# ① 이득이 사이트마다 다르다. AWS 에서 CPU 요청은 **인스턴스 대수 = 청구서**다(3대 vs 4대 = $146.44/월).
#    온프렘은 물리 4워커가 이미 사 놓은 것이고, C-29 실측대로 **온프렘의 제약은 CPU 가 아니라 메모리**다
#    (요청 27.35 ↔ 실사용 24.96 = 1.1배). CPU 요청을 내려도 온프렘에서 풀리는 것이 없다.
# ② 대가는 온프렘 쪽이 크다. 지금 온프렘은 **살아 있는 프로덕션**이고, base 를 고치면 ES·PG·Kafka·앱이
#    한꺼번에 롤링 재시작된다. 이관 준비 기간에 데이터 티어를 흔들 이유가 없다.
# 🔴 체크리스트 0-27 은 "**AWS 가 아니라 온프렘에서 먼저** 한다(같은 매니페스트)"라고 적혀 있다 —
#    이 오버레이는 그 지침과 **다르다**. 갈린 이유 = 이 레인의 머지 조건이 "onprem 렌더 diff 0" 이라
#    base 를 건드릴 수 없다. 온프렘 선적용을 택하려면 **여기 값을 base 로 올리는 별도 PR** 이면 되고,
#    그때 이 오버레이는 같은 값이라 무해하게 남는다(멱등). **사람 결정 대기.**
