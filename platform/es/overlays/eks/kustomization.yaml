apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격만이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-1 이 만드는 것은 "가를 자리"이고, **내용은 Wave B 에서 채운다.**
# 지금은 base 통과라 렌더는 성공하지만 값은 온프렘 그대로다 — 이대로 붙이면 틀린다.
#
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 0-5 zone 라벨 host-a/host-b → AZ 이름(ap-northeast-2a/c…). C-21 = master-eligible **AZ 당 1개**
#    - 0-8 SC → gp3. 🔴 vct 는 immutable 이라 **이관 시점이 유일한 무비용 창**이다
#    - 0-8b ECK `volumeClaimDeletePolicy` 미설정 = 기본값(DeleteOnScaledownAndClusterDeletion) 노출.
#      EKS 에서 이 비대칭을 재현할지 **명시적으로 정할 것**
#    - 0-15 ES PoLP(슈퍼유저 4곳) · HTTP TLS 는 현행대로 끔
resources:
  - ../../base
