apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-9 로 레지스트리만 채웠다(2026-08-10) — 나머지는 아직 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#    ⚠️ 단 **레지스트리만은 예외** — check_eks_registry() 가 eks 렌더의 mp-* 이미지를 전수 본다.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-5 nodeSelector — **base 에서 제거 완료**(2026-08-10). 온프렘 값은 overlays/onprem 이 얹는다.
#         여기서 뺄 것이 남아 있지 않다(패치 0). host-b/host-a 는 EKS 에 없는 라벨값이라
#         그대로 뒀으면 3 파드 전부 영구 Pending 이었다.
#    - ✅ 0-27 CPU 요청 500m → 250m (nodeSet b·a 2곳 = 파드 3개) — 아래
#    - 🔴 **C-21 미완 — 이 오버레이만으로는 배치가 성립하지 않는다.** nodeSelector 를 걷어낸 결과
#         `node.attr.zone: host-b|host-a`(ES 샤드 awareness)를 **뒷받침하는 것이 아무것도 없다** —
#         nodeSet `b` 의 파드 2개가 같은 AZ 에 떠도 ES 는 "다른 zone" 이라고 믿는다.
#         C-21(= master-eligible AZ 당 1개)이 nodeSets 를 3×1 로 재편하면서 함께 풀어야 한다.
#         **그 전에는 EKS 에 붙이지 말 것.** (이 레인 0-5 의 범위 밖 — 사람 판단 필요)
#    - ✅ 0-8 SC → **gp3-retain** (아래 patch). 🔴 vct 는 immutable 이라 **이관 시점이 유일한 무비용 창**이다
#    - C-16 용량 **10Gi → 8Gi × 3** — 미착수
#    - ✅ 0-8b ECK `volumeClaimDeletePolicy` → **DeleteOnScaledownOnly** (아래 patch, 2026-08-13).
#      기본값(DeleteOnScaledownAndClusterDeletion)은 **Elasticsearch CR 삭제 = PVC 삭제**였다.
#    - 0-15 ES PoLP(슈퍼유저 4곳) · HTTP TLS 는 현행대로 끔
#
# 🔴 **아래 patch 는 인덱스 지정(JSON6902)이다.** 지금 nodeSets 순서 = [0]=b · [1]=a.
#    C-21 이 nodeSets 를 재편하면 **인덱스 4개를 다 같이** 고쳐야 한다 — 어긋나도 kustomize 는
#    조용히 성공하고 엉뚱한 nodeSet 에 붙는다.
resources:
  - ../../base


# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`.
# 🔴 mp-elasticsearch-nori 는 **우리가 빌드하는 커스텀 ES 이미지**다(한국어 nori 플러그인).
#    C-? "ECR 이관 + CI 유지" — 매니지드 OpenSearch 로 가는 게 아니라 계속 우리가 굽는다.
#    arm64(m7g) 노드라 **멀티아키 빌드가 전제**다.
#    🟢 **2026-08-14 실측으로 해소** — A0.5(GitLab CI)가 구운 `:4a7fc5bc…` 는 ECR 에서
#      `linux/arm64` 다(`unknown/unknown` 은 BuildKit provenance 항목이지 아키텍처가 아니다).
images:
# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`.
# 🔴 mp-elasticsearch-nori 는 **우리가 빌드하는 커스텀 ES 이미지**다(한국어 nori 플러그인).
#    C-? "ECR 이관 + CI 유지" — 매니지드 OpenSearch 로 가는 게 아니라 계속 우리가 굽는다.
#    arm64(m7g) 노드라 **멀티아키 빌드가 전제**다.
#    🟢 **2026-08-14 실측으로 해소** — A0.5(GitLab CI)가 구운 `:4a7fc5bc…` 는 ECR 에서
#      `linux/arm64` 다(`unknown/unknown` 은 BuildKit provenance 항목이지 아키텍처가 아니다).
  - name: 192.168.0.10/mealplanning/mp-pgsync
    newName: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-pgsync
    newTag: "4a7fc5bc62ffc826c6adde462bee561292ee8da8"

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 실측(C-29): 클러스터 CPU 요청 10.780 코어 ↔ 실사용 1.145(9.4배). 스케줄러는 **요청**으로 배치하므로
# 쓰지도 않을 CPU 때문에 `m7g.xlarge` 3대가 CPU 89% 로 시작하고 노드가 4대가 된다(= 월 $146.44).
# ES 3 파드 = 1.5 코어 요청은 이 클러스터에서 가장 큰 단일 덩어리다 → 0.75 코어로 내린다.
#
# 🔴 왜 안전한가: **CPU limits 가 없다**(§13.7 — 부하테스트에서 CFS 스로틀이 병목이었다).
#    요청은 천장이 아니라 "노드가 포화했을 때 보장되는 몫"이다. 색인 버스트는 그대로 위로 뚫는다.
#    250m 도 여전히 실사용의 몇 배다. 대가 = 노드 CPU 가 실제로 100% 인 순간의 배분 몫이 절반이 된다.
# 🔴 메모리(1536Mi req==limit)는 **건드리지 않는다** — 실사용과 거의 같고 축출 보호가 걸려 있다.
# 🔴 온프렘 base 는 500m 그대로다(사이트 분리 근거 = 이 파일 하단 "왜 eks 에만" 참조).
#
# ── 0-8 StorageClass = gp3-retain · ✅ 0-8b 판정 (2026-08-13) ──────────────────
# 🔴 SC 는 EBS CSI 애드온이 자동 생성하지 않는다(EKS 빌트인은 `gp2` 하나뿐).
#    → ✅ **해소(0-8e)** = `platform/cluster-baseline/overlays/eks/storageclasses.yaml` 가
#      `gp3`(Delete) · `gp3-retain`(Retain · default) 2종을 만든다. Terraform 이 아니라 config 소유다.
#
# 온프렘 IaC 의도 = "PG·ES·Kafka 는 Retain — CR 을 실수로 지워도 데이터가 즉사하지 않는 마지막 방어선".
# 그런데 온프렘은 그 SC 를 만들어만 두고 **아무도 안 썼다**(`openebs-lvm-retain` 소비자 0).
# ES 는 그 위에 **한 겹 더 노출**돼 있었다 — `spec.volumeClaimDeletePolicy` 미설정 = ECK 기본
# `DeleteOnScaledownAndClusterDeletion`(Kafka 는 `deleteClaim:false` 로 오퍼레이터가 막아준다).
# **EKS 에서는 재현하지 않고 고친다.** 둘 다 필요해서 둘 다 넣었다:
#   ① SC = `gp3-retain` (아래 storageClassName patch)
#   ② `spec.volumeClaimDeletePolicy: DeleteOnScaledownOnly` (아래 merge patch)
# ⚠️ ①만 하면 반쪽이다 — ECK 가 PVC 를 지우면 Retain PV 는 `Released` 로 남아 **자동 재사용이 안 된다**
#    (수동 `claimRef` 해제 필요). "안 지워진다"와 "자동으로 돌아온다"는 다르다.
#
# ⚠️ **ES 데이터는 재파생 가능하다**(C-16: 인덱스 24.2mb · 재색인 1.0초). 그런데도 Retain 인 이유 =
#    재색인의 원본이 **PG** 라, PG 가 성한 국면에서만 성립한다. 0-8b 가 온프렘 라이브 PV 21개를
#    Retain 으로 덮을 때 ES 3개를 포함시킨 근거와 같다 — 실제 사고는 PG 와 ES 를 같이 데려갔다.
#    비용은 8Gi × 3 = 24Gi(월 $1.92)뿐이다.
patches:
# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 실측(C-29): 클러스터 CPU 요청 10.780 코어 ↔ 실사용 1.145(9.4배). 스케줄러는 **요청**으로 배치하므로
# 쓰지도 않을 CPU 때문에 `m7g.xlarge` 3대가 CPU 89% 로 시작하고 노드가 4대가 된다(= 월 $146.44).
# ES 3 파드 = 1.5 코어 요청은 이 클러스터에서 가장 큰 단일 덩어리다 → 0.75 코어로 내린다.
#
# 🔴 왜 안전한가: **CPU limits 가 없다**(§13.7 — 부하테스트에서 CFS 스로틀이 병목이었다).
#    요청은 천장이 아니라 "노드가 포화했을 때 보장되는 몫"이다. 색인 버스트는 그대로 위로 뚫는다.
#    250m 도 여전히 실사용의 몇 배다. 대가 = 노드 CPU 가 실제로 100% 인 순간의 배분 몫이 절반이 된다.
# 🔴 메모리(1536Mi req==limit)는 **건드리지 않는다** — 실사용과 거의 같고 축출 보호가 걸려 있다.
# 🔴 온프렘 base 는 500m 그대로다(사이트 분리 근거 = 이 파일 하단 "왜 eks 에만" 참조).
#
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: es
    patch: |-
      - op: replace
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/nodeSets/1/podTemplate/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: add
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/storageClassName
        value: gp3-retain
      - op: add
        path: /spec/nodeSets/1/volumeClaimTemplates/0/spec/storageClassName
        value: gp3-retain

  # ── ✅ 0-8b ② ECK volumeClaimDeletePolicy (2026-08-13) ──────────────────────
  # 🔴 **같은 오브젝트인데 patches 항목이 둘인 이유 = 패치 방언이 다르다** — 위는 JSON6902(op 목록),
  #    아래는 merge 패치(매핑)다. 한 `patch:` 문자열은 둘 중 하나여야 해서 합칠 수 없다.
  #    여기서 merge 를 고른 것은 더 안전하기도 하다 — `op: add` 는 부모 경로가 없으면 렌더가 죽는데
  #    `volumeClaimDeletePolicy` 는 base 에 **없는 필드**다.
  #
  # 기본값 `DeleteOnScaledownAndClusterDeletion` = **Elasticsearch CR 을 지우면 ECK 가 PVC 도 지운다.**
  # `DeleteOnScaledownOnly` = 축소(nodeSet 을 줄임)일 때만 지우고, CR 삭제 시에는 PVC 를 남긴다.
  # 🔴 SC 의 Retain 과 **막는 지점이 다르다** — Retain 은 "PVC 가 사라져도 PV 는 남는다",
  #    이건 "PVC 자체가 안 사라진다"다. 둘을 다 걸어야 CR 삭제가 데이터까지 내려가지 않는다
  #    (0-8b 가 말한 "①만 하면 반쪽" 이 이것이다).
  # ⚠️ 대가 = ES 를 정말로 걷어낼 때 PVC 가 남아 EBS 요금이 계속 나간다. 8Gi × 3 = 월 $1.92.
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: es
    patch: |-
      apiVersion: elasticsearch.k8s.elastic.co/v1
      kind: Elasticsearch
      metadata:
        name: es
      spec:
        volumeClaimDeletePolicy: DeleteOnScaledownOnly

# ── 왜 eks 에만 — 온프렘 base 는 그대로 둔다 ──────────────────────────────────
# ① 이득이 사이트마다 다르다. AWS 에서 CPU 요청은 **인스턴스 대수 = 청구서**다(3대 vs 4대 = $146.44/월).
#    온프렘은 물리 4워커가 이미 사 놓은 것이고, C-29 실측대로 **온프렘의 제약은 CPU 가 아니라 메모리**다
#    (요청 27.35 ↔ 실사용 24.96 = 1.1배). CPU 요청을 내려도 온프렘에서 풀리는 것이 없다.
# ② 대가는 온프렘 쪽이 크다. 지금 온프렘은 **살아 있는 프로덕션**이고, base 를 고치면 ES·PG·Kafka·앱이
#    한꺼번에 롤링 재시작된다. 이관 준비 기간에 데이터 티어를 흔들 이유가 없다.
# 🔴 체크리스트 0-27 은 "**AWS 가 아니라 온프렘에서 먼저** 한다(같은 매니페스트)"라고 적혀 있다 —
#    이 오버레이는 그 지침과 **다르다**. 갈린 이유 = 이 레인의 머지 조건이 "onprem 렌더 diff 0" 이라
#    base 를 건드릴 수 없다. 온프렘 선적용을 택하려면 **여기 값을 base 로 올리는 별도 PR** 이면 되고,
#    그때 이 오버레이는 같은 값이라 무해하게 남는다(멱등). **사람 결정 대기.**

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  # 🔴 `name:` 을 지정한 이유 — 같은 트랙의 `mp-elasticsearch-exporter-auth` 는
  #    generator(Password CR) 기반이라 secretStoreRef 가 **일부러 없다**(monitoring.yaml).
  #    kind 만으로 잡으면 그쪽에 없던 필드가 생겨 조용히 의미가 바뀐다.
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-es-service-accounts}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: mp-es-service-accounts}
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

# 🔴 Elasticsearch CR 의 `spec.image` 는 kustomize `images` 트랜스포머의 기본 fieldSpec 밖이다
#    (컨테이너 경로만 본다). CRD 필드라 patch 로 직접 갈아야 한다 — images 에 적어도 안 먹는다.
  - target:
      group: elasticsearch.k8s.elastic.co
      kind: Elasticsearch
      name: es
    patch: |
      - op: replace
        path: /spec/image
        value: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-elasticsearch-nori:4a7fc5bc62ffc826c6adde462bee561292ee8da8

# 🔴 **빈 클러스터에서만 터지는 훅 교착** — 2026-08-14 A1 실측.
#    `mp-elasticsearch-exporter-bootstrap` Job 이 `sync-wave: -1`(= ES CR 보다 **먼저**)인데
#    `es-es-elastic-user` 시크릿을 env 로 요구한다. 그 시크릿은 **ECK 가 ES CR 을 받은 뒤에야**
#    만든다 ⇒ Job 이 `CreateContainerConfigError` 로 영원히 못 뜨고, Sync 훅이 안 끝나서
#    **wave 0 의 ES CR 자체가 적용되지 않는다.** 즉 "ES 가 없어서 실패하는 Job 이 ES 생성을 막는다".
#    🔴 **온프렘에서 안 드러난 이유 = ES 가 이미 있었다**(웹훅·시크릿이 선재). 같은 결함이 온프렘에도
#      잠복해 있고 **DR 재구축(C-3) 때 처음 터진다** — 다만 C-83 동결이라 여기서는 안 건드린다.
#    ⇒ wave 를 **2** 로 내린다. `mp-es-users-bootstrap`(wave 1)이 ES 응답을 **bounded retry** 로
#      기다리므로, 그 뒤에 두면 "ES 준비 완료" 보장을 그대로 승계한다.
#      🔴 이 Job 자신에겐 재시도 루프가 없다 — wave 1 과 **같은 wave 에 두면 병렬로 떠서** 진다.
  - target:
      group: batch
      version: v1
      kind: Job
      name: mp-elasticsearch-exporter-bootstrap
    patch: |
      - op: test
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-1"
      - op: replace
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "2"
