apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── 온프렘 사이트 오버레이 ─────────────────────────────────────────────────────
# 🔴 여기에 넣을 것 = **온프렘에서만 참인 값**. AWS 이관(C-3)으로 온프렘은 DR 대기 사이트 +
#    크롤 프로덕션으로 **계속 살아 있다** — 그래서 온프렘 전용 설정은 지우는 게 아니라
#    base 에서 이쪽으로 내려야 한다:
#    - ✅ nodeSelector `topology.kubernetes.io/zone: host-b|host-a` (2곳) — 0-5 · 아래 patch
#    - ✅ volumeClaimTemplates storageClassName: openebs-lvm (2곳) — 0-8 · 아래 patch
resources:
  - ../../base

# ── base 에서 내려온 온프렘 전용 값 복원 (0-5 nodeSelector · 0-8 StorageClass) ──
#
# 두 레인(L1 워크로드 스펙 · L2 스토리지)이 각각 base 에서 걷어낸 값을 여기서 그대로 되돌린다.
# **온프렘 렌더는 이사 전과 동일해야 한다** — 검증 = 전 트랙 정규화 diff 0.
#
# ▸ 0-5 nodeSelector — 배치 근거는 플랜 §5.2 "B에 2 · A에 1". 물리호스트 A 급사 3회 이력 때문에
#   ES 정족수를 A 에 몰지 않는다.
# ▸ 0-8 storageClassName — 온프렘 SC 는 `openebs-lvm`. EKS 에서는 `gp3` 로 갈린다(eks 오버레이).
#
# 🔴 왜 JSON6902(인덱스 지정)인가: `spec.nodeSets` 는 CRD 의 **리스트**다. CRD 스키마를 모르는
#    kustomize 는 전략적 머지가 아니라 JSON merge patch(RFC 7386)로 떨어지고, 그러면 리스트가
#    **통째로 교체**된다 — nodeSets 정의 전체를 오버레이에 다시 적어야 하고 정본이 둘이 된다.
#    인덱스 패치는 "그 한 필드만" 얹는다.
# 🔴 그래서 **nodeSets 순서에 결합돼 있다.** 지금 = [0]=b(count 2) · [1]=a(count 1).
#    0-5/C-21(AZ 당 1개 → nodeSet 재편)이 순서를 바꾸면 아래 인덱스 **4개를 다 같이** 고쳐야 한다.
#    ⚠️ 순서가 어긋나도 kustomize 는 조용히 성공한다 — 엉뚱한 nodeSet 에 붙을 뿐이다.
patches:
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: es
    patch: |-
      - op: add
        path: /spec/nodeSets/0/podTemplate/spec/nodeSelector
        value:
          topology.kubernetes.io/zone: host-b
      - op: add
        path: /spec/nodeSets/1/podTemplate/spec/nodeSelector
        value:
          topology.kubernetes.io/zone: host-a
      - op: add
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/storageClassName
        value: openebs-lvm
      - op: add
        path: /spec/nodeSets/1/volumeClaimTemplates/0/spec/storageClassName
        value: openebs-lvm
