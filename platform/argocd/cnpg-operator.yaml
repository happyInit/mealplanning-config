# CloudNativePG 오퍼레이터 — 버전 핀 정본 = 런북 §1.1 (차트 0.29.0 = 오퍼레이터 1.30.0).
# 🔴 PG 이미지 핀은 여기가 아니라 platform/pg/base/cluster.yaml 의 imageName —
#    차트/오퍼레이터 기본 이미지가 PG 18.4 라 안 박으면 18 이 선다(§1.1 함정).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  # 🔴 finalizer 없으면 Application 삭제 시 자식이 고아로 남는다(status §4.2)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: "0.29.0"

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 🔴 오퍼레이터 CRD 는 크다(ECK CRD 는 client-side apply 의 262KB annotation 한계 초과) → SSA 필수
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
