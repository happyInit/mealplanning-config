# 파이프라인 (컨슈머 4 + CronJob 11) — 소유=인프라, project=mealplanning (Q8·Q12).
# dark-deploy: CronJob suspend·Deployment replicas 0 — 기동은 전환창 §4-9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipelines
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: pipelines
  destination:
    server: https://kubernetes.default.svc
    namespace: pipeline
  # automated(auto-sync) 승격 — P2·P3 완료(2026-07-30)로 전환창 promote 리스크 해소. 계획대로 P3 승격.
  #    selfHeal 은 계속 끈다: (1) KEDA scale-to-zero(컨슈머 min 0)와 replicas 를 두고 싸우고,
  #    (2) 수동 CR 조작을 리버트하지 않도록. prune 도 끈다: kustomize 실수로 리소스 자동 삭제 방지.
  #    → 앱 서비스(tier ③)와 동일 정책: 새 커밋은 자동 배포, 라이브 드리프트는 강제하지 않음.
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
