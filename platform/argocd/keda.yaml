# KEDA — 플랫폼 child Application (정본 = 이 파일). P3 스케일 (2026-07-30).
#
# 왜 HPA 로 안 되나(object_spec §9.4): 컨슈머의 병목 신호는 CPU 가 아니라 **Kafka lag** 이다.
#   HPA 는 lag 를 못 본다. KEDA 는 HPA 를 **대체하지 않고 감싼다** — ScaledObject 를 만들면
#   KEDA 가 내부적으로 HPA 를 생성하고 외부 메트릭(lag)을 먹여준다.
#   🔴 그래서 스케일 경로가 이중이다: **0→1 은 KEDA 가 직접**, **1→N 은 (KEDA 가 만든) HPA 가**.
#      "0→1 은 되는데 1→N 이 안 된다" 류 디버깅은 이 구조를 알아야 가능하다.
#
# 🔴 선행조건(app 레포 k8s_argocd 롤, 2026-07-30 적용분) — 없으면 sync 가 조용히 거부된다:
#   ① sourceRepos 에 kedacore 차트 레포  ② destinations 에 keda ns
#   ③ clusterResourceWhitelist 에 **APIService** — 차트 실렌더링으로 확정한 클러스터 스코프 5종
#      (CRD 6·ClusterRole 4·ClusterRoleBinding 5·Validating 1·APIService 1) 중 유일한 누락분이었다.
#      이게 빠지면 외부 메트릭 API 등록이 막혀 ScaledObject 가 lag 를 영영 못 읽는다.
#
# ScaledObject 본체는 여기 없다 — 워크로드 옆(`pipelines/scaledobjects.yaml`)에 산다.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  # 🔴 없으면 Application 삭제 시 CRD·APIService 가 고아로 남는다(status §4.2)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: "2.20.1" # appVersion 2.20.1 · kubeVersion >=1.23 (우리 1.34)
    helm:
      valuesObject:
        # 4노드 학생 예산 — 기본값은 컨트롤플레인급 요청을 잡는다. 실측 후 조정.
        resources:
          operator:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          metricServer:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          webhooks:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
        # 관측: kps 가 라벨 무관 수집(serviceMonitorSelectorNilUsesHelmValues=false)
        prometheus:
          metricServer:
            enabled: true
            serviceMonitor:
              enabled: true
          operator:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD 6개가 큰 편이라 client-side apply 의 last-applied 어노테이션 한도(256KB)에 닿을 수 있다
      # — 대시보드 CM 에서 실제로 밟은 함정(status §3)과 같은 계열이라 미리 켠다.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
