# argo-rollouts ns 의 Harbor 풀 시크릿 — child Application.
#
# 왜 rollouts.yaml(차트 Application)에 못 합치나: 그쪽은 Helm 차트 단일 source 라
#   임의 매니페스트를 얹을 자리가 `extraObjects` 뿐인데, 그 값은 Helm `tpl` 을 타서
#   ESO 템플릿(`{{ .registry }}`)이 먼저 먹힌다(platform/rollouts/base/pullsecret.yaml 주석).
#   그래서 pgsync 와 같은 "디렉터리 + Application" 패턴으로 분리한다.
#
# 🔴 순서 의존: 이 앱이 먼저 떠야 rollouts 컨트롤러의 initContainer 가 Harbor 에서
#    이미지를 당길 수 있다. 늦어도 kubelet 이 ImagePullBackOff 를 재시도하므로 자가치유되지만,
#    새로 만들 때는 이쪽을 먼저 sync 하는 편이 빠르다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-pullsecret
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    # 🔴 사이트 오버레이 경로 (0-1, 2026-08-09). 구 `platform/rollouts` = base 직행. 렌더 결과는 동일(전 트랙 diff 0).
    path: platform/rollouts/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  # 컨트롤러 기동의 전제라 자동 동기화(rollouts 차트 앱과 같은 등급).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
