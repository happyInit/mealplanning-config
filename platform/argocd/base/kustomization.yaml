apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── platform-root 가 배포하는 child Application 21개 (사이트 공통 본문) ──
# 🔴 namespace: 를 넣지 말 것 — 매니페스트가 metadata.namespace(argocd) 를 직접 갖고 있다.
# 🔴 child 를 새로 추가하면 반드시 아래 resources 에 등록한다. 등록하지 않으면 조용히 배포되지 않는다.
# 이 중 12개는 Helm 소스라 사이트 결합 값이 spec.source.helm.valuesObject 에 인라인으로 있다 —
# eks 오버레이에서 필드 단위 패치로 가른다(SITES.md §0-4 "이 구조가 열어주는 것").
resources:
  - alloy.yaml
  - cnpg-operator.yaml
  - cnpg-plugin-barman-cloud.yaml
  - descheduler.yaml
  - eck-operator.yaml
  - es.yaml
  - kafka.yaml
  - keda.yaml
  - kubecost.yaml
  - loki.yaml
  - pg.yaml
  - pgsync.yaml
  - pipelines.yaml
  - policies-observability.yaml
  - pooler.yaml
  - redis-operator.yaml
  - redis.yaml
  - rollouts-pullsecret.yaml
  - rollouts.yaml
  - strimzi-operator.yaml
  - tempo.yaml
