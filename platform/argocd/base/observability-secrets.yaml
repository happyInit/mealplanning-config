# observability 비밀 배선 — 플랫폼 child Application (C-18 선행).
#
# 🔴 이 Application 의 목적은 **단일 공급원을 Ansible 에서 config 로 옮기는 것**이다.
#    `lgtm-minio-creds`(Loki·Tempo 오브젝트 스토어 자격증명)는 지금까지 Ansible 롤
#    `k8s_platform_apps` 가 유일한 공급원이었고 ArgoCD 관리 밖이었다.
#    상세·전환 절차 = platform/observability/README.md
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/observability/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # 🔴 automated 없음 = manual sync. 자격증명 소유권 이전은 **사람이 순서를 지켜야** 한다 —
  #    fb-secrets 적재가 먼저이고, 그 값이 라이브와 같은지 확인한 뒤 sync 한다.
  #    자동이면 ESO 가 빈 값/다른 값으로 시크릿을 덮어써 Loki·Tempo 가 다음 재시작에 죽는다.
  #    (Tempo 는 store init 실패 시 fail-fast 다.)
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
