# loki — 플랫폼 child Application (정본 = 이 파일).
#
# 🔴 2026-07-29 이사분: 종전 정본은 Ansible `roles/k8s_platform_apps` 였다. platform-root
#    (app-of-apps)가 이 디렉토리를 집으면서 git 이 정본이 됐다 — Ansible 쪽 Application
#    태스크는 같은 날 은퇴했다. **양쪽에 두지 말 것**(정본 이원화).
# 값 변경 = 이 파일 수정 → push → root 가 자동 반영(child 는 각자 automated sync).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  # 🔴 이 finalizer 가 없으면 Application 삭제 시 자식 리소스가 고아로 남는다(status §4.2)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "7.1.0"
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false # 단일 테넌트
          commonConfig:
            replication_factor: 1
          storage:
            type: s3
            bucketNames: # 단일 버킷(loki) 재사용 — P0 k8s_minio 가 만들어 둔 것
              chunks: loki
              ruler: loki
              admin: loki
            s3:
              # 🔴 `.svc` 단축형 고정 — 4-dot FQDN 은 search 확장 중 `.local` 로 새어 ISP 가
              #    NXDOMAIN 을 공인 IP 로 하이재킹한다(2026-08-02 실측 21.7%). alloy.yaml 주석 참조.
              endpoint: http://minio.observability.svc:9000
              accessKeyId: ${MINIO_ACCESS_KEY_ID}
              secretAccessKey: ${MINIO_SECRET_ACCESS_KEY}
              s3ForcePathStyle: true
              insecure: true
          schemaConfig:
            configs:
              - from: "2026-07-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: s3
        # 🔴 SSD(SimpleScalable) 타깃을 명시적으로 0 — validate.yaml 이 deploymentMode 와
        #    무관하게 양쪽 replicas 를 검사해서, 기본값(각 3)이 남아 있으면 렌더가 죽는다
        #    (2026-07-28 실측: ArgoCD ComparisonError "more than zero replicas ... both").
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        singleBinary:
          replicas: 1
          # 관측은 B (배치 원칙 — Prometheus·MinIO 동일). zone 은 그대로 두고 **노드만 b1 로 좁힌다**
          # (2026-07-31) — zone B 안에서 볼륨이 b2 한 곳에 몰려 데이터 티어가 자리를 못 잡았다:
          #   b2 openebs-vg 134Gi/150Gi 사용(prometheus 30 · minio 50 · kubecost 32 · es 10 · loki 10
          #   · alertmanager 2) → 여유 16Gi. Kafka 브로커 재배치(20Gi PVC)가 여기서 막혔다.
          #   반면 b1 은 80Gi, a2 는 150Gi 가 놀고 있었다.
          # 🔴 로컬 PV 는 "옮기기 = 볼륨 재생성" 이라 워크로드마다 대가가 다른데, **Loki 가 가장 싸다** —
          #   청크·인덱스는 MinIO(S3)로 나가고 이 10Gi 는 `/var/loki` 작업 디렉터리(WAL·캐시)뿐이라
          #   잃는 건 아직 플러시 안 된 최근 WAL 정도다. prometheus(메트릭 이력 전부)·minio(Loki·Tempo
          #   블록 + 모델 아티팩트)는 같은 이동이 실데이터 손실이라 건드리지 않았다.
          # hostname 고정이 새 취약점을 만들진 않는다 — 로컬 PV 라 어차피 그 노드에 묶여 있다.
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-b1
          persistence:
            size: 10Gi
            storageClass: openebs-lvm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi # 플랜 §2.2 예산
          extraArgs:
            - -config.expand-env=true
          extraEnvFrom:
            - secretRef:
                name: lgtm-minio-creds
        # ── 부속 전부 off — 3노드 스케일에 과잉이고 RAM 을 먹는다 ──
        gateway:
          enabled: false # 소비자는 svc/loki:3100 직결 (Alloy·Grafana)
        chunksCache:
          enabled: false # memcached 8Gi
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        sidecar:
          rules:
            enabled: false # ruler 미사용 (알림은 P4 까지 `.11`)
        rbac:
          namespaced: true # ClusterRole 대신 Role — 클러스터 스코프 최소화
        monitoring:
          serviceMonitor:
            enabled: true # kps 가 라벨 무관 수집(selectorNilUsesHelmValues=false)
        # ~~클러스터-밖 로그 유입구(NodePort 31100)~~ → **회수 (2026-07-30, .15 게이트웨이 개통)**
        # alloy(.10·.11)는 https://loki.mealbong.cloud/loki/api/v1/push 로 민다 — 정본 =
        # gateway-internal/(mp-loki-push-route). 게이트웨이 액세스 로그로 push 204 실증 후 제거.
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
