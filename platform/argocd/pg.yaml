# PG (CNPG Cluster) — 초기 상태 = VM(.8) 의 replica cluster (런북 Q4·Q7).
# promote = platform/pg/cluster.yaml 의 replica.enabled=false 를 T-1 에 머지(장전) 후
# 전환창에서 manual sync 1클릭 (런북 §4-4 · `kubectl cnpg promote` 는 오용 — §9-13).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/pg
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  # 🔴 automated 없음 = manual sync (런북 Q8) — P2 기간 데이터 CR 은 사람이 sync 를 누른다.
  #    selfHeal 이 있으면 전환창의 promote(수동 CR 조작·T-1 장전 커밋)가 몇 초 만에 리버트된다(§9-3).
  #    automated 승격은 P3.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
