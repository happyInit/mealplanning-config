# alloy — 플랫폼 child Application (정본 = 이 파일).
#
# 🔴 2026-07-29 이사분: 종전 정본은 Ansible `roles/k8s_platform_apps` 였다. platform-root
#    (app-of-apps)가 이 디렉토리를 집으면서 git 이 정본이 됐다 — Ansible 쪽 Application
#    태스크는 같은 날 은퇴했다. **양쪽에 두지 말 것**(정본 이원화).
# 값 변경 = 이 파일 수정 → push → root 가 자동 반영(child 는 각자 automated sync).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.11.0"
    helm:
      valuesObject:
        alloy:
          # 파드 로그 수집 → Loki. 트레이스 수신 배선(OTLP→Tempo)은 소비자가 생기는 P1 에서.
          configMap:
            content: |
              // ── 이 노드의 파드 로그: /var/log/pods 테일 → Loki ──
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "job"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
          mounts:
            varlog: true # hostPath /var/log → /var/log readOnly
            extra:
              - name: alloy-data
                mountPath: /var/lib/alloy
          storagePath: /var/lib/alloy # 테일 포지션 영속 — 재시작 시 중복·유실 방지
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0 # /var/log/pods 는 root 소유 — kube-system(PSS 무라벨)이라 허용
            runAsGroup: 0
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi # 🔴 2026-07-29 상향(256Mi→512Mi): b1 파드가 21h 동안
              # `fatal error: out of memory` 로 크래시루프(재시작 204회) — 그 노드 로그가
              # Loki 에 안 들어가고 있었다. Application 은 Progressing 이라 알람도 안 울린다.
              # requests(128Mi)는 그대로라 스케줄 예산·플랜 §2.2 배분은 불변, 한도만 올린다.
        controller:
          type: daemonset
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule # master 로그도 수집 — 플랜 §2.2 master 예산에 이 몫 있음
          volumes:
            extra:
              - name: alloy-data
                hostPath:
                  path: /var/lib/alloy
                  type: DirectoryOrCreate
        crds:
          create: false # PodLogs CRD 미사용 — CRD 는 Ansible 소관 원칙 유지
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # 🔴 hostPath 필수 → PSS baseline(observability) 불가, node-exporter 수칙
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
