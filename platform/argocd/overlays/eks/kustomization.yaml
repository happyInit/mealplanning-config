apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트: platform-root 의 감시 대상 ──────────────────────────────────────
# 🔴 지금은 base 통과다. **이 디렉터리가 0-4 의 목적 그 자체**다 — Helm 소스 child 12개의
#    사이트 결합 값이 `spec.source.helm.valuesObject` 안에 인라인이라, 오버레이가 없으면
#    가를 수단이 0 이었다. 이제 JSON merge patch 로 **필드 단위** 수정이 된다
#    (`null` 이 키 삭제로 동작 → nodeSelector 통째 제거 가능. 실증 = SITES.md §0-4).
#
# 여기서 갈라야 하는 것 — 실측 15건 (SITES.md §0-4 "이 구조가 열어주는 것"):
#   [0-5] nodeSelector `kubernetes.io/hostname`      5건 · loki.yaml:79(b1) · kubecost.yaml:53,75,101,125(a2)
#   [0-5] nodeSelector `topology.../zone: host-b`    ✅ 1건 해소 · tempo.yaml:108 → 아래 patch
#   [0-8] storageClass `openebs-lvm`                 6건 · loki.yaml:82 · tempo.yaml:112
#                                                          · kubecost.yaml:25,62,80,83  → gp3
#   [0-9] Harbor LAN IP `192.168.0.10/mealplanning`  1건 · rollouts.yaml:87 (initContainer 이미지) → ECR
#   [--]  MinIO 인클러스터 엔드포인트                 2건 · loki.yaml:38 · tempo.yaml:100 → S3
#
#   나머지 8개(alloy · keda · descheduler + 오퍼레이터 5)는 사이트 결합 값이 0 이라 패치할 것이 없다.
#
# 🔴 git 소스 child 9개는 여기서 `spec.source.path` 를 `…/overlays/eks` 로 돌려야 한다
#    (그 트랙들의 eks 오버레이는 0-1 이 이미 깔아 뒀다).
# 🔴 이 디렉터리는 **부트스트랩(bootstrap/argocd/overlays/eks)이 이미 참조하도록 적혀 있다** —
#    거기 EKS platform-root 의 path 가 `platform/argocd/overlays/eks` 다.
resources:
  - ../../base

# ── 0-9 레지스트리 분기 — rollouts 플러그인 이미지 (2026-08-10) ────────────────
# 🔴 **`images:` 트랜스포머로는 못 잡는다.** 이 이미지는 컨테이너 spec 이 아니라 Application 의
#    `spec.source.helm.valuesObject` **안에** 있다. kustomize 의 기본 fieldSpec 은 컨테이너 경로만
#    보므로 여기는 patch 로 직접 간다(SITES.md 실무규칙 7 의 "CRD 필드" 와 같은 사정).
#
# 🔴 `op: test` 를 앞에 둔 이유 — 인덱스·경로 기반 replace 는 base 의 values 구조가 바뀌면
#    **엉뚱한 값을 조용히 덮어쓴다.** test 가 깨지면 렌더가 죽어서 `validate.py` 가 잡는다.
# ⚠️ 태그는 온프렘과 **같은 커밋 SHA** 를 유지한다. ECR 로 옮길 때 같은 다이제스트를 밀어 넣는
#    전제이고, 태그가 갈리면 "같은 플러그인"이라는 보장이 사라진다.
# 🔴 `PLACEHOLDER` = AWS 계정 ID 미정(`scripts/sites.yaml` eks.registry 와 같은 값이어야 한다).
#    계정이 정해지면 sites.yaml 을 고치고 `validate.py` 가 열거하는 목록대로 맞춘다.
patches:
  - target: {group: argoproj.io, kind: Application, name: rollouts}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: 192.168.0.10/mealplanning/mp-rollouts-gatewayapi-plugin:314b898fe831b2cbe38c2f17fa43a00441bcce08
      - op: replace
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mp-rollouts-gatewayapi-plugin:314b898fe831b2cbe38c2f17fa43a00441bcce08

# ── 0-5 nodeSelector 이탈 — tempo (2026-08-10) ────────────────────────────────
# `topology.kubernetes.io/zone: host-b` 는 **온프렘에서만 참인 값**이다. EKS 는 같은 라벨 키에
# 실제 AZ(`ap-northeast-2a`·`ap-northeast-2c`)가 들어가므로 `host-b` 는 어느 노드에도 안 맞고,
# tempo 파드가 **영구 Pending** 이 된다. persistence 가 켜져 있어(`enabled: true`) PVC 도
# `WaitForFirstConsumer` 로 같이 멎는다 — 파드가 안 뜨니 볼륨도 영원히 안 붙는다.
#
# 🔴 온프렘 값은 base 에 **그대로 둔다**(ES 트랙과 반대 방향). ES 는 base→overlays/onprem 이사였지만
#    여기는 `platform/argocd/overlays/onprem/kustomization.yaml` 의 방침이 "사이트 결합 값은
#    base 에 그대로 둔다" 라서(그 파일 주석 9행), 이탈은 **eks 쪽에서 빼는** 모양이 된다.
#    → 온프렘 렌더 diff 0. 배치 근거(호스트 B 고정 = A 급사 시 관측 생존)는 온프렘에서 계속 유효하다.
#
# 🔴 `op: test` 를 앞에 두는 이유는 위 rollouts 패치와 같다 — base 가 바뀌면 조용히 어긋나는 대신
#    렌더가 죽어서 `validate.py` 가 잡는다.
# ⚠️ JSON Pointer(RFC 6901) 이스케이프 — 키 `topology.kubernetes.io/zone` 의 `/` 는 `~1` 이다.
#    이스케이프를 빼면 `topology.kubernetes.io` 아래 `zone` 이라는 **없는 경로**를 가리켜 test 가 깨진다.
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/nodeSelector/topology.kubernetes.io~1zone
        value: host-b
      - op: remove
        path: /spec/source/helm/valuesObject/nodeSelector
