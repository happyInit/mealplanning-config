apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트: platform-root 의 감시 대상 ──────────────────────────────────────
# 🔴 지금은 base 통과다. **이 디렉터리가 0-4 의 목적 그 자체**다 — Helm 소스 child 12개의
#    사이트 결합 값이 `spec.source.helm.valuesObject` 안에 인라인이라, 오버레이가 없으면
#    가를 수단이 0 이었다. 이제 JSON merge patch 로 **필드 단위** 수정이 된다
#    (`null` 이 키 삭제로 동작 → nodeSelector 통째 제거 가능. 실증 = SITES.md §0-4).
#
# 여기서 갈라야 하는 것 — 실측 15건 (SITES.md §0-4 "이 구조가 열어주는 것"):
#   [0-5] nodeSelector `kubernetes.io/hostname`      5건 · loki.yaml:79(b1) · kubecost.yaml:53,75,101,125(a2)
#   [0-5] nodeSelector `topology.../zone: host-b`    ✅ 1건 해소 · tempo.yaml:108 → 아래 patch
#   [0-8] storageClass `openebs-lvm`                 6건 · loki.yaml:82 · tempo.yaml:112
#                                                          · kubecost.yaml:25,62,80,83  → gp3
#   [0-9] Harbor LAN IP `192.168.0.10/mealplanning`  1건 · rollouts.yaml:87 (initContainer 이미지) → ECR
#   [--]  MinIO 인클러스터 엔드포인트                 2건 · loki.yaml:38 · tempo.yaml:100 → S3
#
#   나머지 8개(alloy · keda · descheduler + 오퍼레이터 5)는 사이트 결합 값이 0 이라 패치할 것이 없다.
#
# 🔴 git 소스 child 는 여기서 `spec.source.path` 를 `…/overlays/eks` 로 돌려야 한다
#    (그 트랙들의 eks 오버레이는 0-1 이 이미 깔아 뒀다).
#    → ✅ **A1 에서 데이터 티어 4종을 돌렸다**(2026-08-14, 아래 patches). 나머지는 그 트랙 차례에.
#    🔴 **이걸 안 돌리면 EKS 에 온프렘 매니페스트가 배포된다** — 실측으로 이미 일어났다:
#       app ns 파드 12종이 `192.168.0.10/mealplanning/...`(LAN Harbor)에서 이미지를 당기다
#       `ImagePullBackOff` 였다. **ECR 이 비어서가 아니라 오버레이가 온프렘이어서다.**
# 🔴 이 디렉터리는 **부트스트랩(bootstrap/argocd/overlays/eks)이 이미 참조하도록 적혀 있다** —
#    거기 EKS platform-root 의 path 가 `platform/argocd/overlays/eks` 다.
resources:
  - ../../base

  # ── 0-3 (2026-08-13) — 🔴 **EKS 에만 있는 child 4개.** ArgoCD 밖(순수 Helm/Ansible)이던
  #    것을 AWS 쪽에서만 config 소유로 **신설**한다. base 에 넣지 않는 이유 = C-83
  #    (온프렘 형상 동결 · AWS 는 덧셈만). 온프렘의 Helm 소유는 **그대로 둔다** —
  #    종전 계획이던 "온프렘 소유권을 ArgoCD 로 이전" 은 철회됐다(그 국면이 ArgoCD 가
  #    prune 할 수 있는 유일한 창이었고, 라이브 PVC 21/21 이 reclaimPolicy=Delete 라
  #    Prometheus 30Gi 가 날아갈 수 있었다 — 체크리스트 0-8b).
  #
  #    실측(2026-08-13 `helm list -A` + tracking-id 부재)으로 확인한 ArgoCD 밖 릴리스는 **4종**:
  #      ① metrics-server        (kube-system)   → 신설 ✅  🔴 **EKS 기본 제공 아님 · HPA 가 의존**
  #      ② node-exporter         (kube-system)   → 신설 ✅
  #      ③ kube-prometheus-stack (observability) → 신설 ✅  (+ 0-3b · 1-27 · 0-3c · 0-5 · 0-8 동시 해소)
  #      ④ minio                 (observability) → 🔴 **신설하지 않는다. 그게 정답이다.**
  #         C-18 = MinIO 삭제 · S3 전환. AWS 에 MinIO 를 다시 세우면 이관의 목적을 되돌린다.
  #         소비자(Loki·Tempo)는 이미 이 오버레이의 패치로 S3 + IRSA 를 보고 있고,
  #         `mp-data-tier` 의 `mp-minio` 알림 그룹은 `monitoring/overlays/eks` 가 제거했다.
  #         ⚠️ 온프렘 MinIO 는 그대로 산다 — `platform/pg` 의 `mp-pg-onsite-minio` 등 온사이트
  #           백업 경로가 아직 쓴다(C-3 이중역할).
  - metrics-server.yaml
  - node-exporter.yaml
  - kube-prometheus-stack.yaml
  # 0-3 — 클러스터/ns 베이스라인(PriorityClass 3 · Namespace 5 PSA · RQ 2 · LR 3).
  # 🔴 sync-wave -10. AppProject 선행 2건이 있다 — 그 파일 머리말 참조.
  - cluster-baseline.yaml

# ── 0-9 레지스트리 분기 — rollouts 플러그인 이미지 (2026-08-10) ────────────────
# 🔴 **`images:` 트랜스포머로는 못 잡는다.** 이 이미지는 컨테이너 spec 이 아니라 Application 의
#    `spec.source.helm.valuesObject` **안에** 있다. kustomize 의 기본 fieldSpec 은 컨테이너 경로만
#    보므로 여기는 patch 로 직접 간다(SITES.md 실무규칙 7 의 "CRD 필드" 와 같은 사정).
#
# 🔴 `op: test` 를 앞에 둔 이유 — 인덱스·경로 기반 replace 는 base 의 values 구조가 바뀌면
#    **엉뚱한 값을 조용히 덮어쓴다.** test 가 깨지면 렌더가 죽어서 `validate.py` 가 잡는다.
# ⚠️ 태그는 온프렘과 **같은 커밋 SHA** 를 유지한다. ECR 로 옮길 때 같은 다이제스트를 밀어 넣는
#    전제이고, 태그가 갈리면 "같은 플러그인"이라는 보장이 사라진다.
# 🟢 계정 ID 확정(2026-08-14 · `689192361171`) — `scripts/sites.yaml` eks.registry 와 **같은 값이어야 한다**.
#    계정이 정해지면 sites.yaml 을 고치고 `validate.py` 가 열거하는 목록대로 맞춘다.
patches:
  - target: {group: argoproj.io, kind: Application, name: rollouts}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: 192.168.0.10/mealplanning/mp-rollouts-gatewayapi-plugin:314b898fe831b2cbe38c2f17fa43a00441bcce08
      - op: replace
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-rollouts-gatewayapi-plugin:314b898fe831b2cbe38c2f17fa43a00441bcce08

  # ── C-18 MinIO 삭제 → S3 · 1-19 region/TLS — Loki (2026-08-10) ───────────────
  # 🔴 **EKS 에는 MinIO 가 없다**(C-18). base 의 `http://minio.observability.svc:9000` 을 그대로
  #    가져가면 Loki 가 store init 에서 죽는다. 4개를 **한 묶음으로** 갈아야 한다 —
  #    하나만 하면 조용히 실패한다:
  #
  #   ① endpoint  → `s3.ap-northeast-2.amazonaws.com` (스킴 없이. Loki 는 insecure 로 판단한다)
  #   ② 🔴 region  → **1-19.** 실측 = 온프렘 loki·tempo 매니페스트에 region 이 **0건**이다.
  #      MinIO 는 region 을 안 봤지만 S3 는 본다. 안 넣으면 SDK 가 기본 리전(us-east-1)으로
  #      붙어 **버킷을 못 찾는다**(ap-northeast-2 버킷이라 301/PermanentRedirect).
  #   ③ 🔴 insecure: false · s3ForcePathStyle: false — **1-19 의 "뒤집기"** 가 이것이다.
  #      `insecure: true` 면 평문 HTTP 로 S3 에 붙으려 하고, path-style 은 S3 가 이미 폐기 방향이다.
  #   ④ 🔴 `extraEnvFrom` **삭제** — `lgtm-minio-creds` 시크릿이 EKS 에 없다. 남기면 파드가
  #      `CreateContainerConfigError` 로 아예 안 뜬다(시크릿 없는 secretRef). `-config.expand-env`
  #      도 같이 뺀다 — 치환할 `${MINIO_*}` 가 더 이상 없다.
  #      ⇒ 자격증명은 **IRSA**(SA 애너테이션)로 간다. Loki 는 키를 안 적으면 AWS SDK 기본
  #        자격증명 체인을 타므로 accessKeyId/secretAccessKey 를 **적지 않는다**(0-16 과 같은 트랙).
  #
  # 🔴 [0-5] nodeSelector `kubernetes.io/hostname: k8s-worker-b1` **제거** — EKS 에 그런 노드가
  #    없어 영구 Pending 이다. `null` 이 키 삭제로 동작한다(SITES.md §0-4 실증).
  #    base 에 남겨 두는 이유 = 온프렘에선 여전히 참이다(로컬 PV 가 b1 에 묶여 있다).
  #
  # ⚠️ 여기서 **안 고친 것** = `singleBinary.persistence.storageClass: openebs-lvm` → `gp3`.
  #    그건 **0-8**(SC 트랙) 소관이고 이 PR 은 C-18(오브젝트 스토어)만 다룬다.
  #    🔴 0-8 이 안 오면 PVC 가 바인딩되지 않아 Loki 가 Pending 이다 — 둘 다 필요하다.
  # 🟢 계정 ID 는 채워졌다(2026-08-14). ⚠️ **버킷 이름은 아직 자리표시자다** — 실물 생성 확인 전이다.
  - target: {group: argoproj.io, kind: Application, name: loki}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: loki, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              loki:
                storage:
                  bucketNames:
                    chunks: mp-observability-eks
                    ruler: mp-observability-eks
                    admin: mp-observability-eks
                  s3:
                    endpoint: s3.ap-northeast-2.amazonaws.com
                    region: ap-northeast-2
                    accessKeyId: null
                    secretAccessKey: null
                    s3ForcePathStyle: false
                    insecure: false
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-loki-s3
              singleBinary:
                nodeSelector: null
                extraArgs: null
                extraEnvFrom: null

  # ── C-18 · 1-19 — Tempo ──────────────────────────────────────────────────────
  # 근거는 위 Loki 와 같다. Tempo 쪽 키 이름만 다르다(`insecure`/`forcepathstyle` — 소문자 붙임).
  # 🔴 Tempo 는 **store init 실패 시 fail-fast** 다(base 주석: 그래서 421회 재시작으로 먼저 터졌다).
  #    즉 이 패치가 틀리면 EKS 에서 가장 먼저·가장 시끄럽게 죽는 컴포넌트다 — 역설적으로 좋다.
  # ⚠️ `nodeSelector: topology.kubernetes.io/zone: host-b` 는 **여기서 안 고친다** — zone 라벨
  #    3건(prometheus·alertmanager·tempo)은 다른 레인 소관이다. 🔴 안 고치면 EKS 에서
  #    zone 값이 `ap-northeast-2a/c` 라 영구 Pending 이다. 그 PR 과 **둘 다** 필요하다.
  # ⚠️ `persistence.storageClassName: openebs-lvm` → `gp3` 도 0-8 소관(위와 동일).
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: tempo, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              tempo:
                extraArgs: null
                extraEnvFrom: null
                storage:
                  trace:
                    s3:
                      bucket: mp-observability-eks
                      endpoint: s3.ap-northeast-2.amazonaws.com
                      region: ap-northeast-2
                      access_key: null
                      secret_key: null
                      insecure: false
                      forcepathstyle: false
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-tempo-s3
# ── 0-5 nodeSelector 이탈 — tempo (2026-08-10) ────────────────────────────────
# `topology.kubernetes.io/zone: host-b` 는 **온프렘에서만 참인 값**이다. EKS 는 같은 라벨 키에
# 실제 AZ(`ap-northeast-2a`·`ap-northeast-2c`)가 들어가므로 `host-b` 는 어느 노드에도 안 맞고,
# tempo 파드가 **영구 Pending** 이 된다. persistence 가 켜져 있어(`enabled: true`) PVC 도
# `WaitForFirstConsumer` 로 같이 멎는다 — 파드가 안 뜨니 볼륨도 영원히 안 붙는다.
#
# 🔴 온프렘 값은 base 에 **그대로 둔다**(ES 트랙과 반대 방향). ES 는 base→overlays/onprem 이사였지만
#    여기는 `platform/argocd/overlays/onprem/kustomization.yaml` 의 방침이 "사이트 결합 값은
#    base 에 그대로 둔다" 라서(그 파일 주석 9행), 이탈은 **eks 쪽에서 빼는** 모양이 된다.
#    → 온프렘 렌더 diff 0. 배치 근거(호스트 B 고정 = A 급사 시 관측 생존)는 온프렘에서 계속 유효하다.
#
# 🔴 `op: test` 를 앞에 두는 이유는 위 rollouts 패치와 같다 — base 가 바뀌면 조용히 어긋나는 대신
#    렌더가 죽어서 `validate.py` 가 잡는다.
# ⚠️ JSON Pointer(RFC 6901) 이스케이프 — 키 `topology.kubernetes.io/zone` 의 `/` 는 `~1` 이다.
#    이스케이프를 빼면 `topology.kubernetes.io` 아래 `zone` 이라는 **없는 경로**를 가리켜 test 가 깨진다.
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/nodeSelector/topology.kubernetes.io~1zone
        value: host-b
      - op: remove
        path: /spec/source/helm/valuesObject/nodeSelector

# ══════════════════════════════════════════════════════════════════════════════
# A1 — 데이터 티어를 EKS 오버레이로 돌린다 (2026-08-14 · C-78 A1)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **왜 이 4개만인가** = A1 의 범위가 데이터 티어이기 때문이다. 나머지 git 소스 child
#    (`pipelines`·`rollouts-pullsecret`·`observability-secrets`·`policies-observability`)는
#    각자의 차례(A2·A4·A5)에 같은 모양으로 돌린다. **한 번에 다 돌리면 실패 시 원인이 안 갈린다.**
#
# 🔴 `op: test` 를 앞에 두는 이유는 이 파일의 다른 패치들과 같다 — base 가 바뀌면 조용히
#    어긋나는 대신 렌더가 죽어서 `validate.py` 가 잡는다.
  - target: {group: argoproj.io, kind: Application, name: pg}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pg/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pg/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: pooler}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pooler/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pooler/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: es}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/es/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/es/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: pgsync}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pgsync/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pgsync/overlays/eks

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 EKS 에서 **통째로 빼는** 트랙 2개 (2026-08-14 · 사용자 확정)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **오버레이를 비우는 것으로는 부족하다.** child Application 자체가 EKS 목록에 있으면
#    누군가 sync 를 누르는 순간 온프렘 CR 이 EKS 로 샌다(`platform/redis/overlays/eks` 의
#    머리말이 정확히 이 위험을 적어 두고 있다: *"지금 통과로 두면 RedisReplication CR 이 EKS 로 샌다"*).
#    ⇒ **목록에서 지운다.** `$patch: delete` 는 base 를 안 건드리고 이 사이트에서만 뺀다.
#
# ── redis — C-14 ElastiCache for Valkey ───────────────────────────────────────
# EKS 에는 Redis **파드가 없다**(`cache.t4g.micro` Multi-AZ 2노드로 나간다).
# 🔴 대체 경로 = `app-common` 의 Redis 엔드포인트 교체(common 트랙 · A2 소관).
#    ⚠️ 그때까지 앱은 Redis 에 못 붙는다 — **A1 은 데이터 티어를 세우는 단계지 앱이 도는 단계가 아니다.**
# 🟢 `pgsync` 의 전용 Redis(`platform/pgsync/base/redis-pgsync.yaml`)는 **별개다.** 그건 남는다 —
#    체크포인트 저장소라 앱 캐시와 수명·소유자가 다르다. C-14 는 앱 캐시 이야기다.
#
# ── kafka — C-39 크롤 파이프라인 재설계 ───────────────────────────────────────
# **AWS 쪽 Kafka 를 전면 제거**한다. 온프렘 Kafka 는 인터넷 단절 버퍼로 남고,
# AWS 는 S3 → SQS → KEDA → 리파이너 경로다.
# 🔴 `platform/kafka/overlays/eks` 의 머리말은 **C-39 이전에 쓰였다** — 아직 MM2(C-11~13)를
#    전제하고 gp3·용량 조정을 "할 일"로 적고 있다. **낡았다.** 그 오버레이는 지우지 않고 두되
#    (온프렘 렌더에 영향 0), **여기서 목록에서 빼는 것이 실효 결정**이다.
  - target: {group: argoproj.io, kind: Application, name: redis}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: redis, namespace: argocd}
      $patch: delete

  - target: {group: argoproj.io, kind: Application, name: kafka}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: kafka, namespace: argocd}
      $patch: delete
