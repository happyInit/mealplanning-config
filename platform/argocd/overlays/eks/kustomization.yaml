apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트: platform-root 의 감시 대상 ──────────────────────────────────────
# 🔴 지금은 base 통과다. **이 디렉터리가 0-4 의 목적 그 자체**다 — Helm 소스 child 12개의
#    사이트 결합 값이 `spec.source.helm.valuesObject` 안에 인라인이라, 오버레이가 없으면
#    가를 수단이 0 이었다. 이제 JSON merge patch 로 **필드 단위** 수정이 된다
#    (`null` 이 키 삭제로 동작 → nodeSelector 통째 제거 가능. 실증 = SITES.md §0-4).
#
# 여기서 갈라야 하는 것 — 실측 15건 (SITES.md §0-4 "이 구조가 열어주는 것"):
#   [0-5] nodeSelector `kubernetes.io/hostname`      5건 · loki.yaml:79(b1) · kubecost.yaml:53,75,101,125(a2)
#   [0-5] nodeSelector `topology.../zone: host-b`    ✅ 1건 해소 · tempo.yaml:108 → 아래 patch
#   [0-8] storageClass `openebs-lvm`                 6건 · loki.yaml:82 · tempo.yaml:112
#                                                          · kubecost.yaml:25,62,80,83  → gp3
#   [0-9] Harbor LAN IP `192.168.0.10/mealplanning`  1건 · rollouts.yaml:87 (initContainer 이미지) → ECR
#   [--]  MinIO 인클러스터 엔드포인트                 2건 · loki.yaml:38 · tempo.yaml:100 → S3
#
#   나머지 8개(alloy · keda · descheduler + 오퍼레이터 5)는 사이트 결합 값이 0 이라 패치할 것이 없다.
#
# 🔴 git 소스 child 는 여기서 `spec.source.path` 를 `…/overlays/eks` 로 돌려야 한다
#    (그 트랙들의 eks 오버레이는 0-1 이 이미 깔아 뒀다).
#    → ✅ **A1 에서 데이터 티어 4종을 돌렸다**(2026-08-14, 아래 patches). 나머지는 그 트랙 차례에.
#    🔴 **이걸 안 돌리면 EKS 에 온프렘 매니페스트가 배포된다** — 실측으로 이미 일어났다:
#       app ns 파드 12종이 `192.168.0.10/mealplanning/...`(LAN Harbor)에서 이미지를 당기다
#       `ImagePullBackOff` 였다. **ECR 이 비어서가 아니라 오버레이가 온프렘이어서다.**
# 🔴 이 디렉터리는 **부트스트랩(bootstrap/argocd/overlays/eks)이 이미 참조하도록 적혀 있다** —
#    거기 EKS platform-root 의 path 가 `platform/argocd/overlays/eks` 다.
resources:
  - ../../base

  # ── 0-3 (2026-08-13) — 🔴 **EKS 에만 있는 child 4개.** ArgoCD 밖(순수 Helm/Ansible)이던
  #    것을 AWS 쪽에서만 config 소유로 **신설**한다. base 에 넣지 않는 이유 = C-83
  #    (온프렘 형상 동결 · AWS 는 덧셈만). 온프렘의 Helm 소유는 **그대로 둔다** —
  #    종전 계획이던 "온프렘 소유권을 ArgoCD 로 이전" 은 철회됐다(그 국면이 ArgoCD 가
  #    prune 할 수 있는 유일한 창이었고, 라이브 PVC 21/21 이 reclaimPolicy=Delete 라
  #    Prometheus 30Gi 가 날아갈 수 있었다 — 체크리스트 0-8b).
  #
  #    실측(2026-08-13 `helm list -A` + tracking-id 부재)으로 확인한 ArgoCD 밖 릴리스는 **4종**:
  #      ① metrics-server        (kube-system)   → 신설 ✅  🔴 **EKS 기본 제공 아님 · HPA 가 의존**
  #      ② node-exporter         (kube-system)   → 신설 ✅
  #      ③ kube-prometheus-stack (observability) → 신설 ✅  (+ 0-3b · 1-27 · 0-3c · 0-5 · 0-8 동시 해소)
  #      ④ minio                 (observability) → 🔴 **신설하지 않는다. 그게 정답이다.**
  #         C-18 = MinIO 삭제 · S3 전환. AWS 에 MinIO 를 다시 세우면 이관의 목적을 되돌린다.
  #         소비자(Loki·Tempo)는 이미 이 오버레이의 패치로 S3 + IRSA 를 보고 있고,
  #         `mp-data-tier` 의 `mp-minio` 알림 그룹은 `monitoring/overlays/eks` 가 제거했다.
  #         ⚠️ 온프렘 MinIO 는 그대로 산다 — `platform/pg` 의 `mp-pg-onsite-minio` 등 온사이트
  #           백업 경로가 아직 쓴다(C-3 이중역할).
  - metrics-server.yaml
  - node-exporter.yaml
  - kube-prometheus-stack.yaml
  # 0-3 — 클러스터/ns 베이스라인(PriorityClass 3 · Namespace 5 PSA · RQ 2 · LR 3).
  # 🔴 sync-wave -10. AppProject 선행 2건이 있다 — 그 파일 머리말 참조.
  - cluster-baseline.yaml

# ── 0-9 레지스트리 분기 — rollouts 플러그인 이미지 (2026-08-10) ────────────────
# 🔴 **`images:` 트랜스포머로는 못 잡는다.** 이 이미지는 컨테이너 spec 이 아니라 Application 의
#    `spec.source.helm.valuesObject` **안에** 있다. kustomize 의 기본 fieldSpec 은 컨테이너 경로만
#    보므로 여기는 patch 로 직접 간다(SITES.md 실무규칙 7 의 "CRD 필드" 와 같은 사정).
#
# 🔴 `op: test` 를 앞에 둔 이유 — 인덱스·경로 기반 replace 는 base 의 values 구조가 바뀌면
#    **엉뚱한 값을 조용히 덮어쓴다.** test 가 깨지면 렌더가 죽어서 `validate.py` 가 잡는다.
# ⟳ 🔴 **정정(2026-08-14) — 종전 서술 "태그는 온프렘과 같은 커밋 SHA 를 유지한다(같은 다이제스트를
#    밀어 넣는 전제)" 는 C-89 로 성립하지 않는다.** 그 전제는 *한 이미지를 두 레지스트리에 미러링*
#    한다는 것이었는데, C-89(사이트별 단일 아키)가 **양쪽을 각자 빌드**하는 형상을 확정했다 —
#    Harbor=amd64(Jenkins) · ECR=arm64(GitLab). **아키텍처가 다르면 다이제스트가 같을 수 없다.**
#    ⇒ 태그가 갈리는 것은 사고가 아니라 **구조의 결과**다.
# 🔴 그래서 **핀의 판정 기준이 "온프렘과 같은가" 가 아니라 "그 레지스트리에 실재하는가" 로 바뀐다.**
#    실측(2026-08-14) — ECR 전 리포의 태그는 `4a7fc5bc`(A0.5 파이프라인 19, `SERVICES=all`) **단 하나**이고
#    종전 핀 `314b898f` 는 **ECR 에 없다** ⇒ `Init:ImagePullBackOff` 로 rollouts 컨트롤러가 서 있었다.
#    같은 이유로 `services/*/overlays/eks` 13종의 핀도 전부 갱신했다(전수 대조 15/15 불일치였다).
# 🟢 플러그인 **내용**의 동일성은 다이제스트가 아니라 소스로 보증된다 — Dockerfile 이 `314b898`↔현행 main
#    바이트 동일임이 이미 확인돼 있다(base 파일 머리말). 즉 같은 소스를 두 아키로 구운 것이다.
# 🔴 재발 방지는 이 파일이 아니라 **CI 소관**이다 — A-43(Jenkins CD 가 onprem 만 핀) 의 GitLab 쪽 짝이
#    `config-pin` 잡이고, 그것이 eks 핀을 자동 갱신해야 이 수동 대조가 없어진다.
# 🟢 계정 ID 확정(2026-08-14 · `689192361171`) — `scripts/sites.yaml` eks.registry 와 **같은 값이어야 한다**.
#    계정이 정해지면 sites.yaml 을 고치고 `validate.py` 가 열거하는 목록대로 맞춘다.
# ══ PriorityClass 배선 — platform-critical · observability-high (2026-08-16) ═══
# 🔴 **왜 필요했나** — 라이브 실측에서 이 차트들이 만든 파드 **34개가 전부 priority 0** 이었다.
#    분류가 3층(data/app/pipeline)뿐이라 우리가 직접 깐 플랫폼·관측 컴포넌트가 표 밖에 있었고,
#    그래서 **배치성 크롤(pipeline-low=1000)이 CNPG 오퍼레이터·Prometheus 보다 높았다.**
#    2026-08-16 BG 승격 창의 압력이 실제로 Prometheus 를 선점해 내려 롤아웃이 중단됐다.
# 🔴 **merge 패치를 쓴다(JSON6902 아님).** `valuesObject` 아래 부모 키가 차트마다 있기도 없기도
#    한데(cnpg·eck 는 `helm` 블록 자체가 없다), JSON6902 `add` 는 부모가 없으면 실패한다.
#    Application 은 CRD 라 kustomize 가 JSON merge 로 처리 → **객체는 재귀 병합**되므로
#    기존 values 를 보존한 채 키 하나만 얹는다. (리스트를 적으면 교체되지만 여기엔 리스트가 없다)
# 🔴 **키 이름은 차트마다 다르고, 틀리면 조용히 무시된다**(= "설정됨 ≠ 동작함"). 그래서 전부
#    `helm show values` 로 경로를 확인하고 `helm template` 렌더로 실제 주입을 검증했다:
#      loki  = `global.priorityClassName`(전 파드 일괄)   tempo = 최상위   alloy = `controller.`
#      argo-rollouts = `controller.` + `dashboard.`       keda·cnpg·barman·eck = 최상위
# 🔵 kubecost 는 일부러 비워 둔다 — 비용 분석은 밀려도 서비스·복구·관측 어디에도 영향이 없다.
#    `mp-unclassified`(globalDefault=5000)를 받는 것이 의도한 자리다.
patches:
  - target: {group: argoproj.io, kind: Application, name: rollouts}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: rollouts}
      spec:
        source:
          helm:
            valuesObject:
              controller: {priorityClassName: platform-critical}
              dashboard: {priorityClassName: platform-critical}
  - target: {group: argoproj.io, kind: Application, name: keda}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: keda}
      spec:
        source:
          helm:
            valuesObject: {priorityClassName: platform-critical}
  - target: {group: argoproj.io, kind: Application, name: cnpg-operator}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: cnpg-operator}
      spec:
        source:
          helm:
            valuesObject: {priorityClassName: platform-critical}
  - target: {group: argoproj.io, kind: Application, name: cnpg-plugin-barman-cloud}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: cnpg-plugin-barman-cloud}
      spec:
        source:
          helm:
            valuesObject: {priorityClassName: platform-critical}
  - target: {group: argoproj.io, kind: Application, name: eck-operator}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: eck-operator}
      spec:
        source:
          helm:
            valuesObject: {priorityClassName: platform-critical}
  - target: {group: argoproj.io, kind: Application, name: loki}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: loki}
      spec:
        source:
          helm:
            valuesObject:
              global: {priorityClassName: observability-high}
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: tempo}
      spec:
        source:
          helm:
            valuesObject: {priorityClassName: observability-high}
  - target: {group: argoproj.io, kind: Application, name: alloy}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: alloy}
      spec:
        source:
          helm:
            valuesObject:
              controller: {priorityClassName: observability-high}
  - target: {group: argoproj.io, kind: Application, name: rollouts}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: 192.168.0.10/mealplanning/mp-rollouts-gatewayapi-plugin:314b898fe831b2cbe38c2f17fa43a00441bcce08
      - op: replace
        path: /spec/source/helm/valuesObject/controller/initContainers/0/image
        value: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-rollouts-gatewayapi-plugin:4a7fc5bc62ffc826c6adde462bee561292ee8da8

  # ── C-18 MinIO 삭제 → S3 · 1-19 region/TLS — Loki (2026-08-10) ───────────────
  # 🔴 **EKS 에는 MinIO 가 없다**(C-18). base 의 `http://minio.observability.svc:9000` 을 그대로
  #    가져가면 Loki 가 store init 에서 죽는다. 4개를 **한 묶음으로** 갈아야 한다 —
  #    하나만 하면 조용히 실패한다:
  #
  #   ① endpoint  → `s3.ap-northeast-2.amazonaws.com` (스킴 없이. Loki 는 insecure 로 판단한다)
  #   ② 🔴 region  → **1-19.** 실측 = 온프렘 loki·tempo 매니페스트에 region 이 **0건**이다.
  #      MinIO 는 region 을 안 봤지만 S3 는 본다. 안 넣으면 SDK 가 기본 리전(us-east-1)으로
  #      붙어 **버킷을 못 찾는다**(ap-northeast-2 버킷이라 301/PermanentRedirect).
  #   ③ 🔴 insecure: false · s3ForcePathStyle: false — **1-19 의 "뒤집기"** 가 이것이다.
  #      `insecure: true` 면 평문 HTTP 로 S3 에 붙으려 하고, path-style 은 S3 가 이미 폐기 방향이다.
  #   ④ 🔴 `extraEnvFrom` **삭제** — `lgtm-minio-creds` 시크릿이 EKS 에 없다. 남기면 파드가
  #      `CreateContainerConfigError` 로 아예 안 뜬다(시크릿 없는 secretRef). `-config.expand-env`
  #      도 같이 뺀다 — 치환할 `${MINIO_*}` 가 더 이상 없다.
  #      ⇒ 자격증명은 **IRSA**(SA 애너테이션)로 간다. Loki 는 키를 안 적으면 AWS SDK 기본
  #        자격증명 체인을 타므로 accessKeyId/secretAccessKey 를 **적지 않는다**(0-16 과 같은 트랙).
  #
  # 🔴 [0-5] nodeSelector `kubernetes.io/hostname: k8s-worker-b1` **제거** — EKS 에 그런 노드가
  #    없어 영구 Pending 이다. `null` 이 키 삭제로 동작한다(SITES.md §0-4 실증).
  #    base 에 남겨 두는 이유 = 온프렘에선 여전히 참이다(로컬 PV 가 b1 에 묶여 있다).
  #
  # ⚠️ 여기서 **안 고친 것** = `singleBinary.persistence.storageClass: openebs-lvm` → `gp3`.
  #    그건 **0-8**(SC 트랙) 소관이고 이 PR 은 C-18(오브젝트 스토어)만 다룬다.
  #    🔴 0-8 이 안 오면 PVC 가 바인딩되지 않아 Loki 가 Pending 이다 — 둘 다 필요하다.
  # 🟢 계정 ID 는 채워졌다(2026-08-14). ⚠️ **버킷 이름은 아직 자리표시자다** — 실물 생성 확인 전이다.
  - target: {group: argoproj.io, kind: Application, name: loki}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: loki, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              loki:
                storage:
                  bucketNames:
                    chunks: mp-observability-eks
                    ruler: mp-observability-eks
                    admin: mp-observability-eks
                  s3:
                    endpoint: s3.ap-northeast-2.amazonaws.com
                    region: ap-northeast-2
                    accessKeyId: null
                    secretAccessKey: null
                    s3ForcePathStyle: false
                    insecure: false
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-loki-s3
              singleBinary:
                nodeSelector: null
                extraArgs: null
                extraEnvFrom: null

  # ── C-18 · 1-19 — Tempo ──────────────────────────────────────────────────────
  # 근거는 위 Loki 와 같다. Tempo 쪽 키 이름만 다르다(`insecure`/`forcepathstyle` — 소문자 붙임).
  # 🔴 Tempo 는 **store init 실패 시 fail-fast** 다(base 주석: 그래서 421회 재시작으로 먼저 터졌다).
  #    즉 이 패치가 틀리면 EKS 에서 가장 먼저·가장 시끄럽게 죽는 컴포넌트다 — 역설적으로 좋다.
  # ⚠️ `nodeSelector: topology.kubernetes.io/zone: host-b` 는 **여기서 안 고친다** — zone 라벨
  #    3건(prometheus·alertmanager·tempo)은 다른 레인 소관이다. 🔴 안 고치면 EKS 에서
  #    zone 값이 `ap-northeast-2a/c` 라 영구 Pending 이다. 그 PR 과 **둘 다** 필요하다.
  # ⚠️ `persistence.storageClassName: openebs-lvm` → `gp3` 도 0-8 소관(위와 동일).
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: tempo, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              tempo:
                extraArgs: null
                extraEnvFrom: null
                storage:
                  trace:
                    s3:
                      bucket: mp-observability-eks
                      endpoint: s3.ap-northeast-2.amazonaws.com
                      region: ap-northeast-2
                      access_key: null
                      secret_key: null
                      insecure: false
                      forcepathstyle: false
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-tempo-s3
# ── 0-5 nodeSelector 이탈 — tempo (2026-08-10) ────────────────────────────────
# `topology.kubernetes.io/zone: host-b` 는 **온프렘에서만 참인 값**이다. EKS 는 같은 라벨 키에
# 실제 AZ(`ap-northeast-2a`·`ap-northeast-2c`)가 들어가므로 `host-b` 는 어느 노드에도 안 맞고,
# tempo 파드가 **영구 Pending** 이 된다. persistence 가 켜져 있어(`enabled: true`) PVC 도
# `WaitForFirstConsumer` 로 같이 멎는다 — 파드가 안 뜨니 볼륨도 영원히 안 붙는다.
#
# 🔴 온프렘 값은 base 에 **그대로 둔다**(ES 트랙과 반대 방향). ES 는 base→overlays/onprem 이사였지만
#    여기는 `platform/argocd/overlays/onprem/kustomization.yaml` 의 방침이 "사이트 결합 값은
#    base 에 그대로 둔다" 라서(그 파일 주석 9행), 이탈은 **eks 쪽에서 빼는** 모양이 된다.
#    → 온프렘 렌더 diff 0. 배치 근거(호스트 B 고정 = A 급사 시 관측 생존)는 온프렘에서 계속 유효하다.
#
# 🔴 `op: test` 를 앞에 두는 이유는 위 rollouts 패치와 같다 — base 가 바뀌면 조용히 어긋나는 대신
#    렌더가 죽어서 `validate.py` 가 잡는다.
# ⚠️ JSON Pointer(RFC 6901) 이스케이프 — 키 `topology.kubernetes.io/zone` 의 `/` 는 `~1` 이다.
#    이스케이프를 빼면 `topology.kubernetes.io` 아래 `zone` 이라는 **없는 경로**를 가리켜 test 가 깨진다.
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/nodeSelector/topology.kubernetes.io~1zone
        value: host-b
      - op: remove
        path: /spec/source/helm/valuesObject/nodeSelector

# ── 0-8 StorageClass 이탈 — loki · tempo · kubecost (2026-08-14) ──────────────
# 🔴 이 파일이 스스로 예고해 둔 항목이다 — 머리말 실측표의 *"[0-8] storageClass `openebs-lvm`
#    6건 … → gp3"* 이고, Loki 패치 옆 주석이 *"0-8 이 안 오면 PVC 가 바인딩되지 않아 Loki 가
#    Pending 이다 — 둘 다 필요하다"* 라고 적어 뒀다. **그 예고가 라이브에서 그대로 실현됐다**:
#    실측(2026-08-14) `observability/loki-0` **Pending 15시간** ·
#    `storage-loki-0` PVC = `openebs-lvm` 으로 **바인딩 불가**(EKS 에 그 SC 가 없다).
#    `validate.py` 의 [storage] 경고 6건도 정확히 이 목록이다.
#
# 🔴 **`gp3`(Delete) 를 고르는 근거** — 0-8e 의 기준은 *재파생 불가 → `gp3-retain` / 재생성 가능 →
#    `gp3`* 다. 이 셋은 전부 후자다:
#      · Loki·Tempo — 청크·블록의 **정본이 S3**(C-18 · `mp-observability-*`)이고 PVC 는 WAL·캐시다
#      · kubecost   — 비용 지표를 **Prometheus 에서 파생**한다
#    ⚠️ 기본 SC 가 `gp3-retain` 이라(0-8e · 온프렘과 반대) **명시하지 않으면 Retain 으로 떨어진다** —
#       재생성 가능한 볼륨이 지워지지 않고 남아 비용이 된다. 그래서 셋 다 명시한다.
#
# 🔵 온프렘 무영향 — base 의 `openebs-lvm` 은 그대로 두고 eks 쪽에서만 덮는다(C-83 덧셈).
  - target: {group: argoproj.io, kind: Application, name: loki}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: loki, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              singleBinary:
                persistence:
                  storageClass: gp3
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: tempo, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              persistence:
                storageClassName: gp3
  - target: {group: argoproj.io, kind: Application, name: kubecost}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: kubecost, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              global:
                defaultStorageClass: gp3
              aggregator:
                aggregatorDbStorage:
                  storageClass: gp3
                persistentConfigsStorage:
                  storageClass: gp3
              localStore:
                persistentVolume:
                  storageClass: gp3

  # ── kubecost `nodeSelector` 4곳 제거 (2026-08-14) ────────────────────────────
  # 🔴 base 가 파드 4종을 **온프렘 노드 이름**에 못박아 뒀다:
  #      nodeSelector: {kubernetes.io/hostname: k8s-worker-a2}
  #    EKS 에 그런 노드는 없다 ⇒ 4파드 전부 영구 Pending. 실측(2026-08-14):
  #      0/2 nodes are available: 2 node(s) didn't match Pod's node affinity/selector
  #    🔴 바로 위 patch 가 `storageClass` 4곳만 gp3 로 고치고 이 4곳은 놓쳤다 —
  #       **같은 블록에서 절반만 갈린 것**이라 "eks 오버레이가 kubecost 를 다룬다"로 읽혀
  #       원인을 찾기 어려웠다.
  # 🟢 EKS 에서는 핀 자체가 불필요하다 — 온프렘의 핀은 특정 워커에 로컬 PV 를 묶어 두기 위한
  #    것이었고(openebs LVM = 노드 로컬), EBS gp3 는 AZ 안에서 어느 노드에든 붙는다.
  # 🔴 온프렘은 그대로 둔다(C-83) — base 를 고치지 않고 여기서만 걷는 이유가 그것이다.
  # ⚠️ `op: test` 를 앞에 둬서 base 가 바뀌면 조용히 어긋나는 대신 렌더가 죽게 한다.
  - target: {group: argoproj.io, kind: Application, name: kubecost}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/localStore/nodeSelector
        value: {kubernetes.io/hostname: k8s-worker-a2}
      - op: remove
        path: /spec/source/helm/valuesObject/localStore/nodeSelector
      - op: test
        path: /spec/source/helm/valuesObject/aggregator/nodeSelector
        value: {kubernetes.io/hostname: k8s-worker-a2}
      - op: remove
        path: /spec/source/helm/valuesObject/aggregator/nodeSelector
      - op: test
        path: /spec/source/helm/valuesObject/finopsagent/nodeSelector
        value: {kubernetes.io/hostname: k8s-worker-a2}
      - op: remove
        path: /spec/source/helm/valuesObject/finopsagent/nodeSelector
      - op: test
        path: /spec/source/helm/valuesObject/frontend/nodeSelector
        value: {kubernetes.io/hostname: k8s-worker-a2}
      - op: remove
        path: /spec/source/helm/valuesObject/frontend/nodeSelector

# ══════════════════════════════════════════════════════════════════════════════
# A1 — 데이터 티어를 EKS 오버레이로 돌린다 (2026-08-14 · C-78 A1)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **왜 이 4개만인가** = A1 의 범위가 데이터 티어이기 때문이다. 나머지 git 소스 child
#    (`pipelines`·`rollouts-pullsecret`·`observability-secrets`·`policies-observability`)는
#    각자의 차례(A2·A4·A5)에 같은 모양으로 돌린다. **한 번에 다 돌리면 실패 시 원인이 안 갈린다.**
#
# 🔴 `op: test` 를 앞에 두는 이유는 이 파일의 다른 패치들과 같다 — base 가 바뀌면 조용히
#    어긋나는 대신 렌더가 죽어서 `validate.py` 가 잡는다.
  - target: {group: argoproj.io, kind: Application, name: pg}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pg/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pg/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: pooler}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pooler/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pooler/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: es}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/es/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/es/overlays/eks

  - target: {group: argoproj.io, kind: Application, name: pgsync}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/pgsync/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/pgsync/overlays/eks

# ══════════════════════════════════════════════════════════════════════════════
# A2 — `observability-secrets` 를 EKS 오버레이로 돌린다 (2026-08-14)
# ══════════════════════════════════════════════════════════════════════════════
# 위 A1 블록이 예고한 "각자의 차례" 중 하나다. **이번 차례인 이유**는 grafana 가 이것 없이는
# 못 뜨기 때문이다 — 실측(2026-08-14):
#     Error: secret "mp-grafana-admin" not found   (x1132 over 4h)
#   observability ns 에 **ExternalSecret 이 0개**였다. 공급 트랙이 온프렘을 가리키고 있어서다.
#
# 🟢 대상 오버레이는 이미 준비돼 있다 — `platform/observability/overlays/eks` 가
#    ① `externalsecret-grafana-admin.yaml` 을 더하고(스토어 = `mp-aws-secrets`)
#    ② `mp-lgtm-object-store`(온프렘 MinIO 자격증명)를 `$patch: delete` 로 걷는다.
# 🔵 `remoteRef.key` 는 온프렘과 동일한 `observability-secrets` 다(스토어 prefix `mp/prod/` 가
#    앞에 붙어 파라미터 이름이 된다) — 그래서 Secrets Manager 에 **`mp/prod/observability-secrets`**
#    적재가 선행이다. 값 없이 돌리면 `SecretSyncedError` 로 바뀔 뿐 grafana 는 여전히 못 뜬다.
#
# 🔴 `pipelines`·`policies-observability` 는 **이번에 안 돌린다.** 전자는 C-3(크롤은 온프렘 상주)
#    때문에 EKS 에 둘지 자체가 미결이고, 후자는 `0-17`·`0-18`(netpol 의 LAN ipBlock)이 선행이다.
#    A1 주석의 원칙 그대로 — **한 번에 다 돌리면 실패 시 원인이 안 갈린다.**
#    ⟳ **`pipelines` 는 해소됐다(2026-08-16 · A5-a) — 아래에 추가했다.** 위 *"EKS 에 둘지
#      자체가 미결"* 이 D4-a 로 정해졌다: **외부를 긁는 것 = 온프렘 / 우리 DB 를 손보는 것 = AWS.**
#      `policies-observability` 는 그대로 미착수다.
  - target: {group: argoproj.io, kind: Application, name: observability-secrets}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/observability/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/observability/overlays/eks

# ── pipelines → overlays/eks (A5-a · 2026-08-16) ─────────────────────────────
# 🔴 **지금 이게 EKS 장애의 실체다**(실측 2026-08-16): 이 Application 이 아직
#    `pipelines/overlays/onprem` 을 보고 있어서 **온프렘 Harbor 이미지**(`192.168.0.10/…`)가
#    EKS 에 그대로 올라갔다 ⇒ 파드 **17개 ImagePullBackOff** · 발화 알림 **20건**
#    (KubeJobNotCompleted 10 · MpConsumerLagUnobserved 3). 진짜 신호가 묻히는 상태다.
#
# 🔵 대상 오버레이(`pipelines/overlays/eks`)가 같은 커밋에서 **부분집합 + ECR + PVC** 를 갖췄다.
#    그 파일이 스스로 걸어 둔 *"⚠️ 그때까지 이 오버레이를 ArgoCD 에 붙이지 말 것"* 조건
#    (매달린 claimName 2건)이 **둘 다 해소**돼서 이제 붙일 수 있다.
#
# 🔴 **온프렘 Application 은 안 바뀐다** — 이 패치는 eks 오버레이에만 있고, 온프렘은 계속
#    `pipelines/overlays/onprem`(크롤 7종 포함 전체)을 본다. C-3 상 크롤이 상시 프로덕션이다.
  - target: {group: argoproj.io, kind: Application, name: pipelines}
    patch: |-
      - op: test
        path: /spec/source/path
        value: pipelines/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: pipelines/overlays/eks

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 EKS 에서 **통째로 빼는** 트랙 2개 (2026-08-14 · 사용자 확정)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **오버레이를 비우는 것으로는 부족하다.** child Application 자체가 EKS 목록에 있으면
#    누군가 sync 를 누르는 순간 온프렘 CR 이 EKS 로 샌다(`platform/redis/overlays/eks` 의
#    머리말이 정확히 이 위험을 적어 두고 있다: *"지금 통과로 두면 RedisReplication CR 이 EKS 로 샌다"*).
#    ⇒ **목록에서 지운다.** `$patch: delete` 는 base 를 안 건드리고 이 사이트에서만 뺀다.
#
# ── redis — C-14 ElastiCache for Valkey ───────────────────────────────────────
# EKS 에는 Redis **파드가 없다**(`cache.t4g.micro` Multi-AZ 2노드로 나간다).
# 🔴 대체 경로 = `app-common` 의 Redis 엔드포인트 교체(common 트랙 · A2 소관).
#    ⚠️ 그때까지 앱은 Redis 에 못 붙는다 — **A1 은 데이터 티어를 세우는 단계지 앱이 도는 단계가 아니다.**
# 🟢 `pgsync` 의 전용 Redis(`platform/pgsync/base/redis-pgsync.yaml`)는 **별개다.** 그건 남는다 —
#    체크포인트 저장소라 앱 캐시와 수명·소유자가 다르다. C-14 는 앱 캐시 이야기다.
#
# ── kafka — C-39 크롤 파이프라인 재설계 ───────────────────────────────────────
# **AWS 쪽 Kafka 를 전면 제거**한다. 온프렘 Kafka 는 인터넷 단절 버퍼로 남고,
# AWS 는 S3 → SQS → KEDA → 리파이너 경로다.
# 🔴 `platform/kafka/overlays/eks` 의 머리말은 **C-39 이전에 쓰였다** — 아직 MM2(C-11~13)를
#    전제하고 gp3·용량 조정을 "할 일"로 적고 있다. **낡았다.** 그 오버레이는 지우지 않고 두되
#    (온프렘 렌더에 영향 0), **여기서 목록에서 빼는 것이 실효 결정**이다.
  - target: {group: argoproj.io, kind: Application, name: redis}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: redis, namespace: argocd}
      $patch: delete

  - target: {group: argoproj.io, kind: Application, name: kafka}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: kafka, namespace: argocd}
      $patch: delete

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 오퍼레이터 2종도 함께 뺀다 — **CR 이 없으면 오퍼레이터는 죽은 무게다** (2026-08-14)
# ══════════════════════════════════════════════════════════════════════════════
# 위에서 `redis`·`kafka` CR 앱을 뺐으니 그것들을 조종할 컨트롤러도 필요 없다.
# 🔴 실측으로 확인하고 뺀다 — EKS 경로(`pipelines`·`pgsync`·`es` 포함) 어디에도
#    `kafka.strimzi.io` · `redis.redis.opstreelabs.in` CR 이 **0건**이다.
# 🟢 `pgsync` 전용 Redis 는 **오퍼레이터 CR 이 아니라 평범한 Deployment** 다
#    (`platform/pgsync/base/redis-pgsync.yaml` = `apps/v1 Deployment` + Service). 그건 그대로 산다.
# ⚠️ 남기면 비용이 아니라 **혼선**이 문제다 — 컨트롤러가 돌고 있으면 "Kafka 를 쓰나?" 로 읽힌다.
#    (그리고 `strimzi-system`·`redis-operator-system` 네임스페이스를 만들 이유도 생긴다.)
  - target: {group: argoproj.io, kind: Application, name: strimzi-operator}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: strimzi-operator, namespace: argocd}
      $patch: delete

  - target: {group: argoproj.io, kind: Application, name: redis-operator}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: redis-operator, namespace: argocd}
      $patch: delete

# ── rollouts-pullsecret → eks 오버레이 ────────────────────────────────────────
# 🔴 **이 PR 이 유발하는 것이라 같이 고친다.** `argo-rollouts` ns 를 만드는 순간 이 앱이
#    되살아나는데, 온프렘 경로면 `mp-harbor-pull` ExternalSecret 을 EKS 에 만들고
#    Secrets Manager 에서 `fb-secrets/harbor-pull` 을 찾다가 영원히 NotReady 가 된다.
# 🟢 `platform/rollouts/overlays/eks` 가 이미 그 ExternalSecret 을 제거하도록 준비돼 있다
#    (EKS 는 ECR + 노드 롤이라 dockerconfigjson 이 불요하다).
  - target: {group: argoproj.io, kind: Application, name: rollouts-pullsecret}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/rollouts/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/rollouts/overlays/eks

  # ══════════════════════════════════════════════════════════════════════════
  # CPU request 정직화 — kubecost (2026-08-14 실측)
  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 **실측**: 노드 2대 allocatable 7,840m 중 **request 로 7,380m(94%)** 를 잡고 있는데
  #    **실사용은 506m(6.5%)** 이었다. 14.6배다. 파드를 더 못 올리는데 CPU 는 논다.
  #
  # 🔴 **request 는 상한이 아니다** — 상한은 `limits` 다. 여기서 줄이는 것은
  #    ① 스케줄러 장부의 자리 ② 경합 시 몫, 둘뿐이고 **쓸 수 있는 양은 안 줄어든다.**
  #    finopsagent 는 차트 기본 `limits.cpu: 2` 가 그대로 살아 있다.
  #
  # 🔴 **온프렘은 건드리지 않는다(C-83)** — base 를 고치지 않고 여기서만 바꾸는 이유다.
  #    온프렘은 관측 창이 길고 값의 내력이 있다. EKS 는 어제 만들어졌다.
  #
  # ⚠️ **app·data 는 손대지 않았다.** 같은 실측에서 app 이 2,550m 예약 / 80m 사용(32배)으로
  #    가장 커 보이지만 **ALB 24시간 요청 수가 251건**이다(실측). 그 80m 은 "적정"이 아니라
  #    **무부하**다. 여기서 줄이면 A3 컷오버에 트래픽이 들어오는 순간 전부 모자라고,
  #    HPA(`Utilization` = 사용량 ÷ request)까지 함께 어긋난다.
  #    ⇒ app·data 재산정은 **A3 이후**, 트래픽이 있는 상태에서 한다.
  - target: {group: argoproj.io, kind: Application, name: kubecost}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: kubecost, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              finopsagent:
                resources:
                  requests:
                    cpu: 100m

  # 🔴 **반대 방향 — aggregator 는 올린다.** request 100m 인데 **실측 최대 147m** 로
  #    자기 예약을 넘겼다(관측 5시간). 경합이 생기면 가장 먼저 throttle 되는 파드가 된다.
  #    "전부 줄인다"가 아니라 **실측에 맞춘다**가 이 변경의 규칙이다.
  # ⚠️ `op: test` 로 base 값을 고정한다 — base 가 바뀌면 조용히 어긋나는 대신 렌더가 죽는다.
  - target: {group: argoproj.io, kind: Application, name: kubecost}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/aggregator/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/source/helm/valuesObject/aggregator/resources/requests/cpu
        value: 200m

# ── A5-b — KEDA 오퍼레이터에 IRSA 를 붙인다 (SQS 스케일러의 전제 · 2026-08-16) ──
# 🔴 **이게 없으면 SQS 스케일링이 인증 단계에서 죽는다.** 위 머리말이 *"keda 는 사이트 결합 값이
#    0 이라 패치할 것이 없다"* 고 적었는데, A5-b 로 **생겼다** — AWS 신원은 정의상 사이트 결합이다.
#
# 실측(2026-08-16): `keda-operator` 파드에 `AWS_ROLE_ARN` env 도 `aws-iam-token` 볼륨도 **없다**
#   ⇒ AWS SDK 기본 자격증명 체인이 **노드 인스턴스 롤**로 떨어진다.
#   그런데 `mp-crawl-scaler` 신뢰정책은 `sts:AssumeRoleWithWebIdentity` ·
#   sub=`system:serviceaccount:keda:keda-operator` **하나뿐**이라 노드 롤은 못 들어온다.
#   ⇒ 이 어노테이션이 그 신뢰정책이 이미 적어 둔 경로를 **실제로 열어 준다**.
#
# 🔵 그래서 TriggerAuthentication 쪽에는 `roleArn` 을 **적지 않는다** — 적으면 KEDA 가
#    "기본 자격증명으로 그 롤을 AssumeRole"(롤 체이닝)을 시도하는데, 기본 자격증명이 이미
#    `mp-crawl-scaler` 라 자기 자신을 맡으려 들고 self-trust 가 없어 다시 AccessDenied 다.
#    상세 = `pipelines/overlays/eks/triggerauth.yaml` 머리말.
#
# 🔴 폭발 반경 = `sqs:GetQueueAttributes` **한 액션 · 큐 3개.** KEDA 는 클러스터 전역
#    컴포넌트라 여기에 넓은 롤을 붙이면 안 된다 — 리파이너 롤(S3 읽기·**메시지 삭제** 포함)을
#    재사용하지 않고 전용 롤을 판 이유가 그것이다(app 레포 16d22e4).
# ⚠️ SA 어노테이션은 **파드 생성 시점에** 웹훅이 읽는다 — 이미 도는 오퍼레이터에는 반영되지
#    않는다. sync 후 `kubectl -n keda rollout restart deploy/keda-operator` 가 별도로 필요하다.
  - target: {group: argoproj.io, kind: Application, name: keda}
    patch: |-
      - op: add
        path: /spec/source/helm/valuesObject/serviceAccount
        value:
          operator:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-crawl-scaler

# ── policies-observability → overlays/eks (2026-08-16 · 감사 A-1·A-2) ────────
# 🔴 **이 Application 은 EKS 에서 `overlays/onprem` 을 보고 있었다** — 그래서 라이브의
#    observability ns 가 **온프렘용 정책 10개**로 통제됐고, 그중 `mp-minio-egress` ·
#    `mp-observability-minio-backup` 은 **C-18 로 EKS 에 존재하지도 않는 MinIO** 를 겨냥한
#    죽은 규칙이었다. 위 주석의 *"policies-observability 는 그대로 미착수"* 를 여기서 닫는다.
#
# 🟢 **선행이 끝났다** — `0-17`(egress 무제한 워크로드 잠금)·`0-18`(LAN ipBlock 재작성)이
#    eks 오버레이에 이미 쓰여 있고, 같은 커밋에서 app·data·pipeline·ingress 4트랙도 켰다.
#
# 🔴 **그리고 이 전환이 A-1 의 올바른 해법이다.** 대시보드 EC2(C-84) 접근 경로가 라이브에
#    **손으로만** 있었는데(NodePort 3 + netpol 3), 온프렘 오버레이에 넣으면 **온프렘까지
#    번져 C-83 위반**이 된다. eks 오버레이로 옮기면서 **거기** 넣는 것이 유일하게 맞는 자리다.
#    ⚠️ 그래서 이 패치와 `policies-observability/overlays/eks/dashboard-access.yaml` 은 **한 쌍**이다.
#       경로만 돌리고 그 파일이 없으면 **sync 하는 순간 대시보드가 관측 스택을 통째로 잃는다.**
  - target: {group: argoproj.io, kind: Application, name: mp-policies-observability}
    patch: |-
      - op: test
        path: /spec/source/path
        value: platform/policies-observability/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: platform/policies-observability/overlays/eks

# ── kubecost aggregator ServiceMonitor 를 우리 것으로 바꾼다 (2026-08-16 · 감사 F-4) ──
#
# 🔴 **증상** — `job="kubecost-aggregator"` 의 타깃 2개 중 하나가 **30시간 넘게 0/56** 이었다.
#    `kubecost-aggregator`(`tcp-api`) = 56/56 정상 / `kubecost-aggregator-clickhouse`
#    (`db-metrics` 9363) = **0/56**. `TargetDown` 이 영구 발화해 **진짜 장애를 가리는 소음**이 된다.
#
# 🔴 **원인은 우리 설정이 아니다** — 파드 안 `/proc/net/tcp` 실측상 9363 의 로컬 주소가
#    **`0100007F` = 127.0.0.1** 이다. 내장 ClickHouse 가 루프백에만 바인드하므로
#    **파드 밖에서는 원리적으로 닿을 수 없다.** 차트가 그 엔드포인트용 ServiceMonitor 를
#    같이 만들어 버리는 것이 문제다(온프렘도 2026-08-02 부터 같은 상태 — C-83 로 손대지 않는다).
#
# 🔴 **왜 선택자로 못 거르나** — 두 ServiceMonitor 의 라벨이 **완전히 동일하다**
#    (`app=aggregator` · `app.kubernetes.io/name=aggregator` · 같은 chart 라벨).
#    Prometheus 의 `serviceMonitorSelector` 로는 한쪽만 뺄 방법이 없다.
# 🔴 **차트에도 레버가 없다** — `helm show values kubecost 3.2.0` 에 ClickHouse `listen_host`
#    노출이 없고, 끄는 길은 `legacyMode: true`(= ClickHouse 자체를 안 씀 · 데이터 재적재 필요)뿐이라
#    자기 메트릭 하나 때문에 저장엔진을 바꾸는 것은 비례하지 않는다.
#
# 🟢 **그래서 차트 ServiceMonitor 를 끄고 살아 있는 엔드포인트만 우리가 정의한다.**
#    잃는 것 = ClickHouse 자기 메트릭(애초에 한 번도 수집된 적이 없다). 얻는 것 = 소음 제거.
#    🔵 **비용 데이터에는 영향이 없다** — 실측으로 확인했다(`/model/allocation?window=7d`
#       정상 응답 · 7일 합 $21.33). 이건 kubecost 저장엔진의 자기 상태 지표일 뿐이다.
#    ⚠️ 대체 ServiceMonitor 는 `platform/cluster-baseline/overlays/eks` 에 둔다(EKS 전용).
  - target: {group: argoproj.io, kind: Application, name: kubecost}
    patch: |-
      - op: test
        path: /spec/source/helm/valuesObject/aggregator/serviceMonitor/enabled
        value: true
      - op: replace
        path: /spec/source/helm/valuesObject/aggregator/serviceMonitor/enabled
        value: false

# ══ cnpg-operator · keda — 거대 CRD 재적용 실패 (2026-08-17) ═══════════════════
#
# 증상: 두 앱이 `Synced` + `Healthy` 인데 **마지막 sync 작업만 빨갛다.**
#   error when patching "/dev/shm/…": CustomResourceDefinition "clusters.postgresql.cnpg.io"
#   is invalid: metadata.annotations: Too long: may not be more than 262144 bytes
#
# 원인: CRD 실물이 **674KB(cnpg clusters) · 979KB(keda scaledjobs)** 다. 클라이언트 사이드 apply 는
#   전체 매니페스트를 `kubectl.kubernetes.io/last-applied-configuration` 어노테이션에 넣는데
#   그 한도가 256KB 라 **원리적으로 불가능**하다.
#   🔴 `ServerSideApply=true` 는 이미 켜져 있다. 그런데도 `/dev/shm/…` 를 patch 한다는 것은
#      ArgoCD 가 **SSA 에 실패해 CSA 로 되돌아갔다**는 뜻이다(필드 소유권 충돌이 유력 —
#      managedFields 에 `argocd-controller/Apply` 와 `kube-apiserver/Update` 가 공존한다).
#
# 왜 지금 드러났나: 온프렘의 같은 두 앱은 **2026-07-31 이후 sync 를 시도한 적이 없어** 초록으로 보인다.
#   사이트 차이가 아니라 **"실제로 apply 를 해봤느냐"** 의 차이다. 온프렘도 지금 sync 하면 같이 깨진다.
#   ⇒ 이건 EKS 전용 결함이 아니라 **아직 안 터진 공통 결함**이다(C-83 로 온프렘은 그대로 둔다).
#
# ── 🔴🔴 절대 쓰면 안 되는 처방 ────────────────────────────────────────────────
# 이 오류를 검색하면 `Replace=true` 또는 `Force=true` 가 먼저 나온다. **여기서는 금지다.**
#   `Replace=true` 는 실패 시 **삭제 후 재생성**으로 넘어갈 수 있고, `clusters.postgresql.cnpg.io`
#   CRD 를 지우면 **그 CRD 의 모든 Cluster 오브젝트가 캐스케이드로 삭제된다 = PG 전손.**
#   얻는 것(빨간 표시 제거)과 잃는 것(데이터베이스 전체)이 비교가 되지 않는다.
#
# ── 🟢 채택: `ApplyOutOfSyncOnly=true` ────────────────────────────────────────
# ArgoCD 는 기본적으로 **차이가 없어도 전 리소스를 다시 apply** 한다. 두 앱은 `automated`
# (prune·selfHeal)라 그 재적용이 주기적으로 돌고, 매번 이 CRD 에서 깨진다.
# 이 옵션은 **OutOfSync 인 것만** 적용하므로 이미 맞는 CRD 를 건드리지 않는다 → 실패가 사라진다.
# 🔵 위험 0 — apply **방식**이 아니라 **대상 선정**만 바꾼다.
#
# 🔴 **근본 해결은 아니다** — 차트를 올려 CRD 가 실제로 바뀌는 날에는 apply 대상이 되고 같은 오류가
#    다시 난다. 다만 그때는 **업그레이드라는 명확한 맥락에서** 시끄럽게 실패한다. 지금처럼
#    "아무것도 안 했는데 상시 빨간" 상태가 아니다. 그때의 정답은 SSA 충돌 해소이고,
#    **PG 가 걸린 변경이라 별도 창에서 다뤄야 한다.**
  - target: {group: argoproj.io, kind: Application, name: cnpg-operator}
    patch: |-
      - op: test
        path: /spec/syncPolicy/syncOptions/0
        value: ServerSideApply=true
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: ApplyOutOfSyncOnly=true
  - target: {group: argoproj.io, kind: Application, name: keda}
    patch: |-
      - op: test
        path: /spec/syncPolicy/syncOptions/0
        value: ServerSideApply=true
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: ApplyOutOfSyncOnly=true

# ── tempo OOMKilled — 밸러스트 제거 + GOMEMLIMIT (2026-08-17) ─────────────────
#
# 🔴 **차트 기본값 `memBallastSizeMbs: 1024` 가 2Gi limit 안에서 자해한다.**
#    Go 밸러스트는 «GC 를 덜 돌게 하려고 큰 덩어리를 미리 잡아 두는» 기법인데, GC 목표가
#    대략 `2 × (라이브힙 + 밸러스트)` 로 부풀어 **컨테이너 한도를 넘긴 뒤에야** 수집이 돈다.
#    Go 는 cgroup 한도를 스스로 모르기 때문이다. ⇒ 죽는 자리가 항상 같았다:
#      msg="Tempo started" → msg="completing block" → **OOMKilled(exit 137)**
#    실측 2026-08-17: 재시작 14회 · 5분 백오프. ArgoCD 는 `Progressing` 으로만 보여
#    **Degraded 가 아니라 알아서 낫지 않는다.**
#
# 🔵 밸러스트는 «RAM 이 넉넉한 전용 머신» 전제의 기법이라 cgroup 한도 아래서는 해롭다.
#    업스트림도 `GOMEMLIMIT`(Go 1.19+) 로 대체했다 — 그쪽은 **한도를 알고** 그 아래에서 GC 를 돈다.
#    ⇒ 밸러스트 0 + GOMEMLIMIT = 한도의 83%. 남은 17% 는 힙 밖(스택·mmap·고루틴)의 몫이다.
#    🔴 `memBallastSizeMbs: null` 이 아니라 **`0`** 이다 — 차트가 플래그를 항상 렌더하므로
#       null 이면 `-mem-ballast-size-mbs=` 로 값이 비어 기동이 깨진다(렌더로 확인함).
#
# ⚠️ limit 2Gi → 3Gi 는 **소폭 병행**이다(사용자 판정). 근거와 한계를 같이 적는다 —
#    이 노드(`ip-10-10-82-223`)는 memory limit 합이 **17.8Gi / allocatable 14.3Gi = 124%**
#    오버커밋이다. 실사용은 58% 라 지금은 견디지만 **limit 상향은 공짜가 아니다.**
#    (2026-08-17 이전 실측 179% 에서 내려온 값이다.) 근본 해소는 밸러스트 쪽이고 3Gi 는 여유다.
#
# 🔴 온프렘은 건드리지 않는다(C-83) — 그쪽 tempo 는 15일 무사고이고 밸러스트 기본값 그대로다.
#    같은 증상이 나면 그때 같은 처방을 **온프렘 오버레이에** 따로 넣는다. base 로 올리지 말 것.
#
# 🔴 이걸로도 CrashLoop 가 안 풀리면 다음 조치는 **PVC 재생성**이다(2026-08-17 선례).
#    selfHeal 이라 replicas 0 이 즉시 되돌아오고 CrashLoop 라 exec 도 안 되므로
#    PVC 삭제 + 파드 삭제가 유일한 경로다. 잃는 것은 로컬 WAL 뿐 — S3 블록은 무사하다.
  - target: {group: argoproj.io, kind: Application, name: tempo}
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: tempo, namespace: argocd}
      spec:
        source:
          helm:
            valuesObject:
              tempo:
                memBallastSizeMbs: 0
                extraEnv:
                  - name: GOMEMLIMIT
                    value: "2560MiB"
                resources:
                  limits:
                    memory: 3Gi
