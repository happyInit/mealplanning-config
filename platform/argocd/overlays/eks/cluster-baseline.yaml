# cluster-baseline — EKS 사이트 전용 child Application (0-3, 2026-08-13).
#
# 담는 것 = 어떤 워크로드에도 속하지 않는 클러스터/네임스페이스 베이스라인:
#   PriorityClass 3 · Namespace 5(PSA 라벨) · ResourceQuota 2 · LimitRange 3.
# 온프렘에서는 전부 **Ansible 소유**(ArgoCD 밖)이고 C-83 으로 동결이다 — 그래서 이 Application 은
# base 가 아니라 **eks 오버레이에만** 등록한다. 온프렘 `platform-root` 는 이 파일을 영원히 안 본다.
# 트랙 본문·근거 = `platform/cluster-baseline/`(그 `base/kustomization.yaml` 이 "왜 비어 있나"를 적어 뒀다).
#
# ── 🔴 sync-wave = -10 (가장 먼저) ────────────────────────────────────────────
# ArgoCD 는 Application 사이의 순서를 보장하지 않는다. 이 트랙이 늦으면:
#   · Namespace 없음   → 다른 Application 이 "namespace not found" 로 sync 실패
#   · PriorityClass 없음 → 파드가 Pending 도 아니고 **admission 에서 거부**
#     (`no PriorityClass with name app-normal was found`) → ReplicaSet 이 조용히 못 만든다.
#     실측 참조 규모 = config 매니페스트 56곳 / 라이브 파드 76개(priorityclasses.yaml 머리말)
# wave 는 같은 root 가 만드는 child 들 사이에서만 유효하다 — `platform-root` 소관 21개에 대해서는
# 이 값이 먹지만, `mealplanning-root` 의 앱 23개와는 **순서 보장이 없다.**
# 🔴 그래서 이관 당일 절차상 **이 Application 을 먼저 수동 sync** 한 뒤 나머지를 올린다.
#
# ── 🔴 앱 레포(Ansible) 선행 — 없으면 sync 가 거부된다 ────────────────────────
# 실측 2026-08-13 `AppProject/platform`:
#   destinations: observability · kube-system · data · cnpg-system · elastic-system ·
#                 strimzi-system · redis-operator-system · keda · argo-rollouts
#     → 🔴 **`app` · `pipeline` · `mp-ingress` 없음** (ResourceQuota·LimitRange 목적지)
#   clusterResourceWhitelist: ClusterRole · ClusterRoleBinding · CRD ·
#                 ValidatingWebhookConfiguration · MutatingWebhookConfiguration · APIService
#     → 🔴 **`""/Namespace` · `scheduling.k8s.io/PriorityClass` 없음**
# 둘 중 하나만 빠져도 "destination is not permitted" / "resource not permitted in project" 다.
# descheduler·mp-ingress 가 정확히 이 방식으로 이미 한 번씩 죽었다.
#
# ⚠️ 대안 판단 — `mealplanning` 프로젝트로 보내면 app·pipeline·mp-ingress destination 은
#    이미 있지만(실측) 그쪽은 **clusterResourceWhitelist 가 비어 있어** PriorityClass·Namespace 가
#    통째로 막힌다. 어느 쪽이든 AppProject 수정이 필요하고, 플랫폼 성격이므로 `platform` 을 골랐다.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-cluster-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/cluster-baseline/overlays/eks
  destination:
    server: https://kubernetes.default.svc
    # 🔴 이 값은 **metadata.namespace 가 없는 오브젝트에만** 적용된다. 여기 리소스는
    #    클러스터 스코프(Namespace·PriorityClass)이거나 자기 ns 를 직접 갖고 있어서(RQ·LR)
    #    실질적으로 쓰이지 않는다. 그래도 필수 필드라 무해한 값을 둔다.
    namespace: kube-system
  syncPolicy:
    automated:
      # 🔴 prune:false — Namespace 를 prune 하면 그 안의 전부를 데려간다. PriorityClass 를
      #    prune 하면 전 워크로드가 admission 에서 막힌다. 자동 삭제를 허용할 트랙이 아니다.
      #    (오브젝트마다 `sync-options: Prune=false` 도 따로 걸어 뒀다 — 이중 방어.)
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
