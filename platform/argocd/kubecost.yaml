# Kubecost 3.2.0 — 플랫폼 child Application (정본 = 이 파일).
#
# 서버에 설치된 기존 Argo CD가 이 Application을 읽어 Kubecost를 설치·관리한다.
# 별도의 Argo CD 설치 리소스나 AppProject 변경은 포함하지 않는다.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # YAML 한 파일만으로 배포하기 위해 현재 전체 권한이 허용된 default 프로젝트를 사용한다.
  project: default
  source:
    repoURL: https://kubecost.github.io/kubecost/
    chart: kubecost
    targetRevision: "3.2.0"
    helm:
      releaseName: kubecost
      valuesObject:
        global:
          clusterId: mealplanning-k8s
          defaultStorageClass: openebs-lvm

        # 자동 workload 변경 기능은 초기 설치에서 사용하지 않는다.
        clusterController:
          enabled: false

        # 온프레미스 1차 설치에서는 클라우드 청구 연동을 사용하지 않는다.
        cloudCost:
          enabled: false

        # 기본 비용 수집을 안정화한 뒤 필요할 때 활성화한다.
        forecasting:
          enabled: false

        # Cilium·Istio·PSS 검증 후 별도로 활성화한다.
        networkCosts:
          enabled: false
          serviceMonitor:
            enabled: false

        localStore:
          enabled: true
          # ~~Aggregator의 LocalPV와 합치면 A1 용량을 초과하므로 B2로 분리한다.~~
          # → **a2 로 이전 (2026-07-31)**. 이 32Gi 가 b2 의 openebs-vg 여유를 48Gi → 16Gi 로
          #   줄였고, 그 탓에 Kafka 브로커 재배치(20Gi PVC)가 b2 에서 막혔다(실사고). 데이터
          #   티어 노드(a1·b1·b2)를 비용 도구에서 비우고, 오늘 합류해 통째로 비어 있는 a2
          #   (메모리 9.4Gi · VG 150Gi)로 kubecost 를 모은다.
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-a2
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          persistentVolume:
            enabled: true
            storageClass: openebs-lvm
            size: 32Gi

        aggregator:
          enabled: true
          # ~~192.168.0.20 = k8s-worker-a1. DB 64Gi + 설정 1Gi는 A1의 현재 VG 여유 약 89Gi 안에 들어간다.~~
          # 🔴 **스토리지만 보고 정한 배치라 메모리에서 막혔다** — a1 은 VG 여유 89Gi 는 맞았지만
          #    메모리 여유가 2,423Mi 뿐이라 이 3Gi 요청이 131분간 Pending 이었다(알람 3건 상시 발화).
          #    ⚠️ 노드 여유는 `describe node` 의 Allocated resources 로 볼 것 — `spec.containers` 만
          #    합산하면 **Istio 네이티브 사이드카**(K8s 1.34+Istio 1.30 은 istio-proxy 를
          #    restartPolicy=Always 인 initContainer 로 띄운다)가 빠져 a1 에서 672Mi 를 과소계상한다.
          # → **a2 로 이전 (2026-07-31)**: 메모리 9,381Mi · VG 150Gi 여유. 작성 시점엔 a2 가 없었다.
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-a2
          retention1d: 30
          retention1h: 14
          retention10m: 7
          persistentConfigsStorage:
            storageClass: openebs-lvm
            storageRequest: 1Gi
          aggregatorDbStorage:
            storageClass: openebs-lvm
            storageRequest: 64Gi
          resources:
            requests:
              cpu: 100m
              memory: 3Gi
          # Aggregator와 내장 ClickHouse 상태를 기존 Prometheus가 수집한다.
          serviceMonitor:
            enabled: true
            interval: 1m
            scrapeTimeout: 10s

        finopsagent:
          enabled: true
          # ~~A1은 Aggregator 3Gi를 위해 비운다 … FinOps Agent는 B2로 고정한다.~~
          # → **a2 로 이전 (2026-07-31)**. a2 여유가 커서 Aggregator 와 자리를 다투지 않는다
          #   (3,072 + 512 + 256 + frontend ≈ 4Gi / 9,381Mi). b2 의 요청률(80%)도 함께 내려간다.
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-a2
          # 비용·allocation 메트릭을 기존 kube-prometheus-stack/Grafana에 편입한다.
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              namespace: observability
              interval: 1m
              scrapeTimeout: 10s
              # 기존 kube-state-metrics와 중복되는 KSMv1 복사본만 외부 수집에서 제외한다.
              metricRelabelings:
                - action: drop
                  sourceLabels:
                    - __name__
                  regex: "kube_.*"
          agent:
            collectorDataSource:
              enabled: true
              scrapeInterval: 60s

        frontend:
          enabled: true
          # 요청량이 작아 Aggregator와 함께 배치한다 — **a2 로 이전 (2026-07-31)**.
          nodeSelector:
            kubernetes.io/hostname: k8s-worker-a2

        telemetry:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cost

  syncPolicy:
    automated:
      # Git 파일 삭제가 StatefulSet/PVC 삭제로 바로 번지지 않게 한다.
      prune: false
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
