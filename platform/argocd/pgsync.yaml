# PGSync + redis-pgsync — T-3 stable alias 전환 완료, PGSync replicas=1 상시 CDC.
# stock bootstrap 같은 lifecycle 작업은 ops/pgsync-stable-alias/ 수동 런북으로만 실행한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgsync
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/pgsync
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  # 🔴 automated 없음 = manual sync (런북 Q8) — P2 기간 데이터 CR 은 사람이 sync 를 누른다.
  #    selfHeal 이 있으면 전환창의 promote(수동 CR 조작·T-1 장전 커밋)가 몇 초 만에 리버트된다(§9-3).
  #    automated 승격은 P3.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
