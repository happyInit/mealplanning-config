# observability ns 보안 정책(NetworkPolicy default-deny) — 플랫폼 child Application.
#
# 🔴 **플랫폼 트랙에 있는 이유**(2026-08-03 — 처음엔 `argocd/applications/` 에 뒀다가 옮겼다):
#    app·data·pipeline 정책 3종은 `mealplanning` 프로젝트인데, 그 AppProject 의
#    destinations 는 **app·data·pipeline 뿐이다**. observability 를 목적지로 쓰면
#    ArgoCD 가 sync 를 거부한다("destination is not permitted"). observability 를 허용하는
#    프로젝트는 `platform` 이고, 그 root 가 보는 디렉터리가 여기다.
#    → 관측 스택 정책은 앱 트랙이 아니라 **플랫폼 트랙 소관**이다. 옮기지 말 것.
#
# 🔴 syncPolicy.automated 를 일부러 안 켠다 = 수동 sync (같은 트랙의 다른 앱들과 다르다).
#    관측 스택을 잘못 끊으면 **끊겼다는 사실을 알려줄 수단이 같이 죽는다** —
#    Grafana 는 화면이 비고 타깃은 DOWN 이 되는데, 그 알람을 쏘는 게 바로 그 Prometheus 다.
#    "머지 = 강제 적용"이 되면 안 되고, 리소스 하나씩 sync 하며 눈으로 확인한다.
#    확인 절차 = platform/policies-observability/kustomization.yaml 머리말 ①②③.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-policies-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # 없으면 Application 삭제해도 리소스가 유령으로 남음
spec:
  project: platform
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/policies-observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
