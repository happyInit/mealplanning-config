apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-8 `spec.storage.class` → **gp3-retain** (아래 patch · 0-8b 판정 = Retain)
#    - C-16 용량 **20Gi → 10Gi**(실측 110 MB 는 정상상태 · 30일 환산 356 MB) — 미착수
#    - 0-6 🔴 **kafka-combined 가 정족수를 TSC 로 잡은 유일한 워크로드**다. Strimzi 는 StrimziPodSet 이라
#      `kubectl get sts` 스캔에서 사라진다 — 집계는 파드 레벨로 할 것
#    - C-21 브로커 **AZ 당 1개** · C-10 = MSK 미채택, Strimzi 자체운영 유지
#    - C-11/C-12/C-13 MM2(정방향 1개·AWS 배치·소스 별칭 onprem)는 **새 리소스**라 eks 전용 추가분이다
#    - ✅ 0-6 hostname 축 hard → ScheduleAnyway · ✅ 0-27 CPU 250m → 150m (아래)
resources:
  - ../../base

# ── 0-6 hard TSC 완화 + 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────
#
# ▸ 0-6 — `kubernetes.io/hostname` 축만 ScheduleAnyway 로 내린다. **zone 축은 DoNotSchedule 유지.**
#
#   🔴 EKS 에서 hostname 축은 **증명 가능하게 잉여**다. C-29 가 노드 형상을 `m7g.xlarge` × 3 ·
#      **AZ 당 1대**로 확정했으므로 zone 도메인과 hostname 도메인이 1:1 이다 — zone 축이 maxSkew 1 ·
#      DoNotSchedule 로 "AZ 당 정확히 1개"를 이미 강제하는데, AZ 당 노드가 1대뿐이니 두 파드가
#      같은 노드에 앉는 것 자체가 불가능하다. hostname 축이 막아 주는 것이 **0건**이다.
#
#   🔴 그런데 위험은 0 이 아니다. Karpenter NodePool(C-29 층2, BG 버스트 전용)이 어느 AZ 에 노드를
#      한 대 더 띄우면 그 순간 1:1 이 깨지고, hostname 축이 hard 인 채로 남아 있으면 **파드가
#      갈 수 있는 노드가 있는데도 Pending** 이 나는 조합이 생긴다. combined 는 controller+broker 라
#      한 파드의 Pending 이 KRaft 정족수 3중 1 상실이다 — 잉여 제약 때문에 감수할 값이 아니다.
#
#   🔴 온프렘에서는 반대로 **hard 를 유지해야 한다**(그래서 base 를 안 건드린다). 온프렘은 zone 2 ·
#      워커 4대라 1:1 이 아니고, base 주석의 실사고(zone spread 는 만족했는데 combined-0·combined-2 가
#      **둘 다 k8s-worker-b1**)가 정확히 그 비대칭에서 났다.
#
# ▸ 0-27 — CPU 250m × 3 = 750m → 150m × 3 = 450m. Kafka 는 우리 볼륨에서 대기가 대부분이고
#   (실측 클러스터 전체 실사용 1.145 코어) CPU limits 가 없어(§13.7) 리텐션 압축·리밸런스 버스트는
#   그대로 위로 뚫는다. 메모리(1Gi req==limit)는 건드리지 않는다.
#
# ⚠️ 인덱스 패치다. base 의 TSC 순서는 [0]=zone · [1]=hostname 이다. 순서를 바꾸면 여기도 같이 고칠 것.
# ── 0-8 StorageClass = gp3-retain · ✅ 0-8b 판정 (2026-08-13) ──────────────────
# 🔴 SC 는 EBS CSI 애드온이 자동 생성하지 않는다(EKS 빌트인은 `gp2` 하나뿐).
#    → ✅ **해소(0-8e)** = `platform/cluster-baseline/overlays/eks/storageclasses.yaml` 가
#      `gp3`(Delete) · `gp3-retain`(Retain · default) 2종을 만든다. Terraform 이 아니라 config 소유다.
# 🔴 EBS 는 AZ 에 묶인다 — PV 에 `topology.ebs.csi.aws.com/zone` nodeAffinity 가 박혀서
#    브로커 파드는 그 AZ 를 벗어나 못 뜬다. C-21(AZ 당 1개)과 같은 제약이고, AZ 상실 시
#    해당 브로커는 **결정론적 Pending** 이다(RF=3 이므로 클러스터는 산다).
#
# ⚠️ **Kafka 는 셋 중 이득이 가장 작다** — `deleteClaim:false` 로 오퍼레이터가 이미 막고 있어서
#    CR 삭제가 데이터 삭제로 번지지 않는다. 그래도 `gp3-retain` 을 쓰는 이유는 두 가지다:
#      ① `deleteClaim` 은 **Kafka CR 안의 값**이라 CR 을 손대는 실수와 같은 축에 있다.
#         PVC 를 사람이 직접 지우는 경로는 여전히 열려 있고, 그건 SC 만 막는다.
#      ② 온프렘 IaC 주석의 의도가 "PG·ES·**Kafka** = Retain" 이다 — EKS 에서 셋 중 하나만
#         빼면 "왜 얘만?" 을 나중에 아무도 답하지 못한다. 비용은 10Gi × 3 = 월 $2.40.
# 🔴 **단, 이 트랙이 EKS 에 뜨는지 자체가 미결이다** — C-3 은 Kafka 3 브로커를 온프렘 크롤
#    프로덕션에 남기고, C-44 는 EKS 쪽 운반을 S3/SQS 로 바꾼다. 그런데 C-16 PVC 표에는
#    Kafka 10Gi × 3 이 EKS 몫으로 잡혀 있다. **표와 결정이 어긋난 상태다**(0-8e 레인 발견).
#    이 오버레이는 "뜨게 된다면" 의 값이고, 안 뜨면 무해하다.
patches:
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: combined
    patch: |-
      - op: replace
        path: /spec/template/pod/topologySpreadConstraints/1/whenUnsatisfiable
        value: ScheduleAnyway
      - op: replace
        path: /spec/resources/requests/cpu
        value: 150m

  # 🔴 **같은 오브젝트인데 patches 항목이 둘인 이유 = 패치 방언이 다르다.**
  #    위는 JSON6902(op 목록), 아래는 merge 패치(매핑)다. kustomize 의 한 `patch:` 문자열은
  #    둘 중 하나여야 해서 **한 블록으로 못 합친다.** 두 항목은 순서와 무관하게 각각 적용되고,
  #    건드리는 필드가 겹치지 않는다(TSC·CPU ↔ storage.class).
  #    ⚠️ 합치려고 아래를 op 목록으로 옮겨 적지 말 것 — `spec.storage` 가 jbod(리스트)로 바뀌면
  #       인덱스 경로가 조용히 엉뚱한 곳을 가리킨다. 매핑 패치는 그 형태 변화에 영향받지 않는다.
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: combined
    patch: |-
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: combined
      spec:
        storage:
          class: gp3-retain
