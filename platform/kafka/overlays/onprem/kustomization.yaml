apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── 온프렘 사이트 오버레이 ─────────────────────────────────────────────────────
# 🔴 여기에 넣을 것 = **온프렘에서만 참인 값**. AWS 이관(C-3)으로 온프렘은 DR 대기 사이트 +
#    크롤 프로덕션으로 **계속 살아 있다** — 그래서 온프렘 전용 설정은 지우는 게 아니라
#    base 에서 이쪽으로 내려야 한다:
#    - ✅ nodepool.yaml `spec.storage.class: openebs-lvm` — 0-8, 아래 patch
#      (🔴 키가 `class` 라 `storageclass` 정규식에 안 걸린다)
#    - hard TSC 3 (zone 축) — 0-6 (미착수)
resources:
  - ../../base

# ── 0-8 StorageClass ───────────────────────────────────────────────────────────
# base 에서 뺀 값을 여기서 되돌린다. **렌더 결과는 base 에 있던 때와 같아야 한다**(라이브 무변화).
# `spec.storage` 는 맵(type: persistent-claim)이라 merge patch 로 안전하게 키 하나만 얹힌다.
# 🔴 Kafka 는 `deleteClaim: false` 라 오퍼레이터가 PVC 삭제를 막아준다 — 0-8b 의 노출도가
#    PG·ES 와 다르다(SC 가 Delete 여도 CR 삭제로 데이터가 즉사하지는 않는다).
patches:
  - target:
      group: kafka.strimzi.io
      version: v1
      kind: KafkaNodePool
      name: combined
    patch: |-
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: combined
      spec:
        storage:
          class: openebs-lvm
