# Kafka (Strimzi) — 4.3.0 · KRaft combined 3 (런북 §1.1·§1.1.1 · Q6 · status §2.1).
#
# 🔴 CRD `v1` 전용(Strimzi 1.1.0) — 웹의 v1beta2 예제 붙여넣기 금지.
# 🔴 replicas·storage 는 여기 없다 — KafkaNodePool 로 갔다(§9-19 — nodepool.yaml).
# 🔴 auto.create.topics.enable=false 는 사고 이력 기반 필수(2026-07-20 자동생성이
#    create_topics.py 를 무력화한 1파티션 사고) — 토픽 생성 유일 경로 = topics.yaml (KafkaTopic).
# 무인증 PLAINTEXT = 결정(Q6) — 암호화는 WireGuard, 접근제어는 NetworkPolicy(platform/policies 연기 메모).
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka # bootstrap Service = kafka-kafka-bootstrap.data.svc:9092
  namespace: data
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        # 보안 ③ 티어3-4 — 9092(클라이언트 plain 리스너)를 최소권한으로 조인다. 미설정이면 Strimzi 가
        # 9092 를 클러스터 전체에 개방한다(Redis/ES/PG 와 달리 default-allow 잔존) → 아래로 소스 특정.
        # 🔴 Strimzi 는 이 값으로 kafka-network-policy-kafka 의 9092 ingress 만 바꾼다(broker 9090/9091·
        #    operator 8443·exporter 는 자동 유지) → broker 롤링재시작 없음(netpol 리소스만 갱신).
        # 클라이언트(실측): app backend·pipeline 컨슈머/프로듀서(KAFKA_BOOTSTRAP :9092) + KEDA 스케일러(lag 폴링).
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: app
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: pipeline
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: keda
    config:
      auto.create.topics.enable: "false"
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {} # KafkaTopic CR 반영 주체 — 없으면 topics.yaml 이 장식이 된다
  kafkaExporter: {} # Q9 — 현행 kafka-exporter 와 동일 지표(kafka lag 알림 규칙 무수정의 전제)
