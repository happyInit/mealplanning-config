apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kafka(Strimzi) CR 본문. child app = platform/argocd/kafka.yaml (수동 sync).
# 🔴 디렉터리형 → kustomize 변환(0-1, 2026-08-09). 배경·주의는 platform/es/base/kustomization.yaml 머리말과 동일.
#    - 여기 등록 안 한 yaml 은 배포 안 된다
#    - `namespace:` 미지정 = 재구성 전 렌더와 동일 유지(매니페스트가 ns=data 를 직접 갖는다)
resources:
  - kafka.yaml      # Kafka CR (KRaft, RF=3)
  - nodepool.yaml   # KafkaNodePool combined — 🔴 스토리지 SC 는 `spec.storage.class`(0-8) · hard TSC 3(0-6)
  - topics.yaml     # KafkaTopic 5종
  - monitoring.yaml # PodMonitor
