# Tempo 조회(query)용 NodePort — Operations AI 대시보드 EC2 전용.
# 근거는 mp-loki-nodeport와 같다(Helm 차트에 nodePort 고정 지정 필드가 없음).
# 🔴 selector는 라이브 `tempo` Service에서 실측(2026-08-14) 그대로 가져왔다.
# 🔴 포트 3200만 노출한다 — OTLP(4317/4318)·jaeger 등 수신용 포트는 이 EC2가 쓸 일이 없다
#    (조회 API만 필요하다). 불필요한 포트를 열지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: mp-tempo-nodeport
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/name: tempo
  ports:
    - name: query
      port: 3200
      targetPort: 3200
      protocol: TCP
      nodePort: 30093 # kubecost(30090)·prometheus(30091)·loki(30092)와 안 겹치는 다음 번호
