apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
# 보안 정책 묶음. child app = argocd/applications/policies.yaml (mp-policies, 수동 sync).
# README.md 는 kustomize 가 무시(리소스 아님).
resources:
  - peerauthentication.yaml
  # 보안 ③ NetworkPolicy default-deny — frontend→backend→data→pipeline 순(계획). 티어별로 파일 추가·sync·Hubble 검증.
  - netpol-frontend.yaml            # 티어 1: frontend (default-deny, ingress=GW+probe / egress=DNS+istiod)
  - netpol-backend.yaml             # 티어 2: backend 공통 (GW+intra-app+probe / data+DNS+istiod+intra-app)
  - netpol-operations.yaml          # 티어 2 부록: operations cross-ns ↔ observability(Alertmanager/Prometheus)
  - netpol-backend-fqdn.yaml        # 티어 2 부록: account→OAuth · ocr/chat→Gemini FQDN (CiliumNetworkPolicy)
  # 티어 0 진입점 — 위 셀렉터(tier=backend/frontend·app=operations) 어디에도 안 걸려 무정책이던 3파드.
  #   둘 다 egress 전용이다: 입구를 ingress 로 잠그면 유입 소스(노드·LAN·cloudflared)를 하나만
  #   빠뜨려도 공개 서비스가 전면 불가가 된다. ingress 는 default-deny 베이스라인과 함께 별건.
  - netpol-gateway.yaml             # 티어 0: 공개 GW egress (DNS·istiod·backend·frontend·tempo)
  # 🔴 cloudflared 용 CiliumNetworkPolicy(netpol-cloudflared.yaml)는 **철회했다** — 2026-08-04 적용 중
  #    약 50초간 app.mealbong.cloud 가 502 였다(터널 전멸 → 삭제 + 파드 재기동으로 복구).
  #    증상: `failed to dial to edge with quic: timeout: no recent network activity` — 엣지 IP 로 나가는
  #    패킷이 통째로 드롭됐다. 유력 원인 = Cilium toFQDNs 는 **정책이 걸린 뒤 관측한 DNS 응답의 IP만**
  #    허용하는데, 그 파드는 27시간째 떠 있어 엣지 IP 를 이미 해석·보유한 상태였다. 학습된 매핑이 0인
  #    채로 정책이 붙어 전부 막혔다. (netpol-backend-fqdn.yaml 의 "앱이 클러스터 DNS 를 써야 성립"과
  #    같은 계열이지만, 거기 앱들은 요청마다 재해석하는 반면 cloudflared 는 상주 커넥션이라 다르다.)
  #    재도입 조건 = 정책 적용과 **파드 재기동을 한 묶음**으로 하고(정책 하에서 재해석시킨다),
  #    저트래픽 시간대에 롤백 명령을 손에 쥔 채 검증할 것.
  # 티어 3 data → 티어 4 pipeline 이 순서대로 추가된다.
  # 🔴 data·pipeline 대상 netpol 은 그 ns 로 가야 하므로(이 kustomization 은 namespace:app 강제) 그때 별도 배치.
