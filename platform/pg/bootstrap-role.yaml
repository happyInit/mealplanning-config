# Stable-alias PGSync 전환(T-5) 전용 일회성 bootstrap identity — mp-pgsync-bootstrap.
# mp-pgsync-bootstrap single role 로 stock PGSync bootstrap 을 정확히 한 번 실행했다.
# bootstrap 완료 후 PARK 상태: 로그인·복제 차단, membership 없음, password 비활성.
# 이후 실제 schema bootstrap 시에만 이 파일에서 login/replication/inRoles/passwordSecret 을
# 다시 활성화(위 주석에 기록된 구조 대로) 하고 사용 후 재차 park 한다.
#
# bootstrap 활성화 재현 절차:
#   login: true, replication: true, connectionLimit: 10,
#   inRoles: [fbapp, pgsync],
#   passwordSecret: { name: mp-pgsync-bootstrap-db } (+ 인클러스터 Secret 재생성)
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: mp-pgsync-bootstrap
  namespace: data
spec:
  cluster:
    name: pg
  name: mp-pgsync-bootstrap

  login: false
  replication: false
  inherit: true

  disablePassword: true

  superuser: false
  createdb: false
  createrole: false
  bypassrls: false
  connectionLimit: 1

  inRoles: []

  databaseRoleReclaimPolicy: retain