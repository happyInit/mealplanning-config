# T-3 stable-alias 전환 전용 bootstrap identity — mp-pgsync-bootstrap.
# stock PGSync bootstrap 이 요구하는 두 권한을 한시적으로 합친다:
#   · fbapp/pgsync membership(INHERIT) = table owner + PGSync object 권한
#   · REPLICATION                    = logical slot 생성/삭제
# table owner 변경과 superuser 사용은 금지한다.
#
# 평상시는 아래 PARK 상태가 정본이다(NOLOGIN/NOREPLICATION/NO membership/password NULL).
# 재활성화와 사후 봉인은 ops/pgsync-stable-alias/README.md 절차만 따른다. 특히 CNPG CRD에서
# disablePassword:true 와 passwordSecret 은 상호 배타다. 활성화할 때 disablePassword 필드를
# **삭제**하고, kubernetes.io/basic-auth Secret(username+password)을 먼저 만든 뒤 아래를 설정한다:
#   login:true, replication:true, connectionLimit:10, inRoles:[fbapp, pgsync],
#   passwordSecret:{name: mp-pgsync-bootstrap-db}
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: mp-pgsync-bootstrap
  namespace: data
spec:
  cluster:
    name: pg
  name: mp-pgsync-bootstrap
  comment: "T-3 PGSync stable-alias bootstrap; keep parked outside a maintenance window"

  login: false
  replication: false
  inherit: true

  disablePassword: true

  superuser: false
  createdb: false
  createrole: false
  bypassrls: false
  connectionLimit: 1

  inRoles: []

  databaseRoleReclaimPolicy: retain
