# 0-13 — 서비스별 PG 롤의 **비밀번호 배선** (EKS 전용)
#
# 앱 레포 `docs/prd/schema-roles.md §4.3 ②` 의 매니페스트를 그대로 옮긴 것이다.
# 역할 분담(§4.1):
#   · 롤 존재 · LOGIN · **비밀번호** · connectionLimit · 그룹 멤버십 → CNPG `Cluster.spec.managed.roles`
#                                                                    (kustomization.yaml 의 patch)
#   · 스키마·테이블 GRANT                                          → `schema-roles.sql`(사람이 psql 로 1회)
#
# 🔴 **온프렘에는 이 파일이 없다 — C-83.** 온프렘 PG 는 `fbapp` 단독 그대로 두고 권한을 회수하지
#    않는다. 회수하면 라이브 앱 11종이 즉사한다. AWS PG 만 처음부터 갈라서 짓는다.
#
# 🔴 CNPG 는 `kubernetes.io/basic-auth` 타입을 요구한다(그냥 Opaque 면 롤이 조용히 reconcile 안 된다).
#    `username` 은 template 에 리터럴로 박는다 — 비밀이 아니고, Secrets Manager 왕복을 하나 줄인다.
#
# 🔴 원격 키 = `pg-roles` **한 개**에 12 property. `app-secrets` 에 넣지 않는다.
#    ⟳ **2026-08-13 정정** — 원래 근거는 *"app-secrets 가 이미 SSM standard 4,096 B 의 82.6%"* 였다.
#      **C-36 으로 백엔드가 Secrets Manager(64KB)가 되어 그 근거는 소멸했다.**
#    🔴 **그래도 분리는 유지한다** — 남는 근거가 더 중요하다: **폭발 반경 분리**.
#      `app-secrets` 는 app·mp-ingress·observability 3 ns 의 16객체를 받치는데, PG 롤 비밀번호는
#      CNPG 만 쓴다. 한 번들에 넣으면 IAM 경로 최소권한이 번들 단위라 **CNPG 비밀을 읽을 권한과
#      앱 비밀을 읽을 권한을 갈라놓을 수 없다.** 회전 시 새 버전이 생기는 범위도 같이 넓어진다.
#    ⚠️ property 이름에 `.` 금지(AWS provider 가 gjson 경로로 읽는다 — SITES.md §0-2).
#
# 🔴 **값 적재는 이 레포 밖이다.** `mp/prod/pg-roles` 에 12키 JSON 을 넣는 것은 사람/Terraform
#    소관이고, 없으면 ExternalSecret 이 SecretSyncedError 로 앉아 **CNPG 가 롤을 못 만든다.**
#    32자 랜덤 12개 — 온프렘 `fbapp` 이 8바이트인 것과 달리 처음부터 회전 가능한 길이로 짓는다.
#
# `secretStoreRef` 는 kustomization.yaml 의 전수 패치가 `mp-aws-secrets` 으로 덮는다(0-2). 여기도
# 같은 값을 적어 파일만 봐도 읽히게 했다 — 두 값이 갈리면 validate.py check_eks_secret_store() 가 잡는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pg-role-account
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: mp-aws-secrets}
  target:
    name: mp-pg-role-account
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: svc_account
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: pg-roles, property: svc_account}
