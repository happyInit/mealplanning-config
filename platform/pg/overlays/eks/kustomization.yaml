apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - ✅ 0-8 SC 2곳 → **gp3-retain** (아래 patch · 0-8b 판정 = Retain)
#    - C-15 CNPG 유지(RDS/Aurora 미채택) · C-21 **인스턴스 2 → 3**(AZ 당 1개) — 미착수
#    - C-16 용량 **20Gi → 10Gi · WAL 10Gi → 4Gi**(AZ 당 1개 × 3) — 미착수
#    - 0-13 스키마별 롤(현재 단일 슈퍼유저) 이 IRSA 의 전제
#    - objectstore.yaml 자격증명 = 0-16(정적 키 제거 → IRSA)
#    - C-15 CNPG 유지(RDS/Aurora 미채택) · C-21 **인스턴스 2 → 3**(AZ 당 1개)
#    - 0-13 스키마별 롤(현재 단일 슈퍼유저) 이 IRSA/Pod Identity 의 전제
#    - ✅ objectstore.yaml 자격증명 = 0-16 (2026-08-10, IRSA `inheritFromIAMRole` — 아래 patches)
#    - onsite-backup.yaml 은 온프렘 전용(MinIO 목적지). C-18 = barman 과 **다른 버킷/계정**
#    - ✅ 0-27 CPU 요청 500m → 250m (인스턴스당) — 아래
#    - ✅ 0-13 스키마별 롤 — 2026-08-13, 아래 `managed.roles` + `pg-roles.yaml`
#    - ✅ 0-23 · 0-30 barman 경로 사이트 분기 — 아래 patch (destinationPath·serverName = `pg-eks`)
resources:
  - ../../base
  - pg-roles.yaml # 0-13 — 서비스 롤 12종의 비밀번호 배선(EKS 전용)
  - serviceaccount.yaml # 0-14c 잔여분 — mp-pg-onsite-dump 신원(EKS 전용)

# ── 0-27 CPU 요청 재조정 (2026-08-10) ─────────────────────────────────────────
# 실측(C-29): 클러스터 CPU 요청 10.780 코어 ↔ 실사용 1.145(9.4배). PG 는 500m × 2 인스턴스 = 1.0 코어로
# ES 다음으로 큰 덩어리인데, base 주석의 실측이 이미 근거를 준다 — **primary 실사용 295Mi/저부하**다.
# 250m 로 내려도 실사용 대비 여유가 크다.
#
# 🔴 메모리(2Gi req==limit)는 **건드리지 않는다.** base 주석대로 BestEffort→Burstable 전환과
#    OOM 예측성이 걸린 값이고, 실사용 대비 ~7배는 페이지캐시 몫을 일부러 잡아 둔 것이다.
# 🔴 CPU limits 는 여전히 없다(§13.7) — 요청은 천장이 아니라 포화 시 보장 몫이다. 체크포인트·VACUUM
#    버스트는 그대로 위로 뚫는다.
# ⚠️ C-21(인스턴스 2 → 3)이 붙으면 총 요청은 250m × 3 = 750m 다. 그래도 현행 1.0 코어보다 작다.
# ── 0-8 StorageClass = gp3-retain ──────────────────────────────────────────────
# 🔴 SC 는 **EBS CSI 애드온이 자동으로 만들어 주지 않는다.** EKS 기본 SC 는 `gp2`(in-tree 후신)
#    뿐이라 이 이름의 SC 를 누군가 만들어야 PVC 가 바인딩된다. 안 만들면 PG 가 영구 Pending 이다.
#    → ✅ **해소(0-8e, 2026-08-13)** = `platform/cluster-baseline/overlays/eks/storageclasses.yaml`
#      가 `gp3`(Delete) · `gp3-retain`(Retain · **default**) 2종을 만든다. **Terraform 이 아니라 config
#      소유**다 — 종전 주석이 미루던 "앱 레포 IaC 선행"은 실행된 적이 없다(EKS `.tf` 0개, 실측 2026-08-13).
# 🔴 **✅ 0-8b 판정 = `gp3-retain`**(2026-08-13). 온프렘 의도("PG·ES·Kafka = Retain")를 EKS 에서는
#    실제로 배선한다. PG 는 재파생 경로가 없는 유일한 정본이라 가장 명확한 대상이다.
# ⚠️ 이건 **백업이 아니라 즉사 방지**다. 실제 복구 경로는 barman → S3(C-78 · 0-32)이고, Retain 은
#    "Cluster CR 을 실수로 지워도 EBS 볼륨이 함께 사라지지 않는다"까지만 보장한다. PVC 가 사라지면
#    PV 는 `Released` 로 남고 **사람이 `spec.claimRef` 를 지워야** 다시 Bound 된다(자동 재사용 아님).
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: pg
    patch: |-
      - op: replace
        path: /spec/resources/requests/cpu
        value: 250m

  # 🔴 **같은 오브젝트인데 patches 항목이 둘인 이유 = 패치 방언이 다르다.**
  #    위는 JSON6902(op 목록), 아래는 merge 패치(매핑)다. kustomize 의 한 `patch:` 문자열은
  #    둘 중 하나여야 해서 한 블록으로 못 합친다. 건드리는 필드가 안 겹친다(CPU ↔ storageClass).
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: pg
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: pg
      spec:
        storage:
          storageClass: gp3-retain
        walStorage:
          storageClass: gp3-retain

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

  # ── 0-16 정적 AWS 키 제거 — barman(CNPG) 쪽 ────────────────────────────────
  # 🔴 체크리스트 S4-4 의 범위 정정: 정적 AWS 키는 **2세트**다.
  #    ① `pipeline/mp-pipeline-secrets`(pipelines 트랙에서 처리) ② **여기 `data/mp-pg-backup-s3`**.
  #    ⚠️ 반대로 `mp-pg-onsite-minio` 는 **MinIO 자격증명이라 AWS 가 아니다** → IRSA 로 대체 불가.
  #       명시적으로 범위 밖이다. 아래 "남은 결정" 참조.
  #
  # 세 조각이 한 묶음이다 — 하나만 하면 백업이 죽는다:
  #   (a) ObjectStore 가 키 대신 롤을 쓰게 한다        ← inheritFromIAMRole
  #   (b) 그러면 시크릿이 무용지물이므로 지운다          ← $patch: delete
  #   (c) 롤이 붙을 자리를 만든다                      ← Cluster 의 SA 애너테이션
  - target: {group: barmancloud.cnpg.io, kind: ObjectStore, name: mp-pg-backup}
    patch: |-
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: mp-pg-backup, namespace: data}
      spec:
        configuration:
          s3Credentials:
            inheritFromIAMRole: true
            accessKeyId: null        # JSON merge patch 의 null = 키 삭제
            secretAccessKey: null
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-pg-backup-s3}
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: mp-pg-backup-s3, namespace: data}

  # ── 0-23 · 0-30 barman 경로 = EKS 사이트 (2026-08-10) ──────────────────────
  # 🔴 **이 패치가 없으면 이관 당일 양쪽 백업이 동시에 못 쓰게 된다.**
  #    barman 실경로 = `<destinationPath>/<serverName>/{base,wals}/`. 양 사이트 Cluster 가
  #    둘 다 `pg` 라(C-3: 온프렘은 DR+크롤로 잔류) 기본값대로면 둘 다
  #    `mp-backup-ap2/pg/pg/wals/` 에 쓴다. WAL 파일명은 타임라인+LSN 이고 두 사이트는
  #    **각자 자기 타임라인을 처음부터 센다** ⇒ 이름이 겹친다 ⇒
  #      · barman-cloud-wal-archive 가 기존 객체를 만나 실패 → **아카이빙 정지 → pg_wal 적재**
  #      · 섞여 올라간 뒤엔 어느 WAL 이 어느 사이트 것인지 판별 불가 → **양쪽 PITR 불능**
  #    C-51 페일백("AWS 를 버리고 온프렘에서 재구축")의 원본이 바로 이 아카이브다.
  #
  # 🔴 이름은 역할이 아니라 **사이트**다(`pg-eks`, `pg-dr` 아님) — C-51 은 리전 장애 시
  #    온프렘을 승격시켜 **역할을 뒤바꾼다**. 사이트 이름은 페일오버해도 안 바뀐다.
  #
  # 🔴 **부트스트랩과 혼동하지 말 것.** 여기는 *쓰는 곳*(아카이브 목적지)이다.
  #    EKS 최초 시딩이 온프렘 아카이브에서 온다면 그건 `cluster.yaml` 의
  #    `bootstrap.recovery` + `externalClusters` 가 가리키는 **읽는 곳**이고, 그쪽 serverName 은
  #    온프렘 값 `pg` 여야 한다. 그걸 `pg-eks` 로 적으면 빈 경로를 읽어 부트스트랩이 실패한다.
  #    (cluster.yaml 은 이 레인 소유가 아니다 — 그 트랙에 전달할 제약이다.)
  #
  # ⚠️ 같은 버킷의 다른 프리픽스다. **버킷/계정 분리는 별건** — C-8(계정 3개)이 아직 없고,
  #    C-18 이 요구하는 "다른 버킷/계정" 은 *온사이트 덤프* 트랙(2-8)에 걸린 요구다.
  #    다만 IAM 은 지금 형상에서도 갈 수 있다: 온프렘 정적 키는 `pg/*` 만,
  #    EKS IRSA 롤은 `pg-eks/*` 쓰기 + `pg/*` **읽기**(페일백 원본) — 0-16 과 한 트랙.
  - target: {group: barmancloud.cnpg.io, kind: ObjectStore, name: mp-pg-backup}
    patch: |-
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: mp-pg-backup, namespace: data}
      spec:
        configuration:
          destinationPath: s3://mp-backup-ap2/pg-eks
  # 🔴 `serverName` 은 **여기가 아니라 Cluster 의 플러그인 파라미터**다 (2026-08-14 실측).
  #    플러그인 v0.13.0 웹훅이 ObjectStore 쪽을 금지한다 — base 주석에 원문과 근거를 적어 뒀다.
  #    ⚠️ 목적(사이트별 경로 분리)은 그대로다. **적는 자리만 옮겼다.**
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: pg}
    patch: |-
      - op: add
        path: /spec/plugins/0/parameters/serverName
        value: pg-eks
  # 🟢 계정 ID 는 채워졌다(2026-08-14 · `689192361171`). services/* 오버레이와 같은 규약이다.
  #    (종전 *"계정 ID 가 아직 없다"* 는 #167 로 해소됐다.)
  #    CNPG 가 이 애너테이션을 클러스터 SA(`pg`)에 얹고, barman-cloud 사이드카가 그 SA 로 STS 를 탄다.
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: pg}
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: pg, namespace: data}
      spec:
        serviceAccountTemplate:
          metadata:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::689192361171:role/mp-pg-barman

  # ── 0-32 bootstrap — **빈 클러스터로 짓는다** (C-78, 2026-08-13) ────────────
  # 🔴 **이 패치가 없으면 AWS 클러스터가 기동 자체를 못 한다.** base 의 bootstrap 은
  #    `pg_basebackup ← externalClusters: vm-pg → 192.168.0.8` 인데 그 VM 은
  #    **P4(2026-07-31)에서 파괴**됐다. eks 렌더가 그걸 그대로 들고 있었다.
  #
  # 🔴 **왜 `bootstrap.recovery`(barman)가 아닌가 — C-78 사용자 확정.**
  #    *"barman `bootstrap.recovery` 를 쓰지 않는다 — 생성 시점 1회만 유효라 틀리면 Cluster
  #     재생성인데, 빈 클러스터 + `pg_restore` 는 그 경로를 안 밟는다"*
  #    ⇒ A1 에서 **빈 클러스터**로 띄우고, A3 컷오버 창에서 온프렘 `pg_dump -Fc -Z6`(⟳ **31.2MiB · 4초** — 2026-08-14 재실측. 종전 318MiB 는 압축 전 값으로 보인다)을
  #      `pg_restore` 로 붓는다. 다운타임 5~10분. 0-32 의 종전 스케치(recovery)는 C-78 이 뒤집었다.
  #    🔴 그래서 **0-23(barman 경로 분리)은 0-32 의 선행이 아니다** — 읽는 경로가 아예 안 쓰인다.
  #      0-23 이 막는 것은 여전히 유효하지만(양 사이트 WAL 이 섞이는 것) 별개 축이다.
  #
  # 🔴 `bootstrap` 은 **생성 시점 1회만 유효**하다. 틀리면 Cluster 삭제·재생성이고 리허설이 없다(1-9).
  #    지금이 고칠 수 있는 마지막 싼 시점이다.
  #
  # 🟢 `initdb` 라서 딸려오는 것 2가지:
  #    ① CNPG 가 `pg-app` 시크릿(username=fbapp)을 **자동 생성**한다. 온프렘은 pg_basebackup
  #       부트스트랩이라 이게 안 만들어졌었다(base cluster.yaml 주석의 실측) — `mp-pg-onsite-dump`
  #       CronJob 이 그 시크릿을 읽으므로 EKS 에선 오히려 배선이 자연스러워진다.
  #    ② `postInitApplicationSQL(Refs)` 가 **동작한다**(recovery 였다면 안 돈다).
  #       🔴 그래도 **안 쓴다** — GRANT 정본은 앱 레포 `docs/prd/schema-roles.sql` 하나여야 한다.
  #          여기 SQL 을 복사하면 정본이 둘이 되고, 갈리는 순간 권한이 조용히 어긋난다.
  #          A1 의 "스키마 DDL" 은 사람이 psql 로 돌린다(C-78).
  #
  # ⚠️ `externalClusters`·`replica` 도 같이 걷는다 — 둘 다 `vm-pg` 를 가리키고, `replica.source` 가
  #    존재하지 않는 externalCluster 를 참조하면 CNPG 검증에 걸릴 수 있다.
  #    (`mp-pg-replica-source` ExternalSecret 은 남겨 뒀다 — 값은 Secrets Manager 번들에 있어 sync 는 되고,
  #     C-40/C-55 의 역방향 복제 설계가 그 자리를 쓸지 아직 안 정해졌다.)
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: pg}
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: pg, namespace: data}
      spec:
        bootstrap:
          pg_basebackup: null      # JSON merge patch 의 null = 키 삭제
          initdb:
            database: foodbudget   # 🔴 온프렘 덤프와 같은 이름이어야 pg_restore 가 그대로 붙는다
            owner: fbapp           # 🔴 객체 소유자. schema-roles.sql 은 소유권을 fbapp 에 남기는 설계다
        replica: null
        externalClusters: null

  # ── 0-14c 잔여분 — `mp-pg-onsite-dump` 의 신원 (2026-08-13) ──────────────────
  # 0-14c 는 app·pipeline ns 만 했다. data ns 에서 `default` SA 로 남아 있던 이 CronJob 을 여기서 닫는다.
  # 🔴 **이게 없으면 이상한 상태가 된다** — `platform/policies-data/overlays/eks/netpol-pg-onsite-s3.yaml`
  #    이 이미 STS 를 열어 **IRSA 를 전제**하는데 붙일 신원이 없었다(네트워크는 열렸는데 주체가 없음).
  # ⚠️ **나머지 반쪽(업로드 컨테이너 MinIO → S3 재작성)은 여기서 안 한다** — C-78 의 **A4** 이고
  #    체크리스트 `2-8`·`1-20` 소관이다.
  #    ⟳ **보존 주체는 정해졌다**(2026-08-13 사용자 확정 · 미결 ㉕ 해소) = **C-79 의 190일 ·
  #      라이프사이클이 지운다.** 그 집행분이 아래 **A-49** 두 패치다.
  - target: {group: batch, kind: CronJob, name: mp-pg-onsite-dump}
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: mp-pg-onsite-dump, namespace: data}
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: mp-pg-onsite-dump

  # ══ ✅ A-49 ① 해제 — A4 안정화 (2026-08-14) ═══════════════════════════════════
  # 종전(2026-08-13)에는 `suspend: true` 패치가 여기 있었다. 목적지가
  # `minio.observability.svc` 인데 C-18 로 **EKS 에 MinIO 가 없어** 매일 04:00 KST 에
  # 실패하고 매일 알림이 울리기 때문이었다. 그 주석은 *"A4 에서 이 한 줄만 지우면 켜진다"* 고
  # 적었고, **여기가 그 A4 다.** 지운 근거는 아래 ② 가 목적지를 S3 로 바꾼 것이다 —
  # 🔴 **순서가 중요하다.** ②(목적지 재작성) 없이 이 줄만 지우면 MinIO 를 향해 매일 실패한다.
  #    반대로 ② 만 하고 이 줄을 남기면 *조용히 안 도는 백업*이 된다(오브젝트는 있고 ArgoCD 도
  #    Synced 라 대시보드 어디에도 이상이 안 보인다 — 가장 나쁜 실패 형태다). **한 커밋으로 묶는다.**
  # 🔵 온프렘은 애초에 이 패치의 대상이 아니었다(eks 오버레이 전용) — 계속 MinIO 로 돈다(C-83).

  # ══ A-49 ② → A4 재작성 — 업로드 목적지 MinIO → S3 (2026-08-14) ═══════════════
  # 2026-08-13 사용자 확정 = 논리 덤프 보존은 **C-79 의 190일 · 라이프사이클이 지운다.**
  #
  # 🔴 **이게 결정의 나머지 절반이다.** 세 조합 중 둘이 틀린다:
  #      · `mc rm` 남기고 라이프사이클만 걺 → **둘 다 지운다.** 게다가 컨테이너가 7일에 먼저
  #        지워버려서 **Standard-IA 최소 30일에 도달조차 못 하고**, 계층 전환이 영원히 발동 안 한다.
  #        ⇒ C-79 의 산출물(*"라이프사이클을 설계했다는 증명"*)이 그 자리에서 무의미해진다.
  #      · `mc rm` 도 걷고 라이프사이클도 안 걺 → **아무도 안 지운다.**
  #    ⇒ 그래서 한 PR 로 묶었다. 라이프사이클 쪽(`mp-pg-dump-ap2` · Std → IA 30-90d →
  #      Glacier IR 90-180d → 만료 190일)은 **A4 에서 버킷과 함께 생긴다** — 지금은 버킷 자체가 없다.
  #
  # ⚠️ 종전(2026-08-13)에는 `mc rm` 만 걷고 목적지는 MinIO 그대로였다 — ① 로 재워 뒀으니
  #    안 돌아서 무해했다. **이제 ① 을 풀었으므로 목적지도 같이 바꾼다.**
  # 🔴 그래서 파생되는 것 하나 — **A-47 의 `mp-pg-dump` IAM 롤에서 `s3:DeleteObject` 가 불요**다
  #    (보존을 S3 라이프사이클이 맡으므로). 이미 그렇게 돼 있다(앱 레포 `iam_irsa.tf` 실측).
  # 🔵 온프렘은 7일 유지 · MinIO 유지(C-83) ⇒ **두 사이트가 보존도 저장소도 의도적으로 다르다.**
  #
  # ── 바꾸는 것 3가지와 각각의 근거 ──────────────────────────────────────────────
  # ⓐ **이미지 `minio/mc` → `aws-cli`** — `mc` 는 S3 를 정적 액세스키로만 붙는다. 우리는
  #    IRSA(웹 아이덴티티)라 **줄 키가 없다.** 키를 만들어 주면 A-49 ③ 이 ES 를 걷은 이유
  #    (*"IRSA 라 정적 자격증명이 애초에 필요 없다"*)를 정면으로 뒤집는 셈이 된다.
  #    🔵 다이제스트 핀 = `2.36.23`. **멀티아치 인덱스**라 Graviton 노드에서 arm64 가 뽑힌다
  #      (실측: manifests 에 amd64·arm64 둘 다. C-29 로 노드가 `m7g` 라 이게 전제다).
  # ⓑ **env 통째 교체** — `MINIO_ACCESS_KEY`·`MINIO_SECRET_KEY` 가 A-49 ③ 에서 **걷어낸**
  #    시크릿 `mp-pg-onsite-minio` 를 참조한다. ① 을 푸는 순간 그 참조가 살아나
  #    **CreateContainerConfigError** 로 파드가 아예 안 뜬다. `MC_CONFIG_DIR` 도 함께 소멸.
  #    🔴 `HOME=/work` 를 주는 이유 = base 가 `readOnlyRootFilesystem: true` 라 aws-cli 가
  #      설정·캐시를 쓰려 할 때 갈 곳이 필요하다. `/work` 는 emptyDir 이라 쓰기 가능하다.
  #    🟢 자격증명 env 는 **안 적는다** — EKS Pod Identity 웹훅이 SA 의 `role-arn` 어노테이션을
  #      보고 `AWS_ROLE_ARN`·`AWS_WEB_IDENTITY_TOKEN_FILE` 을 admission 때 주입한다.
  # ⓒ **목적지 = `s3://mp-pg-dump-ap2/aws/...`** (C-69 · 버킷은 A4 Terraform 이 만든다).
  #    🔴 프리픽스 `aws/` 는 취향이 아니라 **IAM 제약**이다 — A-47 정책이 PutObject 를
  #      `arn:aws:s3:::mp-pg-dump-ap2/aws/*` 로 한정한다. 다른 경로에 쓰면 403 이다.
  #    🔴 검증에 `head-object` 를 쓰지 않는다 — 그 정책에 **`s3:GetObject` 가 없다**(넣을 이유도
  #      없다. 이 잡은 쓰기 전용이다). 대신 `list-objects-v2` 로 확인한다 — `s3:ListBucket` 은
  #      `s3:prefix` 가 `aws/*` 일 때 허용돼 있어 통과한다.
  #
  # 🔴 `op: test` 로 컨테이너 신원을 먼저 확인한다 — 인덱스 기반 JSON6902 는 base 의 컨테이너
  #    순서가 바뀌면 **엉뚱한 컨테이너를 통째로 갈아치운다.** test 가 깨지면 렌더가 죽는다.
  - target: {group: batch, kind: CronJob, name: mp-pg-onsite-dump}
    patch: |-
      - op: test
        path: /spec/jobTemplate/spec/template/spec/containers/0/name
        value: upload
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: public.ecr.aws/aws-cli/aws-cli@sha256:c7b16ed4f08f8a61634d9c219dd2388cf61c5425f3c096b5a5b235521d7ea5cc
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env
        value:
          - name: TZ
            value: Asia/Seoul
          - name: HOME
            value: /work
          - name: AWS_REGION
            value: ap-northeast-2
          - name: DUMP_BUCKET
            value: mp-pg-dump-ap2
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/args/0
        value: |
          set -eu
          OUT=$(cat /work/latest-path)
          KEY="aws/foodbudget/$(basename "$OUT")"
          echo "[upload] s3://${DUMP_BUCKET}/${KEY}"
          aws s3 cp "$OUT" "s3://${DUMP_BUCKET}/${KEY}" --only-show-errors
          echo "[verify] 원격 크기(byte):"
          aws s3api list-objects-v2 --bucket "$DUMP_BUCKET" --prefix "$KEY" \
            --query 'Contents[0].Size' --output text
          # 🔴 보존 정리 없음 — AWS 쪽 보존은 S3 라이프사이클(C-79 · 190일)이 맡는다.
          #    여기서 지우면 계층 전환이 발동 전에 객체가 사라진다. IAM 에도 Delete 권한이 없다.
          echo "[state] 최근 보관분:"
          aws s3api list-objects-v2 --bucket "$DUMP_BUCKET" --prefix "aws/foodbudget/" \
            --query 'reverse(sort_by(Contents,&LastModified))[0:5].[Key,Size]' --output text

  # ══ A-49 ③ — `mp-pg-onsite-minio` ExternalSecret 을 EKS 에서 걷는다 (2026-08-14) ══
  # 🔴 **발단 = 라이브 실측.** ArgoCD 에서 `pg` 앱이 Degraded 였고 원인이 이 하나였다:
  #      mp-pg-onsite-minio  SecretSyncedError  "could not get secret data from provider"
  #    이 ES 는 `data-secrets/PG_ONSITE_MINIO_ACCESS_KEY`(+ SECRET_KEY)를 당기는데
  #    Secrets Manager 의 `mp/prod/data-secrets` 에는 그 두 키가 **없다**(있는 키 5개는 전부 PG·ES 암호).
  #
  # 🔴 **없는 게 맞다 — 넣어서 고칠 것이 아니다.** 목적지 자체가 없다:
  #    C-18 로 **EKS 에 MinIO 가 없고**, A4 의 재작성 목적지는 `mp-pg-dump-ap2`(C-69) **S3** 다.
  #    그리고 그 S3 접근은 **IRSA**(`mp-pg-dump` 롤 + 위 0-14c 잔여분이 붙인 SA)로 하므로
  #    **정적 자격증명이 애초에 필요 없다.** ⇒ 이 ES 는 EKS 에서 되살아날 일이 없다.
  #
  # 🔴 남기면 해로운 이유는 `common/overlays/eks` 의 **1-31** 과 정확히 같다 —
  #    영구 SecretSyncedError 라 **ns 의 ESO 상태가 상시 빨강이고, 그러면 진짜 실패가 묻힌다.**
  #    (그 상태로 `pg` 앱도 영구 Degraded 라 ArgoCD 대시보드가 신호를 잃는다.)
  #
  # ⚠️ **A-49 ①(CronJob 은 재운다)과 어긋나지 않는다.** 오브젝트를 남기는 근거는
  #    *"걷어내면 A4 에 통째로 다시 만들어야 한다"* 였는데, 이 ES 는 A4 에서 **다시 만들 물건이 아니다.**
  # 🔴 그래서 A4 에서 suspend 를 풀 때 할 일이 하나 늘어난다 —
  #    업로드 컨테이너의 `MINIO_*` env(이 시크릿 참조)도 **같이 걷어야 한다.** 지금은 CronJob 이
  #    suspend 라 파드가 안 떠서 무해하지만, 순서를 바꾸면 CreateContainerConfigError 로 드러난다.
  # 🔵 온프렘은 그대로다(C-83) — 이 패치는 eks 오버레이에만 있다.
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-pg-onsite-minio
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-pg-onsite-minio

  # ── 0-13 서비스별 PG 롤 — **AWS PG 는 처음부터 갈라서 짓는다** (2026-08-13) ──
  # 설계 정본 = 앱 레포 `docs/prd/schema-roles.md`(+ 멱등 DDL `schema-roles.sql`, #566).
  #
  # 🔴 **온프렘은 손대지 않는다 — C-83.** `fbapp` 단독 그대로다. 라이브에서 롤을 가르려면
  #    앱 11종을 하나씩 전환해야 하고(그 문서 §5 Phase 4 = "유일한 위험 구간"), 그건 형상 변경이다.
  #    여기서 하는 것은 *새로 짓는 쪽*을 처음부터 옳게 짓는 것뿐이다.
  #
  # 🔴🔴 **`inRoles` 는 배타적이다.** CNPG 는 여기 안 적힌 멤버십을 **REVOKE 한다.**
  #    `schema-roles.sql` 의 `GRANT mp_data_reader TO svc_*` 가 전부 멤버십이므로, 아래 표와
  #    그 파일이 어긋나면 다음 reconcile 에서 조용히 회수돼 **읽기가 죽는다.** 둘을 같이 고칠 것.
  #    대조표 = schema-roles.md §4.2.
  #
  # 🔴 그룹 롤(`mp_data_reader`·`mp_data_writer`)은 여기 **안 적는다** — NOLOGIN 이라 CNPG 가
  #    관리할 이유가 없고, spec 에 넣으면 그 자신도 inRoles 반영 대상이 되어 꼬인다.
  #    그 둘은 `schema-roles.sql` 1단계가 만든다.
  #
  # 🔴 `connectionLimit: 5` = **파드당 psycopg 풀 max_size 와 같은 수**(§1.5 실측). 롤이 갈리면
  #    PgBouncer 가 **(유저, DB) 쌍마다 별도 풀**을 만들어 상한 산수가 통째로 바뀐다 —
  #    그래서 `platform/pooler/overlays/eks` 를 **같은 PR 에서** 같이 줄였다. 한쪽만 하면 고갈이다.
  #    ⚠️ 이 값은 롤당 상한이지 풀 크기가 아니다. 직결 소비자(ocr·ranking·pipeline)에 실효.
  #
  # 🔴 `ensure: present` 만 쓴다. `absent` 는 어디에도 안 적는다 — 오타 하나가 롤 삭제가 된다.
  - target: {group: postgresql.cnpg.io, kind: Cluster, name: pg}
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: pg, namespace: data}
      spec:
        managed:
          roles:
            - name: svc_account
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: []
              passwordSecret: {name: mp-pg-role-account}
            - name: svc_recipebook
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-recipebook}
            - name: svc_pantry
              ensure: present
              login: true
              connectionLimit: 5
              # 🔴 `[]` 였다 — 그래서 라이브에서 500 이 났다(실측 2026-08-14).
              #    pantry 는 `public` 을 4곳에서 읽는다(앱 레포 `services/pantry/app/queries.py`):
              #      :38 item_master · :39 item_alias  (resolve_item_id — 이름→표준품목)
              #      :140 item_master                  (valid_item_id — 존재 검증)
              #      :191 shelf_life_ref               (lookup_shelf_life — 보관 이동 시 소비기한 재계산)
              #    증상 = POST /api/pantry/receipts 1건 · PATCH /api/pantry/items/{id} 11건이
              #    전부 InsufficientPrivilege. pantry 스키마 권한은 정상이었고 public 읽기만 막혀 있었다.
              #    🔴 CNPG 의 `inRoles` 는 **배타적**이라, 앱 레포 `schema-roles.sql` 에서 GRANT 만 하면
              #       다음 reconcile 이 조용히 REVOKE 한다 — 두 곳을 반드시 같이 고쳐야 한다.
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-pantry}
            - name: svc_mealplan
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-mealplan}
            - name: svc_price
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-price}
            - name: svc_notify
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: []
              passwordSecret: {name: mp-pg-role-notify}
            - name: svc_chat
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-chat}
            - name: svc_recipe
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-recipe}
            - name: svc_video
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-video}
            - name: svc_ocr
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-ocr}
            - name: svc_ranking
              ensure: present
              login: true
              connectionLimit: 5
              inRoles: [mp_data_reader]
              passwordSecret: {name: mp-pg-role-ranking}
            # 🔴 파이프라인만 writer 다 — public(데이터 티어) 쓰기는 여기 하나뿐이다.
            #    직결(Pooler 미경유)이고 CronJob 17종이 겹칠 수 있어 상한을 넉넉히 준다.
            - name: svc_pipeline
              ensure: present
              login: true
              connectionLimit: 15
              inRoles: [mp_data_writer]
              passwordSecret: {name: mp-pg-role-pipeline}
            # 🔴 **서비스 롤이 아니다 — CDC(PG→ES)용이다.** 앱 레포 `schema-roles.sql` 이
            #    롤을 NOLOGIN 으로 만들고 GRANT 를 주며, 여기서 LOGIN·비밀번호·복제속성을 얹는다.
            #    ⚠️ 온프렘엔 이 롤이 **손으로** 만들어져 있어서(0-11 부류) 이 배선이 없었고,
            #      빈 클러스터인 EKS 에서 처음 드러났다(A1 실측: `password authentication failed`).
            # 🔴 **`replication: true` 가 핵심이다** — PGSync 는 논리 복제 슬롯을 만든다.
            #    빠지면 붙기는 하고 **동기화만 조용히 안 된다.**
            # 🔴 비밀번호 출처가 위 12종과 **다르다** — `pg-roles` 가 아니라 `data-secrets` 다.
            #    같은 값을 PGSync 워크로드도 `mp-pgsync-secrets/PG_PASSWORD` 로 받으므로
            #    한 곳에서 나와야 갈리지 않는다. 번들을 옮기면 **양쪽이 조용히 어긋난다.**
            - name: pgsync
              ensure: present
              login: true
              replication: true
              connectionLimit: -1
              inRoles: []
              passwordSecret: {name: mp-pg-role-pgsync}

# ── 🔴 이 트랙에 남은 결정 (사람이 정할 것) ────────────────────────────────────
#  · ~~`mp-pg-onsite-minio` + `onsite-backup.yaml` 을 걷을지 살릴지~~ → 🟢 **해소(A-49, 위 두 패치)**
#    = 살린다. eks 에서는 `suspend: true` 로 재워 두고 **A4 에서 목적지를 `mp-pg-dump-ap2`(C-69)로
#    재작성하며 깨운다.** 보존은 CronJob 이 아니라 **S3 라이프사이클**(C-79 · 190일)이 맡는다.
#    🟢 신원 문제도 닫혔다 — 전용 SA + IRSA 는 위 0-14c 잔여분 패치가 붙였다.
#      (`platform/policies-data/overlays/eks/netpol-pg-onsite-s3.yaml` 이 STS 를 열어 둔 것과 짝이 맞는다.)
#    🔴 **남은 것은 A4 의 "suspend 해제"** — 체크리스트 `2-8`·`1-20` 에 명시돼 있어야 한다.
#    ⟳ **2026-08-14 보강(A-49 ③)** — 자격증명 쪽 `mp-pg-onsite-minio` ES 는 **eks 에서 걷었다.**
#      A4 목적지가 S3 + IRSA 라 정적 키가 필요 없어 *다시 만들 물건이 아니기* 때문이다(CronJob 과 다르다).
#      🔴 그래서 A4 의 "suspend 해제" 는 **두 줄짜리 일이 됐다** — 업로드 컨테이너의 `MINIO_*` env 제거가 짝이다.
#  · 🔴 **`bootstrap.pg_basebackup` 이 죽은 VM 을 가리킨다** — base cluster.yaml 의
#    `externalClusters: vm-pg → 192.168.0.8` 은 P4(2026-07-31)에서 파괴된 호스트다.
#    eks 렌더가 이걸 그대로 들고 있어 **AWS 클러스터가 부트스트랩 자체를 못 한다.**
#    0-32(온프렘→AWS 초기 적재)가 정할 일 = `bootstrap.recovery` + `externalClusters` 를
#    **온프렘 barman**(`serverName: pg` · `destinationPath: s3://mp-backup-ap2/pg`)으로 돌리는 것.
#    🔴 그때 serverName 을 `pg-eks` 로 적으면 빈 경로를 읽어 실패한다 — *읽는 곳*은 온프렘 값이다.
#    ⚠️ 그리고 recovery 로 부트스트랩하면 **`fbapp` 과 그 권한이 물리 복제로 따라온다.**
#      위 `managed.roles` 는 롤을 *더할* 뿐 `fbapp` 을 지우지 않는다 —
#      AWS 쪽 `ALTER ROLE fbapp NOLOGIN`(schema-roles.sql 5단계)은 **적재 검증 후 사람이** 돌린다.
