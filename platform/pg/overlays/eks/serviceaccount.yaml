# 0-14c 잔여분 — `mp-pg-onsite-dump` 전용 ServiceAccount (**EKS 전용**)
#
# 0-14c 의 명세(#571 §A)는 app·pipeline ns 만 셌다. data ns 는 CNPG·Strimzi 가 만든 SA 3개를 빼면
# 나머지가 `default` 였고, 그중 이 레포가 소유한 워크로드는 이것 하나다.
#
# 🔴 `imagePullSecrets` 없음 — EKS 는 ECR + 노드 인스턴스 롤(1-31). 게다가 이 CronJob 의 두 이미지는
#    `ghcr.io/cloudnative-pg/postgresql` 과 `docker.io/minio/mc` 로 **Harbor 를 안 쓴다.**
#
# 🔴 IRSA 롤은 **아직 아무 컨테이너도 안 쓴다.** 지금 업로드 컨테이너는 `mc` + MinIO 정적 키다.
#    그럼에도 어노테이션을 지금 붙이는 이유 = `netpol-pg-onsite-s3.yaml` 이 **이미 STS 를 열어**
#    IRSA 를 전제하고 있어서, 신원만 비어 있는 상태가 "네트워크는 뚫렸는데 주체가 없는" 사각지대가 된다.
#    붙여 두면 Terraform 이 만들어야 할 것이 매니페스트에 드러난다(무해 — SDK 를 안 부르면 assume 도 없다).
#
# 목적지 버킷 = `mp-pg-dump-ap2`(C-68·C-69) · 프리픽스 `aws/`(온프렘은 `onprem/` · 2-8).
# 🔴 **barman 버킷(`mp-backup-ap2`)과 반드시 달라야 한다** — 이 트랙의 존재 이유가
#    "barman 체인이 통째로 오염·삭제됐을 때의 독립 사본" 이라 장애 도메인을 공유하면 안 된다(C-18).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mp-pg-onsite-dump
  namespace: data
  annotations:
    # 🔴 PLACEHOLDER = 계정 ID 미정(C-57 로 계정 1개). services/* 의 ECR 레지스트리와 같은 규약.
    eks.amazonaws.com/role-arn: arn:aws:iam::PLACEHOLDER:role/mp-pg-dump
automountServiceAccountToken: false
