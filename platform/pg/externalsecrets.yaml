# PG 계열 비밀 배선 — fb-secrets(정본) ──ESO──▶ data ns.
# 🔴 선행조건: fb-secrets ns 에 Secret `data-secrets` 적재 (키 목록·적재 방법 = README.md).
#    적재 전에 sync 하면 ExternalSecret 이 NotReady 로 남고 Cluster 는 password 를 못 찾는다.
# 앱 트랙 app-secrets 와 같은 패턴(services/*/base/externalsecret.yaml) — 스토어도 동일 fb-kubernetes.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pg-replica-source
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-pg-replica-source # cluster.yaml externalClusters[vm-pg].password 가 참조
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: data-secrets
        property: STREAMING_REPLICA_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pg-backup-s3
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-pg-backup-s3 # objectstore.yaml s3Credentials 가 참조
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: data-secrets
        property: PG_BACKUP_AWS_ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: data-secrets
        property: PG_BACKUP_AWS_SECRET_ACCESS_KEY
---
# 온사이트 백업(onsite-backup.yaml CronJob)이 인클러스터 MinIO 에 쓸 자격증명.
# 🔴 MinIO **root 키가 아니다.** `mp-pg-onsite` 버킷에만 권한이 있는 전용 키다
#    (MinIO policy `mp-pg-onsite-rw`). root 를 data ns 에 두면 data ns 가 뚫렸을 때
#    loki·tempo·models 버킷까지 통째로 넘어간다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pg-onsite-minio
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-pg-onsite-minio # onsite-backup.yaml 의 upload 컨테이너가 참조
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY
      remoteRef:
        key: data-secrets
        property: PG_ONSITE_MINIO_ACCESS_KEY
    - secretKey: SECRET_KEY
      remoteRef:
        key: data-secrets
        property: PG_ONSITE_MINIO_SECRET_KEY
