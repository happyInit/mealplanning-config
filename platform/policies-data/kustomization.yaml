apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
# 보안 ③ 티어 3 — data ns 스토어별 default-deny 잠금 묶음.
# child app = argocd/applications/policies-data.yaml (mp-policies-data, 수동 sync).
# 🔴 app ns 정책(platform/policies, namespace:app 강제)과 분리 — 여기는 namespace:data.
# 스토어별로 하나씩 추가·sync·관찰: Redis(첫) → ES → PG(백업·apiserver·복제) → (Kafka 는 Strimzi 소유라 제외).
resources:
  - netpol-redis.yaml               # Redis(mp-redis + sentinel) default-deny — 3-1 ✅ 검증완료
  - netpol-es.yaml                  # ES(ECK, cluster=es) default-deny — 3-2 ✅ 검증완료
  - netpol-es-exporter.yaml         # ES exporter: Prometheus ingress + DNS/ES-only egress
  - netpol-es-exporter-bootstrap.yaml # one-shot monitor user bootstrap: DNS + ES only
  - netpol-pg.yaml                  # PG(CNPG instance + pooler) default-deny — 3-3
  - netpol-pg-egress-fqdn.yaml      # PG instance egress: S3 백업 FQDN + kube-apiserver (CiliumNetworkPolicy) — 3-3
  - netpol-pg-onsite.yaml           # 온사이트 백업 CronJob egress 잠금(DNS·PG·MinIO 만) — 2026-08-03
  - netpol-pg-pooler-egress.yaml    # 🔴 pooler → kube-apiserver egress (CiliumNetworkPolicy) — 2026-08-03
                                    #    빠져 있어서 pooler 파드가 **재생성될 때만** CrashLoop 했다
                                    #    (기존 파드는 conntrack 으로 연명 → 무증상). 상세 = 파일 머리말
  - netpol-pgsync.yaml              # PGSync daemon/manual Job egress: DNS·PG·ES·전용 Redis만
