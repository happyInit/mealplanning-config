# 보안 ③ NetworkPolicy — 티어 3(data ns) 스토어별 잠금: Redis. object_spec §10.3.
#
# tier-3 는 가장 위험한 티어다 — data ns 엔 오퍼레이터·복제·백업이 산다. 그래서 빅뱅이 아니라 **스토어별**로
# 하나씩 default-deny 를 걸고(그 스토어만 화이트리스트화, 나머지 스토어는 아직 allow-all) 복제·HA 를 관찰한다.
# Redis 를 첫 스토어로 고른 이유: 자기완결(외부 egress 0·apiserver 불필요)이고 blast radius 가 캐시라 가장 안전.
#
# 🔴 data ns 는 **메시 밖**(사이드카 없음) — app ns 와 다르다:
#   · kubelet probe 가 istio-proxy :15021 로 rewrite 되지 않고 **파드 포트로 직접**(소스=노드 IP) → 노드 ipBlock 필요.
#   · STRICT mTLS 무관(PeerAuth 는 app ns 만). netpol 만이 이 스토어의 유일한 L3/L4 경계.
# 🔴 셀렉터 = app 라벨(Cilium 이 존중). statefulset.kubernetes.io/pod-name·pod-template-hash 로 고르면 무효(runbook §9-27).
#
# 구조(실측): RedisReplication mp-redis(master+replica, app=mp-redis, :6379 + exporter :9121) +
#   인라인 Sentinel(app=mp-redis-s, :26379). 클라이언트(backend·pipeline)는 **Sentinel-aware**(분기 C) —
#   Sentinel(26379)로 master 를 찾고 master(6379)에 붙는다. redis-pgsync(app=redis-pgsync)는 별도 인스턴스라 제외.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-redis
  namespace: data
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [mp-redis, mp-redis-s] }
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1) app backend (Sentinel-aware) → master 6379 + sentinel 26379
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: app } }
          podSelector: { matchLabels: { tier: backend } }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    # 2) pipeline ns (컨슈머·CronJob, Sentinel 경유 — pipelines/base/configmap.yaml REDIS_SENTINELS/REDIS_URL 실측)
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: pipeline } }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    # 3) intra-redis: master↔replica 복제(6379) + Sentinel 감시·합의(6379·26379). 이게 없으면 HA/failover 붕괴.
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [mp-redis, mp-redis-s] }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    # 4) redis-operator (HA 재구성: REPLICAOF·sentinel monitor). exec 기반이면 미사용이나 안전하게 허용.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: redis-operator-system } }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    # 5) Prometheus(observability) → redis-exporter :9121 (mp-redis-metrics)
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 9121 }
    # 6) ── 🔴 kubelet probe 용 `ipBlock: 192.168.0.0/24` 를 base 에서 내렸다 (0-18).
    #    onprem 오버레이가 ingress[5](= 마지막)로 복원, eks 는 `netpol-node-probe.yaml` 이 대체.
  egress:
    # 1) DNS (CoreDNS) — Sentinel/복제가 파드 호스트네임을 해석. 없으면 이름 해석 전멸.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # 2) intra-redis egress (복제·Sentinel comms 의 나가는 쪽 — ingress 3)의 짝). apiserver·외부 egress 는 없다.
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [mp-redis, mp-redis-s] }
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
