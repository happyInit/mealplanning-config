# 보안 ③ NetworkPolicy — 티어 3(data ns) 스토어별 잠금: Elasticsearch(ECK). object_spec §10.3.
#
# Redis(3-1) 다음 스토어. Redis 보다 단순 — 외부 egress 0 · apiserver egress 0 · Prometheus 스크레이프 없음
#   (ECK 는 Prometheus 네이티브 노출 없음, exporter 미배포 — kafka·redis 만 스크레이프됨).
#
# 🔴 data ns=메시 밖 — kubelet probe 가 파드 :9200 로 직접(rewrite 없음, 소스=노드 IP). STRICT 무관.
# 🔴 셀렉터 = ECK 라벨 elasticsearch.k8s.elastic.co/cluster-name=es (3노드: nodeSet a=1 + b=2). Cilium 존중 라벨.
#
# 구조(실측): Elasticsearch CR `es`, http TLS off(평문+basic auth). 클라이언트(backend·pipeline·PGSync)는
#   es-es-http.data.svc:9200 로 붙는다. 노드간 클러스터링(디스커버리·샤딩·코디네이팅 포워딩)은 transport :9300.
#   클라이언트 9200 → 코디네이팅 노드가 내부적으로 9300 으로 데이터노드에 포워드 (노드간 9200 없음).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-es
  namespace: data
spec:
  podSelector:
    matchLabels:
      elasticsearch.k8s.elastic.co/cluster-name: es
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1) app backend (레시피·상품 검색) → HTTP API :9200
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: app } }
          podSelector: { matchLabels: { tier: backend } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 2) pipeline ns (reindex·refiner·ingest — pipelines/configmap ESHOST 실측) → :9200
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: pipeline } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 3) ES exporter (data ns) → cluster health/stats :9200
    - from:
        - podSelector: { matchLabels: { app: elasticsearch-exporter } }
        - podSelector: { matchLabels: { app: elasticsearch-exporter-bootstrap } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 4) PGSync (data ns, app=pgsync — PG WAL → recipes_live bulk 색인, 상시 replicas=1) → :9200
    - from:
        - podSelector: { matchLabels: { app: pgsync } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 5) intra-ES: 노드간 transport :9300 (디스커버리·샤드 복제·코디네이팅 포워딩). 없으면 클러스터 red.
    - from:
        - podSelector: { matchLabels: { elasticsearch.k8s.elastic.co/cluster-name: es } }
      ports:
        - { protocol: TCP, port: 9300 }
    # 6) ECK operator (elastic-system) → :9200 (헬스·라이선스·샤드 관리 오케스트레이션)
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: elastic-system } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 6-1) ES 계정 프로비저닝 Job (data ns, 이슈 #521) → :9200
    #      최소권한 계정 3종을 native realm 에 PUT 하는 일회성 부트스트랩. 3) exporter-bootstrap 과
    #      같은 성격이라 같은 자리에 둔다.
    #      🔴 이게 없으면 Job 이 ES 에 못 닿아 스크립트의 readiness 재시도만 돌다 상한에서 실패한다
    #      (증상: 파드는 Running 인데 로그가 비어 있고 수분째 끝나지 않는다 — 2026-08-04 실측).
    - from:
        - podSelector: { matchLabels: { app: es-users-provision } }
      ports:
        - { protocol: TCP, port: 9200 }
    # 7) ── 🔴 kubelet probe 용 `ipBlock: 192.168.0.0/24` 를 base 에서 내렸다 (0-18).
    #    onprem 오버레이가 ingress[7] 로 복원, eks 는 `netpol-node-probe.yaml` 이 대체.
    #    ⚠️ 아래 8) 이 추가되면서 onprem 의 `add /spec/ingress/7` 은 **마지막이 아니라 삽입**이 된다
    #       (JSON Patch add 는 밀어넣기다) — 8) 이 8번으로 밀리고 둘 다 살아 있다. 동작은 같다.
    # 8) 🆕 Tailscale 프록시(사람 평면, C-53) → ES HTTP :9200.
    #    🔴 `namespaceSelector` 가 필수다 — `from.podSelector` 는 **같은 ns(data) 안에서만** 매칭한다.
    #    🔴 ns 전체를 신뢰하지 않고 `mp.io/plane: human` 라벨까지 건다(라벨 공급원 =
    #       platform/tailscale/base/proxyclass.yaml). tailscale ns 에 나중에 다른 파드가 생겨도
    #       자동으로 ES 에 닿지 않는다.
    #    🔴 :9300(transport) 은 **열지 않는다.** 사람은 HTTP API 로만 붙는다 — transport 를 열면
    #       tailnet 쪽에서 클러스터 노드로 참여를 시도할 수 있는 표면이 생긴다.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
          podSelector: { matchLabels: { mp.io/plane: human } }
      ports:
        - { protocol: TCP, port: 9200 }
  egress:
    # 1) DNS (CoreDNS) — 노드 디스커버리가 파드 호스트네임 해석.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # 2) intra-ES transport :9300 (ingress 4)의 나가는 짝). 외부·apiserver·S3 egress 없음(ES 미백업=재파생).
    - to:
        - podSelector: { matchLabels: { elasticsearch.k8s.elastic.co/cluster-name: es } }
      ports:
        - { protocol: TCP, port: 9300 }
