# Elasticsearch exporter is the only new ES monitoring principal. It may receive scrapes from
# Prometheus and may connect only to DNS and the ECK HTTP endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-es-exporter
  namespace: data
spec:
  podSelector:
    matchLabels: {app: elasticsearch-exporter}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 9114}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {elasticsearch.k8s.elastic.co/cluster-name: es}
      ports:
        - {protocol: TCP, port: 9200}
