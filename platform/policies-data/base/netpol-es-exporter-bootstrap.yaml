# One-shot dedicated-user provisioning boundary. It only needs DNS and the ES security API;
# credentials are materialized by ESO before this hook starts, so Kubernetes API egress is absent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-es-exporter-bootstrap
  namespace: data
spec:
  podSelector:
    matchLabels: {app: elasticsearch-exporter-bootstrap}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {elasticsearch.k8s.elastic.co/cluster-name: es}
      ports:
        - {protocol: TCP, port: 9200}
