# 0-18 — LAN ipBlock 을 대체하는 **노드 신원** 기반 probe 허용. (EKS 전용, 2026-08-10 신설)
#
# base 에서 내려간 4건(`mp-pg-instance` ingress[7] · `mp-pg-pooler` ingress[1] ·
# `mp-es` ingress[7] · `mp-redis` ingress[5])의 EKS 대체물이다.
# VPC CIDR 로 치환하지 않은 근거 = `platform/policies/overlays/eks/netpol-node-probe.yaml` 머리말
# (요지: 실측 `policy-cidr-match-mode` 가 빈 값이라 CIDR 규칙은 노드 신원에 애초에 안 걸린다).
#
# ── app ns 판(포트 15021 로 좁힘)과 여기가 다른 이유 ─────────────────────────
# data ns 는 **메시 밖**이다 — probe 가 istio-proxy 로 rewrite 되지 않고 **파드 포트로 직접** 온다.
# 그 포트는 워크로드마다 다르고(CNPG instance-manager 8000 · PgBouncer · ES · exporter …)
# 오퍼레이터가 버전업하며 바꿀 수도 있다. 여기서 포트를 찍으면 그때 증상은
# **"파드가 NotReady 로 안 뜬다"** 이고, 원인이 netpol 로 보이지 않는다.
# 소스가 이미 `host`(= 그 파드가 뜬 노드) 하나로 좁혀져 있어 포트까지 좁힐 실익이 작다.
# → `netpol-observability-entities.yaml` 이 같은 판단을 같은 근거로 이미 내려 뒀다. 그걸 따른다.
#
# ── 🔴 `enableDefaultDeny.ingress: false` 가 없으면 Kafka 가 죽는다 ──────────
# `endpointSelector: {}` 는 data ns **전 파드**를 고른다. Cilium 에서 정책이 엔드포인트를 고르면
# 그 방향의 default-deny 가 켜지므로, 이 플래그가 없으면 **지금 ingress 정책이 전혀 없는
# Kafka(브로커·entity-operator·exporter)까지 ingress 가 잠긴다** — 클라이언트 9092 가 통째로 끊긴다.
# 이 파일의 목적은 "probe 경로 하나를 더해 주는 것" 뿐이다. 순수 additive 로 둔다.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mp-data-node-probe
  namespace: data
spec:
  endpointSelector: {} # data ns 전체 — 현재·미래 스토어의 probe 를 한 번에 덮는다
  enableDefaultDeny:
    ingress: false # 🔴 위 머리말 참조. 빼면 Kafka ingress 가 잠긴다
  ingress:
    - fromEntities:
        - host
