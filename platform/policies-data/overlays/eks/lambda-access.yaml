# AI Lambda → 데이터 티어 접근 경로 — **NodePort**. (2026-08-17 · AI 파트)
#
# ══ 🔴 왜 NLB 가 아닌가 — 내가 처음에 틀렸다 ═══════════════════════════════════
#
# `docs/serverless/06`(앱 레포)에서 나는 *"NodePort 가 아니라 내부 NLB 가 맞다"* 고 썼다.
# 근거는 «Karpenter 가 노드를 수시로 갈아서 노드 IP 는 수명이 분 단위다» 였다. **틀렸다.**
#
#   ① **C-85 가 이미 그 결정을 내렸다** — 「내부 접근 = 로드밸런서 0개」이고, 그 안에
#      *"대시보드 EC2 → 클러스터 = **NodePort + 노드 사설 IP**"* 가 명시돼 있다.
#   ② **내 Karpenter 논거는 C-85 가 이미 답했다** — *"ⓑ ... **MNG 고정 노드**에 묶어
#      Karpenter 노드가 아니다"*. 대상이 `mp-mng-general` 의 **고정 노드**라 갈리지 않는다.
#   ③ **애초에 만들 수도 없다** — AWS Load Balancer Controller 의 IRSA(`mp-lb-controller`)가
#      `CreateLoadBalancer` 를 **일부러** 갖고 있지 않다(앱 레포 `aws-platform/alb.tf`):
#        *"누군가 실수로 Service type: LoadBalancer 를 만들어도 컨트롤러가 LB 를 만들 권한이
#          없어 **조용히 못 만든다**"* — LB 는 Terraform 소유여야 WAF·SG·ACM 이 한 곳에 있다(C-77).
#      ⇒ `type: LoadBalancer` 매니페스트를 넣었으면 **아무 일도 안 일어난 채로 남았을 것**이다.
#
# 🟢 그리고 NodePort 가 실제로 더 싸고 덜 아프다: **$0 · LB 0개**. NLB 는 C-85 가 적어 둔
#    **가역 경로**(*"아프면 NLB 로 올린다(반대는 불가)"*)로 남는다.
#
# ══ 형상 ══════════════════════════════════════════════════════════════════════
#
#   Lambda(VPC · 노드 서브넷 ENI) → 노드 사설 IP:NodePort → Cilium → 파드
#
# 🔵 **노드 SG 를 손댈 필요가 없다** — 같은 오버레이의 `dashboard-access.yaml` 이 확인해 뒀다:
#    *"NodePort 는 노드 SG 가 이미 전 범위로 열려 있어 포트를 막지 않는다."*
#    ⇒ 「관리자가 SG 인그레스를 열어야 한다」는 종전 서술은 **철회**한다.
#
# 🔴 **대상 노드는 MNG 고정 2대다**(C-85 ⓑ 와 같은 이유). Karpenter(`mp-burst`) 노드를
#    가리키면 consolidation 때 사라진다. Lambda 쪽은 psycopg 의 **다중 호스트**로 받는다:
#        PGHOST=10.10.64.103,10.10.82.223     ← 한쪽이 죽어도 다른 쪽으로 붙는다
#    ⚠️ C-85 가 적어 둔 대가가 여기도 그대로다 — **MNG 롤링 업그레이드로 두 대가 동시에
#       교체되면 끊긴다.** 대시보드는 nginx 502 를 알림에 걸어 막았고, Lambda 는 함수 에러율
#       알람이 그 자리다(미설정 — 배포 후 과제).
#
# 🔴 **이 파일만으로는 아직 통하지 않는다. NetworkPolicy 가 따로 필요하다.**
#    `data` ns 는 default-deny 이고 pooler ingress 가 `app` ns 의 `tier: backend` 로 제한돼 있다
#    (`policies-data/base/netpol-pg.yaml`). 그런데 **허용할 출발지 IP 를 아직 못 정한다**:
#      · `externalTrafficPolicy: Cluster` + Cilium 이라 파드가 보는 출발지가
#        **원 클라이언트 IP 일 수도, 노드 IP 일 수도** 있다(백엔드 파드 위치에 따라 갈린다).
#      · 전자면 ipBlock 이 **노드 서브넷 `/20` 두 개**가 되는데, 그건 **클러스터의 모든 파드**를
#        포함한다 — tier-3 잠금이 실질적으로 풀린다.
#      · 후자면 **노드 IP `/32` 2개**로 충분하다 — 훨씬 좁다.
#    ⇒ **측정하고 정한다.** 추측으로 넓게 열면 그 과다허용은 조용히 남는다.
#       측정 = 첫 Lambda 가 붙을 때 pooler 파드에서 실제 출발지를 확인(또는 Hubble).
#
# 🔵 그때까지 이 Service 들은 **무해하다** — 포트만 열리고 정책이 트래픽을 떨군다.
#    Service 를 먼저 두는 이유는 «주소 지정» 이 선행이라서다(C-85 가 말한 진짜 벽).
---
apiVersion: v1
kind: Service
metadata:
  name: mp-pg-pooler-nodeport
  namespace: data
  labels: { app.kubernetes.io/part-of: mp-ai-lambda-access }
spec:
  type: NodePort
  # 🔴 CNPG 가 소유한 `pg-pooler` Service 를 고치지 않는다 — 오퍼레이터가 되돌리고
  #    그 싸움이 조용히 반복된다. 같은 파드를 고르는 **새 Service** 를 옆에 세운다.
  selector:
    cnpg.io/poolerName: pg-pooler
  ports:
    - { name: pgbouncer, port: 5432, targetPort: 5432, nodePort: 30094, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: mp-es-nodeport
  namespace: data
  labels: { app.kubernetes.io/part-of: mp-ai-lambda-access }
spec:
  type: NodePort
  # ECK 가 만드는 `es-es-http` 와 같은 파드를 고른다(그 Service 는 오퍼레이터 소유).
  selector:
    elasticsearch.k8s.elastic.co/cluster-name: es
  ports:
    - { name: http, port: 9200, targetPort: 9200, nodePort: 30095, protocol: TCP }
