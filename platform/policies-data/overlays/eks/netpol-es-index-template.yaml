# 레시피 인덱스 매핑 고정 Job → ES :9200 (EKS 전용, 2026-08-17 신설)
#
# 짝 = `platform/es/overlays/eks/index-template-job.yaml` 의 `mp-es-index-template-provision`.
#
# ── 🔴 이 파일이 없으면 어떻게 실패하는가 (실제로 당했다) ────────────────────
# base `netpol-es.yaml` 이 ES 파드를 고르므로 ES 는 **ingress default-deny** 상태다.
# 6-1 규칙이 `app: es-users-provision` 라벨에만 :9200 을 열어 뒀는데, 이 Job 은 다른
# 라벨(`app: es-index-template-provision`)이라 **막힌다.**
# 증상 = **파드는 `1/1 Running` 인데 로그가 비어 있고 수 분째 끝나지 않는다.**
#   · 로그가 빈 이유는 이중이다 — 정책에 막혀 진도가 안 나가는 데다, Python stdout 이
#     TTY 가 아니라 **버퍼링**돼 종료 전까지 아무것도 안 나온다. 둘이 겹쳐 "멈춘 것처럼" 보인다.
#   · 결국 스크립트의 readiness 재시도 상한(≈445s)에서 "Elasticsearch not ready" 로 죽는데,
#     🔴 **그 메시지가 원인을 가리키지 않는다** — ES 는 멀쩡하고 막은 건 정책이다.
# ⚠️ base `netpol-es.yaml` 6-1 주석이 이 증상을 **2026-08-04 에 이미 적어 뒀다.**
#    Job 을 새로 만들 때는 그 파일부터 볼 것 — 라벨 하나가 곧 접근 권한이다.
#
# ── 왜 base 6-1 에 라벨을 추가하지 않고 새 정책을 만드나 ─────────────────────
# ① base 를 고치면 **온프렘 렌더가 바뀐다**(C-83 동결). 온프렘엔 이 Job 자체가 없어
#    규칙이 무해하게 놀지만, "온프렘 렌더 diff 0" 이라는 머지 조건을 깬다.
# ② NetworkPolicy 는 **합집합**이라 따로 두면 그대로 더해진다 — base 의 ingress 리스트를
#    patch 로 건드릴 필요가 없다. 🔴 그 리스트는 patchMergeKey 가 없어 strategic merge 로
#    손대면 **통째로 치환**돼 기존 6개 규칙이 조용히 사라진다. 건드리지 않는 게 정답이다.
#
# ── 왜 라벨을 재사용하지 않나 ────────────────────────────────────────────────
# `app: es-users-provision` 을 그대로 붙이면 정책 수정 없이 통과한다. 하지만 **라벨이 곧
# 신원**인 곳에서 서로 다른 워크로드가 한 신원을 공유하면, 나중에 그 라벨로 뭔가를 좁힐 때
# 의도치 않은 쪽까지 걸린다. 신원은 하나씩, 허용은 명시적으로 둔다.
#
# ⚠️ `policyTypes: [Ingress]` 만 둔다 — Egress 를 적으면 ES 의 이그레스 정책을 여기서도
#    선언하는 셈이 되고, base 와 합집합이 되며 의미가 흐려진다. 이 파일은 **경로 하나를
#    더해 주는 것**이 전부다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-es-index-template-provision
  namespace: data
spec:
  podSelector:
    matchLabels:
      elasticsearch.k8s.elastic.co/cluster-name: es
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {matchLabels: {app: es-index-template-provision}}
      ports:
        - {protocol: TCP, port: 9200}
