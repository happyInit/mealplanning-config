apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── 온프렘 사이트 오버레이 ─────────────────────────────────────────────────────
# 🔴 여기에 넣을 것 = **온프렘에서만 참인 값**. 온프렘은 C-3 으로 계속 산다(DR + 크롤 프로덕션).
#
# ── 0-18 (2026-08-10): LAN 노드 서브넷 ipBlock 4건을 base 에서 여기로 내렸다 ──
# base 에서 뺀 것 = `netpol-pg.yaml` mp-pg-instance ingress[7] · mp-pg-pooler ingress[1] ·
#                  `netpol-es.yaml` ingress[7] · `netpol-redis.yaml` ingress[5].
# 여기서 **같은 인덱스에 같은 값**으로 되돌린다 → onprem 렌더는 이전과 동일하다.
# 인덱스 고정 이유·유지보수 주의는 `platform/policies/overlays/onprem/kustomization.yaml` 머리말 참조.
resources:
  - ../../base
patches:
  # mp-pg-instance ingress[7] — Prometheus(6) 다음, 온사이트 백업 CronJob(8) 앞
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: mp-pg-instance
    patch: |-
      - op: add
        path: /spec/ingress/7
        value:
          from:
            - ipBlock:
                cidr: 192.168.0.0/24
  # mp-pg-pooler ingress[1] — app backend(0) 다음(= 마지막)
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: mp-pg-pooler
    patch: |-
      - op: add
        path: /spec/ingress/1
        value:
          from:
            - ipBlock:
                cidr: 192.168.0.0/24
  # mp-es ingress[7] — intra-ES transport(4)·ECK operator(5)·프로비저닝 Job(6) 다음(= 마지막)
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: mp-es
    patch: |-
      - op: add
        path: /spec/ingress/7
        value:
          from:
            - ipBlock:
                cidr: 192.168.0.0/24
  # mp-redis ingress[5] — Prometheus(4) 다음(= 마지막)
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: mp-redis
    patch: |-
      - op: add
        path: /spec/ingress/5
        value:
          from:
            - ipBlock:
                cidr: 192.168.0.0/24
