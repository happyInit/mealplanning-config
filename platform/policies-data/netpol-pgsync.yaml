# PGSync daemon and manual lifecycle Jobs share app=pgsync so the same least-privilege
# egress boundary applies before, during, and after bootstrap/retirement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-pgsync-egress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: pgsync
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
              cnpg.io/podRole: instance
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              elasticsearch.k8s.elastic.co/cluster-name: es
      ports:
        - {protocol: TCP, port: 9200}
    - to:
        - podSelector:
            matchLabels:
              app: redis-pgsync
      ports:
        - {protocol: TCP, port: 6379}
