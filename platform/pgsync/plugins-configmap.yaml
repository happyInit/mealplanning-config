apiVersion: v1
data:
  __init__.py: |
    """PGSync 플러그인 패키지.

    PGSync 는 이 `plugins` 패키지를 walk 해서 `pgsync.plugin.Plugin` 서브클래스를
    찾고, schema.json 의 `plugins: [...]` 에 나열된 이름(`klass.name`)과 매칭되는
    것만 인스턴스화한다(별도 PLUGINS env 없음 — 패키지 탐색 방식).

    배포: 공식 이미지 `toluaina1/pgsync`(WORKDIR=/app)의 `/app/plugins/` 로 이 디렉터리를
    마운트해야 로드됨. `__init__.py` 가 있어야 import 가능한 패키지가 된다.
    """
  recipe_servable.py: |
    """PGSync transform 플러그인 — recipe 조립 문서 → 배치 인덱서와 동일한 flat ES 문서.

    schema.json(`deploy/pgsync/schema.json`)의 `plugins: ["RecipeServable"]` 로 등록.
    PGSync 가 recipe(root) + recipe_ingredient(nested `ingredients[]`)를 조립한 뒤
    문서마다 transform() 을 호출한다.

    하는 일:
      1. servable 계산 — design.md §331 게이트를 그대로 재현(STATIC):
           source='10K'  AND  재료 ≥1개  AND  모든 재료 item_id 매칭(NULL 0건).
         price/nutrition 조인 없음 → recipe + recipe_ingredient 만의 함수라
         PGSync CDC 가 변경을 전부 포착(동적 리프레시 불필요).
      2. 평탄화 — 중첩 ingredients[] → ingredient_names[] / ingredient_item_ids[]
         (배치 index_recipes_es.py `_actions` 와 동일 shape → search.py 쿼리 무변경).
      3. 코퍼스(EPIS/COOKRCP01)는 색인하되 servable=false — Phase C 결정 '(나)':
         PGSync 의 None-skip 시맨틱(미검증)에 의존하지 않는 안전 경로.

    ⚠️ servable=false 문서도 색인된다 → search.py 는 반드시 {"term":{"servable":true}}
       로 필터해야 non-servable/코퍼스가 검색에 새지 않는다(컷오버 필수 변경, ③조각).
    """
    from pgsync import plugin

    # ES float 매핑 대상 — PG numeric(→ Decimal) 을 배치의 float() 캐스팅과 동일하게 처리.
    _FLOAT_FIELDS = ("kcal", "carb_g", "protein_g", "fat_g")


    class RecipeServable(plugin.Plugin):
        name = "RecipeServable"

        def transform(self, doc, **kwargs):
            ingredients = doc.get("ingredients") or []

            names = [
                i["ingredient_name"] for i in ingredients if i.get("ingredient_name")
            ]
            item_ids = [
                i["item_id"] for i in ingredients if i.get("item_id") is not None
            ]

            # STATIC 게이트 = source=10K + 실재료≥1 + 실재료 미매칭 0건.
            #   all([]) 는 True 이므로 len>0 를 반드시 함께 검사(실재료 0개 레시피 차단).
            #   실재료 = is_non_ingredient=false. 비-재료(물·얼음·이쑤시개…)는 gazetteer.STOP 이라
            #   일부러 item_id 가 없다 — 이걸 매칭 실패로 세면 물 든 레시피가 통째로 빠진다.
            #   STOP 목록을 여기 복제하지 않는 이유: 이 플러그인은 pgsync 컨테이너에서 돌아
            #   pipelines/ingest/gazetteer.py 를 import 할 수 없다 → 적재시 판정 결과를 컬럼으로 받는다.
            #   ⚠️ 같은 게이트가 pipelines/ingest/index_recipes_es.py 에도 있다(배치·DR 폴백용).
            #      한쪽만 고치면 DR index(recipes)와 CDC alias(recipes_live)가 어긋난다 — 반드시 같이 수정.
            real = [i for i in ingredients if not i.get("is_non_ingredient")]
            doc["servable"] = (
                doc.get("source") == "10K"
                and len(real) > 0
                and all(i.get("item_id") is not None for i in real)
            )

            # 평탄화 — 배치 _actions 와 동일 필드/타입.
            doc["recipe_id"] = doc.get("id")
            doc["ingredient_names"] = names
            doc["ingredient_item_ids"] = [str(x) for x in item_ids]

            # numeric → float (ES float 매핑, Decimal 직렬화 회피).
            for f in _FLOAT_FIELDS:
                v = doc.get(f)
                doc[f] = float(v) if v is not None else None

            # 중첩 원본은 ES 로 내보내지 않음(flat 유지).
            doc.pop("ingredients", None)
            return doc
  shared_recipe.py: |
    """PGSync transform 플러그인 — recipebook.shared_recipe(유저 발행 레시피) → flat ES 문서.

    schema.json(`deploy/pgsync/schema.json`)의 `plugins: ["SharedRecipe"]` 로 등록.
    PGSync 가 recipebook.shared_recipe(root, 자식 테이블 없음 — 재료가 jsonb 컬럼) 문서마다
    transform() 을 호출한다.

    하는 일:
      1. 평탄화 — jsonb ingredients[] → ingredient_names[] (nori 형태소 분석 대상 텍스트).
         shape: [{"name": "돼지고기", "quantity": "300g"}, ...] (services/recipebook/app/models.py
         `IngredientItem`). item_id 는 저장/검색되지 않는다 — 상세 서빙 시 read-time 재매칭 파생값이라
         recipe_servable.py 처럼 ingredient_item_ids 를 만들지 않는다.
      2. 중첩 원본 ingredients 제거 — flat 유지(recipe_servable.py 와 동일 이유).

      컬럼 선택 — schema.json 의 `columns` 에서 검색·목록 카드에 필요한 것만 가져온다
      (id, title, image_url, ingredients, origin, share_token, published_at). user_id(발행자
      식별자)·steps(조리 본문)·user_recipe_id(파생 FK)·source_url(목록에 안 쓰임) 은 제외해
      문서를 최소화한다. 특히 ingredients 는 본 transform 이 ingredient_names 를 만들 때만
      내부적으로 소비하고, 완성 문서에선 pop 된다.

      share_token 은 유지한다 — 공개 발행 목록 카드의 계약(SharedRecipeCard)이 `share_token`
      을 담아 `/shared/<token>` 공개 상세 링크를 만드는데, B단계(읽기 전환)에서 이 카드 데이터를
      ES 로 채울 때 이 필드가 필요하다.

    why shared_recipe (A단계 설계 결정): 발행=insert → 검색 등장 / 취소=delete → 소멸로 CDC 시맨틱이
    정확히 맞는다. 또 user_recipe 에는 비공개 레시피도 있어서 is_public 필터로 거르면 그 필터가 한 번
    깨질 때 남의 비공개 레시피가 검색에 노출된다 — 안 넣는 게 맞다. 따라서 서로 다른 인덱스
    (user_recipes_live)로 가므로 이 플러그인엔 recipe_servable.py 의 servable 게이트가 필요 없다
    (그것은 source='10K' 크롤링 레시피용 게이트다).

    ⚠️ ingredients 는 nullable jsonb 라 NULL 이거나 리스트가 아닐 수 있다 — 방어한다(None → []).
    """
    from pgsync import plugin


    class SharedRecipe(plugin.Plugin):
        name = "SharedRecipe"

        def transform(self, doc, **kwargs):
            ingredients = doc.get("ingredients") or []

            # 리스트가 아닌 값(NULL 이 아닌데 jsonb 가 깨진 경우 등) 방어 — [] 로 강등.
            if not isinstance(ingredients, list):
                ingredients = []

            # name 만 추출. 반드시 문자열이어야 하고, 공백만·빈·None 은 걸러낸다.
            ingredient_names = [
                i["name"] for i in ingredients
                if isinstance(i, dict) and isinstance(i.get("name"), str) and i["name"].strip()
            ]
            doc["ingredient_names"] = ingredient_names

            # 중첩 원본은 ES 로 내보내지 않음 — flat 필드만 유지(recipe_servable.py 와 동일 정책).
            doc.pop("ingredients", None)
            return doc
kind: ConfigMap
metadata:
  name: mp-pgsync-plugins
  namespace: data
