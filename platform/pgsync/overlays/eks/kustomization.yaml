apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-9 로 레지스트리만 채웠다(2026-08-10) — 나머지는 아직 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#    ⚠️ 단 **레지스트리만은 예외** — check_eks_registry() 가 eks 렌더의 mp-* 이미지를 전수 본다.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 0-9 이미지 → ECR · ✅ 0-2 secretStoreRef(2026-08-10) · 0-15 ES 계정 PoLP(pgsync 가 원본 시크릿을 직접 마운트)
#    - 0-2 secretStoreRef · 0-15 ES 계정 PoLP(pgsync 가 원본 시크릿을 직접 마운트)
#    - 🔴 schema/plugins ConfigMap 은 앱 레포 사본이다 — 사이트별로 갈라 놓으면 동기 대상이 둘이 된다.
#      **가급적 base 에 두고 갈지 말 것.**
resources:
  - ../../base


# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`.
# 🔴 mp-pgsync 는 **CI 로 우리가 빌드하는 커스텀 이미지**다(3rd-party 아님) — ECR 리포지터리가 필요하다.
images:
# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`.
# 🔴 mp-pgsync 는 **CI 로 우리가 빌드하는 커스텀 이미지**다(3rd-party 아님) — ECR 리포지터리가 필요하다.
  - name: 192.168.0.10/mealplanning/mp-pgsync
    newName: PLACEHOLDER.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-pgsync
    newTag: "5b4e66c723bbee21bf41066d4736b72fa53aa994"

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:
# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

# ══ 0-8d — emptyDir `sizeLimit` (2026-08-13) ═══════════════════════════════════
# 🔴 **eks 오버레이에만 건다** — 온프렘에 걸면 잘못된 값이 곧 파드 축출이다(C-83 형상 동결).
# 값의 근거·실측·안전 검산 = `docs/eks-emptydir-sizing.md`. 요약:
#   상한 없는 emptyDir 은 노드 ephemeral-storage 를 무제한으로 먹고, 노드가 DiskPressure 에
#   들어가면 kubelet 이 **폭주한 파드가 아니라 이웃 파드들까지** 축출한다. 상한이 있으면
#   초과한 그 파드 하나만 죽는다.
#   라이브 관측(2026-08-13, kubelet /stats/summary): config 레포 소유 emptyDir(EKS 대상 19개)의 최대는
#   **32 KiB**. 아래 값은 관측의 수천 배이고, 19개가 동시에 상한까지 차도 합계 3.4 GiB =
#   노드 allocatable ephemeral 43.7 GiB 의 8% 다(sizeLimit 은 예약이 아니라 상한).
# 🔴 `op: test` 를 앞에 두는 이유 = 인덱스 기반 JSON6902 는 base 의 volumes 순서가 바뀌면
#    **엉뚱한 볼륨에 상한을 건다.** test 가 깨지면 렌더가 죽어서 validate.py 가 잡는다.
  - target: {group: apps, version: v1, kind: Deployment, name: mp-pgsync}
    patch: |-
      # checkpoint → 64Mi — 재시작 시 재동기화 체크포인트 · 관측 12KiB
      - op: test
        path: /spec/template/spec/volumes/0/name
        value: checkpoint
      - op: add
        path: /spec/template/spec/volumes/0/emptyDir/sizeLimit
        value: 64Mi
      # plugins-dir → 32Mi — ConfigMap 복사본(..data 심링크 함정 회피) · 관측 32KiB
      - op: test
        path: /spec/template/spec/volumes/3/name
        value: plugins-dir
      - op: add
        path: /spec/template/spec/volumes/3/emptyDir/sizeLimit
        value: 32Mi
