apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PGSync(PG→ES CDC) 본문. child app = platform/argocd/pgsync.yaml (수동 sync).
# 🔴 디렉터리형 → kustomize 변환(0-1, 2026-08-09). 배경·주의는 platform/es/base/kustomization.yaml 머리말과 동일.
# 🔴 schema-configmap.yaml·plugins-configmap.yaml 은 앱 레포 deploy/pgsync/* 의 사본이다 —
#    한쪽만 고치면 갈린다(AGENTS.md §PGSync).
resources:
  - pgsync.yaml            # Deployment + ExternalSecret 2종
  - schema-configmap.yaml  # PGSync 스키마(앱 레포 사본)
  - plugins-configmap.yaml # PGSync 플러그인(앱 레포 사본)
  - redis-pgsync.yaml      # PGSync 전용 Redis 브로커
  - monitoring.yaml        # PrometheusRule
