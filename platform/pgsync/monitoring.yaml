# PGSync 알람 — `.11` PGSyncDown/PGSyncCrashLooping 이식 (PR #275 계열: 16h 무알람 크래시루프 사고).
# 구 규칙은 cadvisor container_last_seen 기반이었는데, K8s 에선 kube-state-metrics 프리미티브가
# 더 단순·견고하다. PGSync 는 자체 /metrics 가 없어(업스트림 미지원) 프로세스 생존만 본다 —
# CDC 정체는 platform/pg/monitoring.yaml 의 MpPGReplicationSlotRetainedWALHigh 가 슬롯 쪽에서 잡는다.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-pgsync
  namespace: data
spec:
  groups:
    - name: mp-pgsync
      rules:
        - alert: MpPGSyncDown
          expr: |
            kube_deployment_status_replicas_available{namespace="data", deployment=~"mp-pgsync|mp-redis-pgsync"} < 1
          for: 10m
          labels:
            severity: critical
            service: data-tier
          annotations:
            summary: "{{ $labels.deployment }} 가용 레플리카 0 — PG→ES CDC 중단"
            description: "PGSync 가 죽으면 recipes_pgsync 인덱스가 정체되고 논리 슬롯이 WAL 을 붙잡는다(슬롯 알람 동반 예상)."

        # PG 재시작·유지보수 중에는 PGSync 가 연결 상실로 수 회 재시작하는 게 정상이다
        # (2026-07-30 PG 리소스 반영 롤링에서 3회 실측) — 그 케이스는 원인(PG 쪽 이벤트)과
        # 동반 발화하므로 맥락으로 구분한다.
        - alert: MpPGSyncCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="data", pod=~"mp-(redis-)?pgsync-.*"}[15m]) > 2
          labels:
            severity: critical
            service: data-tier
          annotations:
            summary: "{{ $labels.pod }} 15분 내 3회 이상 재시작 — 크래시루프 의심"
