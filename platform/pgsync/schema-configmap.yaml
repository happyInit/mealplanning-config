apiVersion: v1
data:
  schema.json: |
    [
      {
        "database": "foodbudget",
        "index": "recipes_live",
        "plugins": ["RecipeServable"],
        "nodes": {
          "table": "recipe",
          "schema": "public",
          "columns": [
            "id",
            "source",
            "name",
            "category",
            "cook_method",
            "cooking_time",
            "level_nm",
            "serving",
            "kcal",
            "carb_g",
            "protein_g",
            "fat_g",
            "image_url"
          ],
          "children": [
            {
              "table": "recipe_ingredient",
              "schema": "public",
              "label": "ingredients",
              "columns": [
                "ingredient_name",
                "item_id",
                "is_non_ingredient"
              ],
              "relationship": {
                "variant": "object",
                "type": "one_to_many"
              }
            }
          ]
        }
      },
      {
        "database": "foodbudget",
        "index": "user_recipes_live",
        "plugins": ["SharedRecipe"],
        "nodes": {
          "table": "shared_recipe",
          "schema": "recipebook",
          "columns": [
            "id",
            "title",
            "image_url",
            "ingredients",
            "origin",
            "share_token",
            "published_at"
          ]
        }
      }
    ]
kind: ConfigMap
metadata:
  annotations:
    # T-3 live daemon was stable on recipes_live from 2026-08-03T07:09:55Z.
    # The old slot may be retired only after this reviewed, recorded rollback window.
    operations.mealplanning.io/legacy-slot-retire-after: "2026-08-03T09:15:00Z"
  name: mp-pgsync-schema
  namespace: data
