# PGSync — PG(recipe) → ES stable write alias `recipes_live` CDC. ✅ T-3 전환 완료(2026-08-03).
# runtime 슬롯은 `foodbudget_recipes_live`; alias 의 현재 generation backing 은 운영 검증기로 확인한다.
# generation settings/mapping 정본과 lifecycle gate = ops/pgsync-stable-alias/.
#
# env 계약 = .8 pgsync 컨테이너 실물(docker inspect) + Q13 ES 인증 2개.
# 🔴 구 주석 "SCHEMA·checkpoint 는 이미지 내장"은 오류였다(전환창 실측) — 이미지(deploy/pgsync/Dockerfile)는
#    pgsync 패키지만 담고, schema.json·plugins/ 는 .8 에서 compose 볼륨이었다. K8s 에선 아래 ConfigMap
#    2개(schema-configmap.yaml·plugins-configmap.yaml)로 공급한다. 런타임 정본은 이 레포의 두
#    ConfigMap 이다. 앱 레포 deploy/pgsync/ 사본은 이미지 개발용 mirror 이므로 같은 변경에서 맞춘다.
# 🔴 plugins 는 ConfigMap 직마운트 금지 — 마운트 디렉토리의 ..data 심링크를 pgsync 플러그인 로더가
#    모듈로 오인해 ModuleNotFoundError("plugins.") 로 죽는다(전환창 실측). initContainer 복사 경유가 해법이다.
#
# ✅ 이미지 확보(2026-07-29 06:54 UTC 릴리스 런): mp-pgsync :5b4e66c7…+:1.1.11+:latest.
---
# data ns 공통 Harbor pull secret IaC 화 (런북 §9-21 부채 해소, 2026-07-30) — 수동 복제 대체.
# 집이 여기인 이유: data ns 의 harbor 이미지 최다 소비자가 pgsync (그 외 ES nori 사이드로드).
# 선행조건·형식은 pipelines/externalsecret.yaml 의 동일 사본 주석 참조 (백엔드 = fb-secrets `harbor-pull`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-harbor-pull
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: harbor
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef: {key: harbor-pull, property: REGISTRY}
    - secretKey: username
      remoteRef: {key: harbor-pull, property: USERNAME}
    - secretKey: password
      remoteRef: {key: harbor-pull, property: PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pgsync-secrets
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-pgsync-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: data-secrets # 적재 = platform/pg/README.md (pgsync 롤 비밀번호는 basebackup 으로 승계됨)
        property: PGSYNC_PG_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-pgsync
  namespace: data
  labels:
    app: pgsync
spec:
  replicas: 1 # ✅ 전환창 §4-10 기동(2026-07-29). 논리 슬롯 = 단일 소비자라 1 초과 금지(object_spec §2.2)
  strategy:
    type: Recreate # replicas=1 고정 워크로드 — 롤링이면 순간 2파드 = 슬롯 경합 (status §3 RWO 수칙과 동계열)
  selector:
    matchLabels:
      app: pgsync
  template:
    metadata:
      labels:
        app: pgsync
    spec:
      priorityClassName: app-normal # 서빙 alias(recipes_live) 생산자라 pipeline 급이 아니다 (§9-10)
      initContainers:
        - name: copy-plugins # 🔴 ..data 심링크 함정 회피 — ConfigMap 을 emptyDir 로 복사(파일 상단 주석)
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994
          command: ["sh", "-c", "cp /plugins-src/*.py /app/plugins/"]
          volumeMounts:
            - name: plugins-src
              mountPath: /plugins-src
            - name: plugins-dir
              mountPath: /app/plugins
      containers:
        - name: pgsync
          image: 192.168.0.10/mealplanning/mp-pgsync:5b4e66c723bbee21bf41066d4736b72fa53aa994 # 🔴 상단 주석 — CATALOG 릴리스 후 :sha
          args: ["-c", "/app/schema.json", "-d"] # 🔴 -d(데몬) 필수 — 없으면 1회 동기화 후 종료를 반복한다(전환창 실측)
          env:
            - name: PG_HOST
              value: pg-rw # Pooler 금지 — LISTEN/NOTIFY 는 transaction 풀링에서 죽는다(object_spec §4.5.3)
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: pgsync
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mp-pgsync-secrets
                  key: PG_PASSWORD
            - name: ELASTICSEARCH_HOST
              value: es-es-http
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_SCHEME
              value: http # 플랜 §5.2 — HTTP TLS 끔 확정
            - name: ELASTICSEARCH_USER
              value: elastic
            - name: ELASTICSEARCH_PASSWORD # Q13 — ECK 인증 강제분. ECK 가 만드는 Secret 을 같은 ns 라 직참조
              valueFrom:
                secretKeyRef:
                  name: es-es-elastic-user
                  key: elastic
            - name: REDIS_HOST
              value: redis-pgsync
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_CHECKPOINT
              value: "False"
            - name: SCHEMA
              value: /app/schema.json
            - name: CHECKPOINT_PATH
              value: /app/checkpoint
          volumeMounts:
            - name: checkpoint
              mountPath: /app/checkpoint
            - name: schema
              mountPath: /app/schema.json
              subPath: schema.json # 단일 파일이라 subPath — 디렉토리 스캔이 없어 ..data 함정 무관
            - name: plugins-dir
              mountPath: /app/plugins
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi # status §2.1 예산 ~0.3GB — CPU limits 금지(§13.7)
      volumes:
        - name: checkpoint
          emptyDir: {} # 재시작 시 재동기화 — 현행 .8 도 컨테이너 FS 라 동일 특성. 문서 8.4k 규모라 수 분
        - name: schema
          configMap:
            name: mp-pgsync-schema # → schema-configmap.yaml (런타임 정본; 앱 레포 deploy/pgsync/ 는 mirror)
        - name: plugins-src
          configMap:
            name: mp-pgsync-plugins # → plugins-configmap.yaml — 직마운트 금지, initContainer 로 복사
        - name: plugins-dir
          emptyDir: {}
