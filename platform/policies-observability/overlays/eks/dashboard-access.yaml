# 대시보드 EC2(C-84) → EKS 관측 스택 접근 경로 — 🔴 **IaC 로 편입 (2026-08-16 · 감사 A-1)**
#
# 🔴 **왜 이 파일이 생겼나** — 이 경로가 통째로 **git 밖에 손으로** 만들어져 있었다.
#    라이브 오브젝트에 `app.kubernetes.io/managed-by: mp-dashboard-manual` 라벨이 붙어 있어
#    *의도한 수동 조치*인 것은 분명한데 **어디에도 기록이 없었다.** 위험이 둘이었다:
#      ① `mp-policies-observability` 는 수동 sync 앱이다 — 누가 sync 하는 순간
#         `prometheus-query` 의 추가 규칙이 되돌아가 **대시보드가 Prometheus 를 잃는다.**
#         증상이 *"정책은 그대로인데 접근만 끊김"* 이라 원인을 짚기 어렵다.
#      ② 클러스터를 재구축하면 경로가 소멸하고 **왜 있었는지가 남지 않는다.**
#
# 🔴 **왜 NodePort 인가 (C-85 의 귀결)** — 내부 로드밸런서가 **0개**라(C-85) 대시보드 EC2 가
#    ClusterIP 에 닿을 방법이 없다. ClusterIP 는 VPC 에 존재하는 주소가 아니고 클러스터 DNS 도
#    EC2 에는 없다. 남는 수단이 `kubectl port-forward`(상시 유지 불가 · 감사로그 폭주) 와
#    **NodePort** 뿐이고, 후자를 골랐다.
#    🔵 LB 는 여전히 0개다 — NodePort 는 로드밸런서를 만들지 않는다.
#
# 🔵 **`10.10.0.72/32` = `mp-dashboard` EC2**(`i-0b28079e87febf176`, VPC-A 공개 서브넷).
#    ipBlock 을 쓰는 이유 = 그 기계는 **클러스터 밖**이라 podSelector 로 지목할 수 없다.
#    🔴 **여기가 유일한 문지기다** — NodePort 는 노드 SG 가 이미 전 범위로 열려 있어
#       포트를 막지 않는다. 접근 통제는 이 NetworkPolicy 세 개가 전부다.
---
apiVersion: v1
kind: Service
metadata:
  name: mp-prometheus-nodeport
  namespace: observability
  labels: { app.kubernetes.io/part-of: mp-dashboard-access }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prometheus-stack-prometheus
  ports:
    - { name: http, port: 9090, targetPort: 9090, nodePort: 30091, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: mp-loki-nodeport
  namespace: observability
  labels: { app.kubernetes.io/part-of: mp-dashboard-access }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - { name: http, port: 3100, targetPort: 3100, nodePort: 30092, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: mp-tempo-nodeport
  namespace: observability
  labels: { app.kubernetes.io/part-of: mp-dashboard-access }
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/name: tempo
  ports:
    - { name: http, port: 3200, targetPort: 3200, nodePort: 30093, protocol: TCP }
---
# Prometheus 쪽은 base 에 이미 정책이 있으므로 **여기서 만들지 않고 kustomization 에서 규칙만 덧댄다**
# (같은 이름의 NetworkPolicy 를 두 번 만들면 나중 것이 앞 것을 통째로 덮는다).
# Loki·Tempo 는 base 에 대응 정책이 없어 새로 만든다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-observability-loki-query-dashboard
  namespace: observability
  labels: { app.kubernetes.io/part-of: mp-dashboard-access }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: loki }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.10.0.72/32 }   # mp-dashboard EC2
      ports:
        - { port: 3100, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-observability-tempo-query-dashboard
  namespace: observability
  labels: { app.kubernetes.io/part-of: mp-dashboard-access }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.10.0.72/32 }   # mp-dashboard EC2
      ports:
        - { port: 3200, protocol: TCP }
