# MinIO egress 잠금 — 백업 저장소만 먼저 잠근다. (2026-08-03)
#
# baseline 이 ns 전체를 Ingress 만 다루는데(Prometheus 스크레이프·Alertmanager webhook 때문에
#   ns 단위 egress 잠금은 별건), **MinIO 하나는 예외로 지금 잠근다**. 이유:
#   · 2026-08-03 부터 여기에 PG 전체 논리 덤프가 쌓인다 = ns 안에서 가장 값나가는 파드다.
#   · 그런데 egress 프로파일이 제일 단순하다 — MinIO 는 **아무 데도 먼저 걸지 않는다**.
#     서버 역할만 하고(Loki·Tempo·백업잡이 들어올 뿐), 복제·ILM 티어링·webhook 알림 미설정.
#   → 비용이 거의 0 인데 "털려도 밖으로 못 내보낸다"가 성립한다. 지금 거는 게 남는 장사다.
#
# ⚠️ 나중에 MinIO 에 **버킷 복제나 이벤트 알림을 붙이면 여기부터 막힌다.** 그 기능들은
#    MinIO 가 바깥으로 먼저 connect 하는 동작이라, 이 정책에 목적지를 추가해야 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mp-minio-egress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Egress # 🔴 Ingress 는 baseline·crossns 가 담당한다. 여기 넣으면 규칙 0개 = 전면차단이 된다.
  egress:
    # DNS 만. 그 외 전부 차단 — 인터넷 포함.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
