# CNPG Pooler (PgBouncer) — P2 는 **배포만·무트래픽** (런북 Q8).
# 앱 전환·반복부하 검증·psycopg3 prepare_threshold 함정 대응(object_spec §4.5.3)은 전부 P3.
# 🔴 PGSync 는 이걸 못 쓴다 — LISTEN/NOTIFY 가 세션 기능이라 transaction 풀링에서 죽는다
#    → PGSync 는 pg-rw 직접(object_spec §4.5.3). HPA(P3)의 전제가 이 Pooler 다(status §3).
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pg-pooler # Service 이름도 pg-pooler — P3 에서 앱 PGHOST 가 이걸 가리키게 된다
  namespace: data
spec:
  cluster:
    name: pg
  instances: 2 # status §2.1 — replica 2 + PDB
  type: rw
  pgbouncer:
    poolMode: transaction
  template:
    metadata:
      labels:
        app: pg-pooler
    spec:
      priorityClassName: data-critical
      # 🔴 pgbouncer 컨테이너를 이름으로 명시해 resources 를 준다 — CNPG 가 같은 이름으로 머지한다.
      #    빈 배열([])이면 CNPG 가 resources 없이 채워 파드가 **BestEffort** 가 되고, 노드 메모리
      #    압박 시 커넥션 풀(전 앱이 DB 붙는 급소)이 **가장 먼저 축출**된다(2026-08-03 실측).
      #    명시로 **Burstable** 승격 — priorityClassName 만으론 QoS 축출 순위를 못 바꾼다.
      #    PgBouncer 는 경량이라 64~128Mi 로 충분.
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
# 노드 드레인·재부팅 때 두 인스턴스가 동시에 내려가지 않게 (status §2.1 "replica 2 + PDB")
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mp-pg-pooler-pdb
  namespace: data
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: pg-pooler
