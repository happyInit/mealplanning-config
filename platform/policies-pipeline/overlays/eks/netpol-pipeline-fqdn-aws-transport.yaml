# A5-b — 크롤 운반(S3/SQS) egress · **EKS 전용** (2026-08-16)
#
# 리파이너 3종이 Kafka 대신 **S3 객체 + SQS 메시지**로 일감을 받는다(C-44). base 의
# `mp-pipeline-egress` 가 pipeline ns 전 파드를 **default-deny egress** 로 돌리므로, 이 규칙이
# 없으면 리파이너가 AWS 엔드포인트로 못 나간다.
#
# 🔴 **없을 때의 실패 양식이 고약하다** — 거부가 RST 로 오지 않고 **드롭**이라, boto3 는
#    에러가 아니라 **연결 타임아웃까지 무한 대기**한다. 파드는 Running·재시작 0·로그도 조용한데
#    큐만 쌓인다. 2026-08-03 컬리 97% 유실이 정확히 이 양식이었다(막힌 줄 몰랐다).
#
# 🔵 **base 가 아니라 여기인 이유** = 온프렘엔 이 경로가 없다. 온프렘은 Kafka 로 운반하고
#    (C-3 크롤 상시 프로덕션), S3 로 올리는 쪽은 *업로더*(크롤 CronJob)지 리파이너가 아니다.
#    C-83 = 온프렘 형상 동결 · AWS 는 덧셈만.
#
# ⚠️ **적용 전제 — 지금 EKS 엔 `mp-policies-pipeline` Application 자체가 없다**(실측 2026-08-16:
#    argocd 에 `mp-policies-observability` 하나뿐, pipeline ns 의 netpol 0건). 즉 이 파일은
#    *지금 뭔가를 뚫는 것*이 아니라 **정책을 켜는 순간 리파이너가 죽지 않게 미리 맞춰 두는 것**이다.
#    🔴 순서가 뒤집히면(정책 먼저·이 규칙 나중) 리파이너가 조용히 멈춘다.
---
# ── 리파이너 3종 → S3 · SQS · STS ────────────────────────────────────────────
# 실측 소스 = `pipelines/transport/_s3.py`(get_object·put_object) · `_sqs.py`(receive·delete
# ·change_message_visibility) — 둘 다 `boto3.client(..., region_name=ap-northeast-2)`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mp-pipeline-fqdn-crawl-transport
  namespace: pipeline
spec:
  endpointSelector:
    matchExpressions:
      - { key: app, operator: In, values: [retail-refiner, deal-notifier, recipe-refiner] }
  egress:
    # toFQDNs 의 전제 — DNS L7 가시성. 이게 없으면 Cilium 이 이름→IP 매핑을 학습하지 못해
    # 아래 toFQDNs 가 **아무것도 허용하지 못한다**(같은 ns 의 다른 FQDN CNP 와 동일 규약).
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # ── S3 ───────────────────────────────────────────────────────────────
        # 🔴 **두 이름이 다 필요하다.** boto3 기본은 virtual-hosted 주소라 실제 접속 이름은
        #    `<버킷>.s3.<리전>.amazonaws.com` 이다. 리전 엔드포인트만 열면 그 이름이 안 맞아
        #    막힌다. 반대로 버킷 이름만 열면 리전 리디렉트·버킷 위치 조회가 막힌다.
        - matchName: "mp-crawl-ap2.s3.ap-northeast-2.amazonaws.com"
        - matchName: "s3.ap-northeast-2.amazonaws.com"
        # ── SQS ──────────────────────────────────────────────────────────────
        # 큐 3개가 같은 호스트다(경로만 다르다) — FQDN 은 하나면 된다.
        - matchName: "sqs.ap-northeast-2.amazonaws.com"
        # ── STS (IRSA) ───────────────────────────────────────────────────────
        # 🔴 0-16 으로 정적 AWS 키가 시크릿에서 빠졌으므로 자격증명은 **STS 왕복으로만** 생긴다.
        #    이게 막히면 S3·SQS 를 열어 놔도 **토큰 교환 단계에서** 죽는다 — 증상이 "S3 접근 실패"
        #    로 보여 엉뚱한 곳을 고치게 된다. (bedrock 패치가 같은 이유로 이미 이 둘을 연다.)
        - matchName: "sts.ap-northeast-2.amazonaws.com"
        - matchName: "sts.amazonaws.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
