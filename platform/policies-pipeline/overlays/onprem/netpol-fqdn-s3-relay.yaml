# crawl-s3-relay 의 S3 egress — **온프렘 전용** (A5-b · 2026-08-16)
#
# base `mp-pipeline-egress` 가 pipeline ns 전 파드를 **default-deny egress** 로 돌린다.
# 🔴 온프렘은 그게 **실제로 켜져 있다**(실측 2026-08-16: `mp-pipeline-egress` 15일째 라이브).
#    EKS 와 다르다 — 거긴 아직 `mp-policies-pipeline` Application 자체가 없다.
#    ⇒ 이 규칙 없이 릴레이를 올리면 **첫 실행부터 막힌다.**
#
# 🔴 실패 양식이 고약하다 — 거부가 RST 가 아니라 **드롭**이라 boto3 가 에러 대신 연결 타임아웃까지
#    무한 대기한다. Job 은 시간만 끌다 실패하고, 로그엔 "왜" 가 안 남는다.
#    2026-08-03 컬리 97% 유실이 정확히 이 양식이었다(막힌 줄 몰랐다).
#
# 🔵 **STS 는 열지 않는다.** 릴레이는 IRSA 가 아니라 **정적 키**(`mp-crawl-uploader`)로 붙으므로
#    토큰 교환 왕복이 없다. EKS 쪽 리파이너는 반대로 STS 가 반드시 필요하다 — 자격증명 방식이
#    달라서 여는 것도 다르다(policies-pipeline/overlays/eks 의 같은 계열 규칙과 대조).
#
# 🔵 `endpointSelector` 를 릴레이 하나로 좁힌다 — 같은 ns 의 크롤러·AI 배치는 S3 에 갈 일이 없다.
#    (base 가 대상별 CNP 분리를 규약으로 두고 있다 — `netpol-pipeline-fqdn-ai.yaml` 머리말)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mp-pipeline-fqdn-s3-relay
  namespace: pipeline
spec:
  endpointSelector:
    matchLabels:
      app: crawl-s3-relay
  egress:
    # toFQDNs 의 전제 — DNS L7 가시성. 없으면 Cilium 이 이름→IP 를 학습하지 못해
    # 아래 toFQDNs 가 **아무것도 허용하지 못한다**(이 ns 의 다른 FQDN CNP 와 동일 규약).
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # 🔴 **두 이름이 다 필요하다.** boto3 기본은 virtual-hosted 주소라 실제 접속 이름은
        #    `<버킷>.s3.<리전>.amazonaws.com` 이다. 리전 엔드포인트만 열면 그 이름이 안 맞아
        #    막히고, 버킷 이름만 열면 리전 리디렉트·버킷 위치 조회가 막힌다.
        - matchName: "mp-crawl-ap2.s3.ap-northeast-2.amazonaws.com"
        - matchName: "s3.ap-northeast-2.amazonaws.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
