apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 ─────────────────────────────────────────────────────
# 신설 = 0-1(2026-08-09). 1-31 로 내용 확정(2026-08-10).
#
# 🔴 **이 트랙은 EKS 에서 렌더 결과가 빈다.** base 의 유일한 리소스가 Harbor pull secret 인데
#    ECR 은 kubelet 이 노드 인스턴스 롤로 당기므로(IRSA/Pod Identity 는 파드 전용이라 이미지 풀에
#    관여하지 않는다) dockerconfigjson 이 불요하다.
#    남기면 온프렘 `fb-secrets` 의 `harbor-pull` 을 EKS 스토어(SSM, C-23)에서 찾다가
#    **영구 SecretSyncedError** 가 된다.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 0-9 ECR 은 노드 롤·IRSA 로 당기므로 **pull secret 자체가 불요**할 수 있다
#      (✅ 0-2 는 그때까지의 안전판으로 스토어만 갈아 뒀다 — 2026-08-10, 아래 patches)
#      (C-27 로 Argo Rollouts 는 전 서비스 Blue-Green 으로 확대된다 — 컨트롤러는 계속 산다)
resources:
  - ../../base

# 🔴 그렇다고 `resources: []` 로 base 를 끊지 않는다 — base 에 다른 리소스가 추가되면
#    eks 만 조용히 빠지기 때문이다. base 는 계속 물고, **지울 것만 명시적으로 지운다.**
#
# ⚠️ Argo Rollouts **컨트롤러 자체**는 이 트랙이 아니다 — Helm 소스 Application
#    `platform/argocd/rollouts.yaml` 이고, 그 안 initContainer 이미지가 Harbor LAN IP 다(0-9).
#    그건 `platform/argocd` 가 아직 base/overlays 로 안 갈라져서 **여기서 손댈 수 없다**(0-4 컷오버 선행).
#    C-27 로 Rollouts 는 전 서비스 Blue-Green 으로 확대되므로 컨트롤러는 EKS 에서도 산다.


# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-ssm`(SSM ParameterStore + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → /mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-harbor-pull
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-harbor-pull
