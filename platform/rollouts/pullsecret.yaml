# Harbor pull secret — argo-rollouts ns.
#
# 왜 필요해졌나(2026-08-03): 플러그인 vendoring(ADR-0001 §6.2, config #114)으로 컨트롤러가
#   **처음으로 Harbor 이미지를 당기게 됐다**(initContainer `mp-rollouts-gatewayapi-plugin`).
#   플랫폼 ns 는 그전까지 전부 공개 레지스트리 이미지만 써서 풀 시크릿이 없었고,
#   그래서 #114 머지 직후 새 컨트롤러 pod 가 `Init:ErrImagePull`
#   (`no basic auth credentials`) 로 멈췄다. 이 파일이 그 구멍을 메운다.
#
# 패턴은 app/pipeline ns 와 동일(common/pullsecret.yaml · pipelines/externalsecret.yaml):
#   fb-secrets 의 `harbor-pull`(robot 계정) ──ESO──▶ 이 ns 의 dockerconfigjson `harbor`.
#   🔴 target 이름을 `harbor` 로 맞춘다 — 차트 values 의 imagePullSecrets 가 이 이름을 문다.
#
# 🔴 이 매니페스트를 argo-rollouts 차트의 `extraObjects` 로 넣지 말 것.
#   그 값은 Helm 이 `tpl` 로 렌더하므로 아래 `{{ .registry }}` 등 **ESO 템플릿이 Helm 에게
#   먼저 먹혀** 빈 값으로 치환된다 → 조용히 깨진 dockerconfigjson 이 만들어진다(에러도 안 남).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: harbor
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef: {key: harbor-pull, property: REGISTRY}
    - secretKey: username
      remoteRef: {key: harbor-pull, property: USERNAME}
    - secretKey: password
      remoteRef: {key: harbor-pull, property: PASSWORD}
