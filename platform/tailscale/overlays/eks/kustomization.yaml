apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 (C-53) — 🔴 **아직 배포 대상이 아니다.** ───────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE).
#    여기가 비어 있어도 검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것:
#   · 🔴 **MagicDNS 이름** — Service 2개의 `tailscale.com/hostname` 을 `-eks` 로.
#     tailnet 전역 유일이라 안 갈면 온프렘 디바이스와 충돌한다. 그리고 이름이 곧 접속 주소이므로
#     사람이 **어느 사이트 PG 에 붙었는지** 를 이름으로 구분해야 한다(양쪽 DB 이름이 다 `pg` 다).
#   · 🔴 **Connector(subnet router)는 AWS 에 두지 않는다** — ⟳ C-55(2026-08-11) 로 미채택.
#     하던 일을 다른 것이 이미 덮고 있었다: 노드 접속 = SSM Session Manager(C-37) ·
#     ElastiCache = 파드에서 `kubectl exec` · VPC-B/C 는 원래도 못 붙었다(VPC-A 대역만 광고).
#     ⇒ **EC2 5대 → 4대.** 도구 서브넷은 비우되 대역은 예약 유지(사후 변경 불가 · 비용 $0).
#     ⇒ 이 오버레이가 할 일은 광고 대역 교체가 **아니라 `connector-subnet-onprem.yaml` 제외**다
#       (base 를 그대로 받으면 온프렘용 Connector 가 EKS 에 딸려 온다 — `192.168.0.0/24` 를
#       AWS 에서 광고하는 꼴이 된다). AWS 쪽은 **Operator 단독**이다.
#     🟡 되살릴 조건 = EKS 엔드포인트 IP 허용목록을 exit node 로 채우기로 할 때(체크리스트 미결 ⑮).
#     ~~C-53 ①: 도구 서브넷 subnet router `t4g.nano` = Terraform 트랙~~ → 만들지 말 것.
#   · `externalsecret-oauth.yaml` secretStoreRef → `mp-aws-ssm`(0-2). 🔴 `remoteRef` 는 안 바꾼다
#     (스토어 prefix `/mp/prod/` 가 key 앞에 붙는다).
#   · netpol-proxy-egress.yaml 의 LAN 규칙(4번) → VPC 대역으로. 온프렘 `192.168.0.0/24` 는 무의미.
#   · ProxyClass 자원값은 그대로 — Graviton(arm64)에서도 tailscale 이미지는 멀티아치다.
resources:
  - ../../base

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) / eks = `mp-aws-ssm`(SSM + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 안 바꾼다 —
#    스토어의 `prefix: /mp/prod/` 가 key 앞에 붙어 파라미터 이름이 된다
#    (예: tailscale-secrets → /mp/prod/tailscale-secrets). 상세 = bootstrap/eso/README.md
# ⚠️ 값 자체(OAuth 클라이언트)는 **사이트마다 다른 것을 쓰는 게 맞다.** 같은 클라이언트를
#    양쪽에서 쓰면 한쪽을 revoke 할 때 다른 쪽도 죽는다 — 사이트 격리의 요점이 그것이다.
patches:
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-tailscale-oauth}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: mp-tailscale-oauth, namespace: tailscale}
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-ssm
