# Tailscale 프록시/Connector 파드의 공통 형상.
#
# 🔴 **이 파일이 존재하는 첫 번째 이유 = 라벨.** netpol 은 라벨로만 파드를 잡는데,
#    오퍼레이터가 만드는 프록시 StatefulSet 의 라벨은 우리가 안 정한다.
#    여기서 `mp.io/plane: human` 을 심어 netpol-proxy-egress.yaml 이 그걸 셀렉터로 쓴다.
#    (오퍼레이터 기본 라벨 `tailscale.com/parent-resource` 도 있지만, 그건 업스트림 소유라
#     스키마가 바뀔 수 있다. 우리 정책이 우리 라벨에 걸리게 한다.)
#
# 🔴 두 번째 이유 = **자원 상한**. 프록시는 사람이 안 붙어 있을 때 거의 0 이지만,
#    상한이 없으면 노드 압박 국면에 예측이 안 된다. C-45 로 노드가 2대가 되면 더 아프다.
#    memory req==limit 로 Guaranteed 를 만들어 축출 순서에서 데이터 티어보다 먼저 죽게 한다
#    (사람 평면이 데이터 평면보다 먼저 죽는 게 맞다).
#
# 🔴 세 번째 = **privileged 를 명문화**한다. Tailscale v1.78+ 부터 프록시의 main 컨테이너는
#    `/dev/net/tun` 생성을 위해 privileged 로 돈다(+ CAP_NET_ADMIN). 즉 이 ns 는
#    PSS `baseline` 으로는 **파드가 안 뜬다** — `enforce: privileged` 가 필요하다.
#    ⇒ 그래서 ACL(../acl/policy.hujson)과 netpol 이 "문서"가 아니라 실제 통제여야 한다.
#      privileged ns 를 하나 들이는 대가를 치르는 중이므로, 그 안의 파드가 갈 수 있는 곳은
#      좁혀 놓아야 한다. ns PSS 라벨은 Ansible 소관(app 레포 `k8s_cluster_base`).
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: mp-tailscale-proxy
spec:
  statefulSet:
    pod:
      labels:
        mp.io/plane: human
      tailscaleContainer:
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 64Mi
      tailscaleInitContainer:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 32Mi
