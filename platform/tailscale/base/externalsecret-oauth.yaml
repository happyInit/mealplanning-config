# 오퍼레이터가 tailnet 에 붙는 자격증명 — fb-secrets(정본) ──ESO──▶ tailscale ns.
# 패턴은 platform/pg/base/externalsecrets.yaml 과 동일(스토어 = fb-kubernetes, C-23 로 온프렘 유지).
#
# 🔴 **auth key 가 아니라 OAuth 클라이언트다.** 이게 키 정책(⑤)의 핵심이다:
#     auth key         한 번 발급되면 그 문자열 자체가 tailnet 가입 권한이다 = 장기 자격증명
#     OAuth 클라이언트  오퍼레이터가 **필요할 때마다 짧은 수명의 auth key 를 스스로 발급**한다
#   ⇒ 우리가 보관하는 비밀은 회수 가능한 클라이언트 하나로 줄고, 파드가 들고 있는 것은 단기 키다.
#   🔴 그래서 **secrets.yml 에 auth key 를 적으면 안 된다.** 적는 순간 ⑤가 무의미해진다.
#
# 🔴 클라이언트 발급 시 스코프 = `devices:core` + `auth_keys` (write), 태그 = 아래 4개만.
#    OAuth 클라이언트는 **자기 태그 밖의 디바이스를 만들 수 없다** — 그게 폭발 반경 상한이다.
#      tag:k8s-operator · tag:mp-pg · tag:mp-es · tag:mp-subnet-onprem
#    태그 4개는 ../acl/policy.hujson 의 tagOwners 에 선언돼 있어야 한다.
#    🔴 ACL 을 먼저 올리고 그 다음 클라이언트를 만든다 — 순서를 뒤집으면 태그가 없어서 발급이 막힌다.
#
# 🔴 fb-secrets 적재 (사람이 1회 · 값은 레포에 절대 금지):
#      kubectl -n fb-secrets create secret generic tailscale-secrets \
#        --from-literal=TS_OAUTH_CLIENT_ID='<admin console → Settings → OAuth clients>' \
#        --from-literal=TS_OAUTH_CLIENT_SECRET='<동일>'
#    검증: kubectl -n tailscale get externalsecret  → SecretSynced/Ready
#    🔴 값 확인에 `kubectl describe secret` 을 쓰지 말 것(값이 박힌다). 키 목록은 -o go-template.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-tailscale-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    # 🔴 이름·키 이름이 차트 규약이다(`operator-oauth` / `client_id` · `client_secret`).
    #    바꾸면 오퍼레이터가 자격증명을 못 찾고 tailnet 에 안 붙는다 —
    #    증상은 "파드는 Running 인데 디바이스가 안 생긴다" 로 조용하다.
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-secrets
        property: TS_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: tailscale-secrets
        property: TS_OAUTH_CLIENT_SECRET
