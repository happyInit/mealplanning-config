# Namespace 5종 + PSA(Pod Security Admission) 라벨 — EKS 사이트 정본 (0-3).
#
# 🔴 **PSA 는 Namespace 라벨이다.** 다른 오브젝트에 적을 자리가 없다 — 그래서 "PSA 를 config 로"
#    는 필연적으로 "Namespace 오브젝트를 config 로" 가 된다. 온프렘에서는 Ansible 이 ns 를
#    만들면서 같이 붙인다(그쪽은 C-83 으로 동결 — 건드리지 않는다).
#
# 🔴 **EKS 는 PSA 를 기본으로 안 켜준다.** EKS 클러스터의 네임스페이스는 라벨이 없으면
#    `enforce` 가 없는 상태(=privileged 와 동등)다. 즉 이 파일이 없으면 온프렘에서 통과하던
#    하드닝(#505)이 AWS 에서 **조용히 사라진다** — 파드는 전부 잘 뜨기 때문에 아무도 모른다.
#    보안 회귀 중 가장 발견이 늦는 유형이다.
#
# 라벨 값은 온프렘 라이브 실측(2026-08-13)과 **동일**하다. 사이트별로 다르게 둘 이유가 없고,
# 다르면 "온프렘에서 통과한 파드가 AWS 에서 거부"가 된다:
#   app        enforce=restricted  audit=restricted  warn=restricted   (+ istio-injection=enabled)
#   data       enforce=baseline    audit=restricted  warn=restricted
#   pipeline   enforce=baseline    audit=restricted  warn=restricted
#   mp-ingress enforce=restricted  audit=restricted  warn=restricted
#   observability enforce=baseline audit=restricted  warn=restricted
#
# 🔴 **data·pipeline·observability 가 baseline 인 것은 완화가 아니라 사실 기록이다** —
#    CNPG·ECK·Strimzi·kube-prometheus-stack 이 restricted 를 통과하지 못한다(fsGroup·볼륨 초기화).
#    restricted 로 올리면 데이터 티어가 통째로 admission 거부된다. 올리려면 각 오퍼레이터의
#    securityContext 를 먼저 손봐야 하고, 그건 이관과 무관한 별건이다.
#
# 🔴 여기 **없는 네임스페이스**(= 이 파일이 책임지지 않는 것):
#    · Ansible `eks_operators` 가 `create_namespace: true` 로 만드는 것 —
#      `cert-manager` `external-secrets` `istio-system` `argocd`. 🔴 **그것들의 PSA 라벨은
#      아직 아무도 안 붙인다**(별건 — 이 5개와 같은 방식으로 여기 추가하면 된다).
#
# ── ✅ 해소(2026-08-14 · 사용자 확정 ⑴) — 오퍼레이터 ns 5종을 여기서 만든다 ────
# 🔴 **이게 A1 을 막고 있었다.** ArgoCD 로 깔리는 오퍼레이터들이 자기 ns 를 못 만들어
#    `namespaces "cnpg-system" not found` 로 5회 재시도 후 실패했고, **오퍼레이터 파드가 0개**였다.
#    ⚠️ `Healthy` 로 보여서 더 늦게 발견됐다 — CRD 는 **클러스터 스코프**라 ns 없이도 적용되기
#      때문이다. 즉 *"CRD 는 있는데 컨트롤러가 없는"* 상태였다.
#
# 🔴 **왜 자동으로 안 생겼나** = `helm install --create-namespace` 는 만들지만
#    **ArgoCD 는 그걸 안 한다**(차트를 렌더해서 apply 할 뿐). 그리고 cnpg 차트 자체에
#    Namespace 오브젝트가 없다(실측: 렌더 21개 중 Namespace 0). 온프렘은 전부 Ansible 이라
#    이 경계가 없었다 — **"Ansible 이 까는 층"과 "ArgoCD 가 까는 층"의 이음매에서 빠진 것.**
#
# 🟢 **⑵(Terraform)·⑶(포기) 를 안 고른 이유**
#    ⑵ 는 클러스터 오브젝트의 소유자가 둘(Terraform·ArgoCD)이 된다.
#    ⑶ 은 하드닝(#505)이 AWS 에서 **조용히** 사라진다 — 파드는 전부 잘 뜨므로 아무도 모른다.
#    ⚠️ ArgoCD 의 `managedNamespaceMetadata`(= ns 를 만들며 라벨까지 붙임)도 실재하고 우리
#      ArgoCD 3.4.5 가 지원한다. 그쪽이 응집도는 높지만, **PSA 전경을 한 파일에서 보는 것**이
#      이 파일의 존재 이유라 여기로 모았다. 오퍼레이터를 자주 넣고 빼게 되면 재고할 것.
#
# 🔴 라벨 값은 **온프렘 라이브 실측 그대로**(2026-08-14 · 6/6 전부 동일):
#      cnpg-system · elastic-system · strimzi-system · keda · argo-rollouts · cost
#      · redis-operator-system  →  enforce=baseline / audit=restricted / warn=restricted
#    ⚠️ 그중 **`strimzi-system`·`redis-operator-system` 은 여기 없다** — 그 오퍼레이터를
#      EKS 에서 통째로 뺐기 때문이다(C-39 Kafka 제거 · C-14 ElastiCache). 실측으로 EKS 경로에
#      Kafka·Redis CR 이 0건이고, `pgsync` 전용 Redis 는 오퍼레이터 CR 이 아니라 평범한
#      Deployment 다. **CR 이 없으면 오퍼레이터는 죽은 무게다.**
#    · 온프렘 물리에만 있는 것 — `metallb-system` `openebs` `cilium-secrets` `fb-secrets`
#      (C-16 으로 OpenEBS 없음 · MetalLB 는 NLB 로 대체(C-26) · ESO 백엔드는 Secrets Manager(C-36)).
#    · `mp-users` — 사람 RBAC 용(앱 레포 `k8s_team_rbac` 롤). RBAC 이관 자체가 미결이라 제외.
#
# ── 🔴 `app` = restricted + istio-injection 의 숨은 전제: **istio-cni** ────────
# restricted PSA 아래서는 `NET_ADMIN`·`NET_RAW` 를 가진 initContainer 가 금지된다. 그런데
# Istio 의 기본 주입 방식(`istio-init`)이 정확히 그 권한을 요구한다 → **사이드카 주입이 PSA 에
# 거부되어 파드가 아예 안 뜬다.**
# 온프렘이 restricted 로 굴러가는 이유는 **istio-cni 가 깔려 있어서**다(P0 에서 같이 설치했다) —
# CNI 플러그인이 iptables 를 대신 잡아 주므로 특권 initContainer 가 필요 없다.
# 🔴 **EKS 에도 istio-cni 가 반드시 먼저 있어야 한다.** 그건 이 레포 밖(Istio 설치 = 앱 레포 Ansible)
#    이고, 순서가 어긋나면 `app` ns 워크로드 전부가 기동 실패한다.
#    ⚠️ 완화책으로 `app` 을 baseline 으로 낮추지 말 것 — 그러면 하드닝(#505)이 사라진다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # 🔴 Istio sidecar 주입 스위치. 없으면 사이드카가 안 붙고, mTLS STRICT(PeerAuthentication)
    #    아래에서 **평문으로 말하는 파드**가 되어 서비스 간 통신이 전부 막힌다.
    istio-injection: enabled
  annotations:
    # 🔴 Namespace prune 은 그 안의 전부를 데려간다. Application 쪽 prune=false 와 이중 방어.
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: mp-ingress
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system # CloudNativePG 오퍼레이터 (C-15 — RDS/Aurora 미채택, 자체운영 유지)
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: elastic-system # ECK 오퍼레이터 (C-15 — OpenSearch 미채택)
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda # KEDA (C-44 — SQS 기반 크롤 리파이너 스케일링)
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts # Argo Rollouts (C-27 — 전 서비스 Blue-Green)
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cost # kubecost — 클러스터 비용 배분
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
