apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 (mp-ingress ns) — 🔴 **아직 배포 대상이 아니다.** ─────
# 골격 = 0-1(2026-08-09). 내용 = 0-17·0-18(2026-08-10, 이 커밋).
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다. **초록 ≠ 이관 준비 완료.**
#    적용 순서·검증 게이트는 `docs/netpol-eks-cutover.md`.
#
# ── 빼는 것 (C-5) ────────────────────────────────────────────────────────────
# cloudflared 는 **온프렘 DR 전용 존치**다. AWS 유입은 Cloudflare(주황) → NLB(C-26)라
# 클러스터 안에 터널 파드가 없다. 정책 2개와, 공개 GW ingress 의 cloudflared 규칙까지 같이 뺀다.
# 🔴 `mp-gw-public-ingress` 규칙 2 를 안 빼면 `*.argotunnel.com` 계열 자산은 아니지만
#    "존재하지 않는 파드를 신뢰하는 규칙" 이 남는다 — 0-18 이 지적한 와일드카드 SNI
#    (`*.argotunnel.com`)도 cloudflared 정책과 함께 여기서 사라진다.
#
# ── 손대지 않은 것 ───────────────────────────────────────────────────────────
# · `mp-gw-public-egress`(DNS·istiod·backend·frontend·tempo)는 전부 클러스터 안이라 사이트 무관.
# · `mp-default-deny-{ingress,egress}` 도 그대로.
resources:
  - ../../base
  - netpol-deny-imds.yaml
patches:
  # ── (C-5) cloudflared 정책 2종 소멸 ────────────────────────────────────────
  - patch: |-
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: mp-cloudflared-egress
        namespace: mp-ingress
      $patch: delete
  - patch: |-
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: mp-cloudflared-ingress
        namespace: mp-ingress
      $patch: delete
  # ── (C-5 · C-26) 공개 GW ingress 재작성 ────────────────────────────────────
  #
  # base 의 ingress = [0] world→443·80 · [1] cloudflared→443 · [2] host→15021
  #
  # ① [1] cloudflared 규칙 제거 — 그 파드가 EKS 에 없다.
  # ② 대신 `remote-node`→443·80 을 **한시적으로** 추가한다. 근거와 제거 조건:
  #    C-26 은 NLB target-type `instance` 다. NLB 는 instance 타깃에서 클라이언트 IP 를
  #    보존하므로 정상 경로의 소스는 `world` 다(= [0] 이 덮는다).
  #    🔴 문제는 **크로스노드 홉**이다. NodePort 를 받은 노드에 GW 파드가 없으면 Cilium 이
  #       다른 노드로 넘기면서 노드 IP 로 SNAT 하고, 그 순간 신원이 `world` → `remote-node` 로 바뀐다.
  #       그러면 [0] 에 안 걸려 **공개 서비스가 전면 불가**가 된다.
  #    ⚠️ 온프렘 실측(2026-08-06)에서는 두 노드 모두 `world` 가 보존됐지만, 그건 MetalLB L2 경로였다.
  #       NLB+NodePort 는 경로가 달라 그 실측을 그대로 옮길 수 없다.
  #    → **제거 조건**: 게이트웨이 Service 를 `externalTrafficPolicy: Local` 로 두면
  #      NLB 가 GW 파드가 있는 노드에만 보내 홉 자체가 사라지고, 클라이언트 IP 도 보존된다
  #      (Cloudflare 실주소 로깅에도 그게 맞다). 그 설정이 확정되고 conntrack 실측으로
  #      `remote-node` 유입이 0 임을 확인하면 **이 규칙 하나만 지우면 된다.**
  #      → 미결(산출 §결정필요): 공개 GW Service 의 externalTrafficPolicy.
  #    위험도 평가: 여는 대상이 **우리 노드**이고 포트는 이미 공개된 443·80 하나다.
  #                반대 방향의 실수(빠뜨림)는 전면 장애라 비대칭이 크다.
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: mp-gw-public-ingress
    patch: |-
      - op: remove
        path: /spec/ingress/1
      - op: add
        path: /spec/ingress/-
        value:
          fromEntities:
            - remote-node
          toPorts:
            - ports:
                - { port: "443", protocol: TCP }
                - { port: "80", protocol: TCP }
      # ── ③ 🔴 **ALB 유입 (C-60) — 2026-08-16 신설. 이게 없으면 공개 사이트가 죽는다.** ──
      #
      # 위 ①②는 **C-26(NLB · target-type `instance`) 시절에 쓰였다.** C-60 이 진입을 ALB 로
      # 바꾸면서 유입 형상이 통째로 달라졌는데 이 파일이 따라오지 않았다:
      #
      #   NLB(instance) : 클라이언트 IP 보존 → 소스 = world · 헬스체크 = **노드**(host)
      #   ALB(ip)       : ALB ENI 가 **파드 IP 로 직접** 연결 · 헬스체크도 **그 ENI 에서** 온다
      #
      # 🔴 **실측(2026-08-16)** — 타깃그룹 포트 **443** · 헬스체크 포트 **15021** `/healthz/ready`
      #    · targetType **ip** · 등록 타깃 = 파드 IP `10.10.66.144`·`10.10.83.233`(healthy).
      #    base 의 15021 규칙은 `fromEntities: host` 뿐이라 **ALB 헬스체크가 걸리지 않는다**
      #    ⇒ 타깃 2개가 전부 unhealthy 로 떨어지고 **`aws.mealbong.cloud` 가 죽는다.**
      #    증상이 "정책만 켰는데 사이트가 죽음" 이라 원인을 게이트웨이에서 찾게 된다.
      #
      # 🔵 **`world` 로 때우지 않고 CIDR 로 못박는 이유** — Cilium 이 VPC 안의 미지 IP 를
      #    `world` 로 볼지는 IPAM·native-routing 설정에 딸린 문제다. ALB 가 사는 곳은
      #    확정돼 있으므로(공개 서브넷 2개) **거기서 온다고 적는 편이 분류에 의존하지 않아
      #    안전하고, 범위도 `world` 보다 좁다.**
      - op: add
        path: /spec/ingress/-
        value:
          fromCIDRSet:
            - cidr: 10.10.0.0/24   # mp-subnet-public-ap-northeast-2a
            - cidr: 10.10.1.0/24   # mp-subnet-public-ap-northeast-2b
          toPorts:
            - ports:
                - { port: "443", protocol: TCP }
                - { port: "80", protocol: TCP }
                - { port: "15021", protocol: TCP }   # 🔴 ALB 헬스체크
