apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Redis(OT-Container-Kit) 본문. child app = platform/argocd/redis.yaml (수동 sync).
# 🔴 디렉터리형 → kustomize 변환(0-1, 2026-08-09). 배경·주의는 platform/es/base/kustomization.yaml 머리말과 동일.
# 🔴 분기 C(Sentinel-aware 클라이언트) 근거는 ../README.md.
resources:
  - redis.yaml      # RedisReplication(+ 인라인 Sentinel)
  - config.yaml     # redis.conf ConfigMap
  - monitoring.yaml # ServiceMonitor + PrometheusRule
