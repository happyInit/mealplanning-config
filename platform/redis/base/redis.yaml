# Redis HA — OT-Container-Kit redis-operator (차트 0.25.0, platform-root 가 설치. 여기선 CR 만).
#
# 출처: PR happyInit/food-budget-app#370(Redis 담당) 의 `deploy/k8s/redis-ha.yaml` 을 config 레포로
# 이관하면서 계획(`docs/mp_k8s_redis_ha_handoff.md` §3·§6 · `object_spec §13.7`) 과 어긋난 6건을 교정.
#
# 🔴 영속성 금지 — AOF/RDB 를 켜면 2026-07-22 사고가 재발한다(handoff §6). HA 의 목적은 데이터
#    보존이 아니라 연속성이다. 그래서 volumeMount/PVC 가 없는 게 의도다.
# 🔴 `redis-pgsync`(data ns, 별도 Deployment)와 통합 금지 — 같은 사고의 격리 결론.
#
# ⚠️ **배치 원칙의 한계(2026-07-29 실측)**: handoff §3 은 "primary = A" 를 요구하지만 이 오퍼레이터는
#    StatefulSet ordinal-0 을 master 로 삼고(오퍼레이터 로그 `falling back to Status.MasterNode`),
#    StatefulSet 은 ordinal 별 노드 지정을 지원하지 않는다. host-a 노드도 `worker-a1` 하나뿐이라
#    nodeSelector 로 몰면 두 파드가 같은 노드에 앉아 HA 가 사라진다.
#    → **선언적으로 보장 가능한 것은 "존 분리"까지**이고, master 가 어느 존에 앉는지는 스케줄 결과다.
#    "primary = A" 를 강제하려면 페일오버 후 수동 조정이 필요하다 — 분기 확정 시 재검토.
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: mp-redis
  namespace: data
spec:
  clusterSize: 2 # master 1 + replica 1
  priorityClassName: data-critical
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.3 # 🔴 7.x 명시 핀 — 안 박으면 오퍼레이터 기본값 v8.x 로 뜬다(handoff §3)
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # 🔴 CPU limits 없음 — object_spec §13.7(부하테스트 병목 재발 위험). 하필 페일오버·재동기
        #    구간에서 스로틀링이 걸린다. 메모리는 requests=limits 로 OOM 예측성 확보(§13.7 각주).
        memory: 256Mi
  pdb:
    enabled: true # 원본엔 없었다 — 드레인이 2대를 동시에 걷어가면 복제가 통째로 사라진다
    minAvailable: 1
  # 존 분리 강제 — 상단 ⚠️ 참조. 이게 없으면 두 복제본이 같은 물리호스트에 앉을 수 있다(= HA 껍데기).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: mp-redis
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0

  # 🔴 축출 정책 + RDB 끄기 (2026-08-02) — 아래 ConfigMap `mp-redis-config` 를 붙인다.
  #
  # 왜: 실측(2026-08-02) 결과 라이브 설정이 `maxmemory 0`(무제한) + `maxmemory-policy noeviction`
  #     인데 컨테이너 한도는 256Mi 다. 즉 메모리가 차면 Redis 가 **키를 버리는 대신 OOMKill 당한다**
  #     → 재시작 → 전량 flush → Sentinel 페일오버 유발. 캐시로 쓰면서 축출을 꺼둔 구성이다.
  #     한도를 명시하면 커널이 아니라 Redis 가 결정하고, 서비스는 살아 있는 채로 오래된 키만 버린다.
  #
  # 🔴 왜 allkeys-lru 가 아니라 volatile-lru 인가 — 이 Redis 는 순수 캐시가 아니다(키 실측):
  #     retail:deals:active / :detail   ttl=-1 (영구)  = 딜 워킹셋, mp-deal-pruner 가 관리
  #     video:recipe:<url>              ttl≈28~30일    = 순수 캐시(Gemini 재호출로 복원 가능)
  #     ocr:job:<id>                    ttl=1h         = OCR 진행상태 (앱 코드)
  #     video:lock:<url>                SET NX EX      = 단일플라이트 락 (앱 코드)
  #     allkeys-lru 면 TTL 없는 딜 워킹셋까지 조용히 사라진다. volatile-lru 는 그걸 보호한다.
  #     그리고 LRU 가 유리하게 작동한다 — OCR 잡은 프론트가 1초마다 폴링해 계속 hot 이라 가장 늦게
  #     축출되고, 오래 안 쓴 video 캐시가 먼저 나간다.
  #
  # 🔴 save "" — 이 파일 헤더의 "영속성 금지"가 실제로는 안 지켜지고 있었다. 실측:
  #     CONFIG GET save -> "3600 1 300 100 60 10000"  (RDB 켜짐)
  #     CONFIG GET dir  -> /data                       (PVC 없음 = 컨테이너 레이어)
  #     즉 재시작하면 어차피 사라질 RDB 를 노드 ephemeral 스토리지에 쓰고 있었고, BGSAVE fork 의
  #     copy-on-write 가 256Mi 한도 안에서 OOM 위험만 키웠다. 의도대로 끈다.
  #     (replica 재동기는 save 포인트와 무관하다 — repl-diskless-sync 경로를 쓴다.)
  #
  # 적용 경로 검증(실물 이미지 quay.io/opstree/redis:v7.2.3, 2026-08-02):
  #     /usr/bin/entrypoint.sh:8    EXTERNAL_CONFIG_FILE=...:-"/etc/redis/external.conf.d/redis-additional.conf"
  #     /usr/bin/entrypoint.sh:120      echo "include ${EXTERNAL_CONFIG_FILE}" >> /etc/redis/redis.conf
  #     include 가 redis.conf **끝에** 붙으므로 여기 값이 기본값을 덮는다. ConfigMap 키 이름은
  #     추측이 아니라 업스트림 예제(example/v1beta2/additional_config/configmap.yaml)로 확인했다.
  redisConfig:
    additionalRedisConfig: mp-redis-config

  # 🔴 인라인 Sentinel (2026-07-29, 3차 실측 후 도입) — 별도 RedisSentinel CR 을 대체한다.
  #
  # 왜: 별도 CR 로 두면 **오퍼레이터와 Sentinel 이 서로를 모른다.** Sentinel 이 복제본을 승격시켜도
  #     오퍼레이터가 ordinal-0 을 master 로 되돌려서(failback), Sentinel 은 자기가 뽑은 옛 master 를
  #     계속 광고한다 → 클라이언트가 읽기전용 복제본을 잡는다(READONLY, 245초+ 관측).
  # 어떻게: 오퍼레이터의 슬레이브·role 재구성 분기는 `!EnableSentinel()` 로 게이팅돼 있다.
  #     여기 sentinel 을 인라인으로 두면 게이팅이 닫혀 **failback 코드가 아예 돌지 않고**,
  #     승격 권한이 Sentinel 하나로 모인다(= 제어면 단일화).
  # 🔴 대가: 오퍼레이터가 슬레이브를 고쳐주지 않으므로 Sentinel 이 놓친 슬레이브는 그대로 남는다(#1779).
  #     탐지는 `monitoring.yaml` 의 MpRedisNoReplica(connected_slaves<1) — 2차 실측에서 동작 확인됨.
  #     이 알람이 이 구성의 안전장치다. 끄지 말 것.
  sentinel:
    size: 3 # quorum 2
    image: quay.io/opstree/redis-sentinel:v7.2.3
    imagePullPolicy: IfNotPresent
    quorum: "2"
    downAfterMilliseconds: "10000"
    failoverTimeout: "60000"
    parallelSyncs: "1"
    priorityClassName: data-critical
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi # CPU limits 없음 — object_spec §13.7
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mp-redis-s # 🔴 인라인 sentinel 의 실제 라벨(실측). `mp-redis-sentinel` 로 쓰면
            # 셀렉터가 아무것도 못 잡아 제약이 조용히 무효가 된다 — 실제로 3대 중 2대가 b2 에 몰렸다.
