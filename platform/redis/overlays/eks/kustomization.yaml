apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격만이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-1 이 만드는 것은 "가를 자리"이고, **내용은 Wave B 에서 채운다.**
# 지금은 base 통과라 렌더는 성공하지만 값은 온프렘 그대로다 — 이대로 붙이면 틀린다.
#
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 🔴 **이 트랙은 EKS 에서 통째로 사라진다** — C-14 = ElastiCache for Valkey
#      `cache.t4g.micro` Multi-AZ 2노드. → eks 오버레이는 `resources: []` 가 정답일 가능성이 높다.
#      **Wave B 에서 확정할 것.** 지금 통과로 두면 RedisReplication CR 이 EKS 로 샌다
#    - 대체 경로 = app-common 의 Redis 엔드포인트 교체(common 트랙)
resources:
  - ../../base
