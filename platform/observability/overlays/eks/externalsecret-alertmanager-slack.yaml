# Alertmanager Slack 웹훅 — 🔴 **EKS 사이트 전용** (A2, 2026-08-14).
#
# ── 왜 이 파일이 필요한가 ─────────────────────────────────────────────────────
# `platform/argocd/overlays/eks/kube-prometheus-stack.yaml` 머리말이 이 갭을 **이미 예고**하고 있다:
#   "③ ExternalSecret/observability/mp-alertmanager-slack — 🔴 config 레포에 없다.
#    라이브에서는 Ansible 이 직접 apply 한다 … 없으면 Alertmanager 파드가
#    `secrets:` 마운트 실패로 **아예 안 뜬다.**"
# 실측(2026-08-14)에서 정확히 그대로 났다 — Alertmanager 가 `Init:0/1` 로 9분 넘게 멈춰 있었고
# 사유는 `MountVolume.SetUp failed … secret "mp-alertmanager-slack" not found` 였다.
#
# ── 왜 Ansible 이 아니라 여기인가 ─────────────────────────────────────────────
# 온프렘은 `k8s_observability` 롤이 `files/alertmanager-slack-externalsecret.yaml` 을 apply 한다.
# 그 파일은 `secretStoreRef: fb-kubernetes`(K8s provider) 라 **EKS 에서 쓸 수 없고**, 그 롤은
# 온프렘 전용이라 손대지 않는다(C-83 형상 동결).
# 🟢 EKS 에는 **이미 같은 모양의 선례가 옆에 있다** — `externalsecret-grafana-admin.yaml`.
#    같은 오버레이·같은 스토어·같은 배선이므로 새 관례를 만들지 않고 그 옆에 둔다.
#
# ── 🔴 값을 넣는 사람이 해야 할 일 (이 레포 밖) ───────────────────────────────
# Secrets Manager 에 `mp/prod/alertmanager-slack` 파라미터(JSON)를 두고 그 안에
# `webhook_default` · `webhook_critical` 두 키를 넣는다.
#   · `prefix: mp/prod/` 는 `mp-aws-secrets` ClusterSecretStore 가 붙인다(SITES.md §0-2).
#     그래서 여기 `key:` 는 `alertmanager-slack` 으로 **온프렘과 한 글자도 다르지 않다.**
#   · `property` 에 gjson 메타문자(`.` 등)를 쓰지 않는다 — 같은 §0-2 의 전제.
#
# 🔵 **여기는 온프렘 값을 승계한다** — grafana 와 반대다. 그 파일은 *"온프렘 비밀번호를 그대로
#    옮기지 말 것(C-23: 비밀은 양 사이트 독립)"* 이라고 적는데, 그 원칙은 **우리 시스템에 들어오는
#    자격증명**에 대한 것이다. Slack 웹훅은 자격증명이 아니라 **같은 팀 채널로 가는 목적지**다 —
#    사이트별로 다른 URL 을 쓰면 알림이 두 채널로 갈라져 오히려 운영이 나빠진다.
#    (실제로 C-65~C-68 이 보안 알림도 같은 Slack 으로 모으기로 확정했다.)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-alertmanager-slack
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mp-aws-secrets
  target:
    name: mp-alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook_default
      remoteRef: {key: alertmanager-slack, property: webhook_default}
    - secretKey: webhook_critical
      remoteRef: {key: alertmanager-slack, property: webhook_critical}
