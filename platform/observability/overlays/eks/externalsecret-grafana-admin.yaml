# Grafana 관리자 자격증명 — 🔴 **EKS 사이트 전용** (0-3, 2026-08-13).
#
# ── 왜 EKS 에만 있나 ──────────────────────────────────────────────────────────
# 온프렘은 kube-prometheus-stack values(앱 레포 Ansible 템플릿 + `secrets.yml`)에
# `grafana.adminPassword` 를 **평문으로** 갖고 있다. 그 파일은 git 밖이라 성립한다.
# EKS 는 스택 Application 이 **이 공개 레포 안**에 있으므로(0-3, `platform/argocd/overlays/eks/
# kube-prometheus-stack.yaml`) 같은 방법을 쓸 수 없다 — 그래서 `admin.existingSecret` 으로 우회하고
# 그 시크릿을 ESO 로 만든다.
# 🔴 **온프렘 쪽은 바꾸지 않는다**(C-83). 이 파일은 base 가 아니라 eks 오버레이에만 있다.
#
# ── 🔴 값을 넣는 사람이 해야 할 일 (이 레포 밖) ───────────────────────────────
# Secrets Manager 에 `mp/prod/observability-secrets` 파라미터(JSON)를 두고 그 안에
# `GRAFANA_ADMIN_USER` · `GRAFANA_ADMIN_PASSWORD` 두 키를 넣는다.
#   · `prefix: mp/prod/` 는 `mp-aws-secrets` ClusterSecretStore 가 붙인다(SITES.md §0-2).
#     그래서 여기 `key:` 는 `observability-secrets` 로 **온프렘과 한 글자도 다르지 않다.**
#   · `property` 에 gjson 메타문자(`.` 등)를 쓰지 않는다 — 같은 §0-2 의 전제.
# 🔴 온프렘 비밀번호를 그대로 옮기지 말 것 — 사이트가 다르면 자격증명도 다르다(C-23: 비밀은 양 사이트 독립).
#
# ── 🔴 이 파일이 실제로 배포되려면 선행이 하나 더 있다 ────────────────────────
# `observability-secrets` Application 의 `spec.source.path` 가 아직
# `platform/observability/overlays/onprem` 이다(실측 2026-08-13 — eks 렌더에서 git 소스 child
# **10개**가 여전히 onprem 경로를 가리킨다). 그 일괄 전환은 SITES.md §0-4 가 별건으로 남겨 둔 것이고,
# 그것이 오기 전까지 이 파일은 **무생물**이다. 순서를 뒤집으면 Grafana 가
# `CreateContainerConfigError` 로 안 뜬다 — 조용한 실패가 아니라서 그나마 낫다.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # 🔴 EKS 백엔드 = Secrets Manager + IRSA (C-36). 온프렘 `fb-kubernetes` 가 아니다.
    #    같은 트랙의 다른 ExternalSecret 처럼 오버레이 패치로 갈지 않고 여기 직접 적는 이유 =
    #    이 리소스 자체가 eks 전용이라 갈릴 온프렘 짝이 없다.
    name: mp-aws-secrets
  target:
    name: mp-grafana-admin
    creationPolicy: Owner
  data:
    # 키 이름은 스택 Application 의 `grafana.admin.{userKey,passwordKey}` 와 짝이다.
    - secretKey: admin-user
      remoteRef:
        key: observability-secrets
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: observability-secrets
        property: GRAFANA_ADMIN_PASSWORD
