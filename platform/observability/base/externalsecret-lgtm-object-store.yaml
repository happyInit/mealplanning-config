# Loki·Tempo 오브젝트 스토어 자격증명 — fb-secrets(정본) ──ESO──▶ observability ns.
# 패턴은 platform/pg/base/externalsecrets.yaml 과 동일(스토어 = fb-kubernetes · C-23 온프렘 유지).
#
# 🔴 **무엇을 대체하는가** — Ansible 롤 `k8s_platform_apps` 의 `lgtm-minio-secret.yaml.j2`.
#    그 롤이 `kubectl apply` 로 시크릿을 심어 왔고 **ArgoCD 관리 밖**이었다(실측: 시크릿에
#    tracking-id 없음). 단일 공급원이 IaC 의 다른 트랙에 있으면
#      · config 레포만 보는 사람에게는 그 시크릿이 **어디서 오는지 안 보이고**
#      · 롤을 지우는 순간 Loki·Tempo 가 다음 재시작에 죽는다(그래서 CLAUDE.md 가 금지해 뒀다)
#    ⇒ 여기가 정본이 되면 롤의 시크릿 태스크를 걷을 수 있다.
#
# 🔴 **`target.name` 을 기존 이름 그대로 둔다** — `lgtm-minio-creds`.
#    Loki·Tempo 의 `extraEnvFrom.secretRef.name` 이 이 이름을 참조하고, 그 값은
#    `platform/argocd/base/{loki,tempo}.yaml` 의 인라인 valuesObject 안에 있다.
#    이름을 바꾸면 **두 Application 도 같이 고쳐야 하고**, 그러면 무관한 재배포가 섞인다.
#    ⇒ 이 PR 은 "누가 공급하나" 만 바꾼다. 소비자는 변화를 못 느껴야 한다.
#
# 🔴 **전환은 무중단이 아니라 "무변화" 여야 한다.** 값이 지금 라이브와 **같아야** 한다 —
#    다르면 Loki·Tempo 가 다음 재시작에 스토어 인증에 실패한다(그리고 Tempo 는 fail-fast 다).
#    ⇒ 절차·검증 = ../README.md §전환. 🔴 값을 터미널에 출력하지 말 것.
#
# ⚠️ 지금 라이브 값은 **MinIO root 계정**이다(`k8s_platform_apps` 템플릿이 `minio_root_user`·
#    `minio_root_password` 를 그대로 넣는다 — 템플릿 주석도 "root 계정 재사용" 을 인정한다).
#    즉 observability ns 가 MinIO **전 버킷**(loki·tempo·models·mp-pg-onsite)의 root 를 들고 있다.
#    🔴 이건 이 PR 이 만든 문제가 아니고 **C-18 로 소멸한다**(MinIO 자체가 없어진다) —
#       그래서 여기서 버킷별 계정 분리를 하지 않는다. 소멸할 자격증명에 부품을 붙이지 않는다.
#       (대조: `mp-pg-onsite-minio` 는 전용 키를 쓴다 — 그쪽은 처음부터 분리돼 있다.)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-lgtm-object-store
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: lgtm-minio-creds # 🔴 기존 이름 유지 — 위 주석 참조
    creationPolicy: Owner
  data:
    # 🔴 키 이름도 유지 — Loki 는 `${MINIO_ACCESS_KEY_ID}`,
    #    Tempo 는 `${MINIO_ACCESS_KEY_ID}` 를 config 안에서 치환한다
    #    (`-config.expand-env=true` + extraEnvFrom). 키 이름이 곧 환경변수 이름이다.
    - secretKey: MINIO_ACCESS_KEY_ID
      remoteRef:
        key: observability-secrets
        property: LGTM_OBJECT_STORE_ACCESS_KEY_ID
    - secretKey: MINIO_SECRET_ACCESS_KEY
      remoteRef:
        key: observability-secrets
        property: LGTM_OBJECT_STORE_SECRET_ACCESS_KEY
