# `.11` ContainerMemoryNearLimit 이식 — 클러스터 전 ns 대상 (kustomization 의 namespace: app 으로
# 오브젝트는 app ns 에 놓이지만, 인클러스터 Prometheus 의 ruleSelector 가 `{}`(전체)라 평가는 전역이다).
# 실증 근거: tempo 768M 크래시루프 전례(.11 규칙 주석) + 2026-07-30 컬리 폴러 OOMKill(1Gi 한도).
# ~~tempo 규칙 2종 이식 보류~~ → ✅ **편입 (2026-07-30 오후)** — Istio 메시 트레이싱 배선(app#393,
#    샘플링 100%) 후 첫 블록 flush 실증(MinIO tempo 버킷 블록 3·tempodb_blocklist_length 시리즈 존재).
#    absent() 오발화 전제가 해소돼 아래 mp-tempo 그룹으로 들여왔다. 라벨은 인클러스터 실측
#    (job="tempo" — ServiceMonitor 산출이 .11 시절과 동일이라 식 무수정, owner 라벨만 제거).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-tempo
spec:
  groups:
    - name: mp-tempo
      rules:
        # 🔴 2026-08-02 추가 — 아래 BlocklistIndexBroken 의 **빠진 짝**이다. 반드시 함께 읽을 것.
        #
        #   실측 배경: tempo-0 이 07-28~08-02 닷새간 420회 넘게 재시작했는데 `#alerts-critical`
        #   에는 아무것도 가지 않았다. 7일치 ALERTS 조회 결과 —
        #     KubePodCrashLooping(tempo-0) · KubePodNotReady(tempo-0)
        #     · KubeStatefulSetReplicasMismatch(sts=tempo) · TargetDown(job=tempo)  ← 넷 다 firing
        #     MpTempoBlocklistIndexBroken                                            ← 0 series
        #   즉 클러스터는 침묵하지 않았다. 넷 다 **severity=warning** 이라 전부 `#monitoring` 으로
        #   갔고(`#alerts-critical` 은 severity=critical 만 매칭), repeat_interval 4h 공용 채널에서
        #   닷새간 묻혔을 뿐이다.
        #
        #   아래 규칙의 `and on() up==1` 게이트는 **논리상 틀리지 않았다** — "살아있는데 인덱스만
        #   깨진" 국면 전용이 맞다. 문제는 그 반대편(= 아예 죽은 국면)이 영원히 warning 에 머문
        #   것이다. 게이트를 걷어내는 대신 이 규칙으로 반대편을 critical 로 승격한다.
        #
        #   absent() 를 or 로 붙인 이유: 타깃이 통째로 사라지면 up 시리즈 자체가 없어져
        #   `up == 0` 도 빈 벡터가 된다(= 안 울린다). mp-pg 의 MpPGInstancesDegraded 와 같은 패턴.
        - alert: MpTempoDown
          expr: |
            absent(up{job="tempo"}) or up{job="tempo"} == 0
          for: 10m
          labels:
            severity: critical
            service: observability
          annotations:
            summary: "Tempo 다운 10분 — 분산 트레이싱이 통째로 정지한다(메시 100% 샘플링 스팬이 전부 유실)"
            description: >-
              kubectl -n observability get pod tempo-0 · logs --previous 확인.
              전례 ①store init 실패(MinIO 엔드포인트가 .local search 하이재킹으로 공인 IP 로 해석 —
              2026-08-02, 참조: platform/argocd/tempo.yaml 주석) ②2Gi 한도 OOM(2026-07-21 .11 전례).

        # 블록리스트 인덱스가 안 만들어지면 압축기·보존기가 대상 목록을 못 받아 전부 정지한다.
        #   시리즈 '부재'가 신호다 — 폴러가 실패하면 tempodb_blocklist_length 자체가 노출되지
        #   않는다(값이 0으로 떨어지는 게 아니다). 그래서 threshold 가 아니라 absent() 를 쓴다.
        #   `and on() up==1` = Tempo 가 살아있는데도 부재인 경우로 한정 — 파드가 아예 죽은 경우는
        #   위 MpTempoDown(critical) 이 잡으므로 중복 소음을 막는다. 🔴 이 둘은 한 쌍이다.
        #   백테스트(.11, 2026-07-23): 실사고 구간 31시간 연속 발화·손상 블록 제거 직후 소멸.
        - alert: MpTempoBlocklistIndexBroken
          expr: absent(tempodb_blocklist_length) and on() (up{job="tempo"} == 1)
          for: 15m
          labels:
            severity: critical
            service: observability
          annotations:
            summary: "Tempo 블록리스트 인덱스 생성 실패 15분 — 압축·보존이 정지한다(파드는 Up 이라 다른 알람에 안 걸림)"
            description: >-
              kubectl -n observability logs sts/tempo | grep 'failed to poll' 확인. 급사 후라면
              0바이트 meta.json 이 원인일 수 있다 — MinIO tempo 버킷에서 size 0 meta.json 을 찾아 해당 블록 제거.

        - alert: MpTempoCompactionErrors
          expr: increase(tempodb_compaction_errors_total[30m]) > 0
          for: 5m
          labels:
            severity: warning
            service: observability
          annotations:
            summary: "Tempo 압축 에러 발생 — 보존·질의 성능 저하 진행 중 (tempo 로그의 compaction 에러 확인)"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-container-memory
spec:
  groups:
    - name: mp-container-memory
      rules:
        # 🔴 ES 제외(container!="elasticsearch") — ES 는 설계상 한도 근처에 상주한다
        #    (JVM heap + Lucene off-heap/page cache). 2026-08-03 실측: 1.5Gi 한도의 ~87% 에서
        #    11h 내내 플래토(딥 없음), 알림이 36~68h 연속 firing = repeat_interval 재전송이라
        #    "OOM 임박"이 아니라 정상 상주였다. 0.85 로 두면 ES 가 상시 오발화해 진짜 신호를 가린다.
        #    → 일반 컨테이너는 0.85 유지, ES 는 아래 전용 규칙(0.90)으로 분리한다.
        - alert: MpContainerMemoryNearLimit
          expr: |
            container_memory_working_set_bytes{container!="", container!="POD", container!="elasticsearch"}
              / on(namespace, pod, container)
                kube_pod_container_resource_limits{resource="memory"} > 0.85
          for: 15m
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} 메모리가 한도의 {{ $value | humanizePercentage }} — OOM 임박. 한도 상향 또는 워크로드 축소 검토"
        # ES 전용 — 정상 상주(~87%) 위, 진짜 OOM 위험 구간(>90%)만 발화.
        #   ES 는 원래 hot 하므로 임계를 0.90 으로 올려 상시 소음을 없애되, 90% 를 넘으면
        #   실제로 한도 상향이 필요한 신호이므로 계속 감시한다.
        - alert: MpEsMemoryNearLimit
          expr: |
            container_memory_working_set_bytes{container="elasticsearch"}
              / on(namespace, pod, container)
                kube_pod_container_resource_limits{resource="memory"} > 0.90
          for: 15m
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} ES 메모리가 한도의 {{ $value | humanizePercentage }} (>90%) — ES 는 상주 ~87% 라 이 알람은 진짜 OOM 임박. 한도 상향 검토"
---
# ══ 워크로드 몰림 감시 (2026-07-31, replicas>=2 + PDB 작업과 한 세트) ═══════════════════
#
# ── 왜 필요한가 ──────────────────────────────────────────────────────────────────
# app 워크로드의 topologySpreadConstraints 는 전부 **ScheduleAnyway(soft)** 다.
# hard(DoNotSchedule)는 검토 후 기각했다 — 자리가 없으면 파드가 Pending 으로 멈추는데
# Pending 파드는 일을 안 하므로 죽은 것과 같다. 그래서 스케줄을 막지 않기로 했다.
# 🔴 그 결정의 **대가**가 이 규칙이다. soft 는 "지켜지면 좋고 아니면 말고" 라서, 노드가 비좁거나
#    drain 직후 재배치가 몰리면 **replica 2개가 같은 노드에 조용히 앉는다**. 그 순간 replicas 2 도
#    PDB 도 아무 의미가 없어진다(노드 하나 상실 = 서비스 전멸, replica 1 시절과 동일).
#    아무도 안 죽었으니 기존 알람은 전부 침묵한다 — **그 침묵을 깨는 게 이 규칙의 전부다.**
#
# ── 대상 범위: 전 ns (app 한정 아님) ──────────────────────────────────────────────
# `mp-container-memory` 와 마찬가지로 인클러스터 Prometheus 의 ruleSelector 가 `{}` 라 평가는
# 전역이다. 일부러 ns 를 안 건다 — coredns·cilium-operator·pg-pooler 처럼 클러스터가 의존하는
# 다중 replica Deployment 도 같은 실패 모드를 갖기 때문이다(2026-07-31 실측: 넷 다 현재는 정상 분산).
# `replicas >= 2` 게이트가 있어서 **의도적 단일 replica(MinIO 등)는 자동으로 제외**된다 — 소음 없음.
# ⚠️ 소음이 생길 만한 유일한 후보 = `pipeline` ns 의 KEDA 컨슈머(min 0~1 · max 3). 스케일아웃이
#    20분 넘게 한 노드에 머물면 여기 걸린다. 컨슈머는 노드를 잃어도 랙이 쌓일 뿐이라 급하지 않으니,
#    실제로 시끄러우면 아래 두 record 규칙의 셀렉터에 `namespace!="pipeline"` 을 넣어 빼면 된다.
# ⚠️ 한계: Deployment 전용이다. ES·Kafka·PG·Redis 는 StatefulSet 이라 `kube_deployment_*` 에
#    안 잡힌다. 그쪽은 오퍼레이터가 각자 PDB·anti-affinity 를 갖고 있어 별건으로 둔다.
#
# ── 🔴 결측 내성: `for:` 를 안 쓴다 ───────────────────────────────────────────────
# status §3 수칙 — "알람 규칙은 시계열이 항상 있다를 전제하지 말 것. 결측 한 번이 `for:` 를 통째로
# 무력화한다"(Prometheus 가 staleness 마커를 넣어 즉시 '없음' 처리하고 `for:` 시계가 0부터 다시 센다).
# 실제로 `kafka_consumergroup_lag_sum` 결측으로 알람이 영영 못 울릴 뻔했다. KSM 이 재시작하거나
# 스크레이프가 한 번 튀면 여기도 똑같이 당한다.
# 그래서 `for: 20m` 대신 **`min_over_time(<0/1 게이지>[20m])`** 을 쓴다. 차이가 핵심이다:
#   · `for:`        = 창 안에 **구멍이 하나라도 있으면 리셋**. 결측에 취약.
#   · min_over_time = 창 안에 **존재하는 표본들의 최솟값**. 결측 구간은 그냥 건너뛴다(리셋 없음).
# 몰림은 스파이크가 아니라 **지속 상태**라 `max_over_time`(한 번이라도 참) 이 아니라
# `min_over_time`(내내 참)이 맞다 — 롤아웃·스케일아웃 중 잠깐 몰린 것은 걸러야 하기 때문이다.
# 🔴 min_over_time 만 쓰면 표본이 **1개뿐일 때도** 통과한다(Prometheus 재시작 직후 등).
#    그래서 `count_over_time(...) >= 10` 을 AND 로 건다 = "20분 창에 최소 절반은 관측됐을 때만
#    단정한다". 근거가 부족하면 알람도 침묵하는 게 맞다. interval: 1m 이라 창의 기대 표본은 20개.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-workload-spread
spec:
  groups:
    - name: mp-workload-spread
      # 🔴 [20m] 창의 표본 수(=20)를 결정한다. 아래 count_over_time 하한 10 과 한 세트다.
      #    이 값을 바꾸면 하한도 같이 바꿔라 — 안 그러면 알람이 조용히 둔해지거나 예민해진다.
      interval: 1m
      rules:
        # ── ① 파드 → Deployment 매핑 후 "앉은 노드가 몇 종류인가" ──────────────────
        # 🔴 파드의 owner 는 Deployment 가 아니라 **ReplicaSet** 이고 그 이름에는 해시 접미사가
        #    붙는다(`mp-chat-6559d9cf9c`). label_replace 로 마지막 `-<해시>` 를 떼야 Deployment
        #    이름이 된다. `(.+)-[^-]+` 는 greedy 라 `mp-ranking-serving-6dc4499` 도
        #    `mp-ranking-serving` 으로 정확히 잘린다(2026-07-31 실측 14/14 일치).
        # kube_pod_owner 대신 kube_pod_info 를 쓰는 이유 = 이 지표 하나에 `node` 와
        #    `created_by_name` 이 **둘 다** 있어서 조인이 아예 필요 없다(조인 실패 모드 제거).
        # `node!=""` = 아직 스케줄 안 된 파드 제외. 안 걸러내면 Pending 파드가 빈 노드 한 종류로
        #    세어져 "노드 2종류" 로 보이고 몰림이 가려진다.
        - record: mp:deployment_pod_nodes:count
          expr: |
            count by (namespace, deployment) (
              count by (namespace, deployment, node) (
                label_replace(
                  kube_pod_info{created_by_kind="ReplicaSet", node!=""},
                  "deployment", "$1", "created_by_name", "(.+)-[^-]+"
                )
              )
            )

        # ── ② 같은 것을 zone(물리 호스트) 단위로 ──────────────────────────────────
        # 🔴 **한시적 하드코딩이다.** 이 클러스터의 KSM 은 `kube_node_labels` 를 노출하지 않아
        #    (2026-07-31 확인: 쿼리 결과 0건) `topology.kubernetes.io/zone` 을 PromQL 에서 조인할
        #    방법이 없다. 그래서 노드 **이름 규칙**으로 zone 을 파생한다.
        #    ✅ 제대로 된 해법 = 앱 레포의 kube-prometheus-stack values 에서 KSM 에
        #       `--metric-labels-allowlist=nodes=[topology.kubernetes.io/zone]` 을 켜고, 여기를
        #       `kube_node_labels` 조인으로 교체하는 것. 그때까지의 임시방편이다.
        #    🔴 노드 이름 규칙이 바뀌거나 새 이름의 노드가 붙으면 이 파생이 조용히 틀린다 →
        #       그걸 잡으라고 아래 `MpNodeZoneMapUnknown` 가드 알람을 같이 둔다.
        - record: mp:deployment_pod_zones:count
          expr: |
            count by (namespace, deployment) (
              count by (namespace, deployment, zone) (
                label_replace(
                  label_replace(
                    label_replace(
                      kube_pod_info{created_by_kind="ReplicaSet", node!=""},
                      "deployment", "$1", "created_by_name", "(.+)-[^-]+"
                    ),
                    "zone", "host-$1", "node", "k8s-worker-([ab])[0-9]+"
                  ),
                  "zone", "host-b", "node", "k8s-master"
                )
              )
            )

        # ── ③ 0/1 게이지로 만든다 ─────────────────────────────────────────────────
        # 🔴 `== 1` 로 **거르지 않고** `== bool 1` 로 0/1 값을 만드는 게 의도다.
        #    거르면 정상일 때 시리즈가 사라져서 min_over_time 창이 "정상 구간"을 못 본다 —
        #    즉 방금 2로 스케일한 워크로드가 즉시 알람을 맞는다. 0/1 게이지면 정상 구간이 0 으로
        #    창에 남아 min 을 끌어내리므로, 창 전체가 몰림일 때만 1 이 된다. 이게 `for:` 대체물이다.
        # `>= bool 2` 게이트 = replica 1 짜리는 애초에 몰림 개념이 없다(노드 1개가 정상).
        - record: mp:deployment_single_node:bool
          expr: |
            (mp:deployment_pod_nodes:count == bool 1)
              * on(namespace, deployment)
                (max by (namespace, deployment) (kube_deployment_spec_replicas) >= bool 2)

        - record: mp:deployment_single_zone:bool
          expr: |
            (mp:deployment_pod_zones:count == bool 1)
              * on(namespace, deployment)
                (max by (namespace, deployment) (kube_deployment_spec_replicas) >= bool 2)

        # ── ④ 알람 ────────────────────────────────────────────────────────────────
        - alert: MpDeploymentPodsOnSingleNode
          expr: |
            min_over_time(mp:deployment_single_node:bool[20m]) == 1
              and count_over_time(mp:deployment_single_node:bool[20m]) >= 10
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} replica 가 2개 이상인데 20분째 **노드 1개**에 다 몰려 있다 — 이중화가 사실상 무효"
            description: >-
              soft TSC(ScheduleAnyway)가 안 지켜진 상태다. 그 노드를 잃으면 replica 1 때와 똑같이
              서비스가 통째로 내려간다. 확인 = kubectl -n {{ $labels.namespace }} get pods -o wide
              -l app=<이름>. 원인은 대개 ⑴ 다른 노드에 메모리 자리가 없음(kubectl describe node 의
              Allocated resources 확인) ⑵ drain 직후 재배치가 한 노드로 몰림.
              해소 = 자리를 만든 뒤 kubectl -n {{ $labels.namespace }} rollout restart deploy/{{ $labels.deployment }}.

        # zone 몰림은 노드 몰림보다 덜 급하지만(노드 2개엔 흩어져 있으니) 물리 호스트 하나가
        # 통째로 죽는 사건이 **실제로 3번 있었다**(호스트 A, 2026-07-19·07-21×2, 무흔적 급사).
        # 그래서 별도 알람으로 낸다 — "노드는 흩어졌는데 둘 다 host-a" 는 노드 알람이 절대 못 잡는다.
        - alert: MpDeploymentPodsOnSingleZone
          expr: |
            min_over_time(mp:deployment_single_zone:bool[20m]) == 1
              and count_over_time(mp:deployment_single_zone:bool[20m]) >= 10
              and on(namespace, deployment) (mp:deployment_pod_nodes:count > 1)
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} replica 가 20분째 **물리 호스트 1대** 안에만 있다 — 그 호스트가 죽으면 전멸"
            description: >-
              노드끼리는 흩어졌지만 zone(host-a/host-b)이 같다. 호스트 A 는 무흔적 급사 3회 이력이
              있어 이 상태는 실제 위험이다. 확인 = kubectl get pods -o wide 후 노드의
              topology.kubernetes.io/zone 라벨 대조. 해소 = 반대 zone 에 자리를 만들고 rollout restart.
            # 🔴 `and mp:deployment_pod_nodes:count > 1` = 노드까지 1개면 위 노드 알람이 이미 울린다.
            #    같은 사건으로 두 번 깨우지 않으려는 중복 억제다(노드 알람이 더 심각한 상위 케이스).

        # ── ⑤ 위 zone 파생이 조용히 틀리는 걸 막는 가드 ────────────────────────────
        # zone 은 노드 **이름 정규식**으로 만든다. 규칙에 안 맞는 이름의 노드가 들어오면
        # 그 파드는 zone 라벨이 비게 되고, 빈 zone 이 "다른 zone" 으로 세어져 zone 알람이
        # **조용히 무력화**된다. 침묵하는 알람이 제일 나쁘므로 그 조건 자체를 알람으로 만든다.
        # 노드가 늘어날 때(P4 5노드 램프) 여기가 먼저 울리면 위 정규식을 갱신하면 된다.
        - alert: MpNodeZoneMapUnknown
          expr: |
            count by (node) (
              kube_pod_info{node!="", node!~"k8s-master|k8s-worker-[ab][0-9]+"}
            ) > 0
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "노드 {{ $labels.node }} 이름이 zone 파생 정규식에 안 맞는다 — MpDeploymentPodsOnSingleZone 이 이 노드를 못 센다"
            description: >-
              monitoring/base/rules.yaml 의 mp:deployment_pod_zones:count 정규식
              (k8s-worker-[ab][0-9]+ · k8s-master)을 새 노드 이름에 맞게 갱신할 것.
              근본 해결은 KSM 에 --metric-labels-allowlist=nodes=[topology.kubernetes.io/zone] 를
              켜고 kube_node_labels 조인으로 바꾸는 것(앱 레포 kube-prometheus-stack values).
---
# 앱 SLI 알람 — 지연·오류율·OOM (2026-08-01 이식)
#
# 🔴 **출처와 이식 사유**: 이 규칙들은 원래 앱 레포 `infra/ansible/roles/monitoring/files/
#    alert-rules.yml` 에 있었다(#373, wjsusl98-cloud, 2026-07-31). 그런데 그 파일은 **구 `.11`
#    VM 의 Docker Prometheus 용**이고, `.11` 은 모니터링 컷오버(07-30) 후 07-31 에 파괴됐다.
#    즉 **인클러스터용으로 잘 짜인 규칙이 죽은 파일에 들어가 한 번도 활성화된 적이 없었다**
#    (컷오버·롤 은퇴가 같은 날 일어나 엇갈린 것으로 보인다). PromQL 은 이미 인클러스터
#    라벨 체계(namespace="app" 등)를 쓰고 있어 **식 수정 없이** 그대로 옮긴다.
#
# **이식 대상 3종만** — 나머지 2종은 인클러스터에 이미 등가물이 있어 제외했다(중복 발화 방지):
#   · AppContainerMemoryNearLimit → 위 `mp-container-memory` 그룹의 MpContainerMemoryNearLimit
#   · AppPodRestartLoop           → kube-prometheus-stack 빌트인 KubePodCrashLooping
#
# **이름은 `Mp` 접두사로 정렬**했다(`App*` → `MpApp*`). 이 레포의 전 알람이 `Mp` 접두사이고
#   대시보드·런북이 그 규약을 전제한다. 한 번도 발화한 적이 없어 개명 비용이 0 이다.
#
# 🔴 **이식 전 지표 실재를 전부 실측했다**(이 프로젝트에서 "알람을 넣었는데 안 울린다"가
#    반복돼 왔다 — §3 수칙). 2026-08-01 인클러스터 Prometheus 질의 결과:
#      http_request_duration_highr_seconds_bucket{namespace="app"}  264 시계열 · service 라벨 O
#      http_requests_total{namespace="app"}                          38 시계열 · service·status 라벨 O
#      kube_pod_container_status_restarts_total{namespace="app"}     존재
#      kube_pod_container_status_last_terminated_reason              전 클러스터 55 시계열 · reason 라벨 O
#        (app ns 는 0 — 최근 종료가 없을 뿐이다. 지표 자체는 노출된다.)
#    식 자체도 실제로 쏴 봤다. 5m 창은 0 시계열이지만 이는 **정상**이다(아래 저트래픽 항).
#    트래픽이 있는 1h 창으로 같은 식을 돌리면 값이 나온다 —
#      p95 = notify 0.010s · pantry 0.009s · price 0.216s · account 0.009s (7 시계열)
#      비율식도 정상 계산(5xx 가 없어 2xx 로 뒤집어 확인)
#
# 🔴 **저트래픽 주의 — 이 알람들의 실효성은 트래픽에 달려 있다.**
#    실측(2026-08-01): `rate(http_requests_total[5m])` 이 **전 서비스 0**, 1h 창에서도 최대
#    0.0025 req/s(≈9 req/시간)다. 함의가 둘이다 —
#      ① 유휴 구간엔 식이 **NaN** 을 낸다(버킷 rate 가 전부 0 → histogram_quantile = NaN,
#         0/0 = NaN). NaN 비교는 항상 false 라 발화하지 않는다. **의도된 동작이다.**
#      ② ⚠️ 반대로 **표본이 1~2건일 때 p95 는 사실상 그 요청 하나**다. 콜드스타트가 한 번
#         1초를 넘기면 그대로 발화한다 = 오탐. 실트래픽이 붙기 전엔 소음이 될 수 있다.
#         소음이 확인되면 최소 표본 가드가 표준 처방이다. 원 규칙에 없어 **임의로 넣지 않았다**
#         (임계 조정은 작성자 판단 영역):
#           ... > 1
#           and on(service) (sum by(service) (rate(http_requests_total{namespace="app"}[5m])) > 0.05)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-app-sli
spec:
  groups:
    - name: mp-app-sli
      rules:
        # p95 지연. sum by(service, le) 로 서비스별 히스토그램을 합친 뒤 분위수를 낸다.
        #   service 라벨 실측값 = account·chat·mealplan·notify·ocr·pantry·price·recipe·recipebook·video
        #   (frontend 는 nginx 라 계측 없음, ranking-serving·operations 는 이 지표 미노출 — 정상)
        - alert: MpAppHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by(service, le) (
                rate(http_request_duration_highr_seconds_bucket{namespace="app"}[5m])
              )
            ) > 1
          for: 2m
          labels:
            severity: warning
            owner: app-platform
            environment: production
          annotations:
            summary: "{{ $labels.service }} p95 응답 시간이 1초 초과 상태로 2분 지속"
            description: "5분 윈도우 p95 지연이 1초를 넘었습니다. 관련 오류율, Slow Trace, 최근 배포를 확인하세요."

        # 5xx 비율. ⚠️ **status 라벨은 코드가 아니라 버킷**이다 — 실측값이 `2xx`·`4xx` 형태다
        #   (prometheus-fastapi-instrumentator 기본 동작). `5..` 정규식이 `5xx` 에 매치되므로
        #   식은 그대로 유효하지만, "503 만 보고 싶다" 같은 세분화는 이 지표로 불가능하다.
        #   5xx 가 한 건도 없으면 분자 시계열이 아예 없어 결과가 안 나온다 = 발화 없음(정상 동작).
        - alert: MpAppHighErrorRate
          expr: |
            100 * (
              sum by(service) (
                rate(http_requests_total{namespace="app", status=~"5.."}[5m])
              )
              /
              sum by(service) (
                rate(http_requests_total{namespace="app"}[5m])
              )
            ) > 5
          for: 2m
          labels:
            severity: critical
            owner: app-platform
            environment: production
          annotations:
            summary: "{{ $labels.service }} 5xx 오류율이 5% 초과 상태로 2분 지속"
            description: "요청량, p95 지연, 오류 로그 패턴과 의존 서비스 상태를 함께 확인하세요."

        # OOMKilled. 재시작이 최근에 있었고(increase>0) 그 종료 사유가 OOMKilled 인 경우로 한정한다.
        #   `and on(namespace,pod,container)` 라 두 지표의 나머지 라벨 차이는 무시된다.
        #   istio-proxy 제외 = 사이드카 종료는 앱 문제가 아니다.
        #   ⚠️ 이 두 지표는 kube-state-metrics 산출이라 `service` 라벨이 **앱이 아니라 KSM 서비스**다.
        #      Alertmanager 가 group_by:[alertname,service] 라 Slack 묶음 제목이 KSM 이름으로 뜬다 —
        #      실제 대상은 annotation 의 {{ $labels.container }}·{{ $labels.pod }} 를 볼 것.
        - alert: MpAppContainerOOMKilled
          expr: |
            (
              increase(
                kube_pod_container_status_restarts_total{namespace="app", container!="istio-proxy"}[5m]
              ) > 0
            )
            and on(namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{namespace="app", reason="OOMKilled"} == 1)
          for: 0m
          labels:
            severity: critical
            owner: app-platform
            environment: production
          annotations:
            summary: "{{ $labels.container }} 컨테이너가 OOMKilled 로 재시작 (pod {{ $labels.pod }})"
            description: "메모리 사용량, limit, 요청량 증가 및 메모리 누수 가능성을 즉시 확인하세요."
---
# descheduler CronJob 생사 감시 (2026-08-01)
#
# 왜 필요한가: descheduler 는 **HPA scale-down 이 깬 zone 분산을 자동 복구**하는 유일한 장치다
#   (platform/argocd/descheduler.yaml). 그게 조용히 멈추면 분산은 깨진 채로 남는데,
#   descheduler 자체는 아무 소리도 안 낸다 — CronJob 을 고른 이유가 바로 이 생사를
#   Job 단위 이벤트로 잡을 수 있어서였다. 그 근거를 실제 알람으로 회수한다.
#
# 🔴 **이 알람들이 잡는 것과 못 잡는 것을 분명히 해둔다.**
#   잡는 것   = descheduler 가 **안 도는** 경우(Job 실패·CronJob 삭제·suspend).
#   못 잡는 것 = descheduler 가 **돌긴 도는데 아무것도 안 하는** 경우.
#     ⚠️ 이건 가상의 우려가 아니다 — 2026-08-01 실제로 그랬다. podProtections 설정 하나 때문에
#        Istio 사이드카의 emptyDir 이 "로컬스토리지" 로 잡혀 app ns 파드 20개가 전부 필터링됐고,
#        Job 은 Complete·evictedPods=0·Application 은 Healthy 였다. 완벽하게 조용한 실패였다.
#     → 그 경우를 잡는 건 위쪽 **MpDeploymentPodsOnSingleZone**(결과 기반, 20분 창)이다.
#        두 알람은 대체재가 아니라 **원인·결과 한 쌍**이다. 한쪽만 두지 말 것.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-descheduler
spec:
  groups:
    - name: mp-descheduler
      rules:
        # 임계 5400s = 90분 = 30분 스케줄 기준 **3회 연속 실패**. 1~2회는 노드 압박·이미지 pull
        #   지연 같은 일시적 사유로 날 수 있어 소음이 되고, 3회면 사람이 볼 일이다.
        #   suspend 도 같은 알람으로 묶는다 — "누가 잠깐 끄고 잊었다" 가 실제로 흔한 실패 경로다.
        - alert: MpDeschedulerNotRunning
          expr: |
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace="kube-system", cronjob="mp-descheduler"}
              ) > 5400
            )
            or
            (kube_cronjob_spec_suspend{namespace="kube-system", cronjob="mp-descheduler"} == 1)
          for: 10m
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "descheduler 가 90분째 성공 실행이 없다(또는 suspend) — HPA 축소로 깨진 zone 분산이 복구되지 않는다"
            description: >-
              확인 = kubectl get cronjob,job -n kube-system | grep mp-descheduler 후
              실패 Job 의 로그(kubectl logs job/<name> -n kube-system).
              분산 자체가 이미 깨졌는지는 MpDeploymentPodsOnSingleZone 을 같이 볼 것.

        # CronJob 오브젝트가 통째로 사라지는 경우(ArgoCD Application 삭제·prune 사고).
        #   위 알람은 시계열이 없어지면 **같이 침묵**하므로 absent() 로 따로 받아야 한다.
        #   for 를 길게(20m) 두는 이유 = 정상적인 재배포 중 잠깐 사라지는 것에 안 울리게.
        - alert: MpDeschedulerAbsent
          expr: absent(kube_cronjob_spec_suspend{namespace="kube-system", cronjob="mp-descheduler"})
          for: 20m
          labels:
            severity: warning
            service: infra
          annotations:
            summary: "descheduler CronJob 오브젝트가 없다 — zone 분산 자동 복구가 통째로 사라진 상태"
            description: >-
              ArgoCD Application `descheduler`(platform 프로젝트) 상태를 확인할 것.
              의도적으로 걷어낸 거라면 이 알람 2종도 같이 지워야 한다(고아 알람 방지).
