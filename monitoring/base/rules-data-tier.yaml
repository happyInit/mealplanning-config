# 데이터 티어 알람 (2026-08-03 신설) — **태현 소유 파일**.
#
# 🔴 이 파일이 왜 따로 있나: `rules.yaml` 하나를 둘이 동시에 고치면 머지 충돌이 난다.
#    SYMPTOM(rules-app-symptom.yaml, 봉수) / 데이터 티어(여기, 태현) 로 소유자를 갈랐다.
#
# ── 담는 것 ─────────────────────────────────────────────────────────────────
#   § PGSync/Slot (#4, #516) — CDC status 의 정본은 platform/pg/base/monitoring.yaml (T-2). 여기선 그보다 먼저
#     울리는 **슬롯 보류 WAL 조기경보·고아 슬롯 탐지**만 담는다(중복 발화하지 않도록 큐를 나눈다).
#   § ES     (#3)  — cluster yellow/red · 디스크
#   § Kafka  (#3)  — 브로커 상실 · ISR 축소 (consumer lag 은 pipeline 정본 사용)
#   § MinIO  (#3)  — 디스크 포화
#
# ── 🔴 § PGSync — 왜 최우선인가 ─────────────────────────────────────────────
# 우리 결함 목록에서 **혼자 OLTP 를 세울 수 있는 유일한 경로**다:
#
#     PGSync 정지 → 복제 슬롯 active=f
#                 → PG 가 WAL 을 무한 보존 (구 실측: 128MB/h · 하루 3GB)
#                 → 디스크 고갈 → **PG 쓰기 전면 중단** (이슈 #516 사고)
#
# 🔴 이슈 #516 이후 `max_slot_wal_keep_size=1GB` 상한(cluster.yaml)으로 디스크 고갈 대신
# 그 슬롯만 무효화되도록 바뀌었다. 그래도 소비자가 사라진 채 방치되면 안 되므로,
# 아래 `mp-pg` 그룹이 상한 도달 **이전**에 먼저 울리는 조기경보(+장시간 비활성 고아 탐지)다.
# critical 큐는 platform/pg/base/monitoring.yaml 의 MpPGReplicationSlotRetainedWALHigh 가 담당한다.
#
# 그리고 기존 `MpPGSyncDown` 은 `replicas_available < 1` 기준이라 "파드는 Ready 인데 CDC 만
# 멈춘" 상태를 정상으로 본다. 프로세스 생존이 아니라 **슬롯 자체**를 봐야 하는 이유가 이것이다.
#
# 🔴 함께 가야 하는 것: platform/pgsync/base/pgsync.yaml 의 프로브 추가.
#    프로브만 있고 알람이 없으면 재시작만 반복하고,
#    알람만 있고 프로브가 없으면 자가복구를 못 한다.
# ⚠️ 프로브 `failureThreshold` 는 넉넉히 — **프로브가 CDC 를 재시작 루프에 빠뜨리는 게 최악**이다.
#    (초기 동기화·대량 배치 중에는 응답이 느려질 수 있다.)
#
# ── § ES 알람의 선행조건 ────────────────────────────────────────────────────
# 🔴 `recipes` 인덱스가 `number_of_replicas: 0` 인 동안에는 **cluster yellow 가 상시**다.
#    그 상태로 yellow 알람을 넣으면 즉시 오탐이 되어 무의미해진다.
#    → **#9(rep 1) 을 먼저 적용한 뒤** ES 알람을 넣는다. 순서를 지킬 것.
#
# ── 임계값 수칙 ─────────────────────────────────────────────────────────────
# 내일부터 당분간 아무도 안 본다는 전제다. 오탐이 나면 그대로 방치되고
# 다음에 볼 때 알람 신뢰를 깎는다(tempo-0 전례 — rules.yaml mp-tempo 그룹 주석).
# → 보수적으로. severity=warning 은 #monitoring 에 묻히므로,
#   **유저 영향이 확실하거나 데이터 유실 위험이 있는 것만 critical.**
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-data-tier
spec:
  groups:
    - name: mp-es
      rules:
        # ECK 는 Prometheus 지표를 네이티브로 노출하지 않는다. platform/es/base/monitoring.yaml 의
        # exporter 배관이 끊기면 아래 health 알람도 눈멀기 때문에 결측을 독립적으로 잡는다.
        - alert: MpElasticsearchMetricsUnavailable
          expr: |
            absent(up{job="mp-elasticsearch-exporter"})
            or max(up{job="mp-elasticsearch-exporter"}) == 0
            or absent_over_time(elasticsearch_cluster_health_status{job="mp-elasticsearch-exporter"}[10m])
          for: 15m
          labels: {severity: warning, service: elasticsearch}
          annotations:
            summary: "Elasticsearch health 지표를 15분째 수집하지 못함"
            description: "mp-elasticsearch-exporter 파드·ServiceMonitor·data NetworkPolicy와 ES 인증 Secret을 확인한다."

        # replica=1 전환(#9) 완료가 선행조건이다. 30분은 재할당 중의 일시 yellow를 거른다.
        - alert: MpESClusterYellow
          expr: max_over_time(elasticsearch_cluster_health_status{color="yellow"}[2m]) == 1
          for: 30m
          labels: {severity: warning, service: elasticsearch}
          annotations:
            summary: "Elasticsearch cluster yellow가 30분 지속"
            description: "replica shard가 미할당 상태다. 노드·allocation explain·PVC 여유를 확인한다."

        - alert: MpESClusterRed
          expr: max_over_time(elasticsearch_cluster_health_status{color="red"}[2m]) == 1
          for: 5m
          labels: {severity: critical, service: elasticsearch}
          annotations:
            summary: "Elasticsearch cluster red가 5분 지속"
            description: "primary shard 미할당으로 검색 또는 색인이 중단될 수 있다. 즉시 cluster health와 allocation explain을 확인한다."

        - alert: MpESVolumeMetricsUnavailable
          expr: |
            absent_over_time(kubelet_volume_stats_available_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}[10m])
            or absent_over_time(kubelet_volume_stats_capacity_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}[10m])
            or count(count_over_time(kubelet_volume_stats_available_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}[10m])) != 3
            or count(count_over_time(kubelet_volume_stats_capacity_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}[10m])) != 3
          for: 15m
          labels: {severity: warning, service: elasticsearch}
          annotations:
            summary: "Elasticsearch PVC 용량 지표가 15분째 불완전"
            description: "3개 ES PVC 중 available/capacity 시계열이 빠졌다. kubelet volume stats와 PVC 상태를 확인한다. disk-high 알람도 현재 눈멀 수 있다."

        - alert: MpESDiskHigh
          expr: |
            max by(namespace, persistentvolumeclaim) (
              1 - kubelet_volume_stats_available_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}
                / kubelet_volume_stats_capacity_bytes{namespace="data", persistentvolumeclaim=~"elasticsearch-data-es-.*"}
            ) > 0.85
          for: 30m
          labels: {severity: warning, service: elasticsearch}
          annotations:
            summary: "Elasticsearch PVC {{ $labels.persistentvolumeclaim }} 사용률 85% 초과"
            description: "30분 지속. ES disk watermark 진입 전에 인덱스 보존량·샤드와 실제 PVC 사용량을 확인한다."

    - name: mp-kafka
      rules:
        - alert: MpKafkaMetricsUnavailable
          expr: |
            absent(up{job="data/mp-kafka-exporter"})
            or max(up{job="data/mp-kafka-exporter"}) == 0
            or absent_over_time(kafka_brokers{job="data/mp-kafka-exporter"}[10m])
            or absent_over_time(kafka_topic_partition_under_replicated_partition{job="data/mp-kafka-exporter"}[10m])
          for: 15m
          labels: {severity: warning, service: kafka}
          annotations:
            summary: "Kafka exporter 지표를 15분째 수집하지 못함"
            description: "mp-kafka-exporter PodMonitor와 Strimzi exporter 파드를 확인한다. broker/ISR 알람도 현재 눈먼 상태다."

        # 3-broker/RF=3 기준. max_over_time은 한두 번의 scrape 결측이 for 시계를 리셋하지 않게 한다.
        - alert: MpKafkaBrokerDown
          expr: max_over_time(kafka_brokers{job="data/mp-kafka-exporter"}[2m]) < 3
          for: 10m
          labels: {severity: warning, service: kafka}
          annotations:
            summary: "Kafka broker 수가 3 미만으로 10분 지속"
            description: "RF=3 중 한 대 이상이 보이지 않는다. Strimzi Kafka 상태와 broker 파드·PVC를 확인한다."

        # 한 broker 상실 뒤 ISR가 줄어든 상태에서는 다음 상실이 데이터 가용성/내구성에 직접 영향을 준다.
        # 전체 partition을 한 알람으로 집계해 broker 장애 때 수십 건이 동시에 울리는 것을 막는다.
        - alert: MpKafkaISRShrink
          expr: |
            max(
              max_over_time(kafka_topic_partition_under_replicated_partition{job="data/mp-kafka-exporter"}[2m])
            ) > 0
          for: 10m
          labels: {severity: critical, service: kafka}
          annotations:
            summary: "Kafka under-replicated partition이 10분 지속"
            description: "ISR가 RF보다 작아 다음 broker 상실 시 데이터 위험이 있다. topic별 ISR와 broker 복구 상태를 즉시 확인한다."

        # consumer lag은 여기서 중복 정의하지 않는다. KEDA scale-to-zero를 고려한 정본은
        # pipelines/base/monitoring.yaml 의 MpConsumerIdleWithBacklog·MpConsumerBacklogStuck이다.

    - name: mp-minio
      rules:
        # MinIO native exporter는 미배포다. kubelet PVC 지표는 저장 경로 자체를 재므로 더 직접적이고,
        # 단일 replica/단일 PVC라는 현재 문서화된 예외에도 정확히 맞는다.
        - alert: MpMinIOVolumeMetricsUnavailable
          expr: |
            absent_over_time(kubelet_volume_stats_available_bytes{namespace="observability", persistentvolumeclaim="minio"}[10m])
            or absent_over_time(kubelet_volume_stats_capacity_bytes{namespace="observability", persistentvolumeclaim="minio"}[10m])
          for: 15m
          labels: {severity: warning, service: minio}
          annotations:
            summary: "MinIO PVC 용량 지표를 15분째 수집하지 못함"
            description: "kubelet volume stats와 minio PVC 상태를 확인한다. disk-high 알람도 현재 눈먼 상태다."

        - alert: MpMinIODiskHigh
          expr: |
            1 - kubelet_volume_stats_available_bytes{namespace="observability", persistentvolumeclaim="minio"}
              / kubelet_volume_stats_capacity_bytes{namespace="observability", persistentvolumeclaim="minio"}
            > 0.85
          for: 30m
          labels: {severity: warning, service: minio}
          annotations:
            summary: "MinIO PVC 사용률 85% 초과"
            description: "30분 지속. 단일 replica 저장소이며 Loki·Tempo·PG onsite dump가 함께 의존한다. 버킷별 증가량과 PVC 여유를 확인한다."

    # § PG 복제 슬롯 (이슈 #516, 2026-08-03 신설)
    # 정본 알림인 platform/pg/base/monitoring.yaml 의 MpPGReplicationSlotRetainedWALHigh 는 상한(1GB)에
    # 닿기 직전의 **critical** 큐 역할이다. 여기 둘은 그보다 먼저 울리는 **warning 조기경보 + 고아 탐지**로,
    # 같은 지표(custom-queries.yaml 의 cnpg_pg_replication_slots_*)를 본다. 지표명을 바꾸면
    # 여기 알림도 platform/pg/base/monitoring.yaml 알림도 조용히 죽으므로 custom-queries.yaml 과 동기화 필수.
    - name: mp-pg
      rules:
        # 소비자 없는 슬롯이 WAL 을 무한 붙잡는 사고의 조기경보. 상한 max_slot_wal_keep_size=1GB 보다
        # **낮게** 잡아야 의미가 있다 — 상한에 닿으면 PG 가 그 슬롯을 이미 무효화해버린다(쓰기정지 대신
        # 그 인덱스만 재부트스트랩). 임계 256MiB 는 평시 retained 16MiB · 실측 유출 128MB/h 대비
        # ~2시간의 여유를 주고, 1GB 상한 도달 이전에 확실히 울리는 값이다.
        # physical 슬롯(_cnpg_pg_*, CNPG 아카이빙용)은 항상 reserved 고 이슈 대상이 아니므로
        # slot_type="logical" 로 반드시 좁힌다(정본 알림과 동일 조건).
        - alert: MpPGReplicationSlotRetainedWALWarning
          expr: max by(slot_name) (cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="data", slot_type="logical"}) > 256 * 1024 * 1024
          for: 15m
          labels: {severity: warning, service: data-tier}
          annotations:
            summary: "복제 슬롯 {{ $labels.slot_name }} 이 WAL {{ $value | humanize1024 }}B 보유 — 소비자(PGSync 등) 정체 의심"
            description: "슬롯이 붙잡는 WAL 이 256MiB 를 넘었다. 소비자가 사라진 고아 슬롯이면 그 인덱스의 CDC 만 재부트스트랩한다(상한 1GB 도달 시 슬롯 무효화). pg_replication_slots 를 조회해 소비자 연결 여부를 확인한다."

        # 고아 슬롯의 조기 발견 — **증가 추세**로 잡는다. 보유량(위 알림)이 임계에 닿기 전에
        # "소비가 안 따라가고 있다"를 먼저 본다.
        #
        # 🔴 active=0 을 조건으로 쓰지 않는다(2026-08-04 실측으로 폐기). PGSync 는 walsender
        #    스트리밍이 아니라 **SQL 폴링으로 logical decoding** 을 해서 슬롯이 **상시 active=f** 다:
        #      · pg_stat_replication 에 PGSync 가 없다(잡히는 건 standby pg-2 뿐)
        #      · foodbudget_recipes_live 는 정상 소비 중인데도 active=f 로 계속 관측된다
        #        (이슈 #516 본문의 2026-08-03 실측도 active=f · retained 16MB, 하루 뒤 지금도 동일 —
        #         고아였다면 128MB/h 로 하루 3GB 가 쌓였어야 한다)
        #    즉 `active == 0` 은 정상 상태라 변별력이 없고, for 를 6h 로 잡아도 영구 오탐이 된다.
        #
        # 그래서 진짜 위험 신호인 **보유량 증가**를 본다. 이번 사고는 15분에 32MB(=128MB/h)였으므로
        # 2시간이면 256MB 증가 → 아래 200MiB 임계를 확실히 넘는다. 반대로 정상 슬롯은 보유량이
        # 16MB 근처에 머물러 delta 가 0 이라 울리지 않는다. gauge 이므로 increase() 가 아니라 delta().
        #
        # ⚠️ max by(slot_name) 은 중복 흡수용이다 — 같은 슬롯이 **두 시계열**로 온다.
        #    CNPG 기본 쿼리(cnpg-default-monitoring)와 우리 custom-queries.yaml 이 같은 지표명을
        #    내고 라벨만 다르다(기본=database 라벨 / 우리=wal_status 라벨). 2026-08-04 실측 확인.
        - alert: MpPGReplicationSlotWALGrowing
          expr: max by(slot_name) (delta(cnpg_pg_replication_slots_pg_wal_lsn_diff{namespace="data", slot_type="logical"}[2h])) > 200 * 1024 * 1024
          for: 15m
          labels: {severity: warning, service: data-tier}
          annotations:
            summary: "복제 슬롯 {{ $labels.slot_name }} 의 보유 WAL 이 2시간새 {{ $value | humanize1024 }}B 증가 — 소비 정체"
            description: "슬롯이 붙잡는 WAL 이 계속 늘고 있다(소비자가 못 따라가거나 사라졌다). 방치하면 상한 1GB 에 닿아 슬롯이 무효화되고 그 인덱스는 재부트스트랩이 필요해진다. pg_replication_slots 의 restart_lsn 이 전진하는지 확인하고, 소비자가 없는 고아면 삭제한다(런북 ops/pgsync-stable-alias/README.md §3-1)."

