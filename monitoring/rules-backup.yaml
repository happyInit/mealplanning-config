# 백업 신선도 알림 — 백업 트랙의 **운영 진입점**.
#
# 🔴 왜 신설하나(2026-08-03): 백업이 5트랙 도는데 **알림이 0건이었다.**
#   그날 릴리스 이미지 백업이 **전량 실패한 채로 빌드는 초록**이었다(Jenkins 자격증명이
#   placeholder 문자열 → InvalidAccessKeyId). 사람이 우연히 로그를 읽어서 발견했다.
#   백업은 **필요해지는 순간까지 아무도 안 본다** — 그래서 조용한 실패가 기본값이고,
#   알림이 없으면 "백업이 있다"는 믿음만 남는다. 그 믿음이 DR 때 깨진다.
#
# 🔴 무엇을 재는가 — "잡이 성공했나"가 아니라 **"S3 에 최신 오브젝트가 있나"**.
#   지표 출처 = 마스터의 `mp-backup-freshness` timer(15분) → node-exporter textfile
#   (app 레포 `roles/backup_freshness`). 목적지를 직접 보므로 아래가 **한 신호로** 잡힌다:
#     자격증명 붕괴 · 타이머 미발화 · 업로드 무음실패 · 버킷 오타 · 권한 회수.
#
# 🔴 CNPG 지표를 쓰지 않는 이유(중요 — 다음 사람이 반드시 다시 시도한다):
#   `cnpg_collector_last_available_backup_timestamp` 는 **계속 0 이다.** barman-cloud
#   **플러그인** 방식에서는 CNPG 가 이 필드를 안 채운다(2026-08-03 실측: Backup CR 은
#   completed, S3 에 base 도 있는데 지표·`status.lastSuccessfulBackup` 은 비어 있음).
#   이걸 근거로 알림을 만들면 **영구 오탐**이다. 그래서 S3 실물을 본다.
#
# 임계값 근거 = 각 트랙의 실제 주기에 "1회 놓침"을 더한 값. 한 번 걸러도 안 울리고,
#   두 번 연속 놓치면 운다 — 야간 오탐과 조용한 실패 사이의 타협점.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mp-backup
spec:
  groups:
    - name: mp-backup
      rules:
        # ── 계측 자체가 살아있나 (이게 죽으면 아래 전부가 무력화된다) ──────────
        # 🔴 이 알림이 첫 번째인 이유: 나머지 알림은 전부 이 지표에 얹혀 있다.
        #    지표가 사라지면 "조용함 = 정상" 으로 읽혀 정확히 원래 문제로 되돌아간다.
        - alert: MpBackupProbeMissing
          expr: |
            absent(mp_backup_check_timestamp_seconds)
          for: 1h
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "백업 신선도 계측이 사라졌다 — 모든 백업 알림이 무력화된 상태"
            description: >-
              마스터의 mp-backup-freshness timer 또는 node-exporter textfile 수집이 멈췄다.
              지금은 백업이 죽어도 알 방법이 없다.
              확인: ssh ubuntu@192.168.0.17 'systemctl status mp-backup-freshness.timer'

        # S3 조회 자체가 실패 = 자격증명·권한·네트워크. 백업 자체보다 먼저 터지는 신호다.
        - alert: MpBackupProbeFailed
          expr: |
            mp_backup_check_success == 0
          for: 30m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "백업 트랙 {{ $labels.track }} 의 S3 조회 실패"
            description: >-
              자격증명 무효·권한 회수·버킷 부재 중 하나다. 업로드도 같이 죽어 있을 가능성이 높다.
              확인: ssh ubuntu@192.168.0.17 'sudo /usr/local/sbin/mp-backup-freshness.sh; echo $?'

        # ── PG — RPO 직결 ───────────────────────────────────────────────────
        # WAL 은 평시 4~6분 간격으로 올라간다(archive_timeout 302s). 45분이면 7회 이상 놓친 것.
        # 🔴 critical 인 이유: WAL 이 끊기면 PITR 체인이 끊어져 **RPO 가 즉시 열화**한다.
        #    base 는 어제 것이 있어도 그 이후를 복구할 수 없게 된다.
        - alert: MpBackupWalArchivingStalled
          expr: |
            time() - mp_backup_last_object_timestamp_seconds{track="pg_wal"} > 2700
          for: 15m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "PG WAL 아카이빙 정체 — PITR 체인 끊김 (RPO 열화)"
            description: >-
              45분 이상 새 WAL 이 S3 에 올라오지 않았다. 마지막 오브젝트로부터의 시간이
              그대로 RPO 손실 구간이 된다.
              확인: kubectl exec -n data pg-1 -c postgres -- psql -c 'select * from pg_stat_archiver'

        # 매일 03:00 KST → 30시간이면 하루를 통째로 놓친 것.
        - alert: MpBackupPgBaseStale
          expr: |
            time() - mp_backup_last_object_timestamp_seconds{track="pg_base"} > 108000
          for: 30m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "PG base 백업이 30시간 넘게 갱신되지 않음"
            description: >-
              base 가 오래될수록 복구 시 재생할 WAL 이 늘어 RTO 가 열화한다.
              확인: kubectl get backup -n data --sort-by=.metadata.creationTimestamp | tail -3

        # ── etcd — 클러스터 DR ───────────────────────────────────────────────
        # 매일 02:00 KST. 🔴 이 백업은 **비밀·PKI 묶음(secrets 트랙)과 한 쌍**이다 —
        #   스냅샷만 있고 암호화 키가 없으면 Secret 을 한 건도 못 읽는다.
        - alert: MpBackupEtcdStale
          expr: |
            time() - mp_backup_last_object_timestamp_seconds{track="etcd"} > 108000
          for: 30m
          labels:
            severity: critical
            service: backup
          annotations:
            summary: "etcd 스냅샷이 30시간 넘게 갱신되지 않음"
            description: >-
              컨트롤플레인 DR 의 유일한 복원점이다. 단일 etcd 멤버라 노드 상실 = 스냅샷 복원.
              확인: ssh ubuntu@192.168.0.17 'systemctl status mp-etcd-backup.service'

        # ── 비밀·PKI 묶음 — etcd 백업의 짝 ──────────────────────────────────
        # 주 1회(일 02:30 KST) → 9일이면 2회 연속 놓친 것.
        # warning 인 이유: 즉시 유저 영향이 없고, 마지막 성공본이 S3 에 남아 있다.
        #   다만 그 사이에 키가 회전되면 백업본이 라이브와 어긋난다 — 그래서 방치는 금물.
        - alert: MpBackupSecretsStale
          expr: |
            time() - mp_backup_last_object_timestamp_seconds{track="secrets"} > 777600
          for: 1h
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "비밀·PKI 묶음이 9일 넘게 갱신되지 않음"
            description: >-
              etcd 암호화 키·kubeadm CA(ca.key·sa.key)의 오프사이트 사본이 낡고 있다.
              이게 없으면 etcd 스냅샷을 복원해도 클러스터가 서지 않는다.
              확인: ssh ubuntu@192.168.0.17 'systemctl status mp-secrets-backup.service'

        # ── 소스 미러 — GitHub 상실 DR ──────────────────────────────────────
        # 매월 1일 → 35일이면 한 달을 건너뛴 것.
        - alert: MpBackupSourceStale
          expr: |
            time() - mp_backup_last_object_timestamp_seconds{track="source"} > 3024000
          for: 6h
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "소스 미러 백업이 35일 넘게 갱신되지 않음"
            description: >-
              확인: ssh ubuntu@192.168.0.10 'systemctl status mp-source-backup.service'

        # ── 릴리스 이미지 ───────────────────────────────────────────────────
        # 🔴 여기만 "신선도"가 아니라 "개수"를 본다. 릴리스는 비정기(수동)라 신선도 임계가
        #    무의미하기 때문 — 두 달 릴리스가 없으면 정상인데도 계속 운다.
        #    대신 **한 번도 보관된 적이 없다**는 상태는 명백한 배선 결함이라 그걸 잡는다.
        #    (실패의 즉시 감지는 Jenkinsfile 쪽 담당 — 업로드 실패 시 빌드를 UNSTABLE 로 내린다.)
        - alert: MpBackupImageNeverArchived
          expr: |
            mp_backup_object_count{track="image"} == 0
          for: 1h
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "릴리스 이미지 백업 버킷이 비어 있음 — 한 번도 보관된 적 없음"
            description: >-
              Jenkins credential 'mp-backup-s3' 가 유효한지 먼저 본다(2026-08-03 에 이 값이
              입력창 안내문구 그대로 저장돼 있어 전량 실패했다).

        # ── PG 온사이트 논리덤프 (in-cluster MinIO · CronJob) ────────────────
        # 여긴 S3 가 아니라 MinIO 라 위 계측 대상이 아니다 → kube-state-metrics 로 본다.
        # 🔴 DR 아님(MinIO 가 호스트 B 단독) — 테이블 단위 즉시 복원용 보조 수단이라 warning.
        - alert: MpBackupPgOnsiteDumpStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{cronjob="mp-pg-onsite-dump"} > 108000
          for: 1h
          labels:
            severity: warning
            service: backup
          annotations:
            summary: "PG 온사이트 논리덤프가 30시간 넘게 성공하지 않음"
            description: >-
              확인: kubectl get jobs -n data -l cronjob-name=mp-pg-onsite-dump
