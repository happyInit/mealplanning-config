apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - servicemonitor.yaml
  - rules.yaml
  - rules-physical.yaml
  # 🔴 2026-08-03 신설 — 파일을 가른 이유는 내용이 아니라 **소유권**이다.
  #    rules.yaml 하나를 여러 명이 동시에 고치면 머지 충돌이 난다.
  #    두 항목을 **여기에 미리 등록**해 두는 것이 핵심 — 안 그러면 각자 작업하다가
  #    결국 둘 다 이 kustomization.yaml 을 고쳐서 같은 자리에서 충돌한다.
  - rules-app-symptom.yaml # 유저경로 SYMPTOM (봉수)
  - rules-data-tier.yaml # PGSync·ES·Kafka·MinIO (태현)
  - rules-rollouts.yaml # 카나리 배포(Argo Rollouts) — ADR-0001 운영 진입점

# ── Grafana 대시보드 이식 (모니터링 컷오버 ⑤, 2026-07-30) — 구 .11 provisioning JSON 13장 ──
# 인클러스터 Grafana 의 sidecar 가 grafana_dashboard 라벨을 단 CM 을 자동 로드한다.
# 이 kustomization 은 namespace: app 을 강제하므로 sidecar 는 searchNamespace: ALL 이 전제
# (kube-prometheus-stack values — app repo 소관). 데이터소스 uid(prometheus·loki·tempo)는
# 양쪽이 동일해 JSON 무수정 이식. 총 ~360KB — CM 1MB 한도 내.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    # CM 데이터 ~360KB > client-side apply 의 last-applied 어노테이션 한도 256KB → SSA 강제
    # (2026-07-30 실측: sync 실패 "metadata.annotations: Too long"). SSA 는 last-applied 미기록.
    argocd.argoproj.io/sync-options: ServerSideApply=true
configMapGenerator:
  - name: mp-grafana-dashboards
    files:
      - dashboards/00-overview.json
      - dashboards/01-service-detail.json
      - dashboards/02-data-pipeline.json
      - dashboards/03-data-systems-health.json
      - dashboards/04-infrastructure-overview.json
      - dashboards/05-observability-health.json
      - dashboards/06-security-overview.json
      - dashboards/07-container-resources.json
      - dashboards/08-hypervisor.json
      - dashboards/detail-elasticsearch.json
      - dashboards/detail-kafka.json
      - dashboards/detail-postgresql.json
      - dashboards/detail-redis.json
