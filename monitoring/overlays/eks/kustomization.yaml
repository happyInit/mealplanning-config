apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 아직 배포 대상이 아니다 ──────────────────────────────
# 신설 = 0-1(2026-08-09) · 0-3c 반영 = 2026-08-10.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE) — 렌더 성공만 본다.
#    **초록 = 이관 준비 완료가 아니다.** 아래 "아직 안 갈린 것"을 반드시 같이 읽을 것.
#
# ── ✅ 갈린 것 ────────────────────────────────────────────────────────────────
# 1. **0-3c `rules-physical.yaml` (PrometheusRule/mp-physical-layer · 9룰)** — 이 오버레이에
#    **패치가 없다.** 파일이 `../onprem/` 으로 내려가 base 에 없기 때문이다(그쪽이 정본).
#    근거는 도달성이 아니라 **장애 도메인**이다: 타깃이 Proxmox 물리 2대(`job=hypervisor`)와
#    호스트 C(`job=vm-node`·`vm-cadvisor`)인데 AWS 에 **대응물이 없다** → 영구 TargetDown.
#    🔴 검증 방법 = `kubectl kustomize monitoring/overlays/eks | grep mp-physical-layer` 가
#       **빈 결과**여야 한다. 누가 base 에 되돌려 놓으면 여기서 조용히 다시 샌다.
#
# 2. **`mp-data-tier` 의 `mp-minio` 그룹 제거 (C-18)** — AWS 에는 MinIO 가 없다(→ S3).
#    두 룰 중 `MpMinIOVolumeMetricsUnavailable` 이 `absent_over_time(...)` 기반이라
#    **대상이 없으면 발화한다** — 즉 EKS 에서 영구 firing 이 된다(0-3c 와 같은 실패 유형).
#    🔴 `op: test` 를 앞에 둔 이유: JSON6902 는 **인덱스**로 지운다. 누가 groups 순서를 바꾸면
#       엉뚱한 그룹이 지워지므로, 이름이 다르면 **렌더가 실패하도록** 막아 둔다.
#       (validate.py `check_site_overlays()` 가 eks 렌더 실패를 잡는다 = 조용히 안 썩는다.)
#
# 3. **1-28 알림 룰셋 사이트화 (2026-08-13)** — 아래 §1-28. 두 가지를 했다:
#    ① `mp-workload-spread` 통째 교체(`$patch: delete` + `rules-workload-spread.yaml`)
#    ② `mp-backup` 에서 **AWS 에 대상이 없는 4알람 제거**
#    근거·전수 분류는 `monitoring/EKS-RULESET.md`.
#
# 4. **Blue-Green `-preview` 를 알림 집계에서 제외 (2026-08-17)** — 맨 아래 블록.
#    base 의 `service!~".*-canary"` 는 **카나리 시절 식**이라 EKS 에서 절반만 듣는다.
#    C-76 으로 Service 가 셋(`account`·`account-canary`·`account-preview`)이 되면서
#    preview 가 남아 **2중 계상**된다 ⇒ `MpAuthPathFailing` 이 실제 3건에서 운다(의도 5건).
#    🔴 이건 "쓰인 시점엔 맞았던 규칙이 형상 변경을 못 따라온" 부류다 —
#       ALB(C-26→C-60)·MinIO(C-18)·Kafka(C-44) 와 정확히 같은 유형이니 다음에도 여기부터 의심할 것.
#
# ── ✅ 여기서 해소된 것 (종전 "앱 레포 소관" 이었던 것) ──────────────────────────
# 🔴 아래 A·B·C 는 **더 이상 미결이 아니다** — 0-3(2026-08-13)이 EKS 쪽 kube-prometheus-stack 을
#    ArgoCD/config 소유로 **신설**하면서 values 가 이 레포 안으로 들어왔다:
#    `platform/argocd/overlays/eks/kube-prometheus-stack.yaml`
# A. ✅ **0-3b `externalLabels: {site: aws}` · 1-27 `retentionSize: 14GiB` · `nodeSelector` 제거**
#    · `storageClassName: gp3` · PVC 30→20Gi(C-16) — 전부 그 파일에 있다.
#    ⚠️ **온프렘 쪽은 여전히 미결**이고 그게 의도다(C-83 형상 동결) — 온프렘 Prometheus 에는
#       `site` 라벨을 붙이지 않는다. 쿼리 규약 = 온프렘은 라벨 부재 = `site!="aws"`.
#       종전 명세(`monitoring/SITE-SPLIT.md` §2·§3)는 **온프렘에 대해서만** 유효한 기록으로 남는다.
# B. ✅ **스크레이프 job 4종**(hypervisor·vm-node·vm-cadvisor·vm-alloy) — 같은 파일에
#    `additionalScrapeConfigs` 를 **아예 두지 않았다**. 룰(0-3c)만 갈고 타깃을 안 가르면
#    절반만 고친 것이라 스택 빌트인 `TargetDown` 이 4건 영구 발화한다.
# C. ✅ **`PrometheusRule/mp-workload-spread`** — 아래 §1-28 ① 로 교체 완료.
#    선행이던 KSM `--metric-labels-allowlist=nodes=[topology.kubernetes.io/zone]` 도 같은 파일에서 켰다.
#
# ── 🔴 아직 안 갈린 것 (이 레포에서 못 하거나, 사람 결정 대기) ──────────────────
# D. **대시보드 `08-hypervisor.json`** — 온프렘 물리 전용이라 EKS 에선 빈 패널이 된다.
#    알람이 아니라 소음이 0 이므로 **의도적으로 두었다**(빼려면 CM 을 갈라야 하는데 그러면
#    onprem 렌더가 바뀐다 = 0-1 안전기준 위반). 정리하려면 별건으로.
# E. **`rules-backup.yaml` 의 런북 문자열** — `ssh ubuntu@192.168.0.17` / `.10` 이 박혀 있다.
#    `annotations` 는 발화·라우팅에 참여하지 않아 **오발화를 만들지 않는다** → 0-3c 대상 아님.
#    다만 AWS 온콜이 없는 호스트로 안내받는다 → 문구 정리 별건.
# 🔴 `namespace: app` 을 여기 다시 적는 이유 = onprem 오버레이와 **같은 사정**이다.
#    base 의 `namespace:` 는 base 의 resources 에만 적용된다. 이 오버레이가 **직접** 넣은
#    `rules-workload-spread.yaml` 은 base 트랜스포머를 안 거치므로, 여기서 지정하지 않으면
#    네임스페이스 없이 렌더돼 base 산출물(전부 `app`)과 갈린다.
#    base 산출물에 대해서는 무연산이다(이미 `app` — 렌더 diff 로 확인).
namespace: app
resources:
  - ../../base
  # 1-28 ① — base `mp-workload-spread` 의 EKS 대체본. 아래 patches 의 `$patch: delete` 와 한 묶음.
  - rules-workload-spread.yaml
  # 2026-08-17 — 논리 덤프 트랙. base 의 온사이트(MinIO) 판정이 C-18 로 사라진 자리를 메운다.
  #   🔴 base 룰은 "CronJob 이 성공했나"를 봤지만 이건 **S3 실물**을 본다(2026-08-03 교훈).
  - rules-backup-pgdump.yaml
  # 2026-08-17 — 랭킹 모델 적재 감시(체크리스트 1-21). EKS 전용인 이유는 그 파일 머리말에.
  - rules-ranking.yaml
  # 2026-08-17 — 쿼터 포화·파드 생성 실패. 🔴 상용 규칙(KubeQuota*)이 **있는데도** 이번 사고를
  #   못 잡았다(15분 지속 + info · Exceeded 는 애초에 발화 불가). 그 세 구멍은 그 파일 머리말에.
  - rules-quota.yaml
patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mp-data-tier
    patch: |
      - op: test
        path: /spec/groups/2/name
        value: mp-minio
      - op: remove
        path: /spec/groups/2
      # 🔴 **`mp-kafka` 그룹 제거 (C-44 · 2026-08-16)** — EKS 에 Kafka 가 없다.
      #    `MpKafkaMetricsUnavailable` 이 `absent(up{job="data/mp-kafka-exporter"})` 라
      #    **대상이 없으면 발화한다** ⇒ 바로 위 MinIO 와 정확히 같은 실패 유형이다.
      #    🔵 `EKS-RULESET.md §ⓑ` 가 *"EKS 에 Kafka 없음으로 확정되면 여기서 제거"* 라고
      #       처방까지 적어 뒀고 **C-44(Kafka 전면 제거)가 그 조건을 닫았다.**
      #    🔴 **실측으로 드러났다** — `monitoring` 트랙을 켠 직후(감사 F-1) 이 알림이 실제로 발화했다.
      #       *켜기 전에는 규칙 자체가 없어 안 보였을 뿐이다.* 관측을 켜면 이런 게 같이 나온다.
      #    ⚠️ **인덱스가 하나 당겨진다** — 위에서 `2`(mp-minio)를 지우면 `mp-kafka` 가 **1** 이 된다.
      #       그래서 `op: test` 로 이름을 먼저 확인한다(순서가 바뀌면 렌더가 죽는다).
      - op: test
        path: /spec/groups/1/name
        value: mp-kafka
      - op: remove
        path: /spec/groups/1

  # ══ §1-28 ① `mp-workload-spread` 통째 교체 (2026-08-13) ═════════════════════
  # base 판은 zone 을 노드 **이름 정규식**으로 파생한다(`k8s-worker-([ab])[0-9]+`). EKS 노드는
  # `ip-10-…` 이라 하나도 안 맞아 `MpNodeZoneMapUnknown` 이 전 노드에서, 그리고 zone 이 빈 라벨로
  # 접혀 `MpDeploymentPodsOnSingleZone` 이 **replica 2 이상 전 Deployment 에서** 오발화한다.
  # ⇒ 삭제하고 `rules-workload-spread.yaml`(kube_node_labels 조인)로 갈아 끼운다.
  #
  # 🔴 **왜 patch 로 필드만 고치지 않고 통째로 지우나** — 바꿀 것이 record 규칙 2개의 expr 본문
  #    전체이고, 남는 4개(records 2 + alerts 2)도 그 record 를 참조한다. JSON6902 로 expr 문자열을
  #    replace 하면 "이 룰이 왜 이렇게 생겼나" 가 두 파일에 쪼개져 다음 사람이 못 읽는다.
  #    삭제 + 신설이면 EKS 판이 **한 파일에 완결**된다(0-3c 가 rules-physical 에 쓴 것과 같은 방식).
  # 🔴 대체본의 `metadata.name` 이 `-eks` 접미인 이유 = 같은 이름이면 kustomize 가 리소스를
  #    **수집 단계**에서 ID 충돌로 거부한다(patch 는 그 뒤 단계라 늦다). **alertname 은 동일**하다.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mp-workload-spread
    patch: |
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: mp-workload-spread
        namespace: app

  # ══ §1-28 ② `mp-backup` — AWS 에 **대상이 없는** 4알람 제거 (2026-08-13) ═══════
  # 9알람 전부가 `mp_backup_*`(node-exporter textfile collector) 또는 `kube_cronjob_*` 기반이다.
  # 🔴 발화 의미론을 먼저 봐야 한다 — 지울 것과 남길 것이 여기서 갈린다:
  #     · `absent(X)`            → X 가 없으면 **발화한다**
  #     · `X == 0` · `time()-X>N` → X 가 없으면 시리즈가 비어 **발화하지 않는다**(조용히 침묵)
  #
  # ── 지우는 4개 = **AWS 에 감시 대상 자체가 존재하지 않는 것** ────────────────
  #   · `MpBackupEtcdStale`         — EKS 는 컨트롤플레인이 관리형이라 **우리가 백업할 etcd 가 없다.**
  #                                   AWS 가 알아서 한다. 우리 쪽 백업 잡이 영원히 안 생긴다.
  #   · `MpBackupSourceStale`       — 소스 레포 백업은 호스트 C(`.10`)에서 돈다 = 온프렘 전용.
  #   · `MpBackupImageNeverArchived`— Harbor 이미지 아카이브. EKS 는 ECR 이고 ECR 은 AWS 가 복제한다.
  #   · `MpBackupPgOnsiteDumpStale` — `kube_cronjob_status_last_successful_time{cronjob="mp-pg-onsite-dump"}`
  #                                   = 온사이트 MinIO 덤프. C-18 로 MinIO 가 없다.
  #   ⇒ 넷 다 지금은 "조용한" 부류지만(위 의미론), **남기면 더 나쁘다**: AWS 온콜이 룰 목록에서
  #     `MpBackupEtcdStale` 을 보고 "etcd 백업은 감시되고 있다" 고 읽는다. 침묵을 정상으로 오독한다.
  #
  # ── 남기는 5개 (지우지 않는 근거) ───────────────────────────────────────────
  #   · `MpBackupProbeMissing`(absent) — 🔴 **EKS 에서 즉시 발화한다. 그리고 그게 맞다.**
  #     `mp_backup_*` 를 쓰는 주체는 앱 레포 Ansible 롤(`backup_freshness`)이고 온프렘 호스트에만
  #     있다 → AWS 에는 메트릭이 없다 → absent 가 참. 이것은 **오발화가 아니라 참인 사실**이다:
  #     "AWS 에 백업 신선도 관측이 없다." 끄면 그 사실이 사라지고 아무도 안 만든다.
  #     ⇒ **이관 전 선행 작업으로 승격**할 항목이다(프로브를 EKS 로 이식). 상세 = EKS-RULESET.md.
  #   · `MpBackupProbeFailed` · `MpBackupWalArchivingStalled` · `MpBackupPgBaseStale`
  #     · `MpBackupSecretsStale` — 대상이 **AWS 에도 실재한다**(CNPG barman-cloud → S3 의 WAL·베이스
  #     백업 = C-15 로 PG 자체운영 유지 · 비밀 = Secrets Manager). 프로브가 이식되면 그날부터 바로 일한다.
  #
  # 🔴 인덱스 기반 `op: remove` 는 **내림차순**이어야 한다 — 앞을 먼저 지우면 뒤 인덱스가 밀린다.
  #    각 remove 앞의 `op: test` 는 base 의 룰 순서가 바뀌면 **렌더가 죽게** 하는 장치다
  #    (`validate.py check_site_overlays()` 가 eks 렌더 실패를 잡는다 = 조용히 엉뚱한 걸 지우지 않는다).
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mp-backup
    patch: |
      - op: test
        path: /spec/groups/0/rules/8/alert
        value: MpBackupPgOnsiteDumpStale
      - op: remove
        path: /spec/groups/0/rules/8
      - op: test
        path: /spec/groups/0/rules/7/alert
        value: MpBackupImageNeverArchived
      - op: remove
        path: /spec/groups/0/rules/7
      - op: test
        path: /spec/groups/0/rules/6/alert
        value: MpBackupSourceStale
      - op: remove
        path: /spec/groups/0/rules/6
      # 🔴 **`MpBackupSecretsStale` 도 뺀다 (2026-08-17)** — 종전 주석은 *"비밀 = Secrets Manager
      #    라 AWS 에도 실재한다"* 고 적었지만, 그건 **비밀이 있다**는 말이지 **우리가 뜬 백업이
      #    있다**는 말이 아니다. 온프렘은 K8s Secret 을 S3 로 떠 넣어야 했으나(내구성이 etcd 뿐),
      #    Secrets Manager 는 그 자체가 durable store 다(다중 AZ · 버전 · 삭제 복구창).
      #    ⇒ 잴 대상이 없다 = etcd 와 같은 논리. 프로브도 `secrets` 트랙을 내지 않는다.
      #    🔴 트랙을 안 내면서 룰만 남기면 시리즈가 비어 **영원히 침묵**한다(= 감시되는 척).
      - op: test
        path: /spec/groups/0/rules/5/alert
        value: MpBackupSecretsStale
      - op: remove
        path: /spec/groups/0/rules/5
      - op: test
        path: /spec/groups/0/rules/4/alert
        value: MpBackupEtcdStale
      - op: remove
        path: /spec/groups/0/rules/4

  # ══ Blue-Green `-preview` 를 알림 집계에서 제외 (2026-08-17) ═════════════════════
  # 🔴 **base 의 `service!~".*-canary"` 는 EKS 에서 절반만 듣는다.**
  #    base 주석은 *"카나리 중에는 같은 파드가 두 Service 에 동시에 속해 2배가 된다"* 고 적었다.
  #    맞는 말이지만 **그건 카나리 시절 얘기다.** C-76 으로 EKS 는 account·recipe 가 Blue-Green 이고
  #    Argo Rollouts 가 Service 를 **세 개**(`account` · `account-canary` · `account-preview`) 유지한다.
  #    ⇒ 제외가 `-canary` 하나뿐이라 **preview 가 남아 2중 계상**된다.
  #
  # 🔴 실측 (2026-08-17 · `sum(increase(http_requests_total[1h]))`):
  #       account = 3374.1   account-canary = 3379.2   account-preview = 3380.2
  #       recipe  =    9.076 recipe-canary  =    9.076 recipe-preview  =    9.076
  #    세 Service 가 **같은 파드**를 가리키므로 값이 같다. BG 는 배포 중이 아닐 때
  #    active 와 preview 가 같은 ReplicaSet 을 가리키기 때문이다(배포 중에만 갈린다).
  #
  # 🔴 왜 이게 실제 오발화인가 — `mp-app-symptom` 3알람은 전부 **절대 건수** 임계값이다.
  #    `MpAuthPathFailing` 은 `>= 5` 인데 2배로 세므로 **실제 3건에서 운다.** 의도한 감도의 1.6배다.
  #    (비율 알람은 분자·분모가 같이 2배라 상쇄되지만, `mp-app-sli` 는 `sum by(service)` 라
  #     같은 사건에 **알람이 3개** 뜬다 — 수치는 맞고 소음만 3배인 별개 증상이다.)
  #
  # ── 왜 base 가 아니라 여기서 고치나 ────────────────────────────────────────────
  # 🔴 **온프렘에는 `-preview` Service 가 없다**(실측 2026-08-17: `account-canary`·`recipe-canary` 뿐).
  #    C-27 의 전면 Blue-Green 전환은 **이관 후**라 온프렘은 카나리로 남는다.
  #    ⇒ base 를 고치면 온프렘 동작은 그대로인데 **렌더가 바뀌어** C-83 안전기준
  #      (`kubectl kustomize monitoring/overlays/onprem | sha256sum` 불변)이 깨진다.
  #      preview 는 EKS 전용 산물이므로 제외도 EKS 오버레이에 있는 것이 형상과 일치한다.
  #
  # 🔴 **`op: test` 를 `expr` 전문에 건다** — 여기서는 인덱스 확인만으로 부족하다.
  #    이 패치는 expr **전체를 replace** 하므로, 누가 base 에서 임계값을 조정하면
  #    EKS 는 낡은 식을 조용히 계속 쓴다(알람 임계가 두 사이트에서 갈리는데 아무도 모른다).
  #    expr 을 test 하면 그 순간 **렌더가 죽어** validate.py 가 잡는다.
  #    ⚠️ 그래서 base 의 expr 을 고치면 **이 블록도 같이 고쳐야 한다.** 그게 의도다.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mp-app-symptom
    patch: |
      - op: test
        path: /spec/groups/0/rules/0/alert
        value: MpAuthPathFailing
      - op: test
        path: /spec/groups/0/rules/0/expr
        value: |
          sum(increase(http_requests_total{namespace="app",service!~".*-canary",
              handler=~"/api/auth/(login|signup|refresh|google|kakao)",status=~"5.."}[30m])) >= 5
      - op: replace
        path: /spec/groups/0/rules/0/expr
        value: |
          sum(increase(http_requests_total{namespace="app",service!~".*-(canary|preview)",
              handler=~"/api/auth/(login|signup|refresh|google|kakao)",status=~"5.."}[30m])) >= 5
      - op: test
        path: /spec/groups/0/rules/1/alert
        value: MpMealplanRecommendFailing
      - op: test
        path: /spec/groups/0/rules/1/expr
        value: |
          sum(increase(http_requests_total{namespace="app",service!~".*-canary",
              handler="/api/mealplan/recommend",status=~"5.."}[30m])) >= 3
      - op: replace
        path: /spec/groups/0/rules/1/expr
        value: |
          sum(increase(http_requests_total{namespace="app",service!~".*-(canary|preview)",
              handler="/api/mealplan/recommend",status=~"5.."}[30m])) >= 3
      - op: test
        path: /spec/groups/0/rules/2/alert
        value: MpAppErrorsAccumulating
      - op: test
        path: /spec/groups/0/rules/2/expr
        value: |
          sum by (service) (increase(http_requests_total{namespace="app",
              service!~".*-canary",status=~"5.."}[30m])) >= 10
      - op: replace
        path: /spec/groups/0/rules/2/expr
        value: |
          sum by (service) (increase(http_requests_total{namespace="app",
              service!~".*-(canary|preview)",status=~"5.."}[30m])) >= 10

  # ── `mp-app-sli` — 제외가 **아예 없다** (같은 사건에 알람 3개) ──────────────────
  # 🔴 base 의 SLI 3알람은 `sum by(service)` 라 계산은 맞다. 대신 `account`·`account-canary`
  #    ·`account-preview` 가 **각각 별개 시리즈**라 한 장애에 알람이 세 번 뜬다.
  #    온콜이 같은 사건을 셋으로 보고 중복 대응한다 — 위 symptom 과 원인은 같고 증상만 다르다.
  # 🟢 `MpCoreApiSevereLatency`(rules/1)는 **손대지 않는다** — 이미 명시 allowlist
  #    (`service=~"account|mealplan|…"`)라 `account-canary` 가 애초에 매치되지 않는다. 면역이다.
  # 🟢 `MpAppContainerOOMKilled`(rules/3)도 대상 아님 — `service` 라벨을 쓰지 않는다(pod/container 기준).
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: mp-app-sli
    patch: |
      - op: test
        path: /spec/groups/0/rules/0/alert
        value: MpAppHighP95Latency
      - op: test
        path: /spec/groups/0/rules/0/expr
        value: |
          histogram_quantile(
            0.95,
            sum by(service, le) (
              rate(http_request_duration_highr_seconds_bucket{namespace="app"}[15m])
            )
          ) > 1
          and on(service)
          (sum by(service) (increase(http_requests_total{namespace="app"}[15m])) >= 20)
      - op: replace
        path: /spec/groups/0/rules/0/expr
        value: |
          histogram_quantile(
            0.95,
            sum by(service, le) (
              rate(http_request_duration_highr_seconds_bucket{namespace="app", service!~".*-(canary|preview)"}[15m])
            )
          ) > 1
          and on(service)
          (sum by(service) (increase(http_requests_total{namespace="app", service!~".*-(canary|preview)"}[15m])) >= 20)
      - op: test
        path: /spec/groups/0/rules/2/alert
        value: MpAppHighErrorRate
      - op: test
        path: /spec/groups/0/rules/2/expr
        value: |
          (
            sum by(service) (
              increase(http_requests_total{namespace="app", status=~"5.."}[15m])
            )
            /
            sum by(service) (
              increase(http_requests_total{namespace="app"}[15m])
            )
          ) > 0.05
          and on(service)
          (sum by(service) (increase(http_requests_total{namespace="app"}[15m])) >= 20)
      - op: replace
        path: /spec/groups/0/rules/2/expr
        value: |
          (
            sum by(service) (
              increase(http_requests_total{namespace="app", service!~".*-(canary|preview)", status=~"5.."}[15m])
            )
            /
            sum by(service) (
              increase(http_requests_total{namespace="app", service!~".*-(canary|preview)"}[15m])
            )
          ) > 0.05
          and on(service)
          (sum by(service) (increase(http_requests_total{namespace="app", service!~".*-(canary|preview)"}[15m])) >= 20)

  # ══ `ranking-serving` 을 스크레이프 대상으로 복귀 (2026-08-17) ════════════════
  # 🔴 base 는 이 서비스를 **명시적으로 제외**해 왔다 — 근거 주석이 *"`/metrics` 404"* 다.
  #    사실이었다. 이 서비스에는 계측이 아예 없었고, 그래서 `rules.yaml` 도
  #    *"ranking-serving 은 이 지표 미노출 — 정상"* 이라 적고 넘어갔다. **정상이 아니라 구멍이었다.**
  # 🟢 앱 MR 로 `prometheus-fastapi-instrumentator` + `mp_ranking_model_loaded` 를 넣었으므로
  #    제외를 걷는다. 이게 없으면 위 `rules-ranking.yaml` 의 두 알림이 **지표를 못 받아 무력**해진다.
  # ⚠️ `frontend` 는 **그대로 제외**한다 — nginx 정적 서빙이라 계측이 없고 포트도 80 이다.
  #
  # 🔴 **EKS 에서만 건다.** 계측은 새 이미지에만 있고 온프렘은 C-83 으로 이미지가 2026-08-10 에
  #    동결돼 있다. 온프렘에서 제외를 걷으면 `/metrics` 404 인 타깃이 생겨 **TargetDown 영구 발화**다.
  # 🔴 `op: test` 로 base 의 제외 목록을 확인한다 — base 가 바뀌면(예: 누가 frontend 를 빼면)
  #    렌더가 죽어서 우리가 엉뚱한 값을 덮어쓰는 것을 막는다.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: mp-app-services
    patch: |
      - op: test
        path: /spec/selector/matchExpressions/1/values
        value: [frontend, ranking-serving]
      - op: replace
        path: /spec/selector/matchExpressions/1/values
        value: [frontend]
