apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **골격만이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-1 이 만드는 것은 "가를 자리"이고, **내용은 Wave B 에서 채운다.**
# 지금은 base 통과라 렌더는 성공하지만 값은 온프렘 그대로다 — 이대로 붙이면 틀린다.
#
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 🔴 0-3c `rules-physical.yaml` 을 **빼야 한다** — 안 빼면 EKS 에서 영구 TargetDown
#      (15일 내 4건 실발화한 룰이다: TempCritical·TempHigh·DiskReadBurst·MpHostCDown)
#    - 0-3b `externalLabels.site` 는 kube-prometheus-stack values 쪽(= Ansible, 0-3) 소관이라 여기가 아니다
#    - 대시보드 JSON 은 데이터소스 uid 가 같으면 무수정 이식
resources:
  - ../../base
