# mp-ingress ns 의 Harbor pull secret — `common/base/pullsecret.yaml`(app ns) 의 같은 사본이다.
#
# 🔴 왜 필요한가: cloudflared 이미지가 Harbor 다(192.168.0.10/mealplanning/mp-cloudflared).
#    그런데 그 Deployment 에는 `imagePullSecrets` 가 **없어서 전적으로 default SA 에 의존**한다
#    (2026-08-06 실측). ns 를 옮기면 새 ns 의 default SA 는 비어 있으므로, 이 시크릿 +
#    SA 패치가 둘 다 있어야 이미지를 당긴다. 하나만 있으면 ImagePullBackOff 다.
#    🔴 나머지 반쪽(default SA 의 imagePullSecrets)은 **Ansible 소관**이다
#       (`k8s_cluster_base` tasks — app·data·pipeline·mp-ingress 루프). 이 파일만으론 안 된다.
#
# ⚠️ 공개 게이트웨이 파드는 이게 필요 없다 — 이미지가 `registry.istio.io/release/proxyv2` 공개다.
#    즉 이 파일은 **cloudflared 하나 때문에** 존재한다. cloudflared 가 이 ns 를 떠나면 지워도 된다.
#
# 형식·선행조건은 common/base/pullsecret.yaml 및 pipelines/base/externalsecret.yaml 주석 참조
# (백엔드 = fb-secrets `harbor-pull`). target 이름은 `harbor` 고정 — default SA 가 그 이름을 문다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: harbor
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef: {key: harbor-pull, property: REGISTRY}
    - secretKey: username
      remoteRef: {key: harbor-pull, property: USERNAME}
    - secretKey: password
      remoteRef: {key: harbor-pull, property: PASSWORD}
