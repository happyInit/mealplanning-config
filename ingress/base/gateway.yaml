# 공개 게이트웨이 — .14 (플랜 §3.3 "LoadBalancer 는 게이트웨이 전용, 상시 2개" 중 1번)
#
# 🔴 Gateway 하나 = LoadBalancer Service 하나다. istiod 가 이 리소스를 보고 Envoy Deployment +
#    Service(type: LoadBalancer)를 대신 만들고, MetalLB 가 거기에 .14 를 붙인다(object_spec §5.2).
#    그래서 개별 서비스를 LoadBalancer 로 노출하지 않는다 — EKS 이식 시 교체 대상을 상수 2 로 묶는 규칙.
#
# 🔴 MetalLB 풀이 autoAssign:false 라 주소 풀 주석이 **없으면 영원히 Pending** 이다(P1 핸드오프 3-②).
#    자동 생성되는 Service 에 주석을 전달하는 경로가 spec.infrastructure.annotations.
#
# TLS(object_spec §5.2): HTTPS 443 종단 + HTTP 80 → 443 리다이렉트.
#   443 리스너가 cert-manager Secret `mp-gw-public-tls`(Let's Encrypt·app.mealbong.cloud)로 TLS 를 끊고,
#   앱 라우트 10개는 sectionName: https 로 443 에만 붙는다. 80 리스너에는 리다이렉트 라우트(mp-https-redirect)만.
#   발급 배선 = issuer.yaml · certificate.yaml · externalsecret-cloudflare.yaml(전부 **이 ns**).
#
# 🔴 ns 이전(#532 ③, 2026-08-06): app → mp-ingress. 근거 = 쿼터 결합(app 쿼터 6Gi 를 앱과 공유해
#    HPA 가 붙으면 게이트웨이 surge 파드가 못 뜬다). 보안은 #532 ② 가 이미 해결했다.
#    🔴 **HTTPRoute 는 app ns 에 남는다** — backendRef 가 같은 ns 의 Service 라 ReferenceGrant 가
#       불필요하기 때문이다. 옮기면 라우트 12개 × ReferenceGrant 가 생긴다. 대신 라우트 부착이
#       cross-ns 가 되므로 아래 allowedRoutes 를 Same → Selector 로 연다(이 파일의 유일한 로직 변경).
#    같이 옮긴 것 = params CM·PDB·EnvoyFilter·Issuer×2·Certificate·CF토큰 ES (전부 같은 ns 전제 참조).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mp-gw-public
  namespace: mp-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      metallb.universe.tf/address-pool: gateway-pool
      metallb.universe.tf/loadBalancerIPs: 192.168.0.14
    # 🔴 HA 파라미터(replica 2 + 노드 분산) — gateway-params.yaml 참조.
    #    istiod 가 만드는 Deployment 를 직접 고치면 재조정에 되돌려진다.
    #    이 ConfigMap 이 istiod 가 인정하는 유일한 커스터마이즈 경로다.
    #    ⚠️ 같은 ns(app) 안에서만 참조 가능하고, 대상이 없으면 Gateway 가
    #       Accepted=False(InvalidParameters)로 떨어질 수 있다 — 반드시 함께 배포한다.
    parametersRef:
      group: ""
      kind: ConfigMap
      name: mp-gw-public-params
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # 🔴 Same → Selector (#532 ③). Gateway 만 mp-ingress 로 왔고 HTTPRoute 는 app 에 남았다.
      #    Same 이면 이 ns(mp-ingress)의 라우트만 받는데 거기엔 라우트가 하나도 없어
      #    **리스너가 라우트 0개로 뜬다** = 전 경로 404. 반드시 app 을 열어야 한다.
      #    ⚠️ `from: All` 이 아니라 Selector 다 — 아무 ns 나 우리 공개 입구에 라우트를 붙이면
      #       임의 워크로드가 공개 경로를 만들 수 있다. 허용 대상은 app 하나로 못박는다.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: app
    - name: https                       # 🔴 TLS 종단 리스너 (object_spec §5.2)
      protocol: HTTPS
      port: 443
      hostname: app.mealbong.cloud      # SNI 매칭 — 이 호스트로 온 TLS handshake 만 이 리스너로
      tls:
        mode: Terminate                 # GW 가 여기서 TLS 를 끊는다(오리진 = 인클러스터 평문/메시 mTLS)
        certificateRefs:
          - kind: Secret
            name: mp-gw-public-tls       # cert-manager Certificate 가 채우는 Secret(같은 ns → RefGrant 불요)
      # http 리스너와 같은 이유로 Selector — 근거는 위 주석 참조.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: app
