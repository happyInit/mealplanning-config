# 파이프라인 비밀 — fb-secrets(정본) ──ESO──▶ pipeline ns (앱 트랙 app-secrets 와 동일 패턴).
# 🔴 선행조건: fb-secrets 에 Secret `pipeline-secrets` 적재 —
#   PGPASSWORD(fbapp)·DATA_GO_KR_SERVICE_KEY·REPORT_GEMINI_API_KEY 는 .8 /opt/data-pipeline/.env 값.
#   ES_PASSWORD 는 ECK 기동 후: kubectl -n data get secret es-es-elastic-user -o jsonpath='{.data.elastic}' | base64 -d
#   (data ns 의 ECK Secret 을 pipeline ns 가 직참조할 수 없어 fb-secrets 경유 — 사람 1회 복사)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-pipeline-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-pipeline-secrets
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: {key: pipeline-secrets, property: PGPASSWORD}
    - secretKey: ES_PASSWORD
      remoteRef: {key: pipeline-secrets, property: ES_PASSWORD}
    - secretKey: DATA_GO_KR_SERVICE_KEY
      remoteRef: {key: pipeline-secrets, property: DATA_GO_KR_SERVICE_KEY}
    - secretKey: REPORT_GEMINI_API_KEY
      remoteRef: {key: pipeline-secrets, property: REPORT_GEMINI_API_KEY}
    # ── Bedrock(#10 리뷰 감정·요약) — AI 파트 추가 2026-07-31 ──
    # ⚠️ 지금은 공유 secret(least-privilege 위배 인지). 추후 전용 mp-review-secrets 로 분리 예정.
    #    AWS_REGION 은 비밀 아니라 CronJob env 로 박음(pollers.yaml).
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: pipeline-secrets, property: AWS_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: pipeline-secrets, property: AWS_SECRET_ACCESS_KEY}
---
# Harbor pull secret IaC 화 (런북 §9-21 부채 해소, 2026-07-30) — 종전 "수동 kubectl 복제"를 대체.
# 🔴 선행조건: fb-secrets 에 Secret `harbor-pull` (REGISTRY·USERNAME·PASSWORD — robot 계정 k8spull).
# target 이름은 기존 실물 `harbor` 유지 — default SA 의 imagePullSecrets 가 이 이름을 문다
# (SA 패치의 IaC = app 레포 k8s_cluster_base). app·data ns 에도 동일 사본 존재(common/·platform/pgsync/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: harbor
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: registry
      remoteRef: {key: harbor-pull, property: REGISTRY}
    - secretKey: username
      remoteRef: {key: harbor-pull, property: USERNAME}
    - secretKey: password
      remoteRef: {key: harbor-pull, property: PASSWORD}
