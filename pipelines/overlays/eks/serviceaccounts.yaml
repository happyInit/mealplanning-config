# 0-14c — 워크로드별 ServiceAccount · pipeline ns 22개 (**EKS 전용**)
#
# 🔴 왜 base 가 아니라 여기인가 = **C-83**(2026-08-13). 온프렘은 *형상 동결*이고 SA 교체는
#    구조·권한 변경이다. 종전 정본의 *"config base 에 넣으면 양 사이트에 다 적용된다"* 는 철회됐다.
#
# 🔴 이름 = **워크로드 이름 그대로.** "SA 하나에 여러 워크로드" 가 지금 상태(`default` 하나에 22개)이고
#    그게 0-14c 가 고치려는 것이다. 종전 eks 오버레이가 제안했던 공용 `mp-review-ai` 는
#    같은 실수의 축소판이라 채택하지 않았다 — 대신 Bedrock **롤 하나를 SA 둘이 신뢰**하게 한다
#    (IRSA 신뢰정책 `StringEquals` 에 sub 두 개. 상세 = docs/eks-pg-roles-and-workload-sa.md §IAM).
#
# 🔴 `imagePullSecrets` 없음 — EKS 는 ECR 이고 kubelet 이 노드 인스턴스 롤로 당긴다(1-31).
#    이 오버레이는 `ExternalSecret/mp-harbor-pull` 자체를 지운다.
# 🔴 `automountServiceAccountToken: false` — 실측상 pipeline 22/22 가 **미설정**이라 파드 37개
#    전부에 K8s API 토큰이 마운트돼 있었다. SA 레벨 false 면 파드가 명시로 뒤집지 않는 한 안 붙는다.
#    IRSA 토큰은 별도 projected 볼륨(`aws-iam-token`)이라 이 플래그와 무관하다.
