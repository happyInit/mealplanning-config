# EKS 파이프라인 PVC — **1개뿐** (A5-a · 2026-08-16)
#
# 🔴 **C-20 의 *"EKS 는 pipeline PVC 0개"* 를 여기서 정정한다.** 그 판단은 A5 가 맨 뒤라
#    파이프라인이 EKS 에 아예 안 올라간다는 전제 위에 있었고, 그래서 base 의 `pvc.yaml` 을
#    `overlays/onprem` 으로 내렸다(0-8). A5-a 로 **내부 배치 10종이 EKS 로 오면서** 그중
#    `mp-chat-insights` 하나가 볼륨을 실제로 쓴다 ⇒ 0개가 아니라 1개다.
#
# 🔵 **온프렘 PVC 2개 중 1개만 온다.** 나머지 `mp-recipe-crawl-state` 는 만개 크롤
#    (`mp-poller-recipe`)의 resume/dedup 상태인데, 그 폴러는 **온프렘 전용**이라(C-3 · D4-a)
#    kustomization 에서 통째로 제외한다 ⇒ 참조가 함께 사라진다.
#    🟢 그래서 오버레이가 스스로 적어 뒀던 *"매달린 claimName 2건"* 중 하나는 **부재로 해소**되고,
#      남은 하나가 이 파일이다.
#
# 🔴 storageClassName 을 **명시하지 않는다** — EKS 기본 SC 가 `gp3-retain`(0-8e)이라
#    적지 않으면 그쪽으로 간다. 리포트 산출물은 잃어도 다음 날 다시 만들어지는 파생물이지만,
#    **기본값을 그대로 따르는 편이 낫다**: 여기에 `gp3`(Delete)를 박아 두면 "왜 이것만 정책이
#    다른가"를 나중에 아무도 답하지 못한다. 예외를 만들 근거가 없으면 예외를 만들지 않는다.
#
# 🔵 1Gi 는 온프렘과 같은 값이다(일 1회 · 텍스트 리포트).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mp-chat-reports
  namespace: pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
