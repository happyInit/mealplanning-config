#                                     · score-review-sentiment · summarize-reviews
#                                     · data-invariants · pantry-expire-recompute
#                                     · deal-pruner · user-data-pruner · chat-insights
#
# 🟢 **부수 효과 — 매달린 claimName 이 하나 사라진다.** `mp-poller-recipe` 를 빼면
#    `mp-recipe-crawl-state` 참조가 함께 사라진다. 남은 `mp-chat-reports` 는 pvc.yaml 이 받는다.
#    ⇒ 오버레이 머리말의 *"알려진 미해결: 매달린 claimName 2건"* 이 이 커밋으로 **둘 다 해소**된다.
#
# 🔴 **왜 지금 급한가 (라이브 실측 2026-08-16)**: `pipelines` 앱이 아직 `overlays/onprem` 을
