apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-9 로 레지스트리만 채웠다(2026-08-10) — 나머지는 아직 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#    ⚠️ 단 **레지스트리만은 예외** — check_eks_registry() 가 eks 렌더의 mp-* 이미지를 전수 본다.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 🔴 **D4-a 로 워크로드가 사이트별로 갈린다** — C-3 으로 크롤은 온프렘 상시 프로덕션이다.
#      즉 eks 오버레이는 base 통과가 아니라 **부분집합 선택**이 될 가능성이 높다.
#      (리파이너 6 + 내부 배치 CronJob 10 = AWS / 크롤 폴러 = 온프렘)
#      🔴 **미착수 — 그래서 지금 이 렌더는 그대로 붙이면 깨진다**(아래 "매달린 claimName" 참조).
#    - ✅ 0-8 PVC SC — **패치가 아니라 부재로 해결**했다. C-20 = EKS 는 pipeline PVC 0개라
#      `pvc.yaml` 을 base 에서 `overlays/onprem` 으로 내렸다. 여기서는 아무것도 안 해도 안 나간다.
#    - 0-9 이미지 → ECR — 미착수
#    - ✅ 0-2 secretStoreRef(2026-08-10)
#    - ✅ 0-16 정적 AWS 키 제거(2026-08-10) — 🔴 워크로드 22개가 아니라 **시크릿에서 뺐다**. 아래 patches 주석 참조
#    - ✅ 0-14c 워크로드별 SA — 22/22 (2026-08-13, 아래 + serviceaccounts.yaml)
#    - ✅ 0-13 PG 롤 `svc_pipeline` (2026-08-13, 아래 — ConfigMap 한 줄로 22개가 같이 간다)
#    - ⛔ **0-14d(`mp-pipeline-secrets` 를 db용/aws용으로 쪼개기) 는 EKS 에서 할 일이 없다.**
#      명세(#571 §B)가 쪼개라고 한 이유는 *"20개는 AWS 키가 필요 없는데 envFrom 이 통째 주입이라
#      뺄 수가 없다"* 였다. **EKS 에서는 뺄 것이 이미 없다** — 위 0-16 패치가 `AWS_ACCESS_KEY_ID`·
#      `AWS_SECRET_ACCESS_KEY` 두 엔트리를 시크릿에서 통째로 지웠고(렌더 실측: eks 4키 / 온프렘 6키),
#      Bedrock 자격증명은 IRSA 가 SA 두 개(`mp-score-review-sentiment`·`mp-summarize-reviews`)에만
#      준다. 여기서 굳이 쪼개면 **키가 0개인 `mp-pipeline-aws-secrets`** 가 생긴다.
#      🔴 그래서 0-14d 는 *온프렘 쪽 항목*으로 남는데, 온프렘은 **C-83 으로 형상 동결**이다
#         (시크릿을 쪼개는 것 = 오브젝트 구조·권한 변경). 명세 §B 의 "런타임 Job 36개 처리 절차"도
#         라이브 온프렘 얘기라 신규 클러스터인 EKS 에는 대상이 없다.
#      ⇒ **이 트랙에서 더 할 일 없음.** 되살리려면 C-83 예외를 먼저 받아야 한다.
resources:
  - ../../base
  - serviceaccounts.yaml

#      🔴 그 판정이 나면 아래 mp-crawler-kurly 매핑은 **같이 지운다** — 지금은
#         "base 통과 + 레지스트리만 교체" 라 매핑이 남아 있어야 렌더가 Harbor 를 안 가리킨다.
#    - 0-8 PVC SC → gp3 · 0-2 secretStoreRef
#    - 🔴 0-16 정적 AWS 키 envFrom 제거(pipeline ns 22 워크로드) — env 가 Pod Identity 보다 앞선다
#    - dnsConfig ndots:1 은 온프렘 LAN DHCP 의 `local` 서치도메인 대응이다(base 에 있다).
#      EKS 에서 필요한지 재판정할 것 — 무해하지만 근거가 다르다


# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`. 계정 ID 가 정해지면 거기를 고치고
# validate.py 가 잡아 주는 목록대로 각 오버레이를 맞춘다(불일치 = 실패).
