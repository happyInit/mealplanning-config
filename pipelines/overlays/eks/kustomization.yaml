# ── ②-b 리파이너 3종 = Kafka → S3/SQS 운반으로 복귀 (A5-b · 2026-08-16) ───────
# ══════════════════════════════════════════════════════════════════════════════
# 🟢 **위 ⓐ 가 예고한 복귀다.** A5-a 가 이 셋을 뺀 이유는 "Kafka 가 없다" 였지 "필요 없다" 가
#    아니었다. 큐(SQS 3종)와 버킷(`mp-crawl-ap2`)이 A5-b 로 생겼으므로 되돌린다.
#
# 🔵 **바뀌는 것은 운반뿐이다 — 전처리는 한 줄도 안 바뀐다.** `transport/consume_*.py` 는
#    구 Kafka 컨슈머와 **같은 적재 함수**(`load_retail.stage_record`·`refine_record`,
#    `load_10k_recipe.process_recipe`)를 그대로 호출한다. 그래서 여기서 갈아끼우는 것은
#    **command 한 줄 + env 3개**이고, 워크로드를 새로 짓지 않는다.
#    🔴 이름을 그대로 쓰는 것이 중요하다 — PodMonitor selector·PrometheusRule·대시보드가
#       전부 `app` 라벨(`retail-refiner` …)에 붙어 있다. 새 이름으로 만들면 관측이 조용히 빈다.
#
# 🔴 **전달 단위가 다르다** — Kafka 는 "메시지 1건 = 레코드 1건", SQS 는 "메시지 1건 = 객체 1개
#    (= 크롤 1회분 N건)". 파드가 중간에 죽으면 그 객체를 **처음부터** 다시 읽는다. 적재 SQL 이
#    전부 `on conflict do nothing` 이라 재처리는 무해하다(근거 = `pipelines/transport/_sqs.py` 머리말).
#
# 🔵 **`CONSUME_IDLE_EXIT` 를 주지 않는다** — 소스는 그 env 로 유휴 종료를 지원하지만, 그건
#    Job 모양일 때 맞는 스위치다. 여기는 **Deployment(restartPolicy=Always)** 라 프로세스가
#    정상 종료해도 kubelet 이 곧바로 재기동한다 ⇒ KEDA 가 cooldown(300s) 뒤 0 으로 내리기 전까지
#    **재시작만 쌓이고**, 그 재시작 카운트가 알림·대시보드를 오염시킨다.
#    ⇒ 파드는 상주시키고 **0 으로 내리는 판단은 KEDA 한 곳에만** 둔다.
  - target: {group: apps, kind: Deployment, name: mp-retail-refiner}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-retail-refiner}
      spec:
        template:
          spec:
            containers:
              - name: retail-refiner
                command: ["python", "pipelines/transport/consume_retail.py"]
                env:
                  - name: MP_SQS_URL
                    value: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-retail
                  - name: MP_CRAWL_BUCKET
                    value: mp-crawl-ap2
                  - name: AWS_REGION
                    value: ap-northeast-2
  - target: {group: apps, kind: Deployment, name: mp-recipe-refiner}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-recipe-refiner}
      spec:
        template:
          spec:
            containers:
              - name: recipe-refiner
                command: ["python", "pipelines/transport/consume_recipe.py"]
                env:
                  - name: MP_SQS_URL
                    value: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-recipe
                  - name: MP_CRAWL_BUCKET
                    value: mp-crawl-ap2
                  - name: AWS_REGION
                    value: ap-northeast-2
  - target: {group: apps, kind: Deployment, name: mp-deal-notifier}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-deal-notifier}
      spec:
        template:
          spec:
            containers:
              - name: deal-notifier
                command: ["python", "pipelines/transport/consume_deal.py"]
                env:
                  - name: MP_SQS_URL
                    value: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-deal
                  - name: MP_CRAWL_BUCKET
                    value: mp-crawl-ap2
                  - name: AWS_REGION
                    value: ap-northeast-2

# ── ②-c ScaledObject = kafka 트리거 → aws-sqs-queue ──────────────────────────
# 🔴 **`triggers` 는 통째로 교체된다** — ScaledObject 는 CRD 라 kustomize 가 strategic merge 를
#    못 쓰고 JSON merge patch(RFC 7386)로 떨어진다. 그 시맨틱에서 **배열은 병합이 아니라 치환**이다.
#    여기서는 그게 정확히 원하는 동작이다(kafka 트리거가 남으면 KEDA 가 없는 브로커를 영원히 찔러
#    `MpKedaScalerErrors` 가 상시 발화한다). 🔵 명시하지 않은 `minReplicaCount`·`cooldownPeriod`·
#    `scaleTargetRef` 는 merge patch 라 **base 값 그대로 살아남는다**.
#
# 🔵 `maxReplicaCount` 는 base 값을 그대로 둔다. base 의 근거였던 *"Kafka 파티션 수를 넘기면
#    남는 컨슈머는 논다"* 는 SQS 에선 성립하지 않지만(큐는 파티션이 없다), 숫자 자체는 여전히
#    합리적인 상한이다 — 리파이너는 전부 **PG 에 쓰는** 워크로드라 무한정 늘리면 병목이 DB 로 옮겨간다.
#
# 🔵 `scaleOnInFlight` 는 기본값(true)을 쓴다 — 처리 중(NotVisible) 메시지를 깊이에 포함한다.
#    🔴 이게 중요하다: 객체 하나 처리에 수 분이 걸리는데 InFlight 를 안 세면 큐가 "비었다"로
#       보여 KEDA 가 **처리 도중에 파드를 0 으로 내린다**. 그러면 가시성 타임아웃 뒤 재전달되고
#       같은 객체를 처음부터 다시 읽는 무한 왕복이 된다.
#
# 🔴 인증은 `authenticationRef` → `TriggerAuthentication/mp-crawl-sqs`(triggerauth.yaml).
#    **`roleArn` 을 트리거에 적지 않는 이유**가 거기 적혀 있다 — 적으면 롤 체이닝이 되고
#    신뢰정책이 그 경로를 안 열어 둬서 AccessDenied 다.
  - target: {group: keda.sh, kind: ScaledObject, name: mp-retail-refiner}
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata: {name: mp-retail-refiner}
      spec:
        triggers:
          - type: aws-sqs-queue
            authenticationRef: {name: mp-crawl-sqs}
            metadata:
              queueURL: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-retail
              queueLength: "1"
              awsRegion: ap-northeast-2
  - target: {group: keda.sh, kind: ScaledObject, name: mp-recipe-refiner}
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata: {name: mp-recipe-refiner}
      spec:
        triggers:
          - type: aws-sqs-queue
            authenticationRef: {name: mp-crawl-sqs}
            metadata:
              queueURL: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-recipe
              queueLength: "1"
              awsRegion: ap-northeast-2
  - target: {group: keda.sh, kind: ScaledObject, name: mp-deal-notifier}
    patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata: {name: mp-deal-notifier}
      spec:
        triggers:
          - type: aws-sqs-queue
            authenticationRef: {name: mp-crawl-sqs}
            metadata:
              queueURL: https://sqs.ap-northeast-2.amazonaws.com/689192361171/mp-crawl-deal
              queueLength: "1"
              awsRegion: ap-northeast-2

# ── ③ 최저가 알림을 Kafka 없이 살린다 — `--emit` → `--emit-direct` ────────────
# 🟢 **앱 코드 변경 0.** 이 스위치는 C-88 로 **이미 만들어져 있다**
#    (`pipelines/ingest/detect_price_anomaly.py`). 종전 경로가
#      detect --emit → Kafka `price.anomaly.detected` → notifier → notify.notification
#    이었는데, 종착지가 PG 라 **중간을 걷어내고 배치가 직접 fan-out** 한다.
# 🟢 정책·멱등을 **재구현하지 않고 그대로 재사용**한다 — `--emit-direct` 가 컨슈머의
#    `fanout()` 을 그대로 호출한다(price_alert_sent PK + 7일 쿨다운 + price_anomaly EXISTS 가드).
#    ⇒ 두 경로의 알림 결과가 같다는 것이 코드 수준에서 보장된다.
# 🔴 CLI 가 `--emit` 과 배타로 막아 둔다("목적지는 하나" — C-88). 여기서 args 를 통째로
#    replace 하는 이유가 그것이다. 둘 다 주면 렌더가 아니라 **런타임에** 죽는다.
# 🔵 온프렘은 `--emit` 그대로다 — 그쪽은 Kafka 경로가 정상 가동 중이다(C-83 동결).
#    🟢 C-88 이 *"기존 --emit 을 한 글자도 안 바꾼다"* 를 설계 원칙으로 못박은 덕에
#      이 분기가 오버레이 한 줄로 끝난다.
  - target: {group: batch, kind: CronJob, name: mp-poller-price-anomaly}
    patch: |-
      - op: test
        path: /spec/jobTemplate/spec/template/spec/containers/0/name
        value: poller-price-anomaly
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command
        value: ["python", "pipelines/ingest/detect_price_anomaly.py", "--emit-direct"]

# ══════════════════════════════════════════════════════════════════════════════
# A5-a 후속 — 관측 대상이 없는 규칙을 걷는다 (2026-08-16)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **발단 = 실측.** D4-a 적용 직후 발화 알림이 20 → 7 건으로 떨어졌는데, 남은 것 중
#    `MpConsumerLagUnobserved × 3`(service=data-pipeline)이 **영구 발화**다. 당연하다 —
#    그 규칙은 *"컨슈머 lag 메트릭이 안 보인다"* 를 알리는데, 위에서 컨슈머를 지웠으니
#    메트릭은 앞으로도 영원히 안 보인다.
#
# 🔴 **이건 단순 소음이 아니다.** 상시 빨강은 **진짜 실패를 묻는다** —
#    `common/overlays/eks` 의 1-31 과 정확히 같은 논리다(영구 SecretSyncedError 를 걷은 이유).
#    알림은 "지금 사람이 봐야 하는가" 에만 답해야 한다.
#
# 🔵 **전부 걷지는 않는다 — 두 개는 EKS 에서도 유효하다:**
#   · `MpPollerStale` = 유지. `cronjob=~` 정규식이라 **빠진 CronJob 은 그냥 매칭이 안 될 뿐**
#     오탐이 되지 않는다. 남은 내부 배치(price-matview·deal-pruner·user-data-pruner·
#     chat-insights·es-recipes)를 그대로 감시한다.
#   · `MpPipelineSinkWriteFailure` = 유지. 적재 실패는 사이트와 무관하다.

# ── ① PodMonitor — 🟢 **A5-b 에서 되살렸다**(2026-08-16) ─────────────────────
# A5-a 가 지운 이유는 *"selector `app in (retail-refiner, deal-notifier, recipe-refiner,
# user-event-sink)` 의 대상이 0개"* 였고, 스스로 **"A5-b 에서 리파이너가 돌아오면 이 삭제를
# 되돌린다(라벨이 같다)"** 고 적어 뒀다. 그 조건이 충족됐다 — 위 ②-b 로 셋이 돌아왔고
# `app` 라벨은 base 그대로다.
# 🔵 넷 중 `user-event-sink` 하나는 영구 제외지만, selector 는 `in` 목록이라 **없는 값은 그냥
#    매칭이 안 될 뿐** 오탐이 되지 않는다(A5-a 가 `MpPollerStale` 을 남긴 것과 같은 논리).
#    ⇒ 삭제를 되돌리는 것으로 충분하고, selector 를 좁힐 필요가 없다.

# ── ② 대상이 없는 알림 8개 제거 ─────────────────────────────────────────────
# 🔴 **내림차순으로 지운다.** JSON6902 의 인덱스는 각 op 실행 시점에 재계산되므로
#    오름차순으로 지우면 뒤 인덱스가 밀려 **엉뚱한 규칙이 사라진다.**
# 🔴 각 remove 앞의 `op: test` 는 base 순서가 바뀌었을 때 **렌더를 죽여서** 드러내기 위한 것이다
#    (이 레포의 기존 규약 — 0-16 패치 주석 참조). 없으면 조용히 다른 알림이 지워진다.
#
#   지우는 것 = 컬리 크롤 4 (C-3 로 크롤은 온프렘 전용 — EKS 엔 그 CronJob 자체가 없다)
#             + Kafka 컨슈머·KEDA 4 (C-44 로 EKS 에 Kafka 가 없다)
  - target: {group: monitoring.coreos.com, kind: PrometheusRule, name: mp-pipeline}
    patch: |-
      - op: test
        path: /spec/groups/0/rules/8/alert
        value: MpConsumerLagUnobserved
      - op: test
        path: /spec/groups/0/rules/7/alert
        value: MpKedaScalerErrors
      - op: test
        path: /spec/groups/0/rules/6/alert
        value: MpConsumerBacklogStuck
      - op: test
        path: /spec/groups/0/rules/5/alert
        value: MpConsumerIdleWithBacklog
      - op: test
        path: /spec/groups/0/rules/4/alert
        value: MpKurlyCrawlTruncated
      - op: test
        path: /spec/groups/0/rules/3/alert
        value: MpKurlyLatestRunFailed
      - op: test
        path: /spec/groups/0/rules/2/alert
        value: MpKurlyDataStaleCritical
      - op: test
        path: /spec/groups/0/rules/1/alert
        value: MpKurlyDataStaleWarning
      - op: remove
        path: /spec/groups/0/rules/8
      - op: remove
        path: /spec/groups/0/rules/7
      - op: remove
        path: /spec/groups/0/rules/6
      - op: remove
        path: /spec/groups/0/rules/5
      - op: remove
        path: /spec/groups/0/rules/4
      - op: remove
        path: /spec/groups/0/rules/3
      - op: remove
        path: /spec/groups/0/rules/2
      - op: remove
        path: /spec/groups/0/rules/1
