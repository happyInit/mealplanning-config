# D4-a — 워크로드를 사이트별로 가른다 (A5-a · 2026-08-16 · 사용자 확정 운영모델)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **이 오버레이가 스스로 예고해 둔 숙제다.** 위 머리말이 *"eks 오버레이는 base 통과가
#    아니라 부분집합 선택이 될 가능성이 높다 — 🔴 미착수"* 라고 적었다. 여기가 그 착수다.
#
# 🟢 **분류 기준이 이제 하나로 정해졌다** — 사용자 확정(2026-08-16):
#      *"AWS 가 정본. 온프렘은 크롤 파이프라인만 남아서 데이터를 준다."*
#    ⇒ **외부 사이트를 긁는 것 = 온프렘 / 우리 DB 를 손보는 것 = AWS.**
#
#   온프렘 전용 7 (아래 ①)  크롤 폴러 — kurly · oasis-dawn/noon · deal-timesale/closesale
#                                     · recipe · recipe-review
