apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트 오버레이 — 🔴 **아직 배포 대상이 아니다.** ──────────────────────
# 🔴 validate.py 는 `overlays/eks` 를 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
# ── EKS 사이트 오버레이 — 🔴 **골격이다. 아직 배포 대상이 아니다.** ────────────
# 신설 = 0-1(2026-08-09). 0-9 로 레지스트리만 채웠다(2026-08-10) — 나머지는 아직 base 통과다.
#
# 🔴 validate.py 는 `overlays/eks` 를 정책 검사에서 건너뛴다(SKIP_KUSTOMIZE_RE). 여기가 비어 있어도
#    검증은 초록이다. "초록 = 이관 준비 완료"로 읽지 말 것.
#    ⚠️ 단 **레지스트리만은 예외** — check_eks_registry() 가 eks 렌더의 mp-* 이미지를 전수 본다.
#
# 이 트랙에서 갈라야 하는 것(체크리스트 항목 번호):
#    - 🔴 **D4-a 로 워크로드가 사이트별로 갈린다** — C-3 으로 크롤은 온프렘 상시 프로덕션이다.
#      즉 eks 오버레이는 base 통과가 아니라 **부분집합 선택**이 될 가능성이 높다.
#      (리파이너 6 + 내부 배치 CronJob 10 = AWS / 크롤 폴러 = 온프렘)
#      🔴 **미착수 — 그래서 지금 이 렌더는 그대로 붙이면 깨진다**(아래 "매달린 claimName" 참조).
#    - ✅ 0-8 PVC SC — **패치가 아니라 부재로 해결**했다. C-20 = EKS 는 pipeline PVC 0개라
#      `pvc.yaml` 을 base 에서 `overlays/onprem` 으로 내렸다. 여기서는 아무것도 안 해도 안 나간다.
#    - 0-9 이미지 → ECR — 미착수
#    - ✅ 0-2 secretStoreRef(2026-08-10)
#    - ✅ 0-16 정적 AWS 키 제거(2026-08-10) — 🔴 워크로드 22개가 아니라 **시크릿에서 뺐다**. 아래 patches 주석 참조
#    - ✅ 0-14c 워크로드별 SA — 22/22 (2026-08-13, 아래 + serviceaccounts.yaml)
#    - ✅ 0-13 PG 롤 `svc_pipeline` (2026-08-13, 아래 — ConfigMap 한 줄로 22개가 같이 간다)
#    - ⛔ **0-14d(`mp-pipeline-secrets` 를 db용/aws용으로 쪼개기) 는 EKS 에서 할 일이 없다.**
#      명세(#571 §B)가 쪼개라고 한 이유는 *"20개는 AWS 키가 필요 없는데 envFrom 이 통째 주입이라
#      뺄 수가 없다"* 였다. **EKS 에서는 뺄 것이 이미 없다** — 위 0-16 패치가 `AWS_ACCESS_KEY_ID`·
#      `AWS_SECRET_ACCESS_KEY` 두 엔트리를 시크릿에서 통째로 지웠고(렌더 실측: eks 4키 / 온프렘 6키),
#      Bedrock 자격증명은 IRSA 가 SA 두 개(`mp-score-review-sentiment`·`mp-summarize-reviews`)에만
#      준다. 여기서 굳이 쪼개면 **키가 0개인 `mp-pipeline-aws-secrets`** 가 생긴다.
#      🔴 그래서 0-14d 는 *온프렘 쪽 항목*으로 남는데, 온프렘은 **C-83 으로 형상 동결**이다
#         (시크릿을 쪼개는 것 = 오브젝트 구조·권한 변경). 명세 §B 의 "런타임 Job 36개 처리 절차"도
#         라이브 온프렘 얘기라 신규 클러스터인 EKS 에는 대상이 없다.
#      ⇒ **이 트랙에서 더 할 일 없음.** 되살리려면 C-83 예외를 먼저 받아야 한다.
resources:
  - ../../base
  - serviceaccounts.yaml
  - pvc.yaml # A5-a — mp-chat-reports 하나뿐(C-20 정정 근거는 그 파일 머리말)
  - triggerauth.yaml # A5-b — KEDA 가 SQS 를 읽는 신원(🔴 roleArn 을 안 적는 이유가 그 파일에)

#      🔴 그 판정이 나면 아래 mp-crawler-kurly 매핑은 **같이 지운다** — 지금은
#         "base 통과 + 레지스트리만 교체" 라 매핑이 남아 있어야 렌더가 Harbor 를 안 가리킨다.
#    - 0-8 PVC SC → gp3 · 0-2 secretStoreRef
#    - 🔴 0-16 정적 AWS 키 envFrom 제거(pipeline ns 22 워크로드) — env 가 Pod Identity 보다 앞선다
#    - dnsConfig ndots:1 은 온프렘 LAN DHCP 의 `local` 서치도메인 대응이다(base 에 있다).
#      EKS 에서 필요한지 재판정할 것 — 무해하지만 근거가 다르다


# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`. 계정 ID 가 정해지면 거기를 고치고
# validate.py 가 잡아 주는 목록대로 각 오버레이를 맞춘다(불일치 = 실패).
images:

# ── 0-9 레지스트리 = ECR ────────────────────────────────────────────────────
# 호스트 정본 = scripts/sites.yaml `eks.registry`. 계정 ID 가 정해지면 거기를 고치고
# validate.py 가 잡아 주는 목록대로 각 오버레이를 맞춘다(불일치 = 실패).
  # 🔴 **태그 정정 (A5-a · 2026-08-16).** 종전 값 `710b056de817…` 은 0-9(2026-08-10) 때
  #    적어 둔 **자리표시**였다 — 그 시점엔 GitLab CI 가 이 이미지를 굽지도 않았고(C-89 가
  #    "EKS 에서 안 쓴다" 로 15종만 굽게 했다) **ECR 에 한 번도 push 된 적이 없다**(실측:
  #    ECR 태그 5개 중 그 값 없음). 즉 이 오버레이를 붙이는 순간 전부 ImagePullBackOff 였다.
  #    ⚠️ **렌더도 validate.py 도 이걸 못 잡는다** — 레지스트리 *호스트*는 맞았기 때문이다.
  #      태그 실재는 ECR 에 물어봐야만 안다. 오버레이를 붙이기 전에 반드시 대조할 것.
  #    🟢 아래 값 = 오늘 11:52 push · `latest` 와 동일 다이제스트 · main 소속 커밋(실측).
  - name: 192.168.0.10/mealplanning/mp-data-pipeline
    newName: 689192361171.dkr.ecr.ap-northeast-2.amazonaws.com/mealplanning/mp-data-pipeline
    newTag: "dbe788011e57c7519f86e87553c5c4cab445d369"
  # ⛔ `mp-crawler-kurly` 매핑 삭제 (A5-a).
  #    이 파일 위쪽 주석이 예고한 그대로다 — *"그 판정이 나면 아래 mp-crawler-kurly 매핑은
  #    같이 지운다"*. D4-a 로 `mp-poller-kurly` 가 EKS 에서 빠졌으므로 이 이미지를 쓰는
  #    워크로드가 렌더에 **0개**다. 남겨 두면 "EKS 도 컬리를 굽는다" 로 읽혀 C-89(crawler-kurly =
  #    amd64 온프렘 전용)와 어긋난다. 🔵 ECR 리포는 비어 있는 채로 둔다(해롭지 않다).


# ── 🔴 알려진 미해결: 매달린 claimName 2건 ─────────────────────────────────────
# base 의 두 워크로드가 아직 온프렘 전용 PVC 를 참조한다. 렌더는 성공하지만(kustomize 는
# 크로스 오브젝트 참조를 검증하지 않는다) 그대로 적용하면 **파드가 영구 Pending** 이다:
#
#   pollers.yaml  → claimName: mp-recipe-crawl-state   (만개 크롤 = C-3 로 온프렘 상시)
#   pruners.yaml  → claimName: mp-chat-reports         (chat-insights 리포트)
#
# 일부러 숨기지 않았다 — 이 참조가 곧 **"어느 워크로드가 AWS 로 가는가"(D4-a)** 질문이고,
# 그건 스토리지 레인이 정할 일이 아니다. D4-a 가 워크로드 부분집합을 확정할 때
# ① 두 워크로드를 eks 에서 빼거나 ② AWS 쪽 대체 저장소(S3 등)로 바꾸면 함께 해소된다.
# ⚠️ 그때까지 이 오버레이를 ArgoCD 에 붙이지 말 것.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:

# ── 🔴 알려진 미해결: 매달린 claimName 2건 ─────────────────────────────────────
# base 의 두 워크로드가 아직 온프렘 전용 PVC 를 참조한다. 렌더는 성공하지만(kustomize 는
# 크로스 오브젝트 참조를 검증하지 않는다) 그대로 적용하면 **파드가 영구 Pending** 이다:
#
#   pollers.yaml  → claimName: mp-recipe-crawl-state   (만개 크롤 = C-3 로 온프렘 상시)
#   pruners.yaml  → claimName: mp-chat-reports         (chat-insights 리포트)
#
# 일부러 숨기지 않았다 — 이 참조가 곧 **"어느 워크로드가 AWS 로 가는가"(D4-a)** 질문이고,
# 그건 스토리지 레인이 정할 일이 아니다. D4-a 가 워크로드 부분집합을 확정할 때
# ① 두 워크로드를 eks 에서 빼거나 ② AWS 쪽 대체 저장소(S3 등)로 바꾸면 함께 해소된다.
# ⚠️ 그때까지 이 오버레이를 ArgoCD 에 붙이지 말 것.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

  # ── 0-16 정적 AWS 키 제거 ─────────────────────────────────────────────────
  # 🔴 **여기가 0-16 의 실제 레버다.** 22개 워크로드가 `envFrom.secretRef: mp-pipeline-secrets` 로
  #    시크릿을 **통째로** 받으므로, 워크로드 22개를 고치는 게 아니라 **시크릿에서 키를 빼면** 끝난다.
  #    (온프렘에서 이걸 하려면 0-14d 처럼 시크릿을 2개로 쪼개야 한다 — 2개 CronJob 은 여전히 키가 필요해서다.
  #     EKS 는 IRSA 가 그 자리를 대신하므로 **쪼갤 필요 없이 삭제**가 맞다. 사이트별로 해법이 다르다.)
  #
  # 🔴 왜 반드시 지워야 하나 — `AWS_ACCESS_KEY_ID` env 는 자격증명 체인에서 **IRSA 보다 앞선다.**
  #    남겨두면 롤을 붙여도 파드가 조용히 옛 정적 키를 계속 쓴다. 에러가 없어서 안 드러난다.
  #
  # 🔴 `op: test` 를 앞에 둔 이유 — 인덱스 기반 remove 는 base 의 data 순서가 바뀌면
  #    **틀린 엔트리를 조용히 지운다.** test 가 깨지면 렌더가 죽어서(=`validate.py` 실패) 드러난다.
  #    base 에 엔트리를 추가할 때는 AWS 2개보다 **앞에** 넣지 말 것.
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-pipeline-secrets}
    patch: |-
      - op: test
        path: /spec/data/4/secretKey
        value: AWS_ACCESS_KEY_ID
      - op: test
        path: /spec/data/5/secretKey
        value: AWS_SECRET_ACCESS_KEY
      - op: remove
        path: /spec/data/5
      - op: remove
        path: /spec/data/4

  # ✅ Bedrock IRSA 의 SA 는 **아래 0-14c 블록**이 워크로드 이름 그대로 만든다(2026-08-13).
  #    종전 제안이던 공용 `mp-review-ai` 는 미채택 — 근거는 serviceaccounts.yaml 머리말.
  #    롤 어노테이션은 SA 쪽에 있다. 롤 = bedrock:InvokeModel 두 모델 ARN 한정.

# ── 1-31 Harbor pull secret 제거 ────────────────────────────────────────────
# ECR 은 **kubelet 이 노드 인스턴스 롤로** 당긴다(IRSA/Pod Identity 는 파드용이라 이미지 풀에
# 관여하지 않는다 — 노드 롤에 AmazonEC2ContainerRegistryReadOnly). dockerconfigjson 이 불요하다.
# 🔴 남기면 해로운 이유: 이 ExternalSecret 은 온프렘 `fb-secrets` 의 `harbor-pull`(robot 계정)을
#    당긴다. EKS 스토어(Secrets Manager, C-36)엔 그 키가 없으므로 **영구 SecretSyncedError** 가 되고,
#    ns 의 ESO 상태가 상시 빨강이라 진짜 실패가 묻힌다.
# ⚠️ 나머지 반쪽(default SA 의 imagePullSecrets: harbor)은 **앱 레포 Ansible 소관**이다 — 1-31.
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-harbor-pull
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-harbor-pull

# ── 0-14c 워크로드별 SA 물리기 — 22/22 (EKS 전용 · C-83 덧셈) ──────────────────
# 🔴 base 는 `kind: Deployment` / `kind: CronJob` 전수 패치를 쓰지만 여기서는 못 쓴다 —
#    SA 이름이 워크로드마다 다르다. 이름 대 이름 22줄이 곧 검증표다(빠지면 그 워크로드가
#    `default` SA 로 남고, 그건 IRSA 를 걸었을 때 폭발 반경이 22 로 되돌아가는 경로다).
  - target: {group: apps, kind: Deployment, name: mp-deal-notifier}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-deal-notifier}
      spec:
        template:
          spec:
            serviceAccountName: mp-deal-notifier
  - target: {group: apps, kind: Deployment, name: mp-price-anomaly-notifier}
    patch: |-
