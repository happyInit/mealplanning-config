# ── 0-13 PG 서비스 롤 = svc_pipeline (EKS 전용) ───────────────────────────────
# 🔴 온프렘 `fbapp` 은 그대로다 — 권한 회수 금지(라이브 크롤·리파이너 즉사).
# 파이프라인은 22개가 **한 ConfigMap** 을 공유하므로 서비스처럼 워크로드마다 env 를 얹을 필요가 없다.
# 한 줄이면 22개가 같이 간다. 롤 실체·비밀 = platform/pg/overlays/eks.
# ⚠️ ConfigMap 값은 **파드 기동 시점 주입**이다. 신규 클러스터라 문제 없지만, 나중에 바꾸면
#    상시 컨슈머 5종은 rollout restart 가 별도로 필요하다(base configmap.yaml 주석과 같은 함정).
  - target: {version: v1, kind: ConfigMap, name: mp-pipeline-env}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: mp-pipeline-env}
      data:
        PGUSER: svc_pipeline
# 🔴 비밀번호 출처도 같이 — 유저명과 비번은 한 세트다.
#    `op: test` 로 base 순서 변경을 렌더 실패로 드러낸다(위 0-16 패치와 같은 규약).
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-pipeline-secrets}
    patch: |-
      - op: test
        path: /spec/data/0/secretKey
        value: PGPASSWORD
      - op: replace
        path: /spec/data/0/remoteRef
        value: {key: pg-roles, property: svc_pipeline}

# ── C-14 Redis = ElastiCache for Valkey (A5-b 에서 pipeline ns 도 정합 · 2026-08-16) ──
# 🔴 **라이브 결함을 고치는 패치다 — 신규 배선이 아니다.** app ns 는 A2 에서 이미 갈아탔는데
#    (`common/overlays/eks` C-14 블록) **pipeline ns 는 빠져 있었다.** base 가 온프렘 Sentinel
#    3파드를 가리키는데 EKS 엔 그 파드가 없다 ⇒ 이름이 NXDOMAIN 이라 `MasterNotFoundError`.
#
#    실측 증거(2026-08-16 04:20 UTC · `job/mp-deal-pruner-29780900` 로그):
#      "redis unavailable; deal pruning skipped" · error_type=**MasterNotFoundError** · result=skipped
#    🔴 **조용히 죽는 부류다** — 소비자들이 Redis 를 *선택 의존*으로 다루도록 짜여 있어서
#       (경고만 남기고 PG 는 계속) 파드는 초록이고 Job 은 Complete 인데 **핫딜 ZSET 만 영영 빈다.**
#       파드 상태로는 절대 안 드러난다.
#
# 🔵 **A5-b 가 이걸 같이 고치는 이유** = 위 ②-b 로 돌아오는 `deal-notifier` 가 정확히 같은 벽에
#    부딪힌다. 딜 적재는 PG + Redis ZSET 두 곳인데 Redis 쪽만 조용히 빠진 채로 "리파이너 복귀
#    완료"라고 하면, 마감임박 조회 API 가 빈 목록을 돌려주는 것을 아무도 모른다.
#
# 🔵 base 는 `REDIS_SENTINELS` 가 있으면 Sentinel, 없으면 `REDIS_URL` 폴백이다
#    (`pipelines/stream/_redis.py:client()`). ElastiCache 는 페일오버를 **엔드포인트 DNS 뒤에서**
#    처리하므로 Sentinel 이 할 일이 없다 ⇒ 빈 문자열로 꺼서 폴백 경로를 정본으로 만든다.
#    🔴 빈 문자열이 정확한 값이다(키 삭제 아님) — 소스의 분기 조건이 `if REDIS_SENTINELS:` 라
#       키가 없으면 `os.environ.get(..., "")` 기본값으로 같은 결과지만, **명시가 의도를 남긴다**
#       (app ns 의 같은 패치와 동일한 판단).
# 🔵 `REDIS_MASTER_GROUP` 은 남긴다 — Sentinel 이 꺼지면 아무도 안 읽고, 지우는 쪽이 오히려
#    소스 기본값(`"mymaster"`)과 어긋날 여지를 만든다.
# 🔵 엔드포인트 = primary. reader(`mp-cache-ro…`)는 안 쓴다 — 딜 ZSET 은 **쓰기**다.
# ⚠️ `envFrom.configMapRef` 는 파드 기동 시점 주입이라, 이미 도는 워크로드는 `rollout restart`
#    가 별도로 필요하다. CronJob 은 다음 실행에 자동 반영된다.
  - target: {version: v1, kind: ConfigMap, name: mp-pipeline-env}
    patch: |-
      - op: test
        path: /data/REDIS_SENTINELS
        value: "mp-redis-s-0.mp-redis-s-hl.data.svc:26379,mp-redis-s-1.mp-redis-s-hl.data.svc:26379,mp-redis-s-2.mp-redis-s-hl.data.svc:26379"
      - op: replace
        path: /data/REDIS_SENTINELS
        value: ""
      - op: test
        path: /data/REDIS_URL
        value: redis://mp-redis-master.data.svc:6379/0
      - op: replace
        path: /data/REDIS_URL
        value: redis://mp-cache.gnqpbg.ng.0001.apn2.cache.amazonaws.com:6379/0

