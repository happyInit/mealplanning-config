# ── 🔴 알려진 미해결: 매달린 claimName 2건 ─────────────────────────────────────
# base 의 두 워크로드가 아직 온프렘 전용 PVC 를 참조한다. 렌더는 성공하지만(kustomize 는
# 크로스 오브젝트 참조를 검증하지 않는다) 그대로 적용하면 **파드가 영구 Pending** 이다:
#
#   pollers.yaml  → claimName: mp-recipe-crawl-state   (만개 크롤 = C-3 로 온프렘 상시)
#   pruners.yaml  → claimName: mp-chat-reports         (chat-insights 리포트)
#
# 일부러 숨기지 않았다 — 이 참조가 곧 **"어느 워크로드가 AWS 로 가는가"(D4-a)** 질문이고,
# 그건 스토리지 레인이 정할 일이 아니다. D4-a 가 워크로드 부분집합을 확정할 때
# ① 두 워크로드를 eks 에서 빼거나 ② AWS 쪽 대체 저장소(S3 등)로 바꾸면 함께 해소된다.
# ⚠️ 그때까지 이 오버레이를 ArgoCD 에 붙이지 말 것.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
patches:

# ── 🔴 알려진 미해결: 매달린 claimName 2건 ─────────────────────────────────────
# base 의 두 워크로드가 아직 온프렘 전용 PVC 를 참조한다. 렌더는 성공하지만(kustomize 는
# 크로스 오브젝트 참조를 검증하지 않는다) 그대로 적용하면 **파드가 영구 Pending** 이다:
#
#   pollers.yaml  → claimName: mp-recipe-crawl-state   (만개 크롤 = C-3 로 온프렘 상시)
#   pruners.yaml  → claimName: mp-chat-reports         (chat-insights 리포트)
#
# 일부러 숨기지 않았다 — 이 참조가 곧 **"어느 워크로드가 AWS 로 가는가"(D4-a)** 질문이고,
# 그건 스토리지 레인이 정할 일이 아니다. D4-a 가 워크로드 부분집합을 확정할 때
# ① 두 워크로드를 eks 에서 빼거나 ② AWS 쪽 대체 저장소(S3 등)로 바꾸면 함께 해소된다.
# ⚠️ 그때까지 이 오버레이를 ArgoCD 에 붙이지 말 것.

# ── 0-2 ESO 백엔드 사이트 분기 (C-23) ──────────────────────────────────────────
# onprem = `fb-kubernetes`(K8s provider, fb-secrets ns) 유지 · eks = `mp-aws-secrets`(Secrets Manager + IRSA).
# 🔴 갈리는 것은 `secretStoreRef.name` **한 필드뿐**이다. `remoteRef` 는 한 엔트리도 안 바꾼다 —
#    스토어의 `prefix: mp/prod/` 가 key 앞에 붙어 파라미터 이름이 되기 때문(예: app-secrets → mp/prod/app-secrets).
#    스토어 본문 · 값 적재 형식 · IAM 최소권한 = `bootstrap/eso/README.md`
  - target: {group: external-secrets.io, kind: ExternalSecret}
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: {name: selected-by-target}   # target 이 고르므로 이 이름은 매칭에 안 쓰인다
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: mp-aws-secrets

  # ── 0-16 정적 AWS 키 제거 ─────────────────────────────────────────────────
  # 🔴 **여기가 0-16 의 실제 레버다.** 22개 워크로드가 `envFrom.secretRef: mp-pipeline-secrets` 로
  #    시크릿을 **통째로** 받으므로, 워크로드 22개를 고치는 게 아니라 **시크릿에서 키를 빼면** 끝난다.
  #    (온프렘에서 이걸 하려면 0-14d 처럼 시크릿을 2개로 쪼개야 한다 — 2개 CronJob 은 여전히 키가 필요해서다.
  #     EKS 는 IRSA 가 그 자리를 대신하므로 **쪼갤 필요 없이 삭제**가 맞다. 사이트별로 해법이 다르다.)
  #
  # 🔴 왜 반드시 지워야 하나 — `AWS_ACCESS_KEY_ID` env 는 자격증명 체인에서 **IRSA 보다 앞선다.**
  #    남겨두면 롤을 붙여도 파드가 조용히 옛 정적 키를 계속 쓴다. 에러가 없어서 안 드러난다.
  #
  # 🔴 `op: test` 를 앞에 둔 이유 — 인덱스 기반 remove 는 base 의 data 순서가 바뀌면
  #    **틀린 엔트리를 조용히 지운다.** test 가 깨지면 렌더가 죽어서(=`validate.py` 실패) 드러난다.
  #    base 에 엔트리를 추가할 때는 AWS 2개보다 **앞에** 넣지 말 것.
  - target: {group: external-secrets.io, kind: ExternalSecret, name: mp-pipeline-secrets}
    patch: |-
      - op: test
        path: /spec/data/4/secretKey
        value: AWS_ACCESS_KEY_ID
      - op: test
        path: /spec/data/5/secretKey
        value: AWS_SECRET_ACCESS_KEY
      - op: remove
        path: /spec/data/5
      - op: remove
        path: /spec/data/4

  # ✅ Bedrock IRSA 의 SA 는 **아래 0-14c 블록**이 워크로드 이름 그대로 만든다(2026-08-13).
  #    종전 제안이던 공용 `mp-review-ai` 는 미채택 — 근거는 serviceaccounts.yaml 머리말.
  #    롤 어노테이션은 SA 쪽에 있다. 롤 = bedrock:InvokeModel 두 모델 ARN 한정.

# ── 1-31 Harbor pull secret 제거 ────────────────────────────────────────────
# ECR 은 **kubelet 이 노드 인스턴스 롤로** 당긴다(IRSA/Pod Identity 는 파드용이라 이미지 풀에
# 관여하지 않는다 — 노드 롤에 AmazonEC2ContainerRegistryReadOnly). dockerconfigjson 이 불요하다.
# 🔴 남기면 해로운 이유: 이 ExternalSecret 은 온프렘 `fb-secrets` 의 `harbor-pull`(robot 계정)을
#    당긴다. EKS 스토어(Secrets Manager, C-36)엔 그 키가 없으므로 **영구 SecretSyncedError** 가 되고,
#    ns 의 ESO 상태가 상시 빨강이라 진짜 실패가 묻힌다.
# ⚠️ 나머지 반쪽(default SA 의 imagePullSecrets: harbor)은 **앱 레포 Ansible 소관**이다 — 1-31.
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: mp-harbor-pull
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: mp-harbor-pull

# ── 0-14c 워크로드별 SA 물리기 — 22/22 (EKS 전용 · C-83 덧셈) ──────────────────
# 🔴 base 는 `kind: Deployment` / `kind: CronJob` 전수 패치를 쓰지만 여기서는 못 쓴다 —
#    SA 이름이 워크로드마다 다르다. 이름 대 이름 22줄이 곧 검증표다(빠지면 그 워크로드가
#    `default` SA 로 남고, 그건 IRSA 를 걸었을 때 폭발 반경이 22 로 되돌아가는 경로다).
  - target: {group: apps, kind: Deployment, name: mp-deal-notifier}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mp-deal-notifier}
      spec:
        template:
