apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── 온프렘 사이트 오버레이 ─────────────────────────────────────────────────────
# 🔴 여기에 넣을 것 = **온프렘에서만 참인 값**. AWS 이관(C-3)으로 온프렘은 DR 대기 사이트 +
#    크롤 프로덕션으로 **계속 살아 있다** — 그래서 온프렘 전용 설정은 지우는 게 아니라
#    base 에서 이쪽으로 내려야 한다:
#    - ✅ pvc.yaml (SC openebs-lvm 포함) — 0-8 + C-20. base 에서 여기로 **파일째** 내려왔다.
#      값만 패치하지 않고 오브젝트째 옮긴 이유 = C-20 이 "EKS 는 pipeline PVC 0개"로 확정이라
#      EKS 에서는 SC 를 바꿀 대상이 아니라 **존재하지 않을 대상**이기 때문이다.
#    - 컨슈머·폴러 이미지 = Harbor 192.168.0.10 — 0-9 (미착수)
#    - dnsConfig ndots:1 패치(2026-08-03 컬리 크롤 유실 고침) — 노드 DHCP 의 `local` 서치도메인이 원인이라
#      **온프렘 고유 현상**이다. EKS 에서 필요한지 재판정할 것(무해하지만 근거는 다르다)
namespace: pipeline
resources:
  - ../../base
  - pvc.yaml
  # A5-b — 온프렘 Kafka → S3 브리지(크롤 CronJob 무변경 · C-83 덧셈형). 근거는 그 파일 머리말.
  - crawl-s3-relay.yaml
