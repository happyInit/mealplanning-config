# KEDA ScaledObject — 컨슈머 4종을 **Kafka lag** 으로 스케일한다 (P3, 2026-07-30).
#
# 왜 lag 인가: 컨슈머의 병목은 CPU 가 아니라 "얼마나 밀렸나" 다. HPA 는 그걸 못 본다(object_spec §9.4).
#
# ✅ **minReplicaCount 0 = scale-to-zero 도달** (2026-07-30) — KEDA 를 쓰는 본래 목적.
#   HPA 는 최소 1 이라 0 을 못 만든다. 0→1 은 KEDA 가 직접, 1→N 은 KEDA 가 만든 HPA 가 한다(§9.4).
#   🔴 **pollingInterval·cooldownPeriod 는 min 0 일 때만 유효하다** — KEDA 가 min 1 시절
#      "not relevant" 경고로 알려줬다. 이제 실제로 동작한다: 30s 마다 lag 를 보고,
#      lag 가 0 이 된 뒤 300s 지나면 0 으로 내린다.
#
#   전환 전 검증(실측 2026-07-30):
#     ① 오프셋 커밋 — 커밋 없는 그룹은 KEDA 가 lag 를 0 으로 보고해 **영영 안 깨어난다**.
#        deal-notifier ✅ · retail-refiner ✅ · user-event-sink ✅(테스트 메시지 15,000 처리로 커밋)
#        🔴 **recipe-refiner 만 아직 미커밋 → min 1 유지**(아래 개별 주석)
#     ② 콜드스타트 14초 — 0 replica + lag 3,000 상태에서 파드 기동·Ready·백로그 소진까지.
#        KEDA 폴링(≤30s)을 더하면 최악 ~45초. 컨슈머는 비대화형이라 수용 가능.
#
#   🔴 되돌리기: min 을 1 로 올리면 즉시 복귀한다(파드가 없으면 곧바로 뜬다).
#      "메시지는 쌓이는데 컨슈머가 0" 이 보이면 그게 신호 — lag 알람이 없으므로 당분간 사람이 본다.
#
# lagThreshold 10: 파티션당 10건 밀리면 1대 늘린다. maxReplicaCount 는 **파티션 수를 넘기지 않는다**
#   — Kafka 는 파티션 하나를 컨슈머 하나에만 주므로 그 이상은 놀고만 있다.
#
# 폴러 CronJob 은 대상이 아니다(§9.4) — CronJob 이 이미 그 역할이고, 크롤 예의·중복 수집 때문에 고정 1.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mp-retail-refiner
spec:
  scaleTargetRef:
    name: mp-retail-refiner
  minReplicaCount: 0 # ✅ scale-to-zero (오프셋 커밋 확인됨)
  maxReplicaCount: 3 # retail.crawl.raw 파티션 3 — 파티션 수를 넘기면 남는 컨슈머는 논다
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.data.svc:9092
        consumerGroup: retail-refiner
        topic: retail.crawl.raw
        lagThreshold: "10"
---
# ── C-44 카나리: SQS 스케일러 (retail) ─────────────────────────────────────────────
# KEDA 2.20.1 은 aws-sqs-queue 스케일러를 지원한다(실측).
#
# 🔴 스케일 단위가 Kafka 와 다르다:
#      Kafka  lagThreshold=10  "파티션당 10건 밀리면 1대"  · max 는 파티션 수(3)가 천장
#      SQS    queueLength=1    "메시지(=크롤 1회분) 1건이면 1대" · 파티션 개념이 없다
#    메시지 하나가 곧 객체 하나(레코드 수천 건)라 1건만 와도 파드가 떠야 한다.
#
# maxReplicaCount 3 의 근거 = **retail 스트림의 일일 객체 수**(kurly 03:30 · oasis-dawn 04:10 ·
#   oasis-noon 13:10). 평시 동시성은 1이지만(시각이 흩어져 있다) 리파이너가 하루 멈춰 밀렸을 때
#   그날치를 병렬로 빼낼 수 있는 상한이다. 적재가 전부 멱등이라 병렬이 안전하다.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: mp-crawl-aws
spec:
  secretTargetRef:
    - parameter: awsAccessKeyID
      name: mp-crawl-refiner
      key: AWS_ACCESS_KEY_ID
    - parameter: awsSecretAccessKey
      name: mp-crawl-refiner
      key: AWS_SECRET_ACCESS_KEY
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mp-retail-refiner-s3
spec:
  scaleTargetRef:
    name: mp-retail-refiner-s3
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 30 # 큐 3개 × 30초 = 월 약 26만 요청 → SQS 무료한도(100만)의 26%
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: mp-crawl-aws
      metadata:
        # 🔴 apply 후 `terraform output queue_urls` 값으로 채운다 (consumers.yaml 과 같은 자리)
        queueURL: "https://sqs.ap-northeast-2.amazonaws.com/REPLACE_WITH_AWS_ACCOUNT_ID/mp-crawl-retail"
        queueLength: "1"
        awsRegion: "ap-northeast-2"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mp-deal-notifier
spec:
  scaleTargetRef:
    name: mp-deal-notifier
  minReplicaCount: 0 # ✅ scale-to-zero (오프셋 커밋 확인됨)
  maxReplicaCount: 2 # retail.deal.raw 파티션 2
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.data.svc:9092
        consumerGroup: deal-notifier
        topic: retail.deal.raw
        lagThreshold: "10"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mp-recipe-refiner
spec:
  scaleTargetRef:
    name: mp-recipe-refiner
  # ✅ **2026-08-02 — 1 → 0 전환.** 이로써 컨슈머 4종 전부 scale-to-zero 도달.
  #
  # 종전 사유(해소됨): recipe-refiner 그룹에 **커밋된 오프셋이 없어서**(lag=-) 0 으로 내리면
  #   KEDA 가 lag 를 계산 못 해 영영 안 깨어났다. 합성 메시지로 오프셋을 만들 수도 없었다 —
  #   이 컨슈머는 레시피를 PG 에 적재하고 PGSync 가 ES 로 복제해 **사용자 검색에 노출**되므로
  #   가짜 레시피를 넣을 수 없다. 그래서 "만개레시피 크론(일·수 05:00)이 실제로 돌아 오프셋이
  #   커밋되면 그때 내린다" 를 조건으로 걸어 뒀었다.
  #
  # 🟢 그 조건이 충족됐다 (2026-08-02 05:00 KST 첫 실행 실측):
  #    poller Job **11m30s Complete** · 7,280건 검증 → **Kafka produce 407건**
  #    커밋 오프셋 = part0 137 + part1 129 + part2 141 = **407**(produce 수와 정확히 일치)
  #    lag = 0/0/0 (전량 소비 완료)
  #
  # 🔴 오프셋 만료가 이 설정의 유일한 시한폭탄이다 — 확인했다.
  #    Kafka 는 그룹이 **비는 순간부터** offsets.retention 을 센다. scale-to-zero 면 매 실행
  #    직후 그룹이 비므로, 다음 크롤까지의 공백이 retention 을 넘으면 오프셋이 사라지고
  #    KEDA 가 다시 lag=- 가 된다(= 영영 안 깨어남, 종전 상태로 회귀).
  #    실측 `offsets.retention.minutes=10080`(**7일**, 브로커 기본) vs 크롤 최대 간격
  #    **4일**(수→일) → 여유 3일. 안전하다.
  #    ⚠️ 단 **크롤이 7일 넘게 멈추면**(suspend·장애·연휴) 이 전제가 깨진다. 그걸 잡으라고
  #       `MpConsumerLagUnobserved` 에 recipe-refiner 를 추가했다(종전엔 3종만 덮고 있었다).
  minReplicaCount: 0
  maxReplicaCount: 3 # recipe.crawl.raw 파티션 3
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.data.svc:9092
        consumerGroup: recipe-refiner
        topic: recipe.crawl.raw
        lagThreshold: "10"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mp-user-event-sink
spec:
  scaleTargetRef:
    name: mp-user-event-sink
  minReplicaCount: 0 # ✅ scale-to-zero (테스트 메시지로 오프셋 커밋 확보)
  maxReplicaCount: 3 # events.user.activity 파티션 3 (실측 — 종전 2 는 과소)
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.data.svc:9092
        consumerGroup: user-event-sink
        topic: events.user.activity
        lagThreshold: "10"
