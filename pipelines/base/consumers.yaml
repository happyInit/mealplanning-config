# Kafka 컨슈머 4 — compose 상주 컨슈머의 이전 (런북 Q12 · docker-compose.yml 실측).
# deal-pruner·user-data-pruner·chat-insights 는 여기 없다 — CronJob 전환(pruners.yaml, Q12).
---
# retail.crawl.raw → PG(가격이력·단가뷰)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-retail-refiner
  labels:
    app: retail-refiner
spec:
  # 🔴 replicas 를 **의도적으로 안 적는다** — KEDA ScaledObject(scaledobjects.yaml)가 주인이다(P3).
  #    git 에 남기면 ArgoCD sync 마다 KEDA 가 정한 replica 수를 1 로 되돌려, lag 가 쌓인 와중에
  #    컨슈머가 줄어든다. 필드가 없으면 apply 가 live 값을 안 건드린다.
  #    (기동 이력: 전환창 §4-9, 2026-07-29 — K8s 컨슈머가 정본이고 .8 은 정지)
  selector:
    matchLabels:
      app: retail-refiner
  template:
    metadata:
      labels:
        app: retail-refiner
    spec:
      priorityClassName: pipeline-low
      containers:
        - name: retail-refiner
          image: 192.168.0.10/mealplanning/mp-data-pipeline:4f03052ef394f1a3064296f9f321516fa5e08575
          command: ["python", "pipelines/stream/consume_retail.py"] # 이미지 WORKDIR=/app — compose 와 동일 상대경로 계약
          envFrom:
            - configMapRef:
                name: mp-pipeline-env
            - secretRef:
                name: mp-pipeline-secrets
          env:
            - name: METRICS_PORT
              value: "9401"
          ports:
            - name: metrics
              containerPort: 9401
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
# ── C-44 카나리: S3/SQS 리파이너 (retail) ──────────────────────────────────────────
# 🔴 위 Kafka 리파이너를 **고치지 않고 옆에 세운다.** 전환기에는 둘이 나란히 돈다:
#      Kafka 경로  poller-kurly --kafka  → retail.crawl.raw → mp-retail-refiner      → PG
#      S3 경로     poller-kurly --s3     → S3 → SQS         → mp-retail-refiner-s3   → PG
#    같은 레코드가 양쪽으로 들어와도 적재가 멱등이라(`on conflict do nothing`) 무해하고,
#    두 경로의 결과가 다르면 **원인이 100% 새 코드**다(크롤 변동성이라는 잡음이 제거된다).
#    되돌리기 = 이 Deployment 와 짝 ScaledObject 를 지운다. Kafka 경로는 손댄 적이 없다.
#
# 메트릭 라벨(GROUP)은 `retail-refiner` 로 **같다** — 대시보드·알림이 그 라벨에 붙어 있어서
# 이름을 바꾸면 관측이 조용히 빈다. 파드 라벨만 `-s3` 로 갈라 netpol·KEDA 가 구분한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-retail-refiner-s3
  labels:
    app: retail-refiner-s3
spec:
  # replicas 미기재 = KEDA 가 주인 (위 mp-retail-refiner 주석과 같은 이유)
  selector:
    matchLabels:
      app: retail-refiner-s3
  template:
    metadata:
      labels:
        app: retail-refiner-s3
    spec:
      priorityClassName: pipeline-low
      containers:
        - name: retail-refiner-s3
          image: 192.168.0.10/mealplanning/mp-data-pipeline:4f03052ef394f1a3064296f9f321516fa5e08575
          command: ["python", "pipelines/transport/consume_retail.py"]
          envFrom:
            - configMapRef:
                name: mp-pipeline-env
            - secretRef:
                name: mp-pipeline-secrets
          env:
            - name: METRICS_PORT
              value: "9401"
            # 🔴 큐 URL 은 apply 후 `terraform output queue_urls` 값으로 채운다.
            #    이 레포는 private 이라 계정 ID 를 담아도 되지만, 앱 레포(public)의 Terraform 에는
            #    계정 ID 를 박지 않았다(data.aws_caller_identity 로 apply 시점 해석).
            - name: MP_SQS_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/REPLACE_WITH_AWS_ACCOUNT_ID/mp-crawl-retail"
            # 명시 env 가 envFrom 을 이긴다 — Bedrock 공유키를 이 파드에서만 리파이너 신원으로 덮는다
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: mp-crawl-refiner, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: mp-crawl-refiner, key: AWS_SECRET_ACCESS_KEY}}
            # readOnlyRootFilesystem 이라 홈이 없다. botocore 가 ~/.aws 를 찾을 때
            # uid 1000 이 /etc/passwd 에 없어도 조용히 넘어가게 명시한다(자격증명은 env 로 온다).
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: metrics
              containerPort: 9401
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        # readOnlyRootFilesystem 의 짝 — 이 컨슈머는 디스크에 쓰지 않지만 파이썬·라이브러리가
        # 임시파일을 쓸 자리는 남겨둔다. 없으면 기동은 되고 나중에 조용히 터진다.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# retail.deal.raw → PG(deal_type) + Redis 핫딜. 🔴 REDIS_URL placeholder 해소(Q3) 전 기동 금지
