# Kafka 컨슈머 4 — compose 상주 컨슈머의 이전 (런북 Q12 · docker-compose.yml 실측).
# deal-pruner·user-data-pruner·chat-insights 는 여기 없다 — CronJob 전환(pruners.yaml, Q12).
---
# retail.crawl.raw → PG(가격이력·단가뷰)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-retail-refiner
  labels:
    app: retail-refiner
spec:
  # 🔴 replicas 를 **의도적으로 안 적는다** — KEDA ScaledObject(scaledobjects.yaml)가 주인이다(P3).
  #    git 에 남기면 ArgoCD sync 마다 KEDA 가 정한 replica 수를 1 로 되돌려, lag 가 쌓인 와중에
  #    컨슈머가 줄어든다. 필드가 없으면 apply 가 live 값을 안 건드린다.
  #    (기동 이력: 전환창 §4-9, 2026-07-29 — K8s 컨슈머가 정본이고 .8 은 정지)
  selector:
    matchLabels:
      app: retail-refiner
  template:
    metadata:
      labels:
        app: retail-refiner
    spec:
      priorityClassName: pipeline-low
      containers:
        - name: retail-refiner
          image: 192.168.0.10/mealplanning/mp-data-pipeline:4f03052ef394f1a3064296f9f321516fa5e08575
          command: ["python", "pipelines/stream/consume_retail.py"] # 이미지 WORKDIR=/app — compose 와 동일 상대경로 계약
          envFrom:
            - configMapRef:
                name: mp-pipeline-env
            - secretRef:
                name: mp-pipeline-secrets
          env:
            - name: METRICS_PORT
              value: "9401"
          ports:
            - name: metrics
              containerPort: 9401
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
