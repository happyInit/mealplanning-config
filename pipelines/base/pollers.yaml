# 폴러 8 — deploy/crontab.fb-pollers(UTC)의 KST 복원판. 스케줄 근거 주석은 crontab 원본 유지.
# 피크(11-12·17-18 KST) 회피 스태거는 원 설계 그대로다(design §8.4).
---
# 컬리 크롤 → Kafka 직접 produce. 별도 이미지(브라우저 포함)라 메모리 여유
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-kurly
spec:
  suspend: false # ✅ 전환창 §4-9 unsuspend(2026-07-29) — 이제 K8s 크론이 정본(.8 크론은 주석 처리됨)
  schedule: "30 3 * * *" # 03:30 KST — 컬리(Playwright·무거움) 심야 1회
  timeZone: Asia/Seoul # 결정(CLAUDE.md) — vixie-cron UTC 환산 우회의 복원. KST 값을 그대로 쓴다
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # 실패 = 다음 주기에 맡긴다 (재시도가 크롤 소스에 연타를 넣는 것 방지)
      template:
        metadata:
          labels:
            app: poller-kurly
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          containers:
            - name: poller-kurly
              # 🔴 이 태그는 **손으로** 올린다 — Jenkins 의 'config 레포 태그 커밋' 스테이지는
              #    앱 워크로드만 대상이고 crawler-kurly 는 스킵한다(Jenkinsfile 296). 앱 레포에
              #    크롤러를 고쳐 머지해도 여기 안 바꾸면 **옛 이미지가 계속 돈다.**
              # 2026-08-04: app#525(조용한 절단 가드 4종) 반영. 이미지에 새 코드가 들어있는지는
              #    실제로 당겨서 확인했다(MIN_TOTAL_RECORDS=500 · GOTO_ATTEMPTS=3 · CrawlTruncatedError).
              # 2026-08-10: 6일치 밀린 것을 한 번에 올린다 — app#529·#567·#580.
              #    🔴 이 6일 동안 실패 로그에 남은 게 `"result":"failure"` 한 줄뿐이었다.
              #    #580 이 포맷터의 exc_info 누락을 고쳐 트레이스백·error_type·category_code 가 찍힌다.
              #    #580 은 Jenkinsfile 에 `srcs:['crawler/kurly/','pipelines/stream/']` 도 넣어서,
              #    앞으로는 공유코드만 고쳐도 이 이미지가 리빌드된다(종전엔 조용히 옛 코드가 남았다).
              # 2026-08-10(2차): app#588 — 간헐 유실의 **진짜 원인**을 고쳤다.
              #    첫 카테고리(907)만 깨지던 건 SPA 렌더 경합이었다 — `wait_for_timeout(2000)` 고정
              #    대기가 첫 내비게이션(캐시·쿠키 없음)에서 모자랐다. 실패까지 2.46초 = 타임아웃이
              #    아니라 덜 기다린 것. 이제 카드 개수가 멈출 때까지 기다린다(꽉 차면 즉시 통과).
              #    부수 효과로 페이지당 고정 2초가 사라져 잡 전체가 ~18초 짧아진다.
              image: 192.168.0.10/mealplanning/mp-crawler-kurly:4f03052ef394f1a3064296f9f321516fa5e08575
              # 🔴 C-44 카나리 — **dual-write**. `--kafka` 를 그대로 두고 `--s3` 를 **더한다.**
              #    Kafka 경로가 계속 프로덕션이라 이 단계에서 S3 가 깨져도 잃는 데이터가 없고,
              #    같은 실행의 같은 레코드가 두 경로로 가므로 결과를 **대조**할 수 있다
              #    (컬리 수확량은 실행마다 흔들려서 어제 값과 비교하는 걸로는 판정이 안 된다).
              #    적재 SQL 이 전부 `on conflict do nothing` 이라 이중 도착은 무해하다.
              #    되돌리기 = `--out`·`--s3` 두 인자 제거(볼륨은 남겨도 무해).
              command: ["python", "crawler/kurly/prototype.py", "--kafka",
                        "--out", "/work/kurly.jsonl", "--s3"]
              env:
                # 🔴 명시 env 가 envFrom 보다 우선한다 — mp-pipeline-secrets 의 AWS_* (Bedrock 공유키)를
                #    이 컨테이너에서만 크롤 업로더 신원으로 덮는다. 반대로 하면 리뷰 AI 가 죽는다.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: mp-crawl-uploader, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: mp-crawl-uploader, key: AWS_SECRET_ACCESS_KEY}}
              envFrom:
                - configMapRef:
                    name: mp-pipeline-env
                - secretRef:
                    name: mp-pipeline-secrets
              volumeMounts:
                # 산출 파일 자리. 이 이미지는 USER 1000 으로 도는데 emptyDir 은 0777 로 생성되므로
                # fsGroup 없이도 쓸 수 있다(파드 securityContext 는 kustomization 패치가 관리한다).
                - name: crawl-out
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 1Gi # 실측 피크 1131Mi(2026-07-30 검증 런) — 스케줄러가 실사용을 반영하도록
                limits:
                  memory: 2Gi # 1Gi 는 OOMKill 실장애(chromium 크롤 피크 1131Mi > 1Gi), 2Gi = 여유 ~45%
          volumes:
            # PVC 가 아니라 emptyDir — 객체가 S3 로 올라가면 파일은 쓸모가 없다. 잡이 끝나면 사라진다.
            # 실측 4.7MB/일 규모라 sizeLimit 100Mi 는 충분한 상한이면서 노드 디스크를 지켜준다.
            - name: crawl-out
              emptyDir:
                sizeLimit: 100Mi
---
