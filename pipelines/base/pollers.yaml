# 만개 레시피 크롤 → recipe.crawl.raw. 🔴 크롤 상태(resume/dedup)는 PVC — .8 상태 이전은 선택
# (미이전 시 첫 크롤이 전량 재produce — refiner upsert 라 정합 무해, Kafka·시간 비용만. §4-9 전 결정)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-recipe
spec:
  suspend: false # ✅ 전환창 §4-9 unsuspend(2026-07-29) — 이제 K8s 크론이 정본(.8 크론은 주석 처리됨)
  schedule: "0 5 * * 0,3" # 일·수 05:00 KST — 만개 최신순 재스캔(신규 포착)
  timeZone: Asia/Seoul # 결정(CLAUDE.md) — vixie-cron UTC 환산 우회의 복원. KST 값을 그대로 쓴다
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # 실패 = 다음 주기에 맡긴다 (재시도가 크롤 소스에 연타를 넣는 것 방지)
      template:
        metadata:
          labels:
            app: poller-recipe
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          containers:
            - name: poller-recipe
              image: 192.168.0.10/mealplanning/mp-data-pipeline:4f03052ef394f1a3064296f9f321516fa5e08575
              command: ["python", "/app/crawler/10k_recipe/10k_recipe_crawler.py", "--kafka", "--order", "date"]
              workingDir: /data/recipe-crawl
              envFrom:
                - configMapRef:
                    name: mp-pipeline-env
                - secretRef:
                    name: mp-pipeline-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: crawl-state
                  mountPath: /data/recipe-crawl
          volumes:
            - name: crawl-state
              persistentVolumeClaim:
                claimName: mp-recipe-crawl-state
