# #10 요리후기 수집 (AI 파트 추가 · draft 2026-07-31)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-recipe-review
  namespace: pipeline
spec:
  schedule: "0 6 * * 0,3"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: poller-recipe-review
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          terminationGracePeriodSeconds: 30
