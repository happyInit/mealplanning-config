  schedule: "10 4 * * *" # 04:10 KST — 오아시스 가격, 심야
  timeZone: Asia/Seoul # 결정(CLAUDE.md) — vixie-cron UTC 환산 우회의 복원. KST 값을 그대로 쓴다
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # 실패 = 다음 주기에 맡긴다 (재시도가 크롤 소스에 연타를 넣는 것 방지)
      template:
        metadata:
          labels:
            app: poller-oasis-dawn
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          containers:
            - name: poller-oasis-dawn
              image: 192.168.0.10/mealplanning/mp-data-pipeline:710b056de8174c5026ab3c5273d4dee973da4ff7
              command: ["python", "crawler/oasis/oasis_crawler.py", "--categories", "11,142,141,12,49,9,13,3,216,1274,1275,219,1191", "--kafka"]
              envFrom:
                - configMapRef:
                    name: mp-pipeline-env
                - secretRef:
                    name: mp-pipeline-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
