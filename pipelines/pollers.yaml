# 폴러 8 — deploy/crontab.fb-pollers(UTC)의 KST 복원판. 스케줄 근거 주석은 crontab 원본 유지.
# 피크(11-12·17-18 KST) 회피 스태거는 원 설계 그대로다(design §8.4).
---
# 컬리 크롤 → Kafka 직접 produce. 별도 이미지(브라우저 포함)라 메모리 여유
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-kurly
spec:
  suspend: false # ✅ 전환창 §4-9 unsuspend(2026-07-29) — 이제 K8s 크론이 정본(.8 크론은 주석 처리됨)
  schedule: "30 3 * * *" # 03:30 KST — 컬리(Playwright·무거움) 심야 1회
  timeZone: Asia/Seoul # 결정(CLAUDE.md) — vixie-cron UTC 환산 우회의 복원. KST 값을 그대로 쓴다
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # 실패 = 다음 주기에 맡긴다 (재시도가 크롤 소스에 연타를 넣는 것 방지)
      template:
        metadata:
          labels:
            app: poller-kurly
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          containers:
            - name: poller-kurly
              image: 192.168.0.10/mealplanning/mp-crawler-kurly:710b056de8174c5026ab3c5273d4dee973da4ff7
              command: ["python", "crawler/kurly/prototype.py", "--kafka"]
              envFrom:
                - configMapRef:
                    name: mp-pipeline-env
                - secretRef:
                    name: mp-pipeline-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 1Gi # 실측 피크 1131Mi(2026-07-30 검증 런) — 스케줄러가 실사용을 반영하도록
                limits:
                  memory: 2Gi # 1Gi 는 OOMKill 실장애(chromium 크롤 피크 1131Mi > 1Gi), 2Gi = 여유 ~45%
---
# 오아시스 가격 폴링(카테고리 13종) → Kafka
