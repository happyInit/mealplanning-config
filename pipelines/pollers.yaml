# ── #9 가격 이상탐지 배치 (AI 파트 추가 · draft 2026-07-31) ──
# 04:40 KST — 컬리(03:30)·오아시스(04:10) 유입 후. 성숙도 게이트(MATURE_SAMPLES=28)로 2026-08-18까지 발행 0.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-price-anomaly
  namespace: pipeline
spec:
  schedule: "40 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: poller-price-anomaly
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: poller-price-anomaly
              image: 192.168.0.10/mealplanning/mp-data-pipeline:710b056de8174c5026ab3c5273d4dee973da4ff7
              imagePullPolicy: IfNotPresent
              command: ["python", "pipelines/ingest/detect_price_anomaly.py", "--emit"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
