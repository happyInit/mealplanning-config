              command: ["python", "pipelines/ingest/score_review_sentiment.py"]
              env:
                - {name: AWS_REGION, value: "ap-northeast-2"}   # 비밀 아님(팀장) · AWS 키는 envFrom mp-pipeline-secrets
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
