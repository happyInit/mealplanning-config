# ES 재색인 Job — kustomize 밖(1회성). 용처 = 런북 §2-C-3(사전 재색인: 실증·예열·리허설) ·
# §4-5.5(본번 서빙분 재실행 — REINDEX 완료 후) · §7(리허설).
# 🔴 Job 은 불변 오브젝트 — 재실행 = delete 후 apply:
#   kubectl -n pipeline delete job mp-reindex-recipes-es --ignore-not-found
#   kubectl -n pipeline apply -f pipelines/jobs/reindex-recipes-es.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mp-reindex-recipes-es
  namespace: pipeline
spec:
  backoffLimit: 0 # 실패를 숨기지 않는다 — §5-② 정합 검증이 뒤따르는 스텝
  template:
    metadata:
      labels:
        app: reindex-recipes-es
    spec:
      restartPolicy: Never
      priorityClassName: pipeline-low
      # PodSecurity warn=restricted 대응 — kustomization.yaml 의 일괄 패치와 동일 세트(3종).
      # 이 파일은 kustomize 밖(1회성 kubectl)이라 직접 기재. runAsNonRoot 는 이미지 USER 별건 후.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reindex
          image: 192.168.0.10/mealplanning/mp-data-pipeline:710b056de8174c5026ab3c5273d4dee973da4ff7
          command: ["python", "pipelines/ingest/index_recipes_es.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: mp-pipeline-env
            - secretRef:
                name: mp-pipeline-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
