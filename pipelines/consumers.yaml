# Kafka 컨슈머 4 — compose 상주 컨슈머의 이전 (런북 Q12 · docker-compose.yml 실측).
# deal-pruner·user-data-pruner·chat-insights 는 여기 없다 — CronJob 전환(pruners.yaml, Q12).
---
# retail.crawl.raw → PG(가격이력·단가뷰)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-retail-refiner
  labels:
    app: retail-refiner
spec:
  replicas: 0 # 🔴 dark — 기동은 전환창 §4-9 (그전엔 .8 컨슈머가 정본)
  selector:
    matchLabels:
      app: retail-refiner
  template:
    metadata:
      labels:
        app: retail-refiner
    spec:
      priorityClassName: pipeline-low
      containers:
        - name: retail-refiner
          image: 192.168.0.10/mealplanning/mp-data-pipeline:21db938cdc2755a0614a52c6f560ae4c680d51e4
          command: ["python", "pipelines/stream/consume_retail.py"] # 이미지 WORKDIR=/app — compose 와 동일 상대경로 계약
          envFrom:
            - configMapRef:
                name: mp-pipeline-env
            - secretRef:
                name: mp-pipeline-secrets
          env:
            - name: METRICS_PORT
              value: "9401"
          ports:
            - name: metrics
              containerPort: 9401
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
