# MinIO 콘솔(9001) 노출용 Service — 기존 svc `minio`(9000)는 S3 API 전용이라 건드리지 않는다
# (Loki·Tempo·백업이 무는 경로 — 소비자 경로 불변 원칙).
#
# MinIO Deployment 는 Ansible k8s_minio 소유지만 파드에 9001 이 이미 열려 있어(–console-address :9001)
# Service 만 여기서 추가로 문다. 콘솔 로그인 = MinIO root 자격증명(현행과 동일 — 새 계정 발급은 별건).
apiVersion: v1
kind: Service
metadata:
  name: mp-minio-console
  namespace: observability
spec:
  selector:
    app: minio
    release: minio
  ports:
    - name: http-console
      port: 9001
      targetPort: 9001
      protocol: TCP
