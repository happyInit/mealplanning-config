# Cloudflare API 토큰 — fb-secrets/app-secrets ──ESO──▶ observability ns Secret `mp-cloudflare-api-token`.
#
# gateway/(app ns) 의 동일 파일과 **의도적 사본** 관계다 — Issuer 가 namespaced 라 apiTokenSecretRef 는
# Issuer 와 같은 ns 에 있어야 하고, 내부 게이트웨이의 Issuer 는 observability 에 산다.
# 원본(백엔드 fb-secrets 의 CLOUDFLARE_API_TOKEN)은 하나이므로 값의 정본은 이원화되지 않는다 —
# ESO 가 같은 원천을 두 ns 로 내려줄 뿐이다. 토큰 로테이션 = 백엔드 한 곳만 갱신하면 양쪽 반영.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-cloudflare-api-token
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef: { key: app-secrets, property: CLOUDFLARE_API_TOKEN }
