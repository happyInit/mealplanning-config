# 호스트 C(.10, 클러스터 밖 VirtualBox VM) UI 3종을 게이트웨이 백엔드로 등록.
#
# 🔴 왜 ServiceEntry 인가 (2026-07-30 실측 전환): 처음엔 표준 패턴(셀렉터 없는 Service +
#    수동 EndpointSlice)으로 갔으나, **ArgoCD 기본 resource.exclusions 가 Endpoints·EndpointSlice
#    를 감시·적용 대상에서 통째로 제외**해서(v3.x 차트 기본값 — 대형 클러스터 성능 최적화)
#    sync Succeeded 인데 슬라이스만 조용히 미적용 → 503 이었다. 전역 제외 목록을 고치는 대신
#    Istio 의 정식 표현(ServiceEntry = "메시 밖 서비스 등록")으로 전환 — 구현체가 Istio 로
#    확정된 환경이라 자연스럽고, Harbor TLS 재암호화(DestinationRule)와도 정식 조합이다.
#    HTTPRoute 쪽은 backendRefs 에 group: networking.istio.io / kind: Hostname 으로 문다.
#
# hosts 의 *.hostc.mp.internal 은 **메시 내부 식별용 가상 이름**이다(실제 DNS 아님) —
# 외부 이름(jenkins.mealbong.cloud 등)을 그대로 쓰면 메시의 그 이름 이그레스 전체를
# 가로채는 부작용이 있어 분리한다.
#
# 🔴 스코프 = **브라우저 UI 전용**. containerd 의 이미지 pull 은 계속 192.168.0.10 직결이다 —
#    pull 경로를 게이트웨이 뒤로 넣으면 "클러스터 복구에 Harbor 가 필요한데 Harbor 접근에
#    클러스터가 필요한" 순환 의존이 생긴다(그래서 여기 있는 건 UI 홉뿐이다).
# 🔴 호스트 C IP(.10)·포트가 바뀌면 여기 endpoints 3곳을 같이 갱신할 것.
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mp-jenkins-ext
  namespace: observability
spec:
  hosts: ["jenkins.hostc.mp.internal"]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 8080
      name: http
      protocol: HTTP
  endpoints:
    - address: 192.168.0.10
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mp-sonarqube-ext
  namespace: observability
spec:
  hosts: ["sonarqube.hostc.mp.internal"]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 9000
      name: http
      protocol: HTTP
  endpoints:
    - address: 192.168.0.10
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mp-harbor-ext
  namespace: observability
spec:
  hosts: ["harbor.hostc.mp.internal"]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: https
      protocol: HTTPS      # 게이트웨이가 아래 DR 로 TLS 를 열어 재암호화한다
  endpoints:
    - address: 192.168.0.10
---
# GW → Harbor 백엔드 TLS — 게이트웨이가 브라우저 TLS(LE)를 끊고, Harbor(.10:443)로는
# 로컬 CA(fb-local-ca) 인증서를 **검증하며** 다시 암호화한다.
#   - credentialName: cacert 키만 담은 Secret(mp-harbor-ca, 아래) — 게이트웨이 파드와 같은 ns 필수
#   - subjectAltNames: harbor.crt 의 SAN 은 IP(192.168.0.10) 하나뿐이라 그걸 핀한다
#   - sni 미설정: Harbor nginx 는 default server 라 SNI 불요(IP 는 SNI 에 실을 수도 없다)
# 이 DR 의 유일한 클라이언트 = 게이트웨이 Envoy(observability 에 사이드카 없음).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mp-harbor-ext-tls
  namespace: observability
spec:
  host: harbor.hostc.mp.internal
  trafficPolicy:
    tls:
      mode: SIMPLE
      credentialName: mp-harbor-ca
      subjectAltNames: ["192.168.0.10"]
---
# 로컬 CA 의 **공개** 인증서(fb-local-ca) — 비밀 아님(개인키는 app 레포 infra/certs/ 에서 gitignored).
# app 레포 infra/certs/ca.crt 와 동일 내용. CA 를 교체(재발급)하면 여기도 같이 갱신할 것.
