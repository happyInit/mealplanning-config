# 호스트 C(.10, 클러스터 밖 VirtualBox VM) UI 3종을 게이트웨이 백엔드로 등록.
#
# 셀렉터 없는 Service + 수동 EndpointSlice 패턴 — 파드가 아니라 클러스터 밖 IP 가 실체라
# 셀렉터로 못 찾고, 주소를 우리가 직접 명시한다. EndpointSlice 는 라벨
# kubernetes.io/service-name 으로 Service 에 묶이고, 포트 이름이 Service 쪽과 일치해야 한다.
#
# 🔴 스코프 = **브라우저 UI 전용**. containerd 의 이미지 pull 은 계속 192.168.0.10 직결이다 —
#    pull 경로를 게이트웨이 뒤로 넣으면 "클러스터 복구에 Harbor 가 필요한데 Harbor 접근에
#    클러스터가 필요한" 순환 의존이 생긴다(그래서 여기 있는 건 UI 홉뿐이다).
# 🔴 호스트 C IP(.10)·포트가 바뀌면 여기 EndpointSlice 3개를 같이 갱신할 것.
---
apiVersion: v1
kind: Service
metadata:
  name: mp-jenkins-ext
  namespace: observability
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mp-jenkins-ext-1
  namespace: observability
  labels:
    kubernetes.io/service-name: mp-jenkins-ext
addressType: IPv4
endpoints:
  - addresses: ["192.168.0.10"]
ports:
  - name: http
    port: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mp-sonarqube-ext
  namespace: observability
spec:
  ports:
    - name: http
      port: 9000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mp-sonarqube-ext-1
  namespace: observability
  labels:
    kubernetes.io/service-name: mp-sonarqube-ext
addressType: IPv4
endpoints:
  - addresses: ["192.168.0.10"]
ports:
  - name: http
    port: 9000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mp-harbor-ext
  namespace: observability
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mp-harbor-ext-1
  namespace: observability
  labels:
    kubernetes.io/service-name: mp-harbor-ext
addressType: IPv4
endpoints:
  - addresses: ["192.168.0.10"]
ports:
  - name: https
    port: 443
    protocol: TCP
---
# GW → Harbor 백엔드 TLS — 게이트웨이가 브라우저 TLS(LE)를 끊고, Harbor(.10:443)로는
# 로컬 CA(fb-local-ca) 인증서를 **검증하며** 다시 암호화한다.
#   - credentialName: cacert 키만 담은 Secret(mp-harbor-ca, 아래) — 게이트웨이 파드와 같은 ns 필수
#   - subjectAltNames: harbor.crt 의 SAN 은 IP(192.168.0.10) 하나뿐이라 그걸 핀한다
#   - sni 미설정: Harbor nginx 는 default server 라 SNI 불요(IP 는 SNI 에 실을 수도 없다)
# 이 DR 의 유일한 클라이언트 = 게이트웨이 Envoy(observability 에 사이드카 없음).
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mp-harbor-ext-tls
  namespace: observability
spec:
  host: mp-harbor-ext.observability.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      credentialName: mp-harbor-ca
      subjectAltNames: ["192.168.0.10"]
---
# 로컬 CA 의 **공개** 인증서(fb-local-ca) — 비밀 아님(개인키는 app 레포 infra/certs/ 에서 gitignored).
# app 레포 infra/certs/ca.crt 와 동일 내용. CA 를 교체(재발급)하면 여기도 같이 갱신할 것.
