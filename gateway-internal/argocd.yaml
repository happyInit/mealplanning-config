# ArgoCD UI 를 내부 게이트웨이에 등록 — https://argocd.mealbong.cloud (LAN, .15).
#
# 왜 ServiceEntry 인가 (backends-hostc.yaml 과 동일 패턴): argocd-server 는 argocd ns 에 있고
# 이 라우트/게이트웨이는 observability ns 다. 표준 크로스-ns backendRef 는 argocd ns 에
# ReferenceGrant 를 요구하는데, gateway-internal 앱은 platform project 라 destinations 에
# argocd ns 가 없어 그 RefGrant 를 넣을 수 없다. → Istio 정식 표현(ServiceEntry)으로 백엔드를
# observability ns 안에서 등록하면 크로스-ns 참조 자체가 사라진다(전부 같은 ns).
#
# 🔴 argocd-server 는 이미 `--insecure` 로 뜬다(평문 HTTP :80) — 게이트웨이가 와일드카드 TLS 를
#    종단하고 HTTP 로 프록시한다. argocd 설치 변경 불필요.
# 🔴 location=MESH_EXTERNAL: argocd ns 는 메시 밖(비주입)이라 mTLS 를 originate 하면 안 된다.
#    resolution=DNS 로 in-cluster Service FQDN 을 그대로 물어 ClusterIP 로 붙는다.
# hosts 의 argocd.incluster.mp.internal 은 **메시 내부 식별용 가상 이름**(실제 DNS 아님) —
#    실 FQDN 을 hosts 로 쓰면 그 이름의 메시 egress 를 통째로 가로채는 부작용이 있어 분리한다.
#
# ⚠️ 보안: 이 노출은 LAN 전용(*.mealbong.cloud → 사설 192.168.0.15, DNS-only). ArgoCD 는 클러스터
#    전역 쓰기(object_spec §10.6)라 절대 인터넷 raw 노출 금지 — 인터넷이 필요하면 CF Access 앞단.
#    인증은 ArgoCD 자체(admin/dex). OIDC/리다이렉트 정합을 위해 argocd-cm `url`=https://argocd.mealbong.cloud
#    설정 권장(ansible k8s_argocd argocd-values — 별건, admin 로그인엔 불요).
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mp-argocd-ext
  namespace: observability
spec:
  hosts: ["argocd.incluster.mp.internal"]
  location: MESH_EXTERNAL
  resolution: DNS
  endpoints:
    - address: argocd-server.argocd.svc.cluster.local
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-argocd-route
  namespace: observability
spec:
  parentRefs:
    - name: mp-gw-internal
      sectionName: https
  hostnames: ["argocd.mealbong.cloud"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: argocd.incluster.mp.internal
          port: 80
