# config 레포 검증 — 이 레포에는 CI 가 없었고, 그 사이 13개 Application 이 automated sync 였다.
# 즉 잘못된 매니페스트가 아무 관문 없이 클러스터에 도달했다. 실제로 그렇게 새어나간 것들은
# scripts/validate.py 머리말에 정리돼 있다.
#
# 🔴 검증 로직은 전부 scripts/validate.py 에 있고 이 파일은 껍데기다. 의도적이다 —
#    앱 레포의 GH Actions 는 self-hosted 러너(`fb-ci`)가 은퇴하면서 통째로 죽었다.
#    같은 일이 여기서 반복돼도 스크립트는 로컬·Jenkins 어디서나 그대로 돈다:
#        python3 scripts/validate.py
#    푸시 전에 손으로 한 번 돌리는 것만으로도 이 워크플로의 값어치는 나온다.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML
        run: pip install --quiet pyyaml

      # 버전을 핀한다 — 렌더러가 바뀌면 렌더 결과가 바뀌고, 그러면 이 검증의 기준선이 흔들린다.
      - name: kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          kustomize version

      - name: kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: validate
        run: python3 scripts/validate.py
