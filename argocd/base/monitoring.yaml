# child app — 앱 서비스 ServiceMonitor(app ns). in-cluster Prometheus 가 이걸 보고 파드를 긁고,
# 그 결과를 remoteWrite 로 `.11` 에 밀어 알림 규칙 20개를 살린다(P4 컷오버까지 과도기).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    # 🔴 사이트 오버레이 경로 (0-1, 2026-08-09). 구 `monitoring` = base 직행. 렌더 결과는 동일(전 트랙 diff 0).
    path: monitoring/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: app
