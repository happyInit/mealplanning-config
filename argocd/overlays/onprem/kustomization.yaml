apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── 온프렘 사이트: mealplanning-root 의 감시 대상 ────────────────────────────────
# 🔴 지금은 **순수 통과(base 그대로)** 다. 컷오버 1단계(SITES.md §0-4)의 안전 기준이
#    "옛 경로(argocd/applications/)의 directory 렌더와 전 필드 동일" 이라, 여기에 아무것도 얹지 않았다.
#    검증 = `kubectl kustomize argocd/overlays/onprem` 을 (apiVersion,kind,namespace,name) 정렬 +
#    키 정렬 JSON 으로 덤프해 옛 렌더와 비교 → 문서 23개·차이 0.
#
# 🔴 여기에 넣을 것 = **온프렘에서만 참인 child 설정**. 예: 온프렘에만 존재하는 Application,
#    온프렘 전용 sync 정책. 지금은 사이트가 갈리는 값이 child 쪽에 없다
#    (트랙별 사이트 분기는 각 트랙의 overlays/ 가 이미 담당한다 — 여기는 "어떤 트랙을 배포하는가"만 본다).
resources:
  - ../../base
