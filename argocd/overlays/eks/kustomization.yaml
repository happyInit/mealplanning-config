apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ── EKS 사이트: mealplanning-root 의 감시 대상 (C-78 A2 · Wave 1) ──────────────
#
# 🔴 **종전 상태는 `../../base` 한 줄뿐이었다** = 자식 23개가 전부 딸려 오는데 그들의
#    `spec.source.path` 는 **온프렘 오버레이**를 가리킨다. 즉 이 뿌리를 EKS 에 적용하면
#    **온프렘 형상이 EKS 로 배포된다.** 가장 아픈 예:
#      `ingress/overlays/onprem` → **MetalLB IP `.14` 애너테이션이 EKS 로 샌다**
#      (`ingress/overlays/eks` 머리말이 *"지금 이 오버레이를 붙이면 …샌다"* 로 경고하는 그것)
#
# 이 파일이 하는 일 = ① 켤 13개의 path 를 `overlays/eks` 로 돌리고 ② 나머지 10개를 **지운다**.
#
# 🔴 **base 통과는 유지한다**(개별 파일 나열이 아니라). 이유가 둘:
#    ⓐ kustomize 는 루트 밖의 **개별 파일**을 resources 로 못 읽는다(디렉터리만 된다)
#    ⓑ 그리고 그게 더 낫다 — base 에 child 가 새로 생기면 여기 자동으로 들어오고,
#       path 패치가 없으니 **온프렘 경로인 채로** 남는다. 그 상태를
#       `scripts/validate.py::check_eks_app_site` 가 **실패로** 잡는다.
#       명시 나열이었다면 새 child 가 **조용히 빠져서** 아무도 몰랐을 것이다.
#
# 🔴 **A1(데이터 티어)이 끝나야 머지할 수 있다.** `app-common` 의 백엔드 주소(PG·ES·Redis)가
#    아직 비어 있고(C-14 ElastiCache 엔드포인트), 그게 없으면 앱이 `envFrom` 을 못 받아
#    `CreateContainerConfigError` 로 선다. **이 파일은 A1 완료 시점에 켜는 스위치다.**
#
# ══ Wave 1 = app-common + 앱 12종 (C-78 A2) ═══════════════════════════════════
resources:
  - ../../base

patches:
  # ── ① 제외 10개 ─────────────────────────────────────────────────────────────
  #
  # 🔴 `mp-cloudflared` — C-5. 온프렘 DR 전용(평시 replicas 0)이라 EKS 에 둘 물건이 아니다.
  #    애초에 `services/cloudflared/overlays/eks` 가 **존재하지 않는다** — 남겨두면 뿌리가
  #    없는 path 를 가리켜 `ComparisonError` 로 앉는다.
  - target: {group: argoproj.io, kind: Application, name: mp-cloudflared}
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: mp-cloudflared, namespace: argocd}

  # 🔴 `mp-operations` — C-89. 대시보드 EC2 의 docker compose 로 나간다(C-84).
  #    A2 앱이 13종 → **12종**이 된 이유가 이것이다.
  #    🔵 `services/operations/overlays/eks` 는 **지우지 않는다** — 되돌릴 여지를 없앨 이유가 없고,
  #       Application 이 없으면 그 디렉터리는 아무 일도 하지 않는다.
  - target: {group: argoproj.io, kind: Application, name: mp-operations}
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: mp-operations, namespace: argocd}

  # ══ 진입점 — 🔴 두 개의 운명이 **갈린다.** 같이 묶어 읽지 말 것 ═══════════════
  #
  # ⚠️ **정정(2026-08-14 오전)** — 이 블록은 원래 `gateway` 까지 "진입점 3종"으로 묶어 지웠다.
  #    **틀렸다.** 실측: `gateway/base/kustomization.yaml` 의 resources 는 **`httproutes.yaml`
  #    하나뿐**이고 그 파일에 metallb·loadBalancer·`192.168.*`·annotation 이 **0건**이다.
  #    즉 그 트랙은 **app ns 의 HTTPRoute 묶음일 뿐**이라 아래 ②에서 되살렸다.
  #
  # ⟳ **2026-08-14 오후 — `mp-ingress` 도 되살린다(A2 후반).**
  #    종전 사유(*"ALB 0개 · LB Controller 미설치 · `aws_lb` 선언 0건"*)가 **전부 해소됐다**:
  #    app 레포 PR 이 `alb.tf`·`acm.tf`·`waf.tf` + `roles/eks_lb_controller` 를 만든다.
  #    `ingress/overlays/eks` 도 이제 골격이 아니라 **실제 EKS 형상**이다 —
  #    MetalLB 애너테이션 제거 · 리스너 HTTP(`1-50`) · Service ClusterIP · cert-manager 배선 제거.
  #    ⇒ *"MetalLB `.14` 가 EKS 로 샌다"* 는 위험이 **파일 수준에서 사라졌다.**
  - target: {group: argoproj.io, kind: Application, name: mp-ingress}
    patch: |-
      - op: test
        path: /spec/source/path
        value: ingress/overlays/onprem
      - op: replace
        path: /spec/source/path
        value: ingress/overlays/eks

  # 🔴 **`gateway-internal` 은 계속 지운다 — 미룬 것이 아니라 결정이다.**
  #    C-85 = *"내부 접근 = **로드밸런서 0개**"*. 내부 도구 6종(Grafana·ArgoCD 등)은
  #    `kubectl port-forward` 로 본다 — C-80 이 EKS 엔드포인트를 public + IAM 으로 확정했으므로
  #    노트북에서 **바로** 된다($0 · LB 불요 · 도메인 불요). 🟢 온프렘의 `ssh -L` + 원격
  #    port-forward **2겹**보다 오히려 낫다(1겹).
  #    🔴 이 트랙을 EKS 에서 켜면 내부 게이트웨이용 LB 를 하나 더 사게 되고, 그건
  #       *"공개 ALB 1개만"*(C-9)을 깬다. ❌ 공개 ALB 에 얹는 겸용도 **금지**다 —
  #       감사 #58 이 *"내부 게이트웨이 netpol 이 전면 개방 + 와일드카드 SNI → scheme 을
  #       틀리면 그대로 인터넷 노출"* 로 경고했다.
  #    🟢 그리고 우리 LB 컨트롤러는 **LB 를 만들 IAM 권한이 없다** — 이 결정이 문서가 아니라
  #       권한으로 강제된다(app 레포 `alb.tf` 의 `mp-lb-controller` 정책).
  - target: {group: argoproj.io, kind: Application, name: gateway-internal}
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: gateway-internal, namespace: argocd}

  # 🟢 `monitoring` — **삭제를 걷었다 (2026-08-16 감사 F-1).**
  #    종전 근거는 *"골격. EKS 관측은 platform-root 의 kube-prometheus-stack 이 별도로 든다"* 였고
  #    **쓰인 시점엔 맞았다.** 그 뒤 `monitoring/overlays/eks` 가 실물로 채워졌는데 스위치를 안 켰다.
  #
  # 🔴 **kube-prometheus-stack 은 이것을 대신하지 못한다.** 그 차트가 주는 것은 *플랫폼* 규칙
  #    (Kube*·Node*·Watchdog)이고, **우리 앱 규칙·ServiceMonitor·대시보드는 전부 이 트랙에 있다**:
  #      ServiceMonitor/mp-app-services + PrometheusRule 9종
  #      (mp-app-sli · mp-app-symptom · mp-backup · mp-container-memory · mp-data-tier
  #       · mp-descheduler · mp-rollouts · mp-tempo · **mp-workload-spread-eks**)
  #    `mp-workload-spread-eks` 라는 **EKS 전용 이름**이 "골격이 아니다"의 증거다.
  #
  # 🔴 **없는 동안 실제로 무슨 일이 있었나** — 감사 F-8 이 답이다. `mp-backup` 규칙이 없어서
  #    *"백업이 조용히 실패해도 모른다"* 가 예측이 아니라 **이미 일어난 상태**였다.
  #    앱이 죽어도 Slack 이 안 울고, BG 승격 실패(`mp-rollouts`)도 조용했다.
  #
  # ⚠️ 켠 뒤 **`up` 으로 확인할 것** — `mp-app-services` 의 셀렉터·포트가 온프렘 라벨 그대로면
  #    Application 은 Synced 인데 타깃이 0일 수 있다(= 초록불인데 안 잡힘).

  # 🟢 정책 4종 — **삭제를 걷었다 (2026-08-16 · `0-17`·`0-18` 종결).**
  #    종전 근거는 *"골격이고 0-17·0-18 이 선행"* 이었고 맞았다. 그 선행이 끝났다 —
  #    `platform/policies*/overlays/eks` 네 벌이 전부 실물로 쓰여 있고, LAN ipBlock 을
  #    VPC CIDR 로 기계적 치환하지 않았다(FQDN·엔티티·서브넷 CIDR 로 다시 썼다).
  #
  # 🔴 **켜기 전 감사에서 확인한 것 (전부 실측)**
  #    ① app ns 12파드 전부 `tier` 라벨 보유 ⇒ default-deny 가 고아를 만들지 않는다
  #    ② 게이트웨이 파드 라벨 `gateway.networking.k8s.io/gateway-name=mp-gw-public` 일치
  #    ③ 🔴 **kubelet 프로브는 15020 인데 정책은 15021 만 연다** — 그런데 온프렘에서
  #       같은 형상이 10일째 라이브고 파드 16/17 Ready 다. Cilium 이 **로컬 호스트→파드를
  #       기본 허용**(`allow-localhost: auto`)하기 때문이고, 그래서 문제가 되지 않는다.
  #    ④ FQDN 정책 전부 **DNS L7 rule(`matchPattern: '*'`) 동반** ⇒ IP 학습이 된다
  #       (이게 없으면 FQDN 정책은 전부 차단으로 동작한다)
  #    ⑤ video 는 Vertex(`GCP_LOCATION=global`)라 `aiplatform.googleapis.com` 이 맞다
  #       — 리전 엔드포인트가 아니므로 `matchName` 으로 걸린다
  #    ⑥ app ns 에 IRSA SA **0개** ⇒ 앱은 AWS 를 직접 부르지 않는다(엔드포인트 egress 불요)
  #    🔴 ⑦ **ALB 헬스체크가 막히는 것을 발견해 `policies-ingress/overlays/eks` 를 고쳤다**
  #         (C-26 NLB 시절 규칙이 C-60 ALB 를 따라오지 않았다 — 그 파일 주석 ③ 참조)
  #
  # ⚠️ 이 앱들은 **수동 sync** 다. 위험도 순으로 하나씩 켜고 검증한다:
  #    pipeline → data → app → **ingress(마지막 · 공개 진입)**
  - target: {group: argoproj.io, kind: Application, name: mp-policies}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/policies/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-policies-data}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/policies-data/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-policies-ingress}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/policies-ingress/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-policies-pipeline}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/policies-pipeline/overlays/eks

  # ── ② 남은 14개의 source.path 를 eks 오버레이로 ─────────────────────────────
  # 🔴 `op: replace` 를 쓴다 — 대상 필드가 없으면 **렌더가 죽어서** 오타가 즉시 드러난다.
  #    `add` 는 조용히 통과할 수 있다.
  #
  # 🔴 **`gateway` 가 왜 여기 있나 (2026-08-14 — A2 를 막던 것)**
  #    `mp-account`·`mp-recipe` 는 Rollout(카나리, ADR-0001)이고 `trafficRouting.plugins`
  #    `argoproj-labs/gatewayAPI` 가 **HTTPRoute 를 이름으로 요구**한다(`mp-account-route`).
  #    그게 없으면 Rollout reconcile 이 **RS 를 키우기 전에 중단**된다 — 실측 컨트롤러 로그:
  #      roCtx.reconcile err failed to remove managed routes via plugin:
  #        httproutes.gateway.networking.k8s.io "mp-account-route" not found
  #      rollout syncHandler queue retries: 55
  #    증상은 "Rollout Progressing · replicas 0 · 이벤트 없음" 이라 원인을 짚기 어렵다.
  #    🔵 `parentRefs: mp-gw-public` 은 `mp-ingress` 소관이라 C-60 전까지 **부착되지 않는다.**
  #       그래도 무해하다 — 플러그인이 필요한 것은 **HTTPRoute 객체의 존재**이고, 라우팅은
  #       애초에 이 단계에서 안 쓴다(검증은 port-forward). C-60 이 오면 이미 맞는 상태다.
  #    🔵 첫 배포는 카나리 단계를 타지 않는다(초기 Rollout 은 곧장 stable). 즉 라우팅이 안 붙은
  #       상태로 "카나리가 성공한 척" 하는 일은 A2 에서 발생하지 않는다.
  - target: {group: argoproj.io, kind: Application, name: gateway}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: gateway/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: app-common}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: common/overlays/eks
  # 🔴 `monitoring` 은 base 가 `overlays/onprem` 을 가리킨다 — 위에서 삭제만 걷고 이 줄을 빼면
  #    **온프렘 규칙이 EKS 에 실린다**(LAN ipBlock·MinIO·site 라벨이 전부 온프렘 값이다).
  #    삭제를 걷는 것과 경로를 돌리는 것은 **한 쌍이다.**
  - target: {group: argoproj.io, kind: Application, name: monitoring}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: monitoring/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-account}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/account/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-chat}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/chat/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-frontend}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/frontend/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-mealplan}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/mealplan/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-notify}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/notify/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-ocr}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/ocr/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-pantry}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/pantry/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-price}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/price/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-ranking-serving}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/ranking-serving/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-recipe}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/recipe/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-recipebook}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/recipebook/overlays/eks
  - target: {group: argoproj.io, kind: Application, name: mp-video}
    patch: |-
      - op: replace
        path: /spec/source/path
        value: services/video/overlays/eks
