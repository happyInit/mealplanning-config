# child Application — root app-of-apps 가 이 파일을 읽어 account 를 배포한다.
# 서비스가 늘면 이 디렉터리에 <서비스>.yaml 을 하나씩 더 두면 root 가 자동으로 집는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-account
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 🔴 없으면 Application 삭제해도 리소스가 유령으로 남음(status §4.2 트랩)
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: services/account/overlays/onprem     # ← Jenkins 가 :sha 를 커밋하는 자리(6단계)
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # 🔴 배선만 — 자동 sync 는 아직 안 켠다(플랜 §7.4 "최초의 CD 는 P2").
  #    지금: child Application 오브젝트는 생기고, sync 는 사람이 1회 수동(5단계)으로 검증.
  #    P2 활성화(6단계): 아래 블록의 주석을 풀면 git push → 자동 배포가 완성된다.
  #
  # auto-sync ON (2026-07-29) — git(config) 변경 시 자동 배포.
  #   🔴 selfHeal·prune 는 꺼둠 — selfHeal 은 수동 kubectl 편집을 되돌리고(핸드오프 함정),
  #      Istio 사이드카 주입 드리프트로 OutOfSync↔sync 루프를 유발한다.
  #      완전 GitOps(selfHeal+prune)는 Istio ignoreDifferences 세팅 후 후속(§10).
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
