# child Application — 인클러스터 cloudflared(전용 터널 mp-app). root app-of-apps 가 집는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 🔴 없으면 삭제 시 유령 리소스(status §4.2)
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: services/cloudflared/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # auto + selfHeal 승격 — P2 후속으로 계획됐던 auto-sync 를 이제 반영(P2 완료 2026-07-30).
  #   상태 없는 터널 Deployment 라 선언값을 강제(selfHeal)해 드리프트를 없앤다. ArgoCD 접근은
  #   내부 게이트웨이(.15)라 터널 오설정에 의한 lockout 위험은 낮다.
  #   prune 은 끈다: 단일 Deployment/config 라 자동 삭제 위험만 키운다.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
