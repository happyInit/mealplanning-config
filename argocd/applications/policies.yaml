# child app — app ns 보안 정책(PeerAuthentication mTLS, 이후 NetworkPolicy). 보안 롤아웃 ②~③.
# root app-of-apps 가 이 파일을 집어 mp-policies Application 을 만든다(다른 서비스와 동일 패턴).
#
# 🔴 syncPolicy.automated 를 일부러 안 켠다 = 수동 sync. STRICT 는 민감한 플립이라 "머지=강제"가
#    되면 안 된다. 보안 ①(PR #34) 검증 게이트(Prometheus 가 15020 에서 앱 지표 수신) 통과를 확인한
#    뒤에 사람이 명시적으로 이 앱을 sync 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 없으면 Application 삭제해도 리소스가 유령으로 남음
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
