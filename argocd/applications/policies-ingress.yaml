# child app — mp-ingress ns 보안 정책(공개 진입점 GW·cloudflared 양방향 잠금 + 베이스라인).
# root app-of-apps 가 이 파일을 집어 mp-policies-ingress Application 을 만든다(mp-policies-data 와 동일 패턴).
#
# 🔴 syncPolicy.automated 를 일부러 안 켠다 = 수동 sync. 여기 정책은 **공개 유입의 유일한 입구**를
#    잠근다 — 규칙 하나가 틀리면 사이트가 통째로 죽는다. "머지=강제"가 되면 안 된다.
#    수동이라 롤백도 `kubectl delete cnp/netpol` 한 줄로 끝난다(ArgoCD 가 되살리지 않음).
# 🔴 app ns 의 mp-policies 와 별개 앱 — dest namespace 가 mp-ingress 다
#    (policies kustomization 은 `namespace: app` 강제라 재사용 불가).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-policies-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 없으면 Application 삭제해도 리소스가 유령으로 남음
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: platform/policies-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: mp-ingress
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
