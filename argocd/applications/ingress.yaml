# child app — 공개 진입점 실체(Gateway .14 + 발급 배선 + Harbor pull). ns = mp-ingress (#532 ③).
#
# 🔴 `gateway` Application 과 짝이다. 그쪽은 이제 **HTTPRoute 만**(ns=app) 관리한다 —
#    라우트를 app 에 남긴 이유(ReferenceGrant 12개 회피)는 `ingress/kustomization.yaml` 상단 참조.
#    ⚠️ 그래서 HTTPRoute 관련 ignoreDifferences(카나리 weight 재작성)는 **여기가 아니라
#       `gateway.yaml` 에 그대로 둔다.** 이 앱은 HTTPRoute 를 안 들고 있다.
#
# 🔴 수동 sync — `gateway` 와 같은 이유다. 공개 유입의 유일한 입구라 "머지=강제"가 되면
#    잘못된 매니페스트 하나가 사이트를 통째로 내린다. 사람이 판단해서 반영한다(플랜 §7.4).
#
# 🔴 CreateNamespace=false — ns 는 Ansible(`k8s_cluster_base`)이 유일 생산자다. ArgoCD 가 만들면
#    PSS 라벨 없는 ns 가 생겨 ns 정책이 매니페스트마다 갈라진다(cluster-base.yaml.j2 주석).
#    ⚠️ 애초에 AppProject `mealplanning` 은 clusterResourceWhitelist 가 비어 있어 못 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 없으면 Application 삭제해도 리소스가 유령으로 남음
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: mp-ingress
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
