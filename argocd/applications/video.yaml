# child Application — root app-of-apps 가 집어 mp-video 를 배포. AI 파트 신규 · draft 2026-07-31.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mp-video
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: services/video/overlays/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
