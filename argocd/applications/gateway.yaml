# child app — nginx /api/* 13경로를 대체하는 **HTTPRoute 12개**(ns=app).
#
# 🔴 2026-08-06(#532 ③) 이후 이 앱은 **Gateway 를 들고 있지 않다.** 게이트웨이 실체는
#    `mp-ingress` Application(path `ingress/`, ns=mp-ingress)으로 갈라졌다.
#    라우트만 app 에 남긴 이유 = backendRef 가 app ns Service 라 여기 있으면 ReferenceGrant 가
#    불필요하다(옮기면 12개 필요). 상세 = `gateway/kustomization.yaml` 상단.
#    ⚠️ 구 주석("Gateway 와 HTTPRoute 는 리스너 전역 우선순위로 맞물려 한 단위로 배포")은
#       이제 성립하지 않는다 — 두 앱을 함께 sync 하는 운영 규칙으로 대체됐다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 없으면 Application 삭제해도 리소스가 유령으로 남음(status §4.2)
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # 수동 sync — 유입 전환 전까지 사람이 판단해서 반영한다(플랜 §7.4).
  # 🔴 카나리(ADR-0001) — Rollouts 플러그인이 mp-recipe-route 의 backendRef weight 를 롤아웃 중 재작성.
  #    그 드리프트를 OutOfSync 로 안 보게 무시(git 정본 = recipe 100 / recipe-canary 0).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mp-recipe-route
      jsonPointers:
        - /spec/rules
    - group: gateway.networking.k8s.io       # account 카나리(ADR-0001) — 같은 이유
      kind: HTTPRoute
      name: mp-account-route
      jsonPointers:
        - /spec/rules
