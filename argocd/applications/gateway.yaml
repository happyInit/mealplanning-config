# child app — 공개 게이트웨이(.14) + nginx /api/* 13경로를 대체하는 HTTPRoute 10개.
# Gateway 는 인프라 소유 오브젝트지만(object_spec §5.1 역할분담) HTTPRoute 와 우선순위가
# 리스너 전역으로 맞물려 있어 **한 단위로 검토·배포**한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 없으면 Application 삭제해도 리소스가 유령으로 남음(status §4.2)
spec:
  project: mealplanning
  source:
    repoURL: git@github.com:happyInit/mealplanning-config.git
    targetRevision: main
    path: gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  # 수동 sync — 유입 전환 전까지 사람이 판단해서 반영한다(플랜 §7.4).
  # 🔴 카나리(ADR-0001) — Rollouts 플러그인이 mp-recipe-route 의 backendRef weight 를 롤아웃 중 재작성.
  #    그 드리프트를 OutOfSync 로 안 보게 무시(git 정본 = recipe 100 / recipe-canary 0).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mp-recipe-route
      jsonPointers:
        - /spec/rules
    - group: gateway.networking.k8s.io       # account 카나리(ADR-0001) — 같은 이유
      kind: HTTPRoute
      name: mp-account-route
      jsonPointers:
        - /spec/rules
