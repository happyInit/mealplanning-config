# nginx `/api/*` location 13개 → HTTPRoute (object_spec §5.3 대응표 그대로)
#
# 원본 = food-budget-app `frontend/nginx.conf`. 옮기며 바뀌는 것 세 가지:
#   ① `/internal/metrics/*` 9개는 **옮기지 않는다** — Prometheus 가 클러스터 안에서 파드를 직접
#      긁으므로(ServiceMonitor) compose 시절의 우회가 통째로 소멸한다(§5.4).
#   ② SPA 폴백(`try_files`)은 **nginx 에 남는다** — Gateway 는 파일시스템을 모른다. 여기서는
#      `/` → frontend Service 까지만 보내고 그 안에서 nginx 가 계속한다(§5.5).
#   ③ 프록시 헤더(X-Forwarded-*)는 Envoy 가 붙인다 — nginx 의 proxy_set_header 는 불요.
#
# ⚠️ **매칭 의미 차이**: nginx 는 문자열 프리픽스, Gateway API 는 **경로 세그먼트** 단위다.
#    `/api/recipesXYZ` 가 nginx 에서는 recipe 로 갔지만 여기서는 404 다(§5.3 — Gateway 쪽이 더 엄격).
#    우선순위는 스펙이 정의한다(정확 매치 > 긴 prefix) — `/api/recipes/book` 이 `/api/recipes` 를 이긴다.
---
# 레시피북 — nginx 3 location(/book·/mine·/shared)이 한 Route 의 3 matches 로
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-recipebook-route
  namespace: app
spec:
  parentRefs:
    - name: mp-gw-public
      sectionName: https          # 443(HTTPS) 리스너에만 바인딩 — 80 은 리다이렉트 전용
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/recipes/book }
        - path: { type: PathPrefix, value: /api/recipes/mine }
        - path: { type: PathPrefix, value: /api/recipes/shared }
      backendRefs:
        - name: recipebook
          port: 8006
---
# 레시피 — 위 3개보다 짧은 prefix 라 스펙상 뒤로 밀린다(순서 무관)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-recipe-route
  namespace: app
spec:
  parentRefs:
    - name: mp-gw-public
      sectionName: https          # 443(HTTPS) 리스너에만 바인딩 — 80 은 리다이렉트 전용
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/recipes }
      backendRefs:
        - name: recipe
          port: 8001
---
