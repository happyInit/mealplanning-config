# SPA — 가장 짧은 prefix 라 위 어느 것에도 안 걸린 요청만 온다.
# ranking-serving 은 mealplan 이 내부에서 부르는 소비자라 Route 가 없다(§5.3 표).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-frontend-route
  namespace: app
spec:
  parentRefs:
    - name: mp-gw-public
      sectionName: https          # 443(HTTPS) 리스너에만 바인딩 — 80 은 리다이렉트 전용
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 80
---
# 🔴 HTTP(80) → HTTPS(301) 전량 리다이렉트. 80 리스너에는 이 라우트만 붙는다(sectionName: http).
#    앱 라우트 10개는 전부 https(443) 리스너로 옮겼으므로, 평문으로 온 요청은 여기서 튕겨 올라간다.
#    DNS-01 발급이라 LE 는 80 을 쓰지 않는다 → 80 을 통째로 리다이렉트해도 챌린지와 충돌 없음(§5.2).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-https-redirect
  namespace: app
spec:
  parentRefs:
    - name: mp-gw-public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# ── 영상→레시피 추출 (#11) — /api/recipes/extract 분리 (AI 파트 추가 · draft 2026-07-31) ──
# 🔴 /api/recipes 프리픽스가 recipe:8001 을 잡아 현재 404. 더 긴 prefix 가 우선(recipebook 선례와 동일).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-video-route
  namespace: app
spec:
  parentRefs:
    - name: mp-gw-public
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/recipes/extract}   # POST 접수 + GET 폴링 동일 prefix
      backendRefs:
        - name: video
          port: 8011
