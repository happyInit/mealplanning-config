# Cloudflare API 토큰 — fb-secrets/app-secrets ──ESO──▶ app ns Secret `mp-cloudflare-api-token`.
#
# cert-manager 의 DNS-01 solver 가 이 토큰으로 _acme-challenge TXT 를 쓴다. namespaced Issuer 라
# apiTokenSecretRef 는 **Issuer 와 같은 ns(app)** 에 있어야 한다 → ESO 가 여기 app ns 로 내려준다.
#
# 🔴 인프라 hand-off: 실제 토큰 값을 `app-secrets` 백엔드에 `CLOUDFLARE_API_TOKEN` 프로퍼티로 넣어야 한다
#    (레포 규칙: 값은 여기 두지 않고 ESO 참조만). 토큰 스코프 = Zone.DNS:Edit on mealbong.cloud 하나면 충분.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-cloudflare-api-token
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef: { key: app-secrets, property: CLOUDFLARE_API_TOKEN }
