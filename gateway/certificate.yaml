# app.mealbong.cloud 의 TLS 인증서 — cert-manager 가 Issuer 로 발급해 Secret 에 저장한다.
#
# 발급 흐름: 이 리소스 → cert-manager 가 CertificateRequest→Order→Challenge(DNS-01) 생성 →
#   CF API 로 _acme-challenge.app.mealbong.cloud TXT 심음 → LE 검증 → 서명된 체인을
#   Secret `mp-gw-public-tls`(type kubernetes.io/tls) 에 기록. Gateway 가 이 Secret 를 certificateRefs 로 문다.
#
# issuerRef = prod (staging 으로 전체 루프 검증 완료 2026-07-29 — Certificate Ready·443 서빙·80→443·DNS-01 통과).
#    prod 로 전환 시 cert-manager 가 mp-gw-public-tls 를 브라우저 신뢰(Let's Encrypt R-계열) 인증서로 재발급한다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mp-gw-public-cert
  namespace: app
spec:
  secretName: mp-gw-public-tls          # Gateway https 리스너의 certificateRefs 가 가리키는 이름(같은 app ns)
  issuerRef:
    kind: Issuer
    name: mp-letsencrypt-prod           # staging 검증 완료 → prod (브라우저 신뢰)
  commonName: app.mealbong.cloud
  dnsNames:
    - app.mealbong.cloud
  privateKey:
    rotationPolicy: Always              # 갱신 때마다 키 재생성(권장)
