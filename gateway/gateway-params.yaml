# 외부 유입 게이트웨이 HA 파라미터 — Gateway.spec.infrastructure.parametersRef 대상
#
# 🔴 왜 ConfigMap 인가 (Deployment 를 직접 고치면 안 되는 이유)
#   `mp-gw-public-istio` Deployment 는 우리가 만든 게 아니다 — Gateway/mp-gw-public 을 보고
#   istiod(`istio.io-gateway-controller`)가 대신 만들고 **소유**한다.
#   그래서 Deployment 에 kubectl 로 replicas·TSC 를 박아 넣으면 컨트롤러의 다음 재조정에서
#   되돌려진다. istiod 가 인정하는 유일한 커스터마이즈 경로가 이 parametersRef → ConfigMap 이다.
#   허용 키 5개: service · deployment · serviceAccount · horizontalPodAutoscaler · podDisruptionBudget.
#   각 값은 istiod 가 렌더한 오브젝트 위에 얹는 **오버레이**(전체 정의가 아니라 덮어쓸 조각만 쓴다).
#
# 🔴 podDisruptionBudget 키는 일부러 비워 뒀다.
#   PDB 는 `pdb.yaml` 에서 직접 만든다. 여기에 키를 넣으면 istiod 가 PDB 를 **또** 만들어
#   같은 파드에 PDB 2개가 걸린다(중복 관리·소유자 이원화). 둘 중 하나만 있어야 한다.
#
# 배경: 이 게이트웨이는 외부 유입의 **유일한 입구**였는데 replica 1 로 b2 단독에 떠 있었다.
#   백엔드 11종은 spread 가 걸려 있는데 정작 입구가 SPOF 였다 → replica 2 + 노드 분산.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mp-gw-public-params
  namespace: app
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          # 🔴 축출 서열. 이 파드는 **외부 유입의 유일한 입구**인데 priority 0 이었다(2026-08-03 실측).
          #    노드 압박 시 kubelet 은 (QoS, priority, 초과분) 순으로 고르므로, 입구가 백엔드보다
          #    먼저 죽으면 백엔드가 살아 있어도 서비스는 전면 불가가 된다.
          #    ⚠️ Deployment 를 직접 고치면 안 된다 — istiod 가 소유해서 다음 재조정에 되돌려진다.
          #       이 ConfigMap 오버레이가 istiod 가 인정하는 유일한 경로다(파일 상단 주석).
          #    app-normal 을 쓴다: 서열 정의(object_spec §1.4 ①)에 게이트웨이 전용 등급이 없고,
          #    임의로 data-critical 을 붙이면 PG·etcd 보다 먼저 살아남겠다는 뜻이 되어 서열이 흐려진다.
          priorityClassName: app-normal
          # 분산은 **2계층**이다. 노드만 갈라선 부족하다는 게 실측으로 드러났다.
          #
          # 🔴 1차 반영(hostname TSC 만) 결과 = 두 파드가 a1·a2 에 떴다. 노드는 갈라졌지만
          #    **둘 다 물리 호스트 A** 였다. 그런데 이 클러스터의 실제 고장 이력은
          #    "무흔적 급사 3회, 전부 호스트 A" 다(status §4.x). 즉 노드 SPOF 를 없애면서
          #    호스트 SPOF 를 새로 만든 셈이고, 하필 **실제로 일어난 적 있는 고장 모드**에
          #    대해선 이전(b2 단독 = 호스트 A 급사에 생존)보다 나빠졌다.
          #    → zone(`topology.kubernetes.io/zone` = host-a/host-b) 레이어를 한 겹 더 얹는다.
          #
          # 순서가 중요하다: 스케줄러는 TSC 를 **모두** 만족시키려 점수를 매기므로
          #    hostname·zone 둘 다 있으면 "다른 노드 + 다른 호스트" 가 최고점이 된다.
          #
          # 🔴 3차 — soft → **hard(DoNotSchedule) + nodeTaintsPolicy: Honor**.
          #    2차(soft 2계층)로 a2+b2 분산이 실제로 나왔지만, 그건 **보장이 아니라 결과**였다.
          #    같은 시점 실측에서 동일하게 soft 2계층이 걸린 `mp-recipe` 는 둘 다 host-a,
          #    `mp-frontend` 는 둘 다 host-b 에 앉아 있었다 — soft 는 롤링 업데이트 중
          #    아직 안 죽은 구 파드까지 세어 분포 계산이 왜곡되고, ImageLocality·리소스
          #    밸런싱 점수에 밀려 **조용히 안 지켜진다.** 즉 다음 롤아웃에 입구가 다시
          #    한 호스트로 몰릴 수 있었다. 보장이 필요한 축은 hard 여야 한다.
          #
          #    Pending 우려(2차 주석)는 여기선 낮다 — 파드 2~3개(surge 포함)를 **2 zone /
          #    4 노드** 에 놓는 성긴 제약이고, 파드가 10m/96Mi 로 매우 작으며, 노드 CPU
          #    요청률은 42~50% 다. ResourceQuota 는 **네임스페이스 총량**이라 TSC 의
          #    노드 선택과 무관하다(쿼터 초과는 Pending 이 아니라 파드 생성 자체가 거부).
          #
          # 🔴 nodeTaintsPolicy: Honor 가 hard 의 유일한 함정을 막는다.
          #    기본값 Ignore 면 host-a 가 통째로 죽어도 host-a 가 "파드 0개 도메인" 으로
          #    계산에 남는다 → 죽은 파드를 host-b 로 옮기면 skew 2 라 **거부 → Pending**.
          #    입구가 살아남은 호스트로 못 넘어가는 것이라, 막으려던 바로 그 장애에서
          #    복구가 막힌다. Honor 면 급사·cordon 노드에 붙는 `NoSchedule` 테인트
          #    (파드가 톨러레이션 미보유)를 보고 그 노드를 도메인 계산에서 제외한다.
          #    ⚠️ 파드 기본 not-ready/unreachable 톨러레이션은 `effect: NoExecute` 전용이라
          #       `NoSchedule` 변종에 안 걸린다 → 제외가 실제로 성립한다.
          #
          # 🔴🔴 4차 — matchLabelKeys: [pod-template-hash] 추가. **hard 만으론 부족했다.**
          #    3차(hard) 반영 직후 실측에서 신규 파드 2개가 **둘 다 host-a(a1·a2)** 에 떴다.
          #    TSC 는 스케줄 시점에 selector 에 걸리는 모든 파드를 세는데, 롤링 업데이트 중엔
          #    **아직 안 죽은 구 RS 파드**가 거기 낀다:
          #      구 파드 host-b 1개 → 신규①을 host-a 에(1/1 통과) → 신규②도 host-a 에(2/1 통과)
          #      → 구 파드 종료 → 신규 2개가 전부 host-a. 제약은 매 순간 지켜졌는데 결과가 몰린다.
          #    matchLabelKeys 는 들어오는 파드의 pod-template-hash 를 labelSelector 에 AND 해
          #    **같은 RS 파드만** 세게 만든다 → 구 파드가 계산에서 빠져 신규②가 반대 zone 으로
          #    강제된다. K8s 1.34 에서 기본 활성(beta).
          #
          # labelSelector 는 여전히 gateway-name 을 본다(파드 신원). 해시는 matchLabelKeys 가
          #    런타임에 AND 하는 것이라, 셀렉터를 해시로 바꾸는 것과는 다르다 — 매니페스트에
          #    해시를 적을 수는 없다(롤아웃마다 바뀐다).
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: mp-gw-public
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: mp-gw-public
