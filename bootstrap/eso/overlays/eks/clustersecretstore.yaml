# EKS ESO 백엔드 — AWS SSM Parameter Store + IRSA (C-23 · 체크리스트 0-2).
#
# 🔴 **정본은 이 파일이 아니다.** 온프렘 쪽과 같은 이유로, 실제로 apply 하는 주체는
#    앱 레포 Ansible `k8s_eso` 롤이다(그쪽은 다른 레인 소관). 여기 있는 것은 목표 상태의 기록이며
#    ExternalSecret 26개의 eks 오버레이가 `secretStoreRef.name: mp-aws-ssm` 로 가리키는 대상이다.
#
# ── 🔴 `prefix` 가 이 파일의 핵심이다 ──────────────────────────────────────────
# ESO AWS provider 의 `prefix` 는 **모든 remoteRef.key 앞에 그대로 이어 붙는다**(문자열 concat).
#   remoteRef.key `app-secrets`  →  파라미터 `/mp/prod/app-secrets`
#   remoteRef.key `harbor-pull`  →  파라미터 `/mp/prod/harbor-pull`
# 그래서 **끝의 슬래시가 load-bearing 이다.** `/mp/prod` 로 적으면 `/mp/prodapp-secrets` 가 된다.
#
# 이것이 있어야 다음 둘이 동시에 성립한다:
#   ① `remoteRef` 67엔트리 무수정 — 매니페스트에 AWS 경로가 한 글자도 안 들어간다
#   ② IAM 최소권한 — 정책 Resource 를 `parameter/mp/prod/*` 로 경로 한정할 수 있다
# 없으면 구현자가 67엔트리에 `/mp/prod/` 를 손으로 붙이기 시작하고, 그 순간 두 사이트의
# 매니페스트가 갈라져 base 공유가 무너진다.
#
# ── 값의 형상 ────────────────────────────────────────────────────────────────
# 파라미터 1개 = JSON 오브젝트 1개("번들"). `remoteRef.property` 가 그 JSON 의 gjson 경로다.
# 온프렘의 `fb-secrets` ns Secret 1개 ↔ SSM 파라미터 1개가 1:1로 대응한다 — 그래서 무수정이 성립한다.
#
#   /mp/prod/app-secrets        ← app · mp-ingress · observability ns 가 참조 (33 엔트리)
#   /mp/prod/data-secrets       ← app · data · pipeline ns          (14)
#   /mp/prod/harbor-pull        ← app · data · pipeline · mp-ingress · argo-rollouts (15)
#   /mp/prod/pipeline-secrets   ← pipeline ns                        (5)
#   /mp/prod/alertmanager-slack ← observability — 🔴 config 레포 밖(Ansible 소유)
#   /mp/prod/repo-food-budget-config ← argocd  — 🔴 config 레포 밖(Ansible 소유) · dataFrom.extract
#
# 🔴 standard tier 는 값 **4KB** 상한이다. `app-secrets` 가 GCP SA JSON(`GCP_SA_KEY_JSON`)을
#    통째로 담고 있어 여유가 얼마 없다(체크리스트 실측: 711 B). 키를 더 넣기 전에 실측할 것.
#
# ── 인증 = IRSA (C-30) ───────────────────────────────────────────────────────
# `auth` 를 **일부러 비웠다.** 비우면 AWS SDK 기본 자격증명 체인이 돌고, ESO 컨트롤러 파드의
# ServiceAccount(`external-secrets` ns 의 `external-secrets`)에 붙은 IRSA 웹아이덴티티 토큰을 집는다.
# 계정 ID 가 매니페스트에 안 들어가는 것이 이 방식의 실질 이득이다(C-8 계정 3개 · 아직 미생성).
#
# 🔴 이 스토어가 동작하려면 **앱 레포 쪽 선행 1건**이 필요하다 → ../../README.md "앱 레포에 필요한 것".
#    (컨트롤러 SA 애너테이션 + IAM 롤/정책. 이 레포에서는 할 수 없다.)
#
# 🔴 스토어별 롤 분리를 원하면 `spec.provider.aws.role: arn:aws:iam::<계정>:role/<롤>` 을 켠다.
#    지금 안 켠 이유 = 계정 ID 미정. 켤지 말지는 **사람 결정**(README ⑤).
# 🔴 **`spec.conditions` 는 채워야 한다 — 미래 과제가 아니다.** (2026-08-10 정정)
#    최초 기록은 "지금 비어 있는 것은 온프렘 `fb-kubernetes` 와 같은 상태이고 채우는 것은 0-11 소관"
#    이라고 적었는데 **전제가 틀렸다.** 온프렘 라이브는 비어 있지 않고 ns 7개로 좁혀져 있으며,
#    그건 예정된 작업이 아니라 **2026-08-09 에 이미 적용된 통제**다(체크리스트 0-14b · S4-1).
#    비워 두면 새 사이트가 그 통제 **없이** 태어난다 — 온프렘에서 막은 구멍을 EKS 에 다시 뚫는 셈이다.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mp-aws-ssm
spec:
  # 🔴 참조 허용 ns 화이트리스트 (위 근거). **온프렘과 같은 목록으로 시작한다** — 사이트별로
  #    다르게 좁히면 드리프트가 된다.
  # ⚠️ 다만 EKS 의 ns 집합은 **D4-a 가 확정한다**(어느 워크로드가 AWS 로 가는가). 그때 이 목록을
  #    다시 맞출 것 — 남는 ns 는 무해하지만(참조자가 없다), **빠진 ns 는 조용히 동기화 실패**다.
  conditions:
    - namespaces:
        - app
        - argo-rollouts
        - argocd
        - data
        - mp-ingress
        - observability
        - pipeline
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      prefix: /mp/prod/   # 🔴 끝 슬래시 필수 — 이 줄이 remoteRef 67엔트리 무수정의 근거다
