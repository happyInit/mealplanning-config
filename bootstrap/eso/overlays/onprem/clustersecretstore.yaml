# 온프렘 ESO 백엔드 — K8s provider. `fb-secrets` ns 의 Secret 을 원격 저장소처럼 읽는다.
#
# 🔴 **정본은 이 파일이 아니다.** 라이브를 만드는 주체는 앱 레포 Ansible `k8s_eso` 롤이고,
#    여기 있는 것은 그 롤이 만들어내야 할 **목표 상태의 기록**이다(bootstrap/argocd 와 같은 성격).
#    아래 본문은 2026-08-10 라이브(`kubectl get clustersecretstore fb-kubernetes -o yaml`)에서
#    `metadata` 의 서버 생성 필드와 `status` 만 걷어낸 것이다 — 필드 단위로 일치한다.
#
# 🔴 이름이 `mp-` 가 아닌 이유 = **기존 실물**이다(CLAUDE.md 명명 규칙의 예외 항목).
#    리네임하면 ExternalSecret 27개의 `secretStoreRef` 가 한꺼번에 깨진다. 건드리지 않는다.
#
# C-23: 온프렘은 이관 후에도 이 provider 를 그대로 쓴다. SSM 으로 옮기지 않는다.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fb-kubernetes
spec:
  provider:
    kubernetes:
      remoteNamespace: fb-secrets
      auth:
        serviceAccount:
          name: eso-reader
          namespace: fb-secrets
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: fb-secrets
          key: ca.crt
