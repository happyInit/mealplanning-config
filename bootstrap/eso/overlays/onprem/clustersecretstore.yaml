# 온프렘 ESO 백엔드 — K8s provider. `fb-secrets` ns 의 Secret 을 원격 저장소처럼 읽는다.
#
# 🔴 **정본은 이 파일이 아니다.** 라이브를 만드는 주체는 앱 레포 Ansible `k8s_eso` 롤이고,
#    여기 있는 것은 그 롤이 만들어내야 할 **목표 상태의 기록**이다(bootstrap/argocd 와 같은 성격).
#    아래 본문은 2026-08-10 라이브(`kubectl get clustersecretstore fb-kubernetes -o yaml`)에서
#    `metadata` 의 서버 생성 필드와 `status` 만 걷어낸 것이다 — 필드 단위로 일치한다.
#    ⚠️ 최초 기록 때 **`spec.conditions` 를 빠뜨렸다**(2026-08-10 대조에서 발견·보강).
#       `status` 안에도 `conditions` 가 있어서 그쪽과 함께 걷힌 것으로 보인다. 이름이 같을 뿐
#       완전히 다른 필드다 — `spec.conditions` 는 **접근 통제**이고 `status.conditions` 는 상태다.
#
# 🔴 이름이 `mp-` 가 아닌 이유 = **기존 실물**이다(CLAUDE.md 명명 규칙의 예외 항목).
#    리네임하면 ExternalSecret 27개의 `secretStoreRef` 가 한꺼번에 깨진다. 건드리지 않는다.
#
# C-23: 온프렘은 이관 후에도 이 provider 를 그대로 쓴다. SSM 으로 옮기지 않는다.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fb-kubernetes
spec:
  # 🔴 **이 스토어를 참조할 수 있는 ns 화이트리스트다. 지우거나 비우지 말 것.**
  #    비면 **어느 ns 에서든** 이 스토어를 참조할 수 있고, 백엔드 SA `eso-reader` 의 Role 은
  #    `secrets [get,list,watch]` 에 resourceNames 가 없어 `fb-secrets` **전체**를 읽는다.
  #    게다가 ESO 차트의 `external-secrets-edit` ClusterRole 이 `aggregate-to-edit` 라 그 ns 의
  #    edit 보유자가 ExternalSecret 을 만들 수 있다 → **ExternalSecret 하나로 fb-secrets 전량을
  #    자기 ns 로 복사**할 수 있었다(`harbor-pull` · config 레포 **쓰기** SSH 키 포함).
  #    2026-08-09 에 막은 통제이고(체크리스트 0-14b · S4-1), 라이브에 이 값이 실제로 들어 있다.
  #
  # 🔴 정본은 앱 레포 Ansible `k8s_eso` 의 `eso_allowed_namespaces` 다 — 아래는 그 사본이다.
  #    새 ns 에 ExternalSecret 을 추가하면 **양쪽 다** 고쳐야 한다. 안 하면 조용히 동기화가 안 된다.
  conditions:
    - namespaces:
        - app
        - argo-rollouts
        - argocd
        - data
        - mp-ingress
        - observability
        - pipeline
  provider:
    kubernetes:
      remoteNamespace: fb-secrets
      auth:
        serviceAccount:
          name: eso-reader
          namespace: fb-secrets
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: fb-secrets
          key: ca.crt
